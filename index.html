      'ARI','ATL','BAL','BOS','CHC','CWS','CIN','CLE','COL','DET','HOU','KC','LAA',

      'TB','TEX','TOR','WAS'
    ]}
  };

  let currentBreakType = 'nba';
  let soldTeams = new Set();
  let soldTeamsList = [];

  function initializeGrid() {
    const grid = document.getElementById('teamsGrid');
    const currentBreak = breakTypes[currentBreakType];
    grid.innerHTML = '';
    // dynamic columns: prefer per-break config, else default 6
    const cols = currentBreak.gridCols || 6;
    grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    soldTeams.clear();
    soldTeamsList = [];

    currentBreak.teams.forEach((team, index) => {
      const teamDiv = document.createElement('div');
      teamDiv.className = 'team';
      teamDiv.dataset.teamIndex = index;
      teamDiv.onclick = () => toggleTeam(index);

      if (typeof team === 'object' && team.image) {
        const img = document.createElement('img');
        img.src = team.image;
        img.alt = team.name;
        img.onerror = () => {
          teamDiv.innerHTML = team.code;
          teamDiv.classList.add('text-only');
        };
        teamDiv.appendChild(img);
      } else {
        teamDiv.textContent = typeof team === 'object' ? team.code : team;
        teamDiv.classList.add('text-only');
      }
      grid.appendChild(teamDiv);
    });

    updateHeader();
    updateStats();
    updateSoldList();
    updateControlsForBreak();
  }

  function toggleTeam(index) {
    const teamDiv = document.querySelector(`[data-team-index="${index}"]`);
    const listIndex = soldTeamsList.findIndex(e => e.index === index);

    if (soldTeams.has(index)) {
      soldTeams.delete(index);
      teamDiv.classList.remove('sold');
      if (listIndex !== -1) soldTeamsList.splice(listIndex, 1);
    } else {
      soldTeams.add(index);
      teamDiv.classList.add('sold');
      if (listIndex === -1) soldTeamsList.push({ index, buyer: '' });
    }
    updateStats();
    updateSoldList();
  }

  function updateStats() {
    const currentBreak = breakTypes[currentBreakType];
    const totalTeams = currentBreak.teams.length;
    const soldCount = soldTeams.size;
    const teamsLeft = totalTeams - soldCount;
    document.getElementById('teamsLeft').textContent = teamsLeft;
    document.getElementById('teamsSold').textContent = soldCount;
  }

  function updateHeader() {
    const currentBreak = breakTypes[currentBreakType];
    document.getElementById('headerText').textContent = `${currentBreak.icon} ${currentBreak.name} BOX BREAK`;
  }

  function resetAll() {
    soldTeams.clear();
    soldTeamsList = [];
    document.querySelectorAll('.team').forEach(team => team.classList.remove('sold'));
    updateStats();
    updateSoldList();
  }

  function changeBreakType() {
    const types = Object.keys(breakTypes);
    currentBreakType = types[(types.indexOf(currentBreakType) + 1) % types.length];
    updateControlsForBreak();

    initializeGrid();
  }

  // Sold list: 3 columns of 10
  function updateSoldList() {
  const soldListDiv = document.getElementById('soldList');
  soldListDiv.innerHTML = '';
  const currentBreak = breakTypes[currentBreakType];

  // choose columns: per-break override or auto by count
  const total = soldTeamsList.length;
  const cols = currentBreak.soldCols || (total > 20 ? 3 : total > 10 ? 2 : 1);

  let columns = Array.from({ length: cols }, () => []);

  soldTeamsList.forEach((entry, i) => {
    columns[i % cols].push(entry);
  });

  columns.forEach(col => {
    const colDiv = document.createElement('div');
    colDiv.style.display = 'flex';
    colDiv.style.flexDirection = 'column';

    col.forEach(entry => {
      const team = currentBreak.teams[entry.index];
      const row = document.createElement('div');

      if (team.image) {
        const img = document.createElement('img');

      input.placeholder = 'Buyer name';
      input.value = entry.buyer || '';
      input.oninput = (e) => { entry.buyer = e.target.value; };
      row.appendChild(input);

      colDiv.appendChild(row);
    });

    soldListDiv.appendChild(colDiv);
  });

  soldListDiv.style.display = 'grid';
  soldListDiv.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  soldListDiv.style.gap = '6px 18px';
}

function updateControlsForBreak() {
  const wrap = document.getElementById('promoWrap');
  const container = document.querySelector('.container');
  const isPKM = currentBreakType === 'pkm';

  if (wrap) wrap.style.display = isPKM ? 'none' : 'flex';
  // shorter container when only 8 slots
  if (container) container.style.height = isPKM ? '260px' : '340px';
}

  // No keyboard shortcuts!
  // (If you want to re-enable, add a similar event listener as before)

  // Init
  initializeGrid();
</script>
<script>
/* ===== Real-time hookup (SSE) ===== */

/* 1) Dynamic bridge selection */
function param(k){ return new URLSearchParams(location.search).get(k); }

// Default to PROD bridge unless overridden.
// For the dev overlay branch you can point this at dev if you want:
const DEFAULT_BRIDGE = "https://tsu-bridge-dev.onrender.com";

const BRIDGE_BASE =
  param("bridge") ||
  localStorage.getItem("tsu.bridge.base") ||
  DEFAULT_BRIDGE;

const STREAM_URL = `${BRIDGE_BASE}/stream`;

/* 2) Auto Break ID: YYYY-MM-DD + "-" + sport (nba/nfl/mlb) */
function getDatePart(d = new Date()) {
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function computeBreakId(sport) {
  return `${getDatePart()}-${sport}`.toLowerCase();
}
function getCurrentBreakId() {
  return computeBreakId(currentBreakType || "nba");
}

/* 3) Helpers to apply updates */
function teamCodeToIndex(code) {
  const t = breakTypes[currentBreakType].teams;
  return t.findIndex(x => (x.code || x) === code);
}
function setBuyerForTeamCode(teamCode, buyerName) {
  const idx = teamCodeToIndex(teamCode);
  if (idx === -1) return;
  if (!soldTeams.has(idx)) toggleTeam(idx);
  const entry = soldTeamsList.find(e => e.index === idx);
  if (entry) { entry.buyer = buyerName; updateSoldList(); }
}

/* 4) Subscribe to SSE */
let es;
function startSSE() {
  es = new EventSource(STREAM_URL);
  es.onmessage = (e) => {
    try {
      const data = JSON.parse(e.data);
      const myBreakId = getCurrentBreakId();
      if (data.breakId !== myBreakId) return;
      if (data.breakType !== currentBreakType) return;

      if (data.type === "reset") {
        resetAll();
        return;
      }
      if (data.teamCode && data.buyerName) {
        setBuyerForTeamCode(data.teamCode, data.buyerName);
      }
    } catch {}
  };
  es.onerror = () => {
    es.close();
    setTimeout(startSSE, 1500);
  };
}
startSSE();

/* 5) Single test helper — uses the same base as the overlay */
window.__postTestSale = async (teamCode="LAL", buyerName="Tester") => {
  const payload = {
    breakId: getCurrentBreakId(),
    breakType: currentBreakType,
    teamCode,
    buyerName,
    ts: Date.now()
  };
  await fetch(`${BRIDGE_BASE}/events`, {
    method: "POST",
    headers: { "Content-Type":"application/json" },
    body: JSON.stringify(payload)
  });
};
</script>
<script>
function getDatePart(d = new Date()) {
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function isDevBridge() {
  try { return BRIDGE_BASE.includes("-dev."); } catch { return false; }
}
function computeBreakId(sport) {
  const base = `${getDatePart()}-${sport}`.toLowerCase();
  return isDevBridge() ? `${base}-dev` : base;
}
</script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  if (isDevBridge()) {
    const h = document.getElementById("headerText");
    if (h && !h.textContent.includes("[DEV]")) h.textContent = "[DEV] " + h.textContent;
    document.body.style.outline = "4px solid #8b5cf6"; // tasteful purple guilt trip
  }
});
</script>
