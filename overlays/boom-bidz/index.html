<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, initial-scale=1.0" />
  <title>BoomBidz – Chase Overlay (1080x1920)</title>

  <style>
    :root{
      /* === Canvas === */
      --W:1080px;
      --H:1920px;
      --safePad: 22px;
--heroH: 560px;
      /* === TOP CONTAINER HEIGHT (keep ~ top 1/3) === */
      --topH: 560px; /* adjust 640–720 if needed */
--midH: 150px;
--lowerMinH: 620px;
--rotH: 150px;
      /* === BoomBidz palette (from logo) === */
      --bg0:#010202;
      --bg1:#070711;

      --white:#FAF5DD;
      --muted: rgba(250,245,221,0.78);

      --neonRed:#EA4202;   /* primary Boom orange */
      --red2:#D83704;      /* ember */
      --rust:#A52F08;
      --deep:#5E1E09;

      --holo:#F4AC14;      /* fuse yellow accent */
      --holo2:#586360;     /* charcoal accent */

      --gridRed: rgba(234,66,2,0.35);
      --gridRed2: rgba(234,66,2,0.16);

      --shadow: 0 16px 44px rgba(0,0,0,0.78);

      /* === Layout sizes (compressed to fit top 1/3) === */
      --hdrH: 112px;
      --tickerH: 56px;
      --subHdrH: 510px;
      
      --gap: 12px;

      /* 3-col widths */
      --sideW: 150px;
      --centerW: calc(100% - (var(--sideW) * 2) - (var(--gap) * 2));

      /* Center camera box uses 16:9 ratio */
      --camMaxW: 600px;
      --camPad: 10px;

      /* Border / corners */
      --r: 18px;
      --r2: 14px;
      --outerR: 28px; /* full-height outer border radius */
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }

    body{
      margin:0;
      width: var(--W);
      height: var(--H);
      background: transparent;
      overflow:hidden;
      font-family: "Arial Black", Arial, sans-serif;
      user-select:none;
      color: var(--white);
    }

    /* ====== Stage (FULL canvas) ====== */
    .stage{
      position:relative;
      width: var(--W);
      height: var(--H);
      background: transparent;
      overflow:hidden;
    }

    /* ==========================================================
       FULL-HEIGHT BORDER + WICK SHIMMER (NO FILL / TRANSPARENT)
       - This is ONLY stroke + shimmer around the entire canvas
       - Does not paint any background underneath
       ========================================================== */
    .fullFrame{
      position:absolute;
      left: var(--safePad);
      right: var(--safePad);
      top: var(--safePad);
      bottom: var(--safePad);
      border-radius: var(--outerR);
      pointer-events:none;
      z-index: 3;
    }

    /* static thin stroke */
    .fullFrame::before{
      content:"";
      position:absolute;
      inset:0;
      border-radius: inherit;
      border: 2px solid rgba(250,245,221,0.20);
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.70),
        0 0 18px rgba(234,66,2,0.20),
        0 0 14px rgba(244,172,20,0.12);
    }

    /* wick shimmer stroke (masked to border only) */
    .fullFrame::after{
      content:"";
      position:absolute;
      inset:-2px;
      border-radius: inherit;

      background: linear-gradient(130deg,
        rgba(255,221,122,0) 0%,
        rgba(255,221,122,0) 40%,
        rgba(250,245,221,1) 50%,
        rgba(234,66,2,0.95) 54%,
        rgba(244,172,20,0.65) 60%,
        rgba(255,221,122,0) 72%,
        rgba(255,221,122,0) 100%
      );
      background-size: 300% 300%;
      animation: wickRun 5.2s ease-in-out infinite alternate;

      /* Mask the fill so only the STROKE shows */
      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      mask-composite: exclude;
      padding: 5px;

      filter:
        drop-shadow(0 0 10px rgba(234,66,2,0.65))
        drop-shadow(0 0 18px rgba(244,172,20,0.28));
      opacity: 1;
    }

    @keyframes wickRun{
      0%   { background-position:   0% 50%; }
      100% { background-position: 100% 90%; }
    }

    /* ====== TOP ONLY shell (only area with background/grid) ====== */
    .topShell{
  position:absolute;
  left: var(--safePad);
  right: var(--safePad);
  top: var(--safePad);
  bottom: var(--safePad);
      border-radius: var(--outerR);
      overflow:visible;
      box-shadow: var(--shadow);
      z-index: 5;
overflow:visible;
      background:
        radial-gradient(1200px 720px at 50% 0%, rgba(234,66,2,0.18), transparent 62%),
        radial-gradient(900px 720px at 18% 70%, rgba(234,66,2,0.10), transparent 66%),
        linear-gradient(180deg, var(--bg0) 0%, var(--bg1) 100%);
    }

    /* Perspective orange grid ONLY inside top container */
    .topShell::before{
      content:"";
      position:absolute;
      inset:-60px -60px -10px -60px;
      pointer-events:none;
      background:
        linear-gradient(to right, transparent 0, transparent 48px, rgba(234,66,2,0.22) 49px, transparent 50px),
        linear-gradient(to bottom, transparent 0, transparent 48px, rgba(234,66,2,0.22) 49px, transparent 50px),
        repeating-linear-gradient(to right, transparent 0 14px, var(--gridRed2) 14px 15px),
        repeating-linear-gradient(to bottom, transparent 0 14px, var(--gridRed2) 14px 15px),
        radial-gradient(900px 900px at 50% 75%, rgba(234,66,2,0.12), transparent 62%);
      opacity: 0.90;
      filter: blur(0.9px);
      transform-origin: 50% 70%;
      transform: perspective(900px) rotateX(62deg) translateY(170px) scale(1.15);
      mix-blend-mode: screen;
      animation: gridDrift 10s linear infinite;
    }

    @keyframes gridDrift{
      0%   { transform: perspective(900px) rotateX(62deg) translateY(170px) scale(1.15) translateX(0); }
      100% { transform: perspective(900px) rotateX(62deg) translateY(160px) scale(1.15) translateX(-18px); }
    }

    /* scanlines inside top container */
    .topShell::after{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background:
        repeating-linear-gradient(to bottom,
          rgba(255,255,255,0.05) 0px,
          rgba(255,255,255,0.05) 1px,
          rgba(0,0,0,0.00) 3px,
          rgba(0,0,0,0.00) 7px
        ),
        radial-gradient(1100px 900px at 50% 35%, transparent 55%, rgba(0,0,0,0.62) 100%);
      opacity: 0.16;
      animation: dustFlicker 3.8s ease-in-out infinite;
    }

    @keyframes dustFlicker{
      0%,100%{ opacity: 0.14; }
      50%{ opacity: 0.20; }
    }

    /* ===== Content wrapper inside top container ===== */
    .app{
      position:relative;
      z-index: 5;
      height:100%;
      display:flex;
      flex-direction:column;
      gap: var(--gap);
      padding: 12px;
    }

    .panel{
      background: linear-gradient(180deg, rgba(0,0,0,0.55), rgba(0,0,0,0.22));
      border: 1px solid rgba(250,245,221,0.12);
      border-radius: var(--r);
      box-shadow: inset 0 0 0 1px rgba(234,66,2,0.10);
      overflow:hidden;
      position:relative;
    }
    .panel > *{ position:relative; z-index: 2; }

    /* ===== Header ===== */
    .header{
      height: var(--hdrH);
      display:grid;
      grid-template-columns: 1fr 260px 1fr;
      align-items:center;
      gap: 12px;
      padding: 10px 14px;
overflow:visible;
position:relative;
      background:
        linear-gradient(90deg,
          rgba(0,0,0,0.85) 0%,
          rgba(234,66,2,0.28) 55%,
          rgba(244,172,20,0.10) 84%,
          rgba(0,0,0,0.85) 100%);
      border: 2px solid rgba(250,245,221,0.14);
    }

    .hdr-left{
      min-width:0;
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap: 5px;
    }

    .hdr-title{
      font-size: 34px;
      letter-spacing: 1px;
      color: var(--white);
      text-shadow: 0 3px 14px rgba(0,0,0,0.85);
      white-space: nowrap;
           text-overflow: initial;
      line-height: 1.0;
    }



.hdr-center{
  position:relative;
  top:-140px;
  left:50%;
  transform:translateX(-50%);
  height:auto;
  pointer-events:auto;
  z-index:50;
}
    
.hdr-center img{
  height: 400px;
  width:auto;
  object-fit:cover;
  position:absolute;
  filter:
    drop-shadow(0 20px 30px rgba(0,0,0,0.9))
    drop-shadow(0 0 20px rgba(234,66,2,0.5));
}

    .hdr-right{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap: 10px;
    }

    .break-pill{
      display:flex;
      align-items:end;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 999px;
      border: 2px solid rgba(250,245,221,0.22);
      background: rgba(0,0,0,0.35);
      box-shadow:
        inset 0 0 0 1px rgba(250,245,221,0.06),
        0 0 12px rgba(234,66,2,0.14);
      text-transform: uppercase;
      white-space: nowrap;
    }
    .break-pill .label{
      font-size: 16px;
      opacity: 0.92;
      letter-spacing: 1px;
    }
    .break-pill .value{
      font-size: 20px;
      color: #fff;
      text-shadow: 0 0 10px rgba(244,172,20,0.12);
      min-width: 32px;
      text-align:right;
      font-weight: 900;
    }
/* =========================
   NEW FULL-HEIGHT STRUCTURE
   ========================= */
.app{
  height: 100%;
  display:flex;
  flex-direction:column;
  gap: var(--gap);
  padding: 12px;
}

/* Big hero camera panel */
.heroCamRow{
  flex: 0 0 var(--heroH);
  padding: var(--camPad);
}
.heroCamBox{
  width: 100%;
  height: 100%;
  border-radius: var(--r);
  position:relative;
  overflow:visible;
  background: linear-gradient(135deg, rgba(250,245,221,0.08), rgba(0,0,0,0.25));
  border: 2px solid rgba(250,245,221,0.20);
  box-shadow:
    inset 0 0 0 2px rgba(0,0,0,0.35),
    0 0 0 1px rgba(234,66,2,0.12);
}
.heroCamBox::before{
  content:"";
  position:absolute; inset:0;
  background:
    radial-gradient(circle at 30% 30%, rgba(250,245,221,0.10), transparent 55%),
    radial-gradient(circle at 70% 70%, rgba(244,172,20,0.10), transparent 55%),
    linear-gradient(180deg, rgba(250,245,221,0.05), rgba(0,0,0,0.20));
  opacity: .9;
  pointer-events:none;
}


/* ===== CAMERA WICK BORDER FIXED ===== */
.heroCamBox,
.lowerInner{
  position:relative;
  isolation:isolate;
}

/* static border glow */
.heroCamBox::after,
.lowerInner::after{
  content:"";
  position:absolute;
  inset:-3px;
  border-radius:inherit;
  pointer-events:none;
  z-index:50;
  border:3px solid rgba(250,245,221,0.18);
  box-shadow:
    0 0 10px rgba(234,66,2,0.25),
    0 0 18px rgba(244,172,20,0.14),
    inset 0 0 8px rgba(0,0,0,0.6);
}

/* moving ember lives on a dedicated overlay layer */
.heroCamBox .wick,
.lowerInner .wick{
  position:absolute;
  inset:-14px;
  pointer-events:none;
  z-index:60;
}

.heroCamBox .wick::before,
.lowerInner .wick::before{
  content:"";
  position:absolute;
  width:26px;
  height:26px;
  pointer-events:none;

  background:
    radial-gradient(circle, rgba(255,255,255,0.98) 0 12%, rgba(255,255,255,0) 13%),
    linear-gradient(0deg, rgba(250,245,221,0) 0%, rgba(250,245,221,1) 42%, rgba(244,172,20,1) 50%, rgba(234,66,2,1) 58%, rgba(250,245,221,0) 100%),
    linear-gradient(90deg, rgba(250,245,221,0) 0%, rgba(250,245,221,1) 42%, rgba(244,172,20,1) 50%, rgba(234,66,2,1) 58%, rgba(250,245,221,0) 100%),
    linear-gradient(45deg, rgba(250,245,221,0) 0%, rgba(250,245,221,0.95) 44%, rgba(244,172,20,1) 50%, rgba(234,66,2,0.95) 56%, rgba(250,245,221,0) 100%),
    linear-gradient(-45deg, rgba(250,245,221,0) 0%, rgba(250,245,221,0.95) 44%, rgba(244,172,20,1) 50%, rgba(234,66,2,0.95) 56%, rgba(250,245,221,0) 100%);

  background-repeat:no-repeat;
  background-position:center;
background-size:
  26px 26px,
  8px 26px,
  26px 8px,
  26px 8px,
  26px 8px;

  filter:
    drop-shadow(0 0 4px #fff)
    drop-shadow(0 0 8px #F4AC14)
    drop-shadow(0 0 14px #EA4202);

  animation: fuseTravel 26s linear infinite, wickFlicker 0.55s ease-in-out infinite alternate;
}

@keyframes fuseTravel{
  0%   { top:0; left:0; }
  25%  { top:0; left:calc(100% - 28px); }
  50%  { top:calc(100% - 28px); left:calc(100% - 28px); }
  75%  { top:calc(100% - 28px); left:0; }
  100% { top:0; left:0; }
}

@keyframes wickFlicker{
  0%{
    transform: scale(0.92) rotate(0deg);
    opacity: 0.88;
  }
  100%{
    transform: scale(1.08) rotate(8deg);
    opacity: 1;
  }
}

/* Mid row: SOLD | CHASE | REMAINING */
.midChaseRow{
  flex: 0 0 var(--midH);
  display:grid;
  grid-template-columns: var(--sideW) 1fr var(--sideW);
  gap: var(--gap);
  align-items: stretch;
}

.midStat{
  padding: 12px 10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  border:1px solid rgba(255, 68, 0, 0.671)
}
.midStat .v{
  font-size: 46px;
  font-weight: 900;
  letter-spacing: 1px;
  line-height: 1;
}
.midStat .k{
  font-size: 12px;
  letter-spacing: 1.4px;
  opacity: 0.85;
  text-transform: uppercase;
  margin-top: 6px;
}
.midStat .sub{
  font-size: 11px;
  opacity: 0.75;
  margin-top: 6px;
  letter-spacing: 1px;
}

/* Chase panel fits mid row height */
.midChaseRow .chasePanel{
  height: 100%;
}

/* Optional: hide the dots row (mock doesn’t show them) */
.chaseMetaRow{ display:none; }

/* Lower big panel (second camera / stage) */
.lowerStage{
  flex: 1 1 auto;
  min-height: var(--lowerMinH);
  padding: 10px;
  position:relative;
}

.lowerInner{
  position:absolute;
  inset: 10px;
  border-radius: var(--r);
  border: 2px solid rgba(250,245,221,0.20);
  background: rgba(0,0,0,0.18);
  overflow:visible;
}

/* subtle grid + glow */
.lowerInner::before{
  content:"";
  position:absolute;
  inset:-60px -60px -10px -60px;
  pointer-events:none;
  z-index:1;
  background:
    repeating-linear-gradient(to right, transparent 0 14px, var(--gridRed2) 14px 15px),
    repeating-linear-gradient(to bottom, transparent 0 14px, var(--gridRed2) 14px 15px),
    radial-gradient(900px 600px at 50% 75%, rgba(234,66,2,0.14), transparent 62%);
  opacity: 0.60;
  filter: blur(0.8px);
  transform: perspective(900px) rotateX(60deg) translateY(110px) scale(1.20);
  mix-blend-mode: screen;
}

.lowerHud{
  position:absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  padding: 6px 10px;
  border-radius: 999px;
  background: rgba(0,0,0,0.45);
  border: 1px solid rgba(250,245,221,0.14);
  font-size: 11px;
  letter-spacing: 1px;
  text-transform: uppercase;
  opacity: 0.90;
  z-index: 3;
}


    /* ===== Marquee ===== */
    .ticker{
      height: var(--tickerH);
      display:flex;
      align-items:center;
      overflow:hidden;
      padding: 0 14px;
      border-radius: var(--r);
      background:
        linear-gradient(90deg,
          rgba(0,0,0,0.45) 0%,
          rgba(234,66,2,0.18) 55%,
          rgba(244,172,20,0.08) 86%,
          rgba(0,0,0,0.45) 100%);
      border: 1px solid rgba(250,245,221,0.14);
    }
.ticker span{
  display:inline-block;
  white-space: nowrap;
  padding-left: 100%;
  will-change: transform;
  animation: tickerScroll 22s linear infinite;
  font-size: var(--topTickerSize, 30px);
  letter-spacing: 1px;
  font-weight: 900;
  color:#fff;
  text-shadow: 0 2px 14px rgba(0,0,0,0.85);
}
    @keyframes tickerScroll{
      0%{ transform: translateX(0); }
      100%{ transform: translateX(-100%); }
    }
/* LIVE SCORES MARQUEE (between chase + bottom cam) */
.scoresTicker{
  height: 46px;
  display:flex;
  align-items:center;
  overflow:hidden;
  padding: 0 14px;
  border-radius: var(--r);
  background:
    linear-gradient(90deg,
      rgba(0,0,0,0.40) 0%,
      rgba(234,66,2,0.14) 55%,
      rgba(244,172,20,0.07) 86%,
      rgba(0,0,0,0.40) 100%);
  border: 1px solid rgba(250,245,221,0.14);
}
.scoresTicker span{
  display:inline-block;
  white-space: nowrap;
  padding-left: 100%;
  will-change: transform;
  animation: scoresScroll 18s linear infinite;
  font-size: var(--scoresTickerSize, 34px);
  letter-spacing: 1px;
  font-weight: 900;
  color:#fff;
  text-shadow: 0 2px 14px rgba(0,0,0,0.85);
}
@keyframes scoresScroll{
  0%{ transform: translateX(0); }
  100%{ transform: translateX(-100%); }
}
    /* ===== 3-column row ===== */
    .subheader{
      height: var(--subHdrH);
      display:grid;
      grid-template-columns: var(--sideW) var(--centerW) var(--sideW);
      gap: var(--gap);
      align-items: stretch;
    }

    .sidePanel{
      border-radius: var(--r);
      padding: 10px;
      display:flex;
      flex-direction:column;
      gap: 10px;
      justify-content:space-between;
    }

    .miniStat{
      border-radius: var(--r2);
      border: 1px solid rgba(250,245,221,0.12);
      background: rgba(0,0,0,0.35);
      padding: 8px 8px;
      text-align:center;
      box-shadow: inset 0 0 0 1px rgba(234,66,2,0.08);
    }
    .miniStat .v{
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 1px;
    }
    .miniStat .k{
      font-size: 11px;
      letter-spacing: 1.2px;
      opacity: 0.82;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .ssePill{
      display:flex;
      align-items:center;
      justify-content:center;
      gap: 8px;
      border-radius: 999px;
      border: 1px solid rgba(250,245,221,0.14);
      background: rgba(0,0,0,0.35);
      padding: 7px 9px;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 900;
      opacity: 0.92;
    }
    .ssePill .dot{
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #666;
      box-shadow: 0 0 10px rgba(250,245,221,0.10);
    }
    .ssePill.connected .dot{ background: #3cff8a; box-shadow: 0 0 10px rgba(60,255,138,0.7); }
    .ssePill.error .dot{ background: #ff2f2f; box-shadow: 0 0 10px rgba(255,47,47,0.7); }

    /* ===== Center column ===== */
    .centerCol{
      display:flex;
      flex-direction:column;
      gap: var(--gap);
      align-items: stretch;
      justify-content:flex-start;
      min-width:0;
    }

    .camWrap{
      border-radius: var(--r);
      padding: var(--camPad);
      background: rgba(0,0,0,0.26);
      border: 1px solid rgba(250,245,221,0.12);
      box-shadow: inset 0 0 0 1px rgba(244,172,20,0.06);
      overflow: visible;
    }

    .camBox{
      width: min(100%, var(--camMaxW));
      margin: 0 auto;
      aspect-ratio: 16 / 9;
      border-radius: var(--r);
      position:relative;
      overflow:hidden;
      background: linear-gradient(135deg, rgba(250,245,221,0.08), rgba(0,0,0,0.25));
      border: 1px solid rgba(250,245,221,0.12);
      box-shadow:
        inset 0 0 0 2px rgba(0,0,0,0.35),
        0 0 0 1px rgba(234,66,2,0.12);
    }

    .camBox::before{
      content:"";
      position:absolute; inset:0;
      background:
        radial-gradient(circle at 30% 30%, rgba(250,245,221,0.10), transparent 55%),
        radial-gradient(circle at 70% 70%, rgba(244,172,20,0.10), transparent 55%),
        linear-gradient(180deg, rgba(250,245,221,0.05), rgba(0,0,0,0.20));
      opacity: .9;
      pointer-events:none;
    }

.camLabel{
  position:absolute;
  left: 12px;
  top: 10px;
  padding: 7px 9px;
  border-radius: 999px;
  background: rgba(0,0,0,0.45);
  border: 1px solid rgba(250,245,221,0.14);
  font-size: 12px;
  letter-spacing: 1px;
  text-transform: uppercase;
  opacity: 0.90;
  text-shadow: 0 2px 10px rgba(0,0,0,0.85);
  z-index: 70;
}

    /* ===== Mini controls (HIDDEN by default; show in admin) ===== */
    .miniControls{
      display:none;
      border-radius: var(--r);
      padding: 10px 12px;
      background: rgba(0,0,0,0.26);
      border: 1px solid rgba(250,245,221,0.12);
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    body.adminOn .miniControls{ display:flex; }

    .btn{
      border: 1px solid rgba(250,245,221,0.18);
      background: linear-gradient(135deg, rgba(234,66,2,0.75), rgba(0,0,0,0.35));
      color: #fff;
      border-radius: 12px;
      padding: 9px 11px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor:pointer;
      font-size: 12px;
      box-shadow: inset 0 0 0 1px rgba(250,245,221,0.06);
    }

  <script>
   const qs = new URLSearchParams(location.search);
const ENABLE_SCORES = qs.get("scores") === "1";
const OVERLAY_ID = (qs.get("overlay") || "boombidz-chase").toLowerCase();
const CHANNEL_MAIN = (qs.get("channel") || "main").toLowerCase();
const CHANNEL_SCORES = (qs.get("scoresChannel") || "sports").toLowerCase();

const BRIDGE_LS = { URL: "overlay.bridge.url", KEY: "overlay.bridge.key" };

function cleanUrl(u){
  return String(u || "").trim().replace(/\/$/, "").replace(/\/(events|stream)(\/.*)?$/, "");
}
function getParam(name){ return qs.get(name); }

function getBridgeBase(){
  const q = getParam("bridge");
  if (q && q.trim()){
    const cleaned = cleanUrl(q);
    if (cleaned) localStorage.setItem(BRIDGE_LS.URL, cleaned);
    return cleaned;
  }
  return cleanUrl(localStorage.getItem(BRIDGE_LS.URL) || "");
}

function getBridgeKey(){
  const q = getParam("key");
  if (q && q.trim()){
    localStorage.setItem(BRIDGE_LS.KEY, q.trim());
    return q.trim();
  }
  return (localStorage.getItem(BRIDGE_LS.KEY) || "").trim();
}

function bridgeEnabled(){ return !!getBridgeBase(); }

function todayKey(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

const LS_KEY = `boombidz.overlay.${todayKey()}`;
const DAILY_COUNTER_KEY = `boombidz.breakCounter.${todayKey()}`;

const state = {
  title: "BOOMBIDZ",
  breakNo: 1,

  topTicker: "Follow on Socials 👉 @boombidz - use code 'BOOM' - check show notes",
  topTickerSpeed: 22,
  topTickerSize: 30,

  promos: ["Promo Spot 1", "Promo Spot 2", "Promo Spot 3"],
  promoIndex: 0,
  promoFlipSec: 5,

  chaseCards: ["Chase Card 1", "Chase Card 2", "Chase Card 3"],
  soldCount: 0,
  scoresTickerSpeed: 18,
  scoresTickerSize: 34,

  scoresBySport: {
    NBA: "NBA: —",
    MLB: "MLB: —"
  }
};

const el = {
  hdrTitle: document.getElementById("hdrTitle"),
  brandLogo: document.getElementById("brandLogo"),
  breakNo: document.getElementById("breakNo"),

  soldPanel: document.getElementById("soldPanel"),
  soldCount: document.getElementById("soldCount"),
  remCount: document.getElementById("remCount"),

  topTickerBar: document.getElementById("topTickerBar"),
  tickerText: document.getElementById("tickerText"),

  promoPanel: document.getElementById("promoPanel"),
  chaseMain: document.getElementById("chaseMain"),

  scoresTickerBar: document.getElementById("scoresTickerBar"),
  scoresText: document.getElementById("scoresText"),

  sseText: document.getElementById("sseText"),

  headerModalMask: document.getElementById("headerModalMask"),
  headerTitleInput: document.getElementById("headerTitleInput"),
  headerBreakInput: document.getElementById("headerBreakInput"),
  headerTickerInput: document.getElementById("headerTickerInput"),
  headerTickerSpeedInput: document.getElementById("headerTickerSpeedInput"),
  headerTickerSizeInput: document.getElementById("headerTickerSizeInput"),
  headerResetBtn: document.getElementById("headerResetBtn"),
  headerNextBreakBtn: document.getElementById("headerNextBreakBtn"),
  headerSaveBtn: document.getElementById("headerSaveBtn"),
  headerCloseBtn: document.getElementById("headerCloseBtn"),

  promoModalMask: document.getElementById("promoModalMask"),
  promoLinesInput: document.getElementById("promoLinesInput"),
  promoFlipInput: document.getElementById("promoFlipInput"),
  promoSaveBtn: document.getElementById("promoSaveBtn"),
  promoCloseBtn: document.getElementById("promoCloseBtn"),

  scoresModalMask: document.getElementById("scoresModalMask"),
  scoresCardsInput: document.getElementById("scoresCardsInput"),
  scoresSpeedInput: document.getElementById("scoresSpeedInput"),
  scoresSizeInput: document.getElementById("scoresSizeInput"),
  scoresSaveBtn: document.getElementById("scoresSaveBtn"),
  scoresCloseBtn: document.getElementById("scoresCloseBtn")
};

let rotTimer = null;
let sseMain = null;
let sseScores = null;

function computeBreakId(){
  return `${todayKey()}-chase-${Number(state.breakNo || 1)}`;
}

function ensureDailyCounter(){
  const v = Number(localStorage.getItem(DAILY_COUNTER_KEY) || "1");
  if (!Number.isFinite(v) || v < 1){
    localStorage.setItem(DAILY_COUNTER_KEY, "1");
    return 1;
  }
  return v;
}

function setDailyCounter(n){
  const v = Math.max(1, Number(n || 1));
  localStorage.setItem(DAILY_COUNTER_KEY, String(v));
  state.breakNo = v;
  saveLocal();
}

function incrementDailyCounter(){
  const v = ensureDailyCounter() + 1;
  setDailyCounter(v);
  return v;
}

function loadLocal(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (!data || typeof data !== "object") return;

    if (typeof data.title === "string") state.title = data.title;
    if (Number.isFinite(+data.breakNo)) state.breakNo = +data.breakNo;

    if (typeof data.topTicker === "string") state.topTicker = data.topTicker;
    if (Number.isFinite(+data.topTickerSpeed)) state.topTickerSpeed = Math.max(8, +data.topTickerSpeed);
    if (Number.isFinite(+data.topTickerSize)) state.topTickerSize = Math.max(18, +data.topTickerSize);

    if (Array.isArray(data.promos) && data.promos.length){
      state.promos = data.promos.map(v => String(v || "").trim()).filter(Boolean);
    }
    if (Number.isFinite(+data.promoIndex)) state.promoIndex = +data.promoIndex;
    if (Number.isFinite(+data.promoFlipSec)) state.promoFlipSec = Math.max(1, +data.promoFlipSec);

    if (Array.isArray(data.chaseCards)){
      state.chaseCards = data.chaseCards.map(v => String(v || "").trim()).filter(Boolean);
    }
    if (Number.isFinite(+data.soldCount)) state.soldCount = Math.max(0, +data.soldCount);
    if (Number.isFinite(+data.scoresTickerSpeed)) state.scoresTickerSpeed = Math.max(8, +data.scoresTickerSpeed);
    if (Number.isFinite(+data.scoresTickerSize)) state.scoresTickerSize = Math.max(18, +data.scoresTickerSize);

    if (data.scoresBySport && typeof data.scoresBySport === "object"){
      state.scoresBySport = {
        NBA: String(data.scoresBySport.NBA || "NBA: —"),
        MLB: String(data.scoresBySport.MLB || "MLB: —")
      };
    }
  }catch(_){}
}

function saveLocal(){
  localStorage.setItem(LS_KEY, JSON.stringify({
    title: state.title,
    breakNo: state.breakNo,
    topTicker: state.topTicker,
    topTickerSpeed: state.topTickerSpeed,
    topTickerSize: state.topTickerSize,
    promos: state.promos,
    promoIndex: state.promoIndex,
    promoFlipSec: state.promoFlipSec,
    chaseCards: state.chaseCards,
    soldCount: state.soldCount,
    scoresTickerSpeed: state.scoresTickerSpeed,
    scoresTickerSize: state.scoresTickerSize,
    scoresBySport: state.scoresBySport
  }));
}

function counts(){
  const total = state.chaseCards.length;
  const sold = Math.max(0, Math.min(total, Number(state.soldCount || 0)));
  const rem = Math.max(0, total - sold);
  return { total, sold, rem };
}

function applyCssVars(){
  document.documentElement.style.setProperty("--topTickerSize", `${state.topTickerSize}px`);
  document.documentElement.style.setProperty("--scoresTickerSize", `${state.scoresTickerSize}px`);
  if (el.tickerText) el.tickerText.style.animationDuration = `${state.topTickerSpeed}s`;
  if (el.scoresText) el.scoresText.style.animationDuration = `${state.scoresTickerSpeed}s`;
}

function renderHeader(){
  if (el.hdrTitle) el.hdrTitle.textContent = state.title || "BOOMBIDZ";
  if (el.breakNo) el.breakNo.textContent = String(state.breakNo || 1);
  if (el.tickerText) el.tickerText.textContent = state.topTicker || "—";
  applyCssVars();
}

function renderPromo(){
  if (!Array.isArray(state.promos) || !state.promos.length) state.promos = ["Promo Spot 1"];
  const n = state.promos.length;
  state.promoIndex = ((state.promoIndex % n) + n) % n;
  if (el.chaseMain) el.chaseMain.textContent = state.promos[state.promoIndex] || "—";

  const c = counts();
  if (el.soldCount) el.soldCount.textContent = String(c.sold);
  if (el.remCount) el.remCount.textContent = String(c.rem);
}

function updateScoresMarquee(){
  const nba = String(state.scoresBySport.NBA || "NBA: —").trim() || "NBA: —";
  const mlb = String(state.scoresBySport.MLB || "MLB: —").trim() || "MLB: —";
  const hitsLine = (state.chaseCards && state.chaseCards.length) ? state.chaseCards.join(", ") : "—";

  const out = `Live Scores - ${nba} - Big Hits In Break: ${hitsLine} - Live Scores - ${mlb}`;
  if (el.scoresText) el.scoresText.textContent = out;

  const c = counts();
  if (el.soldCount) el.soldCount.textContent = String(c.sold);
  if (el.remCount) el.remCount.textContent = String(c.rem);

  applyCssVars();
}

function setPromoIndex(i){
  const n = Math.max(1, state.promos.length);
  state.promoIndex = ((i % n) + n) % n;
  saveLocal();
  renderPromo();
}

function startRotator(){
  stopRotator();
  const ms = Math.max(1000, Number(state.promoFlipSec || 5) * 1000);
  rotTimer = setInterval(() => setPromoIndex(state.promoIndex + 1), ms);
}

function stopRotator(){
  if (rotTimer) clearInterval(rotTimer);
  rotTimer = null;
}

function resetSold(){
  state.soldCount = 0;
  saveLocal();
  renderPromo();
  updateScoresMarquee();
}

function setScoresLine(text){
  const line = String(text || "").trim();
  if (!line) return;

  const upper = line.toUpperCase();
  if (upper.startsWith("NBA")) state.scoresBySport.NBA = line;
  else if (upper.startsWith("MLB")) state.scoresBySport.MLB = line;
  else if (!state.scoresBySport.NBA || state.scoresBySport.NBA === "NBA: —") state.scoresBySport.NBA = line;
  else state.scoresBySport.MLB = line;

  saveLocal();
  updateScoresMarquee();
}

function openHeaderModal(){
  if (!el.headerModalMask) return;
  el.headerTitleInput.value = state.title || "";
  el.headerBreakInput.value = String(state.breakNo || 1);
  el.headerTickerInput.value = state.topTicker || "";
  el.headerTickerSpeedInput.value = String(state.topTickerSpeed || 22);
  el.headerTickerSizeInput.value = String(state.topTickerSize || 30);
  el.headerModalMask.style.display = "block";
}

function closeHeaderModal(){
  if (el.headerModalMask) el.headerModalMask.style.display = "none";
}

function saveHeaderModal(){
  state.title = String(el.headerTitleInput.value || "").trim() || "BOOMBIDZ";
  state.breakNo = Math.max(1, Number(el.headerBreakInput.value || 1));
  state.topTicker = String(el.headerTickerInput.value || "").trim() || "—";
  state.topTickerSpeed = Math.max(8, Number(el.headerTickerSpeedInput.value || 22));
  state.topTickerSize = Math.max(18, Number(el.headerTickerSizeInput.value || 30));

  setDailyCounter(state.breakNo);
  saveLocal();
  renderHeader();
  closeHeaderModal();
}

function openPromoModal(){
  if (!el.promoModalMask) return;
  el.promoLinesInput.value = (state.promos || []).join("\n");
  el.promoFlipInput.value = String(state.promoFlipSec || 5);
  el.promoModalMask.style.display = "block";
}

function closePromoModal(){
  if (el.promoModalMask) el.promoModalMask.style.display = "none";
}

function savePromoModal(){
  const lines = String(el.promoLinesInput.value || "")
    .split("\n")
    .map(v => v.trim())
    .filter(Boolean);

  state.promos = lines.length ? lines : ["Promo Spot 1"];
  state.promoFlipSec = Math.max(1, Number(el.promoFlipInput.value || 5));
  state.promoIndex = 0;

  saveLocal();
  renderPromo();
  startRotator();
  closePromoModal();
}

function openScoresModal(){
  if (!el.scoresModalMask) return;
  el.scoresCardsInput.value = (state.chaseCards || []).join("\n");
  el.scoresSpeedInput.value = String(state.scoresTickerSpeed || 18);
  el.scoresSizeInput.value = String(state.scoresTickerSize || 34);
  el.scoresModalMask.style.display = "block";
}

function closeScoresModal(){
  if (el.scoresModalMask) el.scoresModalMask.style.display = "none";
}

function saveScoresModal(){
  const lines = String(el.scoresCardsInput.value || "")
    .split("\n")
    .map(v => v.trim())
    .filter(Boolean);

  state.chaseCards = lines;
  state.scoresTickerSpeed = Math.max(8, Number(el.scoresSpeedInput.value || 18));
  state.scoresTickerSize = Math.max(18, Number(el.scoresSizeInput.value || 34));

  const c = counts();
  if (state.soldCount > c.total) state.soldCount = c.total;

  saveLocal();
  renderPromo();
  updateScoresMarquee();
  closeScoresModal();
}

function setSSEStatus(stateName, msg){
  if (!el.sseText) return;
  el.sseText.textContent = `SSE: ${msg || stateName || "idle"}`;
}

function connectSSE({ channel, onEvent, onStatus }){
  if (!bridgeEnabled()){
    onStatus?.("error", "missing bridge");
    return null;
  }

  const base = getBridgeBase();
  const url = `${base}/stream?channel=${encodeURIComponent(channel)}`;

  onStatus?.("connecting", "connecting");
  const es = new EventSource(url);

  const ingest = (e) => {
    try{
      const data = JSON.parse(e.data);
      if (data?.type === "hello") return;
      onEvent?.(data, channel);
    }catch(_){}
  };

  es.onopen = () => onStatus?.("connected", "connected");
  es.onmessage = ingest;

  ["sale","sold","purchase","team_sold","reset","set_break","scores","stream_stats","buyer"].forEach(t => {
    es.addEventListener(t, ingest);
  });

  es.onerror = () => {
    onStatus?.("error", "reconnecting");
    try{ es.close(); }catch(_){}
    setTimeout(() => startSSE(), 2500);
  };

  return es;
}

async function bridgePost(payload){
  if (!bridgeEnabled()) return;
  const base = getBridgeBase();
  const key = getBridgeKey();

  await fetch(`${base}/events`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      ...(key ? { "x-bridge-key": key } : {})
    },
    body: JSON.stringify(payload)
  }).catch(() => {});
}

function bridgeWarmup(){
  return bridgePost({
    type: "overlay_warmup",
    overlay_id: OVERLAY_ID,
    channel: CHANNEL_MAIN,
    ts: Date.now(),
    breakId: computeBreakId()
  });
}

function applySaleFromSSE(evt){
  const breakId = String(evt?.breakId || evt?.break_id || "");
  if (breakId && breakId !== computeBreakId()) return;

  const c = counts();
  if (c.rem <= 0) return;

  state.soldCount = c.sold + 1;
  saveLocal();
  renderPromo();
  updateScoresMarquee();
}

function handleSSEEvent(evt, channel){
  const type = String(evt?.type || "").toLowerCase();

  if (type === "reset"){
    resetSold();
    return;
  }

  if (channel === CHANNEL_MAIN){
    if (["sale","sold","purchase","team_sold"].includes(type)) applySaleFromSSE(evt);

    if (type === "set_break" || type === "next_break"){
      const bn = Number(evt?.breakNo || evt?.break_no);
      if (Number.isFinite(bn) && bn >= 1){
        setDailyCounter(bn);
        renderHeader();
      }
    }
  }

  if (channel === CHANNEL_SCORES){
    const line = String(evt?.line || evt?.text || evt?.ticker || evt?.scores || "").trim();
    if (line) setScoresLine(line);
  }
}

function startSSE(){
  if (sseMain) try{ sseMain.close(); }catch(_){}
  if (sseScores) try{ sseScores.close(); }catch(_){}
  sseMain = null;
  sseScores = null;

  if (!bridgeEnabled()){
    setSSEStatus("error", "idle (no bridge)");
    return;
  }

  sseMain = connectSSE({
    channel: CHANNEL_MAIN,
    onEvent: handleSSEEvent,
    onStatus: setSSEStatus
  });

  if (ENABLE_SCORES){
    sseScores = connectSSE({
      channel: CHANNEL_SCORES,
      onEvent: handleSSEEvent,
      onStatus: () => {}
    });
  }

  bridgeWarmup();
}

function bindModalClose(maskEl, closeFn){
  if (!maskEl) return;
  maskEl.addEventListener("click", (e) => {
    if (e.target === maskEl) closeFn();
  });
}

function bindUI(){
  if (el.brandLogo) el.brandLogo.addEventListener("click", openHeaderModal);
 if (el.soldPanel) el.soldPanel.addEventListener("click", () => {
  const c = counts();
  if (c.rem <= 0) return;
  state.soldCount = c.sold + 1;
  saveLocal();
  renderPromo();
  updateScoresMarquee();
});
  if (el.topTickerBar) el.topTickerBar.addEventListener("click", openHeaderModal);

  if (el.promoPanel) el.promoPanel.addEventListener("click", openPromoModal);

  if (el.scoresTickerBar) el.scoresTickerBar.addEventListener("click", openScoresModal);

  if (el.headerCloseBtn) el.headerCloseBtn.addEventListener("click", closeHeaderModal);
  if (el.headerSaveBtn) el.headerSaveBtn.addEventListener("click", saveHeaderModal);
  if (el.headerResetBtn) el.headerResetBtn.addEventListener("click", () => {
    resetSold();
    closeHeaderModal();
  });
  if (el.headerNextBreakBtn) el.headerNextBreakBtn.addEventListener("click", () => {
    state.breakNo = incrementDailyCounter();
    saveLocal();
    renderHeader();
    closeHeaderModal();
  });

  if (el.promoCloseBtn) el.promoCloseBtn.addEventListener("click", closePromoModal);
  if (el.promoSaveBtn) el.promoSaveBtn.addEventListener("click", savePromoModal);

  if (el.scoresCloseBtn) el.scoresCloseBtn.addEventListener("click", closeScoresModal);
  if (el.scoresSaveBtn) el.scoresSaveBtn.addEventListener("click", saveScoresModal);

  bindModalClose(el.headerModalMask, closeHeaderModal);
  bindModalClose(el.promoModalMask, closePromoModal);
  bindModalClose(el.scoresModalMask, closeScoresModal);
}

async function init(){
  state.breakNo = ensureDailyCounter();
  loadLocal();

  if (!Array.isArray(state.promos) || !state.promos.length) state.promos = ["Promo Spot 1"];
  if (!Array.isArray(state.chaseCards)) state.chaseCards = [];
  if (state.soldCount > state.chaseCards.length) state.soldCount = state.chaseCards.length;

  if (!state.scoresBySport.NBA) state.scoresBySport.NBA = "NBA: —";
  if (!state.scoresBySport.MLB) state.scoresBySport.MLB = "MLB: —";

  bindUI();
  renderHeader();
  renderPromo();
  updateScoresMarquee();
  startRotator();
  startSSE();
}

init();
  </script>
