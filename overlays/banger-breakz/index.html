<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=920, initial-scale=1.0"/>
  <title>Banger Breakz – Multi-Sport Box Break Overlay</title>

  <style>
    :root{
      /* ===== BANGER BREAKZ (electric blue lightning theme) =====
         extracted from provided logo:
         navy ~ #061028 / #07275B
         electric blue ~ #19559B / #063A85
         bright ice ~ #59A1D5
         whites/greys ~ #D8DADA
      */
      --bg0:#061028;
      --bg1:#040815;
      --panel:#07162e;
      --tile:#040a16;

      --bolt:#59A1D5;
      --bolt2:#19559B;
      --bolt3:#063A85;

      --white:#ffffff;
      --muted: rgba(255,255,255,0.80);

      --boltBorder: rgba(89,161,213,0.85);
      --boltBorderSoft: rgba(89,161,213,0.45);
      --iceBorder: rgba(255,255,255,0.14);

        --tileHTeam: 58px;      /* classic/team view tile height */
  --tileHDivision: 49px;  /* division view tile height */
  --tileH: var(--tileHTeam); /* active (auto-switched by JS) */
      --gap: 5px;

      --cols: 10; /* changes per sport */
    }

    *{ box-sizing:border-box; }

    body{
      margin:15px;
      background:transparent;
      font-family: "Arial Black", Arial, sans-serif;
      width:1080px;
      min-height:500px;
      user-select:none;
    }

    .container{
      position: relative;
      background:
        radial-gradient(900px 520px at 50% 0%, rgba(89,161,213,0.18), transparent 58%),
        radial-gradient(900px 520px at 18% 18%, rgba(25,85,155,0.14), transparent 62%),
        linear-gradient(180deg, var(--bg0) 0%, var(--bg1) 100%);
      border: 4px solid rgba(89,161,213,0.92);
      border-radius: 12px;
      padding: 6px;
      box-shadow: 0 0 22px rgba(0,0,0,0.75);
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }

    /* subtle lightning texture overlay */
    .container::before{
      content:"";
      position:absolute;
      inset:-40px;
      pointer-events:none;
      opacity:0.35;
      background:
        radial-gradient(circle at 12% 18%, rgba(89,161,213,0.35), transparent 55%),
        radial-gradient(circle at 72% 22%, rgba(25,85,155,0.28), transparent 58%),
        radial-gradient(circle at 46% 76%, rgba(89,161,213,0.22), transparent 60%),
        linear-gradient(115deg, transparent 0%, rgba(255,255,255,0.04) 45%, transparent 60%),
        linear-gradient(18deg, transparent 0%, rgba(89,161,213,0.08) 35%, transparent 55%);
      filter: blur(10px);
      animation: ambientPulse 6.5s ease-in-out infinite;
    }
    @keyframes ambientPulse{
      0%{ transform: translate(0,0) scale(1); opacity:0.30; }
      50%{ transform: translate(6px,-4px) scale(1.03); opacity:0.42; }
      100%{ transform: translate(0,0) scale(1); opacity:0.30; }
    }

    /* ===== HEADER ===== */
    .header{
      position: relative;
      background: linear-gradient(90deg, rgba(6,16,40,1) 0%, rgba(25,85,155,1) 50%, rgba(6,16,40,1) 100%);
      color: var(--white);
      padding: 6px 10px;
      margin: -6px -6px 6px -6px;
      border-radius: 6px 6px 0 0;
      display:flex;
      align-items:center;
      justify-content: space-between;
      gap:10px;
      border-bottom: 2px solid rgba(255,255,255,0.10);
      z-index: 2;
    }

    .header-left{
      display:flex;
      align-items:center;
      gap:10px;
      min-width: 0;
    }

    .header-icon{
      width:18px;height:18px;border-radius:50%;
      border:2px solid rgba(255,255,255,0.92);
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.95), var(--bolt2));
      box-shadow: 0 0 12px rgba(89,161,213,0.45);
      flex: 0 0 auto;
    }

    .header-text{
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 1px;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.85);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-transform: uppercase;
    }

    .header-right{
      display:flex;
      align-items:center;
      gap:10px;
      flex: 0 0 auto;
    }

    .break-pill{
      display:flex;
      align-items:center;
      gap:8px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 2px solid var(--boltBorder);
      background: rgba(0,0,0,0.32);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .break-pill .label{ opacity: 0.95; font-size: 19px; }
    .break-pill .value{ font-size: 19px; color: #fff; }

    /* ===== MAIN WRAPPER ===== */
    .main-content{
      display:flex;
      flex-direction:column;
      gap: 6px;
      position: relative;
      z-index: 2;
    }

    .teams-wrapper{
      background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, rgba(0,0,0,0.55) 100%);
      border-radius: 8px;
      padding: 1px;
      border: 3px solid rgba(89,161,213,0.55);
      isolation: isolate;
      position: relative;
      overflow: visible;
    }

    /* IMPORTANT: keep tiles above the flare */
    .teams-wrapper > *{
      position: relative;
      z-index: 2;
    }

    /* Border wick sweep (electric) */
    .teams-wrapper::after{
      content:"";
      position:absolute;
      inset: 0px;
      border-radius: inherit;
      pointer-events:none;
      z-index: 1;

      background:
        linear-gradient(130deg,
          transparent 0%,
          rgba(89,161,213,0) 35%,
          rgba(255,255,255,0.25) 48%,
          rgba(89,161,213,0.95) 58%,
          rgba(25,85,155,0.55) 64%,
          rgba(89,161,213,0.0) 72%,
          transparent 100%);
      background-size: 300% 300%;
      animation: teamsWickRun 4.5s linear infinite;

      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      mask-composite: exclude;

      padding: 2px;
      filter: blur(5px);
      opacity: 1;
      mix-blend-mode: screen;
    }

    @keyframes teamsWickRun{
      0%   { background-position:   0% 50%; }
      100% { background-position: 100% 50%; }
    }

    /* ===== GENERIC ROW GRID ===== */
    .row-grid{
      display:grid;
      gap: var(--gap);
      margin-bottom: 6px;
      grid-template-columns: repeat(var(--cols), 1fr);
      align-items: stretch;
    }

    .team{
      background: #000;
      border: 2px solid rgb(255 255 255 / 89%);
      border-radius: 6px;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      position:relative;
      height: var(--tileH);
      overflow:hidden;
      isolation:isolate;
      transition: transform 0.1s, box-shadow 0.1s, border-color 0.2s;
    }

    /* electric shimmer sweep */
    .team::before{
      content:"";
      position:absolute;
      inset:-2px;
      pointer-events:none;
      opacity:0;
      z-index:2;

      background:
        linear-gradient(
          120deg,
          transparent 35%,
          rgba(255,255,255,0.22) 45%,
          rgba(89,161,213,0.70) 50%,
          rgba(255,255,255,0.18) 55%,
          transparent 65%
        );

      transform: translateX(-140%) skewX(-18deg);
      transition: opacity 160ms ease;
      mix-blend-mode: screen;
    }

    .team:hover::before{
      opacity: 0.95;
      animation: boltShimmer 650ms ease-out both;
    }

    @keyframes boltShimmer{
      0%{ transform: translateX(-160%) skewX(-18deg); }
      100%{ transform: translateX(160%) skewX(-18deg); }
    }

    .team:hover{
      transform: translateY(-2px) scale(1.02);
      box-shadow:
        0 0 18px rgba(89,161,213,0.35),
        0 10px 18px rgba(0,0,0,0.45);
      border-color: rgba(255,255,255,0.55);
    }

    .team img{
      width:100%;
      height:100%;
      object-fit: cover;
      border-radius: 4px;
    }

    .team img.nfl-small{ object-fit: cover; }

    .team .fallback-code{
      color:#fff;
      font-size: 14px;
      letter-spacing: 1px;
      opacity: 0.9;
    }

    .team.sold img{
      opacity: 0.22;
      filter: grayscale(100%) brightness(0.35);
    }

    .team.flash{ animation: soldFlash 260ms ease; }
    @keyframes soldFlash{
      0%{ box-shadow: 0 0 0 rgba(89,161,213,0.0); }
      50%{ box-shadow: 0 0 18px rgba(89,161,213,0.65); }
      100%{ box-shadow: 0 0 0 rgba(89,161,213,0.0); }
    }

    .team.sold::after{
      content:"X";
      position:absolute;
      font-size: 20px;
      color: #061028;
      text-shadow: 0 0 2px rgba(255,255,255,0.35);
      z-index: 10;
      background: rgba(255, 255, 255, 0.637);
      border-radius: 50%;
      width: 26px;
      height: 26px;
      display:flex;
      align-items:center;
      justify-content:center;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      border: 2px solid rgba(89,161,213,0.95);
      box-shadow: 0 0 12px rgba(89,161,213,0.35);
    }

    .team.sold:hover{
      transform:none;
      box-shadow:none;
      border-color: rgba(89,161,213,0.35);
    }
    .team.sold:hover::before,
    .team.sold:hover::after{
      opacity:0;
      animation:none;
    }
/* ===== Ticker Editor Modal (OBS-friendly) ===== */
.modal-backdrop{
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.60);
  display:none;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}

.modal-backdrop.open{ display:flex; }

.modal-panel{
  width: 860px;
  max-width: calc(100vw - 30px);
  border-radius: 12px;
  border: 3px solid rgba(89,161,213,0.70);
  background: linear-gradient(180deg, rgba(6,16,40,0.98) 0%, rgba(4,8,20,0.98) 100%);
  box-shadow: 0 0 28px rgba(0,0,0,0.75);
  padding: 10px;
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 8px;
}

.modal-title{
  font-weight: 900;
  letter-spacing: 1px;
  color:#fff;
  text-transform: uppercase;
  font-size: 14px;
}

.modal-actions{
  display:flex;
  gap: 6px;
  align-items:center;
}

.ticker-editor{
  display:flex;
  gap: 10px;
  align-items: stretch;
}

.ticker-editor textarea{
  flex: 1 1 auto;
  min-height: 92px;
  resize: none;
  padding: 10px 12px;
  border-radius: 10px;
  border: 2px solid rgb(255 255 255 / 85%);
  background: rgba(0,0,0,0.35);
  color:#fff;
  font-weight: 900;
  outline:none;
  font-family: Arial, sans-serif;
  font-size: 18px;
  line-height: 18px;
}

.ticker-hint{
  margin-top: 6px;
  font-size: 11px;
  opacity: 0.85;
  color:#fff;
  text-transform: none;
  letter-spacing: 0.2px;
}

    /* ===== LOGO SLOT (IN GRID) ===== */
    .logo-slot{
      border-radius: 10px;
      height: calc(var(--tileH) * 1);
      display:flex;
      align-items:center;
      justify-content:center;
      pointer-events:none;

      overflow:visible;
      position:relative;
    }
    .logo-slot img{
      max-height: 200px;
      max-width: 1300%;
      object-fit: cover;
      position: absolute;
        transform-origin: 50% 60%;
  will-change: transform, filter;
  animation: logoBreathe 3.8s ease-in-out infinite;
      top: -106px;
      filter:
        drop-shadow(0 2px 10px rgba(0,0,0,0.70))
        drop-shadow(0 0 14px rgba(89,161,213,0.35));
    }

/* ===== Logo "breathing" animation ===== */
@keyframes logoBreathe{
  0%, 100%{
    transform: translateY(0) scale(1);
    filter:
      drop-shadow(0 2px 10px rgba(0,0,0,0.70))
      drop-shadow(0 0 14px rgba(89,161,213,0.35));
  }
  50%{
    transform: translateY(-2px) scale(1.03);
    filter:
      drop-shadow(0 3px 12px rgba(0,0,0,0.72))
      drop-shadow(0 0 22px rgba(89,161,213,0.55));
  }
}


    /* ===== TICKER ROW ===== */
    .ticker-slot{
      border-radius: 10px;
      height: var(--tileH);
      display:flex;
      align-items:center;
      overflow:hidden;
      background: linear-gradient(90deg, rgba(6,16,40,1) 0%, rgba(25,85,155,1) 50%, rgba(6,16,40,1) 100%);
      border: 2px solid var(--boltBorder);
      padding: 0 10px;
    }

    .ticker-text{
      display:inline-block;
      white-space: nowrap;
      padding-left: 100%;
      animation: tickerScroll 22s linear infinite;
      font-weight: 900;
      letter-spacing: 0.8px;
      color: #fff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.65);
    }
    @keyframes tickerScroll{
      0%{ transform: translateX(0); }
      100%{ transform: translateX(-100%); }
    }

    /* ===== CONTROLS ROW ===== */
 .controls-row{
  margin-top: 2px;
  display:grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 65px;
  align-items: stretch;
}
/* ===== NFL Division View center slots (2 columns wide) ===== */
.center-slot{
  border-radius: 10px;
  height: var(--tileH);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  border: 2px solid rgba(255,255,255,0.18);
  background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(0,0,0,0.22));
  box-shadow: inset 0 0 0 1px rgba(0,0,0,0.35);
}

.center-slot .mini-stat{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-weight: 900;
  color:#fff;
  background: linear-gradient(90deg, rgba(6,16,40,1) 0%, rgba(25,85,155,1) 50%, rgba(6,16,40,1) 100%);
}

.center-slot .mini-stat .val{
  font-size: 18px;
  line-height: 18px;
}

.center-slot .mini-stat .lab{
  font-size: 10px;
  letter-spacing: 1px;
  margin-top: 2px;
  opacity: 0.95;
}

/* Stack the 3 mini controls between AFC and NFC */
.center-stack{
  border-radius: 10px;
  display:flex;
  flex-direction:column;
  gap: var(--gap);
  padding: 0;
  overflow: visible; /* was hidden */
}

/* More space specifically in the NFL section layout center column */
.nfl-center-col .center-stack{
  gap: 10px;       /* <- increase spacing */
  padding: 4px 0;  /* <- adds breathing room top/bottom */
}


/* ONLY do the auto-height flex trick when the stack lives inside a .row-grid */
.row-grid .center-stack .center-slot{
  height: auto;
  flex: 1 1 0;
}

/* In the section layout (AFC | CONTROLS | NFC), keep normal fixed tile height */
.nfl-center-col .center-stack .center-slot{
  height: var(--tileH);
  flex: 0 0 auto;
}



.center-slot .mini-btn{
  width:100%;
  height:100%;
  border:0;
  cursor:pointer;
  font-family: inherit;
  font-weight: 900;
  letter-spacing: 0.5px;
  border-radius: 8px;
  color:#061028;
  background: linear-gradient(135deg, rgba(89,161,213,1) 0%, rgba(25,85,155,1) 100%);
}
.center-slot .mini-btn:active{ transform: translateY(1px); }


    .stat-box{

      color:#fff;

    }

    .btn{

    /* ===== SOLD LIST ===== */
    .sold-list-container{

/* ===== NFL Division Group (4 teams act as one) ===== */
.division-group{
  grid-column: span 5;              /* was 4 */
  position: relative;
  display:grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--gap);
  padding:5px;
}


.division-buyer{
  position:absolute;
  left: 4px;
  right: 4px;
  top: 15px;
  height: 30px;
  border-radius: 8px;
  display:none;
  align-items:center;
  justify-content:center;
  z-index: 20;

  background: rgba(0,0,0,0.70);
  border: 2px solid rgba(89,161,213,0.85);
  color:#fff;
  font-weight: 900;
  letter-spacing: 1px;
  text-transform: uppercase;
  text-shadow: 0 2px 10px rgba(0,0,0,0.7);
  pointer-events:none;
}

.division-group.sold .division-buyer{
  display:flex;
}

/* ===== Conference label row (AFC / NFC) ===== */
.conf-label{
  height: 26px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius: 10px;
  border: 2px solid rgba(255,255,255,0.16);
  background: linear-gradient(90deg, rgba(6,16,40,0.85), rgba(25,85,155,0.85), rgba(6,16,40,0.85));
  color:#fff;
  font-weight: 900;
  letter-spacing: 2px;
  text-transform: uppercase;
  text-shadow: 0 2px 10px rgba(0,0,0,0.7);
}


/* ===== Division label on each 4-team group ===== */
.division-tag{
  position:absolute;
  left: 6px;
  bottom: 50px;
  z-index: 25;
  padding: 2px 6px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 900;
  letter-spacing: 1px;
  text-transform: uppercase;
  color:#061028;
  background: rgba(255,255,255,0.88);
  border: 2px solid rgba(89,161,213,0.95);
  box-shadow: 0 0 10px rgba(89,161,213,0.25);
  pointer-events:none;
}

/* =========================
   NFL DIVISION VIEW: 3 SECTION LAYOUT
   AFC | CONTROLS | NFC
========================= */

.nfl-div-layout{
  display:grid;
  grid-template-columns: 1fr 140px 1fr; /* center width is fixed; tweak if desired */
  gap: var(--gap);
  margin-bottom: 6px;
  align-items: start;
}

.conf-col{
  display:flex;
  flex-direction:column;
  gap: var(--gap);
}

.nfl-center-col{
  display:flex;
  flex-direction:column;
  gap: var(--gap);
}
/* conference labels live inside columns now */
.conf-col .conf-label{
  width: 100%;
  grid-column: auto !important;
}

/* IMPORTANT: division-group was hard-coded to span 5 columns for row-grid.
   In section layout it must behave like a normal block. */
.nfl-div-layout .division-group{
  grid-column: auto !important;
  width: 100%;
}

/* Center stack: make it look like a column block */
.nfl-center-col{
  display:flex;
  flex-direction:column;
  gap: var(--gap);
}

/* center-stack already exists; ensure it fills the column nicely */
.nfl-center-col .center-stack{
  width: 100%;

// ---- NFL grouping (AFC then NFC, by division) ----
const NFL_DIVISION_MAP = {
  AFCE: ["BUF","MIA","NE","NYJ"],
  AFCN: ["BAL","CIN","CLE","PIT"],
  AFCS: ["HOU","IND","JAX","TEN"],
  AFCW: ["DEN","KC","LAC","LV"],
  NFCE: ["DAL","NYG","PHI","WAS"],
  NFCN: ["CHI","DET","GB","MIN"],
  NFCS: ["ATL","CAR","NO","TB"],
  NFCW: ["ARI","LAR","SEA","SF"]
};

const NFL_DIV_PRETTY = {
  AFCE: "AFC EAST",
  AFCN: "AFC NORTH",
  AFCS: "AFC SOUTH",
  AFCW: "AFC WEST",
  NFCE: "NFC EAST",
  NFCN: "NFC NORTH",
  NFCS: "NFC SOUTH",
  NFCW: "NFC WEST"
};


const NFL_DIV_ORDER = ["AFCE","AFCN","AFCS","AFCW","NFCE","NFCN","NFCS","NFCW"];

function orderNflTeamsByDivision(teams){
  const byCode = new Map(teams.map(t => [String(t.code).toUpperCase(), t]));
  const ordered = [];

  for (const div of NFL_DIV_ORDER){
    for (const code of (NFL_DIVISION_MAP[div] || [])){
      const tm = byCode.get(code);
      if (tm) ordered.push(tm);
    }
  }

  // safety: append any missing teams (shouldn't happen)
  if (ordered.length !== teams.length){
    const used = new Set(ordered.map(t => t.code));
    teams.forEach(t => { if (!used.has(t.code)) ordered.push(t); });
  }
  return ordered;
}

function makeConferenceLabel(text, span=5){
  const d = document.createElement("div");
  d.className = "conf-label";
  d.style.gridColumn = `span ${span}`;

  return d;
}

const divisionBuyers = new Map(); // divKey -> buyer string

function getDivisionForTeam(code){
  const c = String(code || "").trim().toUpperCase();
  for (const div of NFL_DIV_ORDER){
    const codes = NFL_DIVISION_MAP[div] || [];
    if (codes.includes(c)) return div;
  }
  return null;
}

function divisionCodes(div){
  return (NFL_DIVISION_MAP[div] || []).slice();
}

function isDivisionSold(div){
  const codes = divisionCodes(div);
  return codes.length === 4 && codes.every(c => soldTeams.has(c));
}

function setDivisionBuyer(div, buyer){
  const b = String(buyer || "");
  divisionBuyers.set(div, b);

  // update overlay text if the group exists in DOM
  const group = document.querySelector(`.division-group[data-division="${cssEscape(div)}"]`);
  if (group){
    const label = group.querySelector(".division-buyer");

function toggleDivision(divKey, buyerFromSSE=""){
  if (!divKey) return;

  const codes = divisionCodes(divKey);
  if (codes.length !== 4) return;

  const selling = !isDivisionSold(divKey);

  if (selling){
    // mark all 4 sold
    codes.forEach(c => soldTeams.add(c));

    // one sold-list entry for the division
    soldTeamsList = soldTeamsList.filter(e => !(e.isDivision && e.div === divKey));
    soldTeamsList.push({ isDivision:true, div: divKey, buyer: buyerFromSSE || (divisionBuyers.get(divKey) || "") });

    // keep buyer remembered
    if (buyerFromSSE) divisionBuyers.set(divKey, buyerFromSSE);

  } else {
    // unsell all 4
    codes.forEach(c => soldTeams.delete(c));

    // remove division entry + buyer
    soldTeamsList = soldTeamsList.filter(e => !(e.isDivision && e.div === divKey));
    divisionBuyers.delete(divKey);
  }

  // update DOM tiles + overlay
  codes.forEach(code => {
    const tile = document.querySelector(`[data-team-code="${cssEscape(code)}"]`);
    if (tile){
      if (selling){
        tile.classList.add("sold","flash");
        setTimeout(()=>tile.classList.remove("flash"), 280);
      } else {
        tile.classList.remove("sold");
      }
    }
  });

  const group = document.querySelector(`.division-group[data-division="${cssEscape(divKey)}"]`);
  if (group){
    if (selling) group.classList.add("sold");
    else group.classList.remove("sold");

    const label = group.querySelector(".division-buyer");
    if (label){
      const b = (divisionBuyers.get(divKey) || "").trim();
      label.textContent = b || "SOLD";
    }
  }

  updateStats();
  updateSoldList();
}

  // ===== Helpers =====
  function cssEscape(s){
    return String(s || '').replace(/"/g,'\\"');
  }

  function norm(s){
    return String(s || '')
      .toLowerCase()
      .replace(/&/g,'and')
      .replace(/[^a-z0-9]+/g,' ')
      .trim();
  }

  function inferCodeFromTitle(title, sportHint){
    const t = norm(title);
    if (!t) return null;

    // try hinted sport first
    if (sportHint && breakTypes[sportHint]){
      const list = breakTypes[sportHint].teams || [];
      for (const tm of list){
        const code = String(tm.code||'').toUpperCase().trim();
        if (!code) continue;
        if (t.includes(norm(code))) return code;
        if (tm.name && t.includes(norm(tm.name))) return code;
      }
    }

    // then scan all sports
    for (const k of Object.keys(breakTypes)){
      const list = breakTypes[k].teams || [];
      for (const tm of list){
        const code = String(tm.code||'').toUpperCase().trim();
        if (!code) continue;
        if (t.includes(norm(code))) return code;
        if (tm.name && t.includes(norm(tm.name))) return code;
      }
    }

    // token fallback (2-4 letters)
    const tokens = t.toUpperCase().split(/\s+/).filter(Boolean);
    for (const tok of tokens){
      if (tok.length < 2 || tok.length > 4) continue;
      for (const k of Object.keys(breakTypes)){
        const list = breakTypes[k].teams || [];
        for (const tm of list){
          const code = String(tm.code||'').toUpperCase().trim();
          if (tok === code) return code;
        }
      }
    }

    return null;
  }

  /* =========================
     SSE Bridge (Wizards-style)
  ========================== */
  let sse = null;

  const BRIDGE_URL = (() => {
    const q = new URLSearchParams(location.search).get('bridge');
    if (q) {
      const cleaned = q.replace(/\/$/, '');
      localStorage.setItem(LS.BRIDGE, cleaned);
      return cleaned;
    }
    const saved = localStorage.getItem(LS.BRIDGE);
    return saved ? saved.replace(/\/$/, '') : '';
  })();

  const BRIDGE_KEY = (() => {
    const q = new URLSearchParams(location.search).get('key');
    if (q) {
      localStorage.setItem(LS.KEY, q);
      return q;
    }
    return localStorage.getItem(LS.KEY) || '';
  })();

  function automationEnabled(){ return !!BRIDGE_URL; }

  function normalizeBridge(u){
    return String(u||'')
      .trim()
      .replace(/\/$/, '')
      .replace(/\/(events|stream)(\/.*)?$/,'');
  }

  function setSSEStatus(state, msg){
    const wrap = document.getElementById('sseStatus');
    const text = document.getElementById('sseText');
    if (!wrap || !text) return;

    wrap.classList.remove('connected','error');
    if (state === 'connected') wrap.classList.add('connected');
    if (state === 'error') wrap.classList.add('error');

    text.textContent = msg || state || 'disconnected';
  }

  function connectSSE(url){
    if (sse) { try { sse.close(); } catch(_){} }
    setSSEStatus('error','connecting');

    try{
      sse = new EventSource(url);

      sse.onopen = () => {
        setSSEStatus('connected','connected');
        warmupPing();
      };

      sse.onmessage = (e) => {
        try{
          const data = JSON.parse(e.data);
          handleSSEEvent(data);
        }catch(_){}
      };

      sse.onerror = () => {
        setSSEStatus('error','reconnecting');
        try { sse.close(); } catch(_) {}
        sse = null;
        setTimeout(() => connectSSE(url), 2500);
      };
    }catch(_){
      setSSEStatus('error','failed');
    }
  }

  function startSSE(){
    if (!automationEnabled()){
      setSSEStatus('error','missing bridge');
      return;
    }
    const base = normalizeBridge(BRIDGE_URL);
    connectSSE(`${base}/stream`);
  }

  async function warmupPing(){
    if (!automationEnabled()) return;
    const base = normalizeBridge(BRIDGE_URL);

    try{
      await fetch(`${base}/events`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          ...(BRIDGE_KEY ? { 'x-bridge-key': BRIDGE_KEY } : {})
        },
        body: JSON.stringify({
          type: 'overlay_warmup',
          overlay: 'bangerbreakz',
          breakId: computeBreakId(),
          ts: Date.now()
        })
      });
    }catch(_){}
  }

  function handleSSEEvent(data){
    const type = String(data?.type || '').toLowerCase();
    if (type === 'hello' || type === 'scores') return;

    if (type === 'reset'){
      resetAll();
      return;
    }

    // supports both payload styles:
    // wizards: { type:'set_break', breakNumber: 12 }
    // radman:  { type:'set_break', value: "12" }
    if (type === 'set_break'){
      const n = parseInt(String(data?.breakNumber ?? data?.value ?? ''), 10);
      if (Number.isFinite(n) && n > 0) setBreakNumber(n);
      return;
    }

    if (type === 'set_sport'){
      const sport = String(data?.sport || '').toLowerCase();
      if (sport && breakTypes[sport]) setSport(sport);
      return;
    }

    if (type === 'set_ticker'){
      if (Array.isArray(data?.lines)) {
        setTickerLines(data.lines.map(x => String(x)));
      } else if (typeof data?.text === "string") {
        const parts = data.text.split("•").map(s => s.trim()).filter(Boolean);
        setTickerLines(parts.length ? parts : DEFAULT_TICKER_LINES.slice());
      }
      return;
    }

    if (type === 'team_unsold'){
      const code = String(data?.code || '').trim().toUpperCase();
      if (!code) return;
      sseMarkUnsold(code);
      return;
    }

    // primary sale event
    // expected:
    // { type:'team_sold', sport:'nfl', code:'DAL', buyer:'name' }
    // OR extension-style: { type:'team_sold', buyer, title, amount } (code inferred)
    if (type === 'team_sold'){
      const sport = String(data?.sport || '').toLowerCase();
      const buyer = String(data?.buyer || '').trim();

      let code = String(data?.code || '').trim().toUpperCase();
      if (!code) code = inferCodeFromTitle(data?.title, sport || currentBreakType);

      if (!code) return;

      if (sport && breakTypes[sport] && sport !== currentBreakType){
        currentBreakType = sport;
        buildLayout();
      }

      sseMarkSold(code, buyer);
      return;
    }

    if (type === 'buyer' || type === 'buyer_update'){
      const code = String(data?.code || '').trim().toUpperCase();
      const buyer = String(data?.buyer || '').trim();
      if (!code) return;
      sseUpdateBuyer(code, buyer);
      return;
    }
  }

  function sseMarkSold(code, buyer=""){
    // If NFL division view is on, a team_sold event sells the whole division
if (currentBreakType === "nfl" && nflDivisionView){
  const div = getDivisionForTeam(code);
  if (div){
    toggleDivision(div, buyer);
    return;
  }
}

    if (!code) return;

    const exists = breakTypes[currentBreakType].teams.some(t => t.code === code);
    if (!exists) return;

    if (!soldTeams.has(code)){
      soldTeams.add(code);
      soldTeamsList.push({ code, buyer });

      const tile = document.querySelector(`[data-team-code="${cssEscape(code)}"]`);
      if (tile){
        tile.classList.add("sold","flash");
        setTimeout(()=>tile.classList.remove("flash"), 280);
      }

      updateStats();
      updateSoldList();
    } else if (buyer) {
      const entry = soldTeamsList.find(t => t.code === code);
      if (entry) entry.buyer = buyer;
      updateSoldList();
    }
  }

function sseMarkUnsold(code){
  if (currentBreakType === "nfl" && nflDivisionView){
    const div = getDivisionForTeam(code);
    if (div){
      if (isDivisionSold(div)) toggleDivision(div, "");
      return;

  if (!code) return;
  soldTeams.delete(code);
  soldTeamsList = soldTeamsList.filter(t => t.code !== code);

  const tile = document.querySelector(`[data-team-code="${cssEscape(code)}"]`);
  if (tile) tile.classList.remove("sold");

  updateStats();
  updateSoldList();
}


  function sseUpdateBuyer(code, buyer){
    const entry = soldTeamsList.find(t => t.code === code);
    if (entry) entry.buyer = buyer || "";
    updateSoldList();

      if (id === "titleModal") closeTitleEditor();
      if (id === "breakModal") closeBreakEditor();
    }
  });
});


  });
</script>


<!-- ===== Title Editor Modal ===== -->
<div class="modal-backdrop" id="titleModal">

</div>
