<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wizards Company Breakz — Multi-Sport Break Overlay</title>

  <style>
    :root{
      /* ===== WIZARDS (Balanced Silver + Red) ===== */
      --bg0:#060606;
      --bg1:#0d0d0d;

      --steel1:#f2eee6;  /* bright */
      --steel2:#c9c2b7;  /* mid */
      --steel3:#6e6861;  /* dark */

      --red:#f4352f;       /* bright accent */
      --redDeep:#a90401;   /* deep accent */

      --white:#ffffff;

      --border: rgba(242,238,230,0.35);
      --borderSoft: rgba(242,238,230,0.20);

      --team-cols: 5;
      --team-height: 68px;
      --teams-h: 390px;

      --W:1080px;
      --radius:16px;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      width:100%;
      max-width: var(--W);
      min-height: 600px;
      margin-inline:auto;
      font-family: Arial, sans-serif;
      color: var(--white);
      background: transparent;
      display:flex;
      flex-direction:column;
      align-items:center;
      user-select:none;
    }

    /* ===== Outer container ===== */
    .overlay-container{
      width:100%;
      max-width: var(--W);
      overflow:hidden;
      border-radius: var(--radius);
      padding: 8px;
      background:
        radial-gradient(900px 420px at 30% 0%, rgba(242,238,230,0.16), transparent 62%),
        radial-gradient(900px 520px at 72% 30%, rgba(244,53,47,0.16), transparent 62%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      border: 4px solid rgba(242,238,230,0.26);
      box-shadow: 0 12px 32px rgba(0,0,0,0.70);
      display:flex;
      flex-direction:column;
      gap: 8px;
      position:relative;
    }

    .overlay-container::before{
      content:"";
      position:absolute; inset:-30px;
      background:
        radial-gradient(circle at 22% 20%, rgba(242,238,230,0.14), transparent 56%),
        radial-gradient(circle at 72% 18%, rgba(244,53,47,0.14), transparent 58%),
        radial-gradient(circle at 60% 86%, rgba(242,238,230,0.10), transparent 58%);
      filter: blur(16px);
      opacity: .95;
      pointer-events:none;
    }

    /* ===== Header ===== */
    .header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      border-radius: 14px;
      padding: 6px 10px;
      background:
        linear-gradient(90deg,
          rgba(242,238,230,0.20),
          rgba(0,0,0,0.65),
          rgba(244,53,47,0.22)
        );
      border: 2px solid var(--borderSoft);
      position:relative;
      z-index: 2;
    }

    .brand{
      display:flex;
      flex-direction:column;
      gap: 2px;
      min-width: 0;
    }

    .brand-title{
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 3px 12px rgba(0,0,0,0.85);
      white-space: nowrap;
      overflow:hidden;
      text-overflow: ellipsis;
      color: var(--steel1);
    }

    .brand-slogan{
      font-size: 12px;
      font-weight: 800;
      opacity: 0.92;
      letter-spacing: 0.8px;
      margin-top:-4px;
      white-space: nowrap;
      overflow:hidden;
      text-overflow: ellipsis;
      color: rgba(242,238,230,0.92);
    }

    .header-right{
      display:flex;
      align-items:center;
      gap: 10px;
      flex: 0 0 auto;
    }

    .break-id-box{
      display:flex;
      align-items:center;
      gap: 10px;
      padding: 6px 10px;
      border-radius: 12px;
      background: rgba(0,0,0,0.55);
      border: 2px solid rgba(242,238,230,0.22);
      box-shadow: inset 0 0 14px rgba(0,0,0,0.45);
    }

    .break-id-label{
      font-size: 18px;
      opacity: 0.86;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 900;
      color: rgba(242,238,230,0.92);
    }

    .break-id-value{
      font-size: 20px;
      font-weight: 900;
      color: var(--steel1);
      text-shadow: 0 2px 0 rgba(0,0,0,0.85);
      min-width: 28px;
      text-align:right;
    }

    /* ===== Main wrapper ===== */
    .main{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap: 6px;
      width:100%;
      min-height:0;
      position: relative;
      z-index: 2;
    }

    /* ===== Split grid + center control bar ===== */
    .teams-section{
      display:grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 2px;
      height: var(--teams-h);
      min-height:0;
      align-items:stretch;
      padding: 6px;
      border-radius: 14px;
      background: linear-gradient(90deg, rgba(242,238,230,0.10), rgba(0,0,0,0.20), rgba(244,53,47,0.10));
      border: 2px solid rgba(255,255,255,0.10);
    }

    .conference{
      display:flex;
      flex-direction:column;
      border: 2px solid var(--borderSoft);
      border-radius: 14px;
      padding: 3px;
      background: rgba(0,0,0,0.45);
      min-height:0;
      height:inherit;
      width:440px;
      overflow-y:auto;
      overflow-x:hidden;
      justify-content: flex-start;
    }
    .conference::-webkit-scrollbar{ display:none; }

    .conference-title{
      font-size: 16px;
      font-weight: 900;
      text-align:center;
      
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px solid rgba(242,238,230,0.22);
      padding-bottom: 4px;
      color: var(--steel1);
    }

    .division{ margin-top: 6px; }

    .division-name{
      font-size: 13px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.92;
      
      color: rgba(242,238,230,0.90);
    }

    .division-teams{
      display:grid;
      grid-template-columns: repeat(var(--team-cols), 1fr);
      gap: 4px;
    }

    /* ===== Team tile ===== */
    .team{
      position:relative;
      background: rgba(0,0,0,0.78);
      border-radius: 10px;
      height: var(--team-height);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      cursor:pointer;
      border: 2px solid rgba(242,238,230,0.20);
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
      will-change: transform;
    }

    .team:hover{
      transform: translateY(-2px) scale(1.015);
      box-shadow: 0 10px 22px rgba(0,0,0,0.55);
      border-color: rgba(244,53,47,0.55);
    }

    .team img{
      width:100%;
      height:100%;
      object-fit: cover;
      filter: drop-shadow(0 10px 16px rgba(0,0,0,0.55));
    }

    .team-label{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 10px;
      text-align:center;
      font-weight: 900;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      font-size: 18px;
      line-height: 1.05;
      text-shadow: 0 3px 12px rgba(0,0,0,0.80);
      z-index: 3;
      pointer-events:none;
      color: rgb(255, 255, 255);
    }

/* ===== NIL two-line label (title + subtitle) ===== */
.team.nil .team-label{
  flex-direction: column;
  gap: 2px;
  padding: 8px;
}

.team.nil img{
  filter: brightness(0.35) contrast(1.05);
}


.nil-title{
  width: 100%;
  text-align: center;
  font-weight: 900;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  line-height: 1.02;
  /* font-size will be auto-fit in JS */
  white-space: nowrap;          /* keep title on one line */
  overflow: hidden;
  text-overflow: ellipsis;      /* safety fallback */
}

.nil-sub{
  width: 100%;
  text-align: center;
  font-weight: 800;
  opacity: 0.85;
  letter-spacing: 0.4px;
  text-transform: uppercase;
  font-size: 11px;
  line-height: 1.1;
  max-height: 2.2em;            /* ~2 lines */
  overflow: hidden;             /* hide overflow ok */
}

    
    .team::before{
      content:'';
      position:absolute;
      inset:-12px;
      border-radius: 14px;
      background:
        radial-gradient(circle, rgba(242,238,230,0.28) 0%, rgba(244,53,47,0.20) 40%, transparent 72%);
      filter: blur(18px);
      opacity: 0.34;
      z-index: 0;
      pointer-events:none;
      animation: tilePulse 3.2s ease-in-out infinite;
    }

    @keyframes tilePulse{
      0%{ opacity: .16; transform: scale(.98); }
      50%{ opacity: .45; transform: scale(1.02); }
      100%{ opacity: .16; transform: scale(.98); }
    }

    .team.sold::before{ opacity: 0.10; animation:none; }

    .team.sold img{
      opacity: 0.22;
      filter: grayscale(1) brightness(0.35);
    }

    .sold-x{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size: 54px;
      font-weight: 900;
      color: rgba(244,53,47,0.95);
      text-shadow:
        0 0 10px rgba(244,53,47,0.65),
        0 0 18px rgba(242,238,230,0.22),
        0 10px 22px rgba(0,0,0,0.85);
      z-index: 4;
      pointer-events:none;
      opacity: 0;
      transform: scale(0.92);
      transition: opacity .14s ease, transform .14s ease;
    }
    .team.sold .sold-x{ opacity: 1; transform: scale(1); }

    /* ===== Center control bar ===== */
    .control-bar{
      display:flex;
      flex-direction:column;
      justify-content: space-between;
      align-items: stretch;
      width: 140px;
      border-radius: 14px;
      padding: 10px 6px;
      background: linear-gradient(180deg, rgba(242,238,230,0.12), rgba(0,0,0,0.55), rgba(244,53,47,0.14));
      border: 2px solid rgba(242,238,230,0.18);
      box-shadow: inset 0 0 18px rgba(0,0,0,0.35);
       position: relative;              /* NEW: anchor for absolute logo */
  overflow: visible;                /* keeps glow clean */
    }

    .control-bar .btn{
      background: linear-gradient(180deg, rgba(244,53,47,0.88), rgba(169,4,1,0.92));
      color: #fff;
      border: 2px solid rgba(242,238,230,0.20);
      border-radius: 12px;
      padding: 10px 8px;
      font-size: 18px;
      font-weight: 900;
      text-transform: uppercase;
      cursor:pointer;
      width:100%;
      box-shadow: 0 6px 14px rgba(0,0,0,0.35);
      transition: transform .12s ease;
      position: relative;
  z-index: 2; 
    }
    .control-bar .btn:active{ transform: translateY(1px); }

    .stat-box{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      background: rgba(0,0,0,0.55);
      border: 2px solid rgba(242,238,230,0.18);
      border-radius: 12px;
      padding: 6px 4px;
      position: relative;
  z-index: 2; 
    }
    .stat-box .value{
      font-size: 22px;
      font-weight: 900;
      color: var(--steel1);
      text-shadow: 0 2px 0 rgba(0,0,0,0.85);
    }
    .stat-box .label{
      font-size: 13px;
      letter-spacing: 1px;
      text-transform: uppercase;
      opacity: 0.85;
      font-weight: 900;
      color: rgba(242,238,230,0.92);
    }

    .sold-stat{ cursor:pointer; }

.brand-logo{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap: 4px;

  position:relative;               /* NEW: remove from flex layout */
  left:50%;
  top:50%;
  transform: translate(-50%, -50%);
  width: 100%;
  padding: 0;

  pointer-events:none;             /* prevents blocking clicks on stats/buttons */
  animation: logoBreathe 9s ease-in-out infinite;
  transform-origin:center;
  z-index: 1;
}



    @keyframes logoBreathe{
      0%{ transform: scale(1); }
      50%{ transform: scale(1.06); }
      100%{ transform: scale(1); }
    }

    .brand-logo img{
      width: 150%;
      height:auto;
      top:-280px;
      left:-95px;
      z-index: 999;;
      object-fit: contain;
      position:absolute;
      filter:
        drop-shadow(0 10px 18px rgba(0,0,0,0.65))
        drop-shadow(0 0 12px rgba(242,238,230,0.18))
        drop-shadow(0 0 10px rgba(244,53,47,0.18));
      pointer-events:none;
    }

    /* "update the name on the logo to match" — overlay-safe text tag under logo */
    .logo-tag{
      font-weight: 900;
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: rgba(242,238,230,0.92);
      text-shadow: 0 2px 8px rgba(0,0,0,0.65);
      opacity: 0.95;
      text-align:center;
      line-height: 1.1;
      padding: 0 4px;
    }

    /* ===== Ticker ===== */
    .ticker{
      width:100%;
      overflow:hidden;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(90deg, rgba(242,238,230,0.16), rgba(0,0,0,0.70), rgba(244,53,47,0.18));
      border: 2px solid rgba(242,238,230,0.16);
    }

    .ticker-text{
      display:inline-block;
      white-space:nowrap;
      padding-left:100%;
      animation: tickerScroll 20s linear infinite;
      font-weight: 900;
      letter-spacing: 0.8px;
      font-size: 18px;
      line-height: 40px;
      text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(0,0,0,0.65);
      color: rgba(242,238,230,0.96);
    }

    @keyframes tickerScroll{
      0%{ transform: translateX(0); }
      100%{ transform: translateX(-100%); }
    }

    /* ===== Control panel ===== */
    .control-panel{
      width:100%;
      border: 2px solid rgba(242,238,230,0.16);
      border-radius: 14px;
      padding: 8px;
      background: rgba(0,0,0,0.08);
      display:flex;
      flex-direction:row;
      gap: 8px;
      justify-content: space-between;
      align-items:center;
      flex-wrap: wrap;
    }

    .breaktype-buttons{
      display:flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items:center;
    }

    .breaktype-btn{
      background: rgba(0,0,0,0.55);
      color: rgba(242,238,230,0.95);
      border: 2px solid rgba(242,238,230,0.18);
      border-radius: 12px;
      padding: 8px 10px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor:pointer;
      font-size: 18px;
    }

    .breaktype-btn.active{
      border-color: rgba(244,53,47,0.60);
      box-shadow: 0 0 0 2px rgba(242,238,230,0.10);
    }

    .control-actions{
      display:flex;
      align-items:center;
      gap: 8px;
      flex-wrap: wrap;
      margin-left:auto;
    }

    .pill-btn{
      background: linear-gradient(180deg, rgba(242,238,230,0.18), rgba(0,0,0,0.35));
      color: rgba(242,238,230,0.96);
      border: 2px solid rgba(242,238,230,0.18);
      border-radius: 999px;
      padding: 10px 14px;
      font-weight: 900;
      cursor:pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 13px;
      white-space: nowrap;
      box-shadow: 0 8px 18px rgba(0,0,0,0.30);
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .pill-btn:hover{
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(0,0,0,0.40);
    }
    .pill-btn:active{ transform: translateY(0); }

    .pill-btn.red{
      background: linear-gradient(180deg, rgba(244,53,47,0.90), rgba(169,4,1,0.95));
      border: 2px solid rgba(242,238,230,0.18);
      color:#fff;
    }

    /* ===== SOLD header row ===== */
    .sold-header-row{
      display:flex;
      align-items:center;
      justify-content:center;
      gap: 12px;
      padding: 6px 10px;
      margin-top: 2px;
      border-radius: 14px;
      background: linear-gradient(90deg, rgba(242,238,230,0.10), rgba(0,0,0,0.12), rgba(244,53,47,0.10));
      border: 1px solid rgba(242,238,230,0.18);
      z-index: 2;
      position: relative;
    }

    .sold-header-controls{
      display:flex;
      align-items:center;
      gap: 16px;
      flex-wrap: wrap;
      justify-content:center;
    }

    .sold-panel-title{
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 2px;
      white-space: nowrap;
      opacity: 0.94;
      color: rgba(242,238,230,0.96);
    }

    .sse-status{
      display:flex;
      align-items:center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 2px solid rgba(242,238,230,0.18);
      background: rgba(0,0,0,0.25);
      font-weight: 900;
      font-size: 12px;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      white-space: nowrap;
      color: rgba(242,238,230,0.92);
    }

    .sse-status .dot{
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #666;
      box-shadow: 0 0 8px rgba(255,255,255,0.15);
    }
    .sse-status.connected .dot{
      background: #3cff8a;
      box-shadow: 0 0 10px rgba(60,255,138,0.7);
    }
    .sse-status.error .dot{
      background: #ff2f2f;
      box-shadow: 0 0 10px rgba(255,47,47,0.7);
    }

    /* ===== SOLD panel slot ===== */
    .sold-panel-slot{
      width: 95%;
      height: 160px;
      position: relative;
      overflow: visible;
      margin: 0 auto;
      z-index: 2;
    }

    .sold-panel{
      position: relative;
      inset: 0;
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      border-radius: 14px;
      border: 2px solid rgba(242,238,230,0.18);
      background: linear-gradient(90deg, rgba(242,238,230,0.12), rgba(0,0,0,0.55), rgba(244,53,47,0.12));
      opacity: 1;
      pointer-events: auto;
      transition: opacity 0.2s ease;
      box-shadow: inset 0 0 18px rgba(0,0,0,0.35);
    }

    .sold-panel.hidden{
      opacity: 0;
      pointer-events: none;
      background: transparent;
      border-color: transparent;
    }

    .sold-item{
      display:flex;
      align-items:center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 999px;
      background: rgba(242,238,230,0.10);
      box-shadow: inset 0 0 0 2px rgba(242,238,230,0.10);
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .sold-item:hover{
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(0,0,0,0.35);
    }

    .sold-item img{
      max-width: 100%;
      max-height: 36px;
      object-fit: contain;
      filter: drop-shadow(0 10px 16px rgba(0,0,0,0.55));
      background: rgba(0,0,0,0.25);
      border-radius: 8px;
      padding: 2px;
    }

    .buyer-input{
      width: 100%;
      border: none;
      outline: none;
      background: rgba(0,0,0,0.55);
      color: rgba(242,238,230,0.96);
      border-radius: 999px;
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 900;
      border: 1px solid rgba(242,238,230,0.14);
    }

    /* ===== Sport density tweaks ===== */
    .overlay-container.sport-nfl{
      --teams-h: 390px;
      --team-height: 65px;
      --team-cols: 4;
    }

    .overlay-container.sport-nba,
    .overlay-container.sport-mlb{
      --team-height: 79px;
      --team-cols: 5;
    }

    .overlay-container.sport-nil{
      --team-height: 65px;
      --team-cols: 4;
    }

    .overlay-container.sport-nil .conference-title,
    .overlay-container.sport-nil .division-name{
      display:none !important;
    }

    .overlay-container.titles-off .conference-title,
    .overlay-container.titles-off .division-name{
      display:none !important;
    }

    /* ===== NIL modal ===== */
    .nil-modal{
      position: fixed;
      inset: 0;
      z-index: 5000;
      display:flex;
      align-items:center;
      justify-content:center;
      background: rgba(0,0,0,0.55);
    }
    .nil-modal.hidden{ display:none; }

    .nil-modal-inner{
      width: min(520px, 92vw);
      border-radius: 14px;
      border: 2px solid rgba(242,238,230,0.22);
      background: linear-gradient(180deg, rgba(0,0,0,0.92), rgba(0,0,0,0.85));
      box-shadow: 0 18px 60px rgba(0,0,0,0.65);
      padding: 14px;
    }

    .nil-modal-inner h2{
      margin: 0 0 10px 0;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--steel1);
    }

    #nilTextInput{
      width: 100%;
      height: 220px;
      resize: none;
      border-radius: 12px;
      padding: 10px;
      background: rgba(255,255,255,0.95);
      color: #000;
      font-weight: 900;
      border: 2px solid rgba(255,255,255,0.25);
      outline: none;
    }

    .nil-modal-actions{
      margin-top: 10px;
      display:flex;
      gap: 8px;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .nil-modal-actions button{
      background: linear-gradient(180deg, rgba(244,53,47,0.90), rgba(169,4,1,0.95));
      color:#fff;
      border:none;
      border-radius: 10px;
      padding: 10px 12px;
      font-weight: 900;
      cursor:pointer;
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }

    .nil-modal-actions button.secondary{
      background: rgba(242,238,230,0.12);
      border: 2px solid rgba(242,238,230,0.20);
      color: rgba(242,238,230,0.95);
    }

      localStorage.setItem(LS.TITLE_MAIN, main);
      localStorage.setItem(LS.TITLE_SUB, sub);
    }

let tickerMode = 'custom'; // 'custom' | 'sports'
let tickerFlipTimer = null;

const TICKER_CUSTOM_SECONDS = 12; // show user text
const TICKER_SPORTS_SECONDS = 8;  // show sports lines

function setTickerRawText(text){
  const el = document.getElementById('tickerText');
  if (!el) return;
  el.textContent = text;

  // restart scroll
  el.style.animation = 'none';
  void el.offsetHeight;
  el.style.animation = '';
}

function currentSportsTickerText(){
  if (!SPORTS_LINES.length) return 'LIVE SCORES • Waiting for feed…';
  return ` ${SPORTS_LINES.join('   •   ')} `;
}

function flipTickerTo(mode){
  tickerMode = mode;

  // simple “flip” feel without heavy 3D:
  const el = document.getElementById('tickerText');
  if (el){
    el.style.transition = 'transform 220ms ease, opacity 220ms ease';
    el.style.transform = 'rotateX(90deg)';
    el.style.opacity = '0';

    setTimeout(() => {
      const txt = (tickerMode === 'sports')
        ? currentSportsTickerText()
        : ` ${TICKER_LINES.join('   •   ')} `;
      setTickerRawText(txt);

      el.style.transform = 'rotateX(0deg)';
      el.style.opacity = '1';
    }, 220);
  }
}

function startTickerRotation(){
  if (tickerFlipTimer) clearTimeout(tickerFlipTimer);

  const loop = () => {
    const next = (tickerMode === 'custom') ? 'sports' : 'custom';
    flipTickerTo(next);

    const waitMs = (next === 'sports' ? TICKER_SPORTS_SECONDS : TICKER_CUSTOM_SECONDS) * 1000;
    tickerFlipTimer = setTimeout(loop, waitMs);
  };

  // start from custom
  tickerMode = 'custom';
  setTickerRawText(` ${TICKER_LINES.join('   •   ')} `);
  tickerFlipTimer = setTimeout(loop, TICKER_CUSTOM_SECONDS * 1000);
}



    function loadTickerLines(){
      try{
        const raw = localStorage.getItem(LS.TICKER);
        if (!raw) return DEFAULT_TICKER_LINES.slice();
        const arr = JSON.parse(raw);
        if (Array.isArray(arr) && arr.length) return arr.map(s => String(s));
      }catch(_){}
      return DEFAULT_TICKER_LINES.slice();
    }

    function saveTickerLines(lines){
      localStorage.setItem(LS.TICKER, JSON.stringify(lines));
    }

    let TICKER_LINES = loadTickerLines();

    function refreshTickerText(){
      const t = ` ${TICKER_LINES.join('   •   ')} `;
      const el = document.getElementById('tickerText');
      if (!el) return;
      el.textContent = t;
      el.style.animation = 'none';
      void el.offsetHeight;
      el.style.animation = '';
    }

    function setTickerLines(lines){
      TICKER_LINES = Array.isArray(lines) && lines.length ? lines : DEFAULT_TICKER_LINES.slice();
      saveTickerLines(TICKER_LINES);
      refreshTickerText();
    }

    function applyTickerFromRaw(raw){
      const txt = String(raw || '').trim();
      const parts = txt.includes('•') ? txt.split('•').map(s => s.trim()).filter(Boolean) : [txt].filter(Boolean);
      setTickerLines(parts.length ? parts : DEFAULT_TICKER_LINES.slice());
    }

    function computeBreakId(){
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth()+1).padStart(2,'0');
      const dd = String(d.getDate()).padStart(2,'0');
      const dayKey = `${yyyy}-${mm}-${dd}`;
      const sport = currentBreakType || 'na';
      const n = loadBreakNumber();
      return `${dayKey}-${sport}-${n}`;
    }

      try{
        const raw = localStorage.getItem(LS.NIL_ENTRIES);
        const arr = raw ? JSON.parse(raw) : [];
        if (!Array.isArray(arr)) return [];

return arr.map((e) => {
  // Back-compat: if old format used "name", treat it as title
  const title = String(e?.title || e?.name || '').trim();
  const sub   = String(e?.sub || e?.subtitle || '').trim();
  const code  = String(e?.code || '').trim();
  const image = String(e?.image || '').trim();
  return { title, sub, code, image };
}).filter(e => e.title.length);

      }catch{
        return [];
      }
    }

    function saveNilEntries(entries){
      localStorage.setItem(LS.NIL_ENTRIES, JSON.stringify(entries || []));
    }

    function makeCodeFromName(name, idx){
      const cleaned = (name || '').toUpperCase().replace(/[^A-Z0-9]+/g,'').slice(0,8);
      const n = String(idx+1).padStart(3,'0');
      return cleaned ? `${cleaned}${n}` : `NIL${n}`;
    }

    function buildNilBreakTypeFromEntries(entries){
      const safe = (entries || []).filter(e => {
  const title = String(e?.title || e?.name || '').trim();
  return title.length > 0;
});

      const mid = Math.ceil(safe.length / 2);
      const left = safe.slice(0, mid);
      const right = safe.slice(mid);

const leftTeams = left.map((e, i) => {
  const title = (e.title || e.name || '').trim();
  const sub   = (e.sub || '').trim();
  return {
    code: e.code || makeCodeFromName(title, i),
    title,
    sub,
    name: title,          // keep "name" for any legacy logic
    image: e.image || ''
  };
});


 const rightTeams = right.map((e, i) => {
  const title = (e.title || e.name || '').trim();
  const sub   = (e.sub || '').trim();
  return {
    code: e.code || makeCodeFromName(title, mid + i),
    title,
    sub,
    name: title,
    image: e.image || ''
  };
});


return {
  name: 'Bo Jackson',
  conferences: ['Left','Right'],
  divisions: {
    Left: { Spots: leftTeams },
    Right: { Spots: rightTeams }
  },
  scoreboard: []
};

  })

      modal.classList.remove('hidden');
    }

const entries = lines.map((line, i) => {
  // Try TAB first (best for copy/paste columns), then pipe, then comma
  let parts = line.split('\t');
  if (parts.length < 2) parts = line.split('|');
  if (parts.length < 2) parts = line.split(',');

  const title = String(parts[0] || '').trim();
  const sub   = String(parts.slice(1).join(' ').trim() || ''); // keep rest as subtitle

  return {
    title,
    sub,
    code: makeCodeFromName(title, i),
    image: ''
  };
}).filter(e => e.title.length);

      closeNilModal();

        const lines = String(e.target.result || '').split('\n');
const entries = lines
  .map(l => l.trim())

    const cols = l.split(','); // simple CSV (no quoted commas)

function connectSSE(url){
  if (sse) { try { sse.close(); } catch(_){} }
  setSSEStatus('error','connecting');

  try{
    sse = new EventSource(url);

    const ingest = (e) => {
      try{
        const data = JSON.parse(e.data);
        console.log("[SSE in]", data);
        handleSSEEvent(data);
      }catch(err){
        console.warn("[SSE parse error]", err, e.data);
      }
    };

    sse.onopen = () => {
      setSSEStatus('connected','connected');
      warmupPing();
    };

    // Default SSE messages (no "event:" field)
    sse.onmessage = ingest;

    // Named SSE events (server sends: event: team_sold)
    sse.addEventListener('team_sold', ingest);
    sse.addEventListener('stream_stats', ingest);
    sse.addEventListener('scores', ingest);
    sse.addEventListener('reset', ingest);
    sse.addEventListener('set_break', ingest);

    sse.onerror = () => {
      setSSEStatus('error','reconnecting');
      try { sse.close(); } catch(_) {}
      sse = null;
      setTimeout(() => connectSSE(url), 2500);
    };
  }catch(_){
    setSSEStatus('error','failed');
  }
}

    /* =========================
       Helpers
    ========================== */

function stripPrefixTitle(title){
  const raw = String(title || '').trim();
  if (!raw) return '';

  // Whatnot titles often look like: "STREAM NAME - ITEM TITLE"
  // Take the last " - " segment as the actual item title
  const parts = raw.split(' - ').map(s => s.trim()).filter(Boolean);
  return parts.length ? parts[parts.length - 1] : raw;
}


function norm(s){
  return String(s || '')
    .toLowerCase()
    .replace(/&/g,'and')
    .replace(/[^a-z0-9]+/g,' ')
    .trim();
}

function buildLookupForSport(sportKey){
  const cfg = breakTypes[sportKey];
  const map = new Map(); // normKey -> code

  if (!cfg) return map;

  for (const conf of cfg.conferences || []){
    const divs = cfg.divisions?.[conf] || {};
    for (const divName of Object.keys(divs)){
      for (const t of (divs[divName] || [])){
        const code = String(t.code || '').toUpperCase().trim();
        if (!code) continue;

        // codes
        map.set(norm(code), code);

        // names (Bills, Celtics, etc.)
        if (t.name) map.set(norm(t.name), code);

        // NIL titles
        if (t.title) map.set(norm(t.title), code);

        // small extra keys (helps for “New York Jets”, etc.)
        // if you ever add city fields later, you can map those too.
      }
    }
  }
  return map;
}

// cache lookups so we don’t rebuild every event
const SPORT_LOOKUP = {
  nfl: null,
  nba: null,
  mlb: null,
  nil: null
};

function ensureLookup(sportKey){
  if (!SPORT_LOOKUP[sportKey]) SPORT_LOOKUP[sportKey] = buildLookupForSport(sportKey);
  return SPORT_LOOKUP[sportKey];
}

function inferCodeFromTitle(title, sportHint){
  const t = norm(title);
  if (!t) return null;

  // 1) If hint sport exists, try it first
  if (sportHint && breakTypes[sportHint]){
    const map = ensureLookup(sportHint);
    // exact
    if (map.has(t)) return map.get(t);
    // substring scan (longest keys first)
    const keys = Array.from(map.keys()).sort((a,b) => b.length - a.length);
    for (const k of keys){
      if (k.length < 3) continue;
      if (t.includes(k)) return map.get(k);
    }
  }

  // 2) Otherwise try all sports (nfl/nba/mlb/nil)
  for (const sportKey of Object.keys(SPORT_LOOKUP)){
    if (!breakTypes[sportKey]) continue;
    const map = ensureLookup(sportKey);

    if (map.has(t)) return map.get(t);

    const keys = Array.from(map.keys()).sort((a,b) => b.length - a.length);
    for (const k of keys){
      if (k.length < 3) continue;
      if (t.includes(k)) return map.get(k);
    }
  }

  // 3) Fallback: look for a 2–4 letter token in the title that matches any code
  const tokens = t.toUpperCase().split(/\s+/).filter(Boolean);
  for (const tok of tokens){
    if (tok.length < 2 || tok.length > 4) continue;
    for (const sportKey of Object.keys(SPORT_LOOKUP)){
      const map = ensureLookup(sportKey);
      const code = map.get(norm(tok));
      if (code) return code;
    }
  }

  return null;
}

function fitTextToWidth(el, maxPx, minPx){
  if (!el) return;
  const parent = el.parentElement;
  if (!parent) return;

  // available width inside tile label
  const pad = 10; // safety padding
  const maxWidth = parent.clientWidth - pad;

  // start big, shrink until fits
  let size = maxPx;
  el.style.fontSize = size + 'px';

  // guard infinite loops
  let loops = 0;
  while (loops++ < 40 && size > minPx && el.scrollWidth > maxWidth){
    size -= 1;
    el.style.fontSize = size + 'px';
  }
}

function refitAllNilTitles(){
  // only adjust visible NIL titles
  document.querySelectorAll('.team.nil .nil-title').forEach(el => {
    // tune these 2 numbers to your taste
    fitTextToWidth(el, 20, 10);
  });
}
