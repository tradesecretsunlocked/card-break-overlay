<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
  <title>JunkWax Vintage — TikTok Overlay</title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/themes.css" />
</head>

<body>

<div id="overlay-root" class="mode-selling">


  <!-- HEADER -->
  <header class="header-band">
    <div class="header-left">
      <div class="break-type">DIRECTIONAL BREAK</div>
      <div class="break-id">BREAK #001</div>
    </div>

    <div class="header-right">
      <div><span id="soldCount">0</span> SOLD</div>
      <div><span id="remainingCount">4</span> REMAINING</div>
    </div>
  </header>

  <!-- CHAT (RIGHT RAIL, DOES NOT MOVE) -->
  <aside class="chat-panel">
    <div class="chat-title">LIVE CHAT</div>
    <div class="chat-feed" id="chatFeed">
      <div class="chat-msg">FakeUser1: Let’s go 🔥</div>
      <div class="chat-msg">FakeUser2: EAST 🔴</div>
    </div>
  </aside>

<!-- MAIN GRID (2 ROWS x 3 COLUMNS) -->
<section class="main-grid">

  <!-- Row 1 -->
  <div class="grid-slot">
    <div class="assignment-panel" id="assignmentPanel-top-left"></div>
  </div>

  <div class="grid-slot facecam-slot">
    <div class="facecam-frame">
      <div class="facecam-placeholder">FACE CAM (16:9)</div>
    </div>
  </div>

  <div class="grid-slot">
    <div class="assignment-panel" id="assignmentPanel-top-right"></div>
  </div>

  <!-- Row 2 -->
  <div class="grid-slot">
    <div class="assignment-panel" id="assignmentPanel-mid-left"></div>
  </div>

  <div class="grid-slot status-tile">

    <div class="status-row">
      <div class="status-box sold">
        <div class="status-label">SOLD</div>
        <div class="status-value" id="soldCountMid">0</div>
      </div>

      <div class="status-box remaining">
        <div class="status-label">REMAINING</div>
        <div class="status-value" id="remainingCountMid">4</div>
      </div>
    </div>

    <div class="status-spacer"></div>
  </div>

  <div class="grid-slot">
    <div class="assignment-panel" id="assignmentPanel-mid-right"></div>
  </div>

</section>


  <!-- BOTTOM BAND -->
  <section class="bottom-band">
    <div class="scroll-slot">SCROLL TEXT</div>
    <div class="logo-gap">LOGO GAP</div>
    <div class="scroll-slot">SCROLL TEXT</div>
  </section>

</div>


<!-- JS (unchanged) -->
<script src="js/state.js"></script>

</html>
