<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, initial-scale=1.0" />
  <title>MCM Breaks — Divisional Split Overlay</title>

  <style>
    :root{
      --W:1080px;
      --radius:18px;

      --bg0:#04070c;
      --bg1:#09121b;
      --bg2:#150a07;
--custom-rows: 2;
      --red:#d81414;
      --redGlow:#ff5a1f;
      --blue:#9ecbff;
      --blueGlow:#1c8ecb;
      --white:#ffffff;
      --soft:#d9e8f0;

      --line:rgba(255,255,255,0.14);
      --lineSoft:rgba(255,255,255,0.08);

      --teams-h:395px;
      --ticker-duration:20s;

      --fx-board:
        linear-gradient(90deg,
          rgba(255,116,34,0.08) 0%,
          rgba(255,116,34,0.00) 34%,
          rgba(255,255,255,0.05) 50%,
          rgba(92,198,255,0.00) 66%,
          rgba(92,198,255,0.08) 100%);
    }

    *{ box-sizing:border-box; }

    html, body{
      margin:0;
      padding:0;
      background:transparent;
      font-family: Arial, Helvetica, sans-serif;
      color:var(--white);
      user-select:none;
    }

    body{
      width:var(--W);
      min-height:720px;
      overflow:hidden;
    }

    .overlay{
      width:var(--W);
      margin:0;
      border-radius:var(--radius);
      overflow:hidden;
      position:relative;
      padding:8px;
      background:
        radial-gradient(760px 380px at 12% 10%, rgba(216,20,20,0.36), transparent 56%),
        radial-gradient(780px 420px at 88% 12%, rgba(64,200,255,0.26), transparent 56%),
        radial-gradient(420px 220px at 50% 92%, rgba(255,160,54,0.06), transparent 62%),
        linear-gradient(90deg, #2a0c06 0%, #0a1018 50%, #061b29 100%);
      border:3px solid rgba(255,255,255,0.16);
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.7),
        0 18px 40px rgba(0,0,0,0.55),
        0 0 42px rgba(52,196,255,0.10),
        0 0 42px rgba(255,96,26,0.10);
      isolation:isolate;
    }

    .overlay > *{
      position:relative;
      z-index:1;
    }

    .header{
      position:relative;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:6px 12px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,0.16);
      background:
       linear-gradient(90deg, rgba(158, 34, 8, 0.98) 0%, rgba(72, 20, 10, 0.86) 32%, rgba(8, 12, 18, 0.84) 50%, rgba(8, 34, 50, 0.86) 58%, rgb(113 176 204) 100%);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.10),
        inset 0 -1px 0 rgba(0,0,0,0.34);
      overflow:hidden;
    }

    .header::before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background:
        linear-gradient(90deg,
          rgba(255,122,42,0.14) 0%,
          rgba(255,122,42,0.00) 30%,
          rgba(255,255,255,0.04) 50%,
          rgba(84,196,255,0.00) 70%,
          rgba(84,196,255,0.14) 100%);
      opacity:.22;
      mix-blend-mode:screen;
    }

    .brand{
      display:flex;
      flex-direction:column;
      min-width:0;
      gap:1px;
    }

    .brand-title{
      font-size:28px;
      font-weight:900;
      line-height:1;
      letter-spacing:1.5px;
      text-transform:uppercase;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      color:#fff6e8;
      text-shadow:
        0 2px 0 rgba(0,0,0,0.8),
        0 0 16px rgba(255,132,50,0.18),
        0 0 16px rgba(84,188,255,0.18);
    }

    .brand-slogan{
      font-size:12px;
      font-weight:900;
      letter-spacing:1.6px;
      text-transform:uppercase;
      color:rgba(232,242,250,0.86);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .header-right{
      display:flex;
      align-items:center;
      gap:10px;
      flex:0 0 auto;
    }

    .sport-chip{
      padding:8px 12px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,0.14);
      background:rgba(0,0,0,0.34);
      font-size:13px;
      font-weight:900;
      letter-spacing:1px;
      text-transform:uppercase;
      color:#dff6ff;
      min-width:78px;
      text-align:center;
    }

    .break-box{
      display:flex;
      align-items:center;
      gap:10px;
      padding:8px 12px;
      border-radius:12px;
      background:rgba(0,0,0,0.38);
      border:1px solid rgba(255,255,255,0.14);
      box-shadow: inset 0 0 14px rgba(0,0,0,0.35);
    }

    .break-label{
      font-size:16px;
      font-weight:900;
      letter-spacing:1px;
      text-transform:uppercase;
      color:rgba(255,255,255,0.88);
    }

    .break-value{
      min-width:30px;
      text-align:right;
      font-size:24px;
      font-weight:900;
      color:#fff2d6;
      text-shadow:0 2px 0 rgba(0,0,0,0.8);
    }

    .main{
      position:relative;
      margin-top:8px;
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .teams-section{
      position:relative;
      display:grid;
      grid-template-columns:1fr 146px 1fr;
      gap:8px;
      height:var(--board-height, var(--teams-h));
      border-radius:16px;
      padding:3px;
      background:
        linear-gradient(90deg,
          rgba(112,24,8,0.90) 0%,
          rgba(34,12,8,0.62) 24%,
          rgba(6,10,16,0.50) 50%,
          rgba(8,24,36,0.62) 76%,
          rgba(12,78,118,0.90) 100%);
      border:1px solid rgba(255,255,255,0.12);
      overflow:visible;
    }

    .teams-section::before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background:var(--fx-board);
      opacity:1;
      mix-blend-mode:screen;
    }

    .conference{
      position:relative;
      height:100%;
      min-height:0;
      overflow-y:auto;
      overflow-x:hidden;
      border-radius:14px;
      padding:2px;
      background:rgba(0,0,0,0.42);
      border:1px solid rgba(255,255,255,0.10);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
    }

    .conference::-webkit-scrollbar{ display:none; }

    .conference.left{
      background:
        linear-gradient(180deg, rgba(255,96,22,0.20), rgba(0,0,0,0.62));
    }

    .conference.right{
      background:
        linear-gradient(180deg, rgba(70,208,255,0.20), rgba(0,0,0,0.62));
    }

    .conference > *{
      position:relative;
      z-index:1;
    }

    .conference-title{
      text-align:center;
      font-size:15px;
      font-weight:900;
      letter-spacing:1px;
      text-transform:uppercase;
      padding:0 0 2px;
      border-bottom:1px solid rgba(255,255,255,0.12);
      margin-bottom:2px;
      color:#eef7ff;
    }

    .division-group{
      margin-top:1px;
      border:1px solid rgba(255,255,255,0.12);
      border-radius:14px;
      padding:1px;
      background:rgba(0,0,0,0.24);
      position:relative;
      overflow:hidden;
      cursor:pointer;
      transition:transform .15s ease, box-shadow .15s ease;
    }

    .division-group:hover{
      transform:translateY(-1px);
      box-shadow:
        0 10px 18px rgba(0,0,0,0.28),
        inset 0 0 18px rgba(255,255,255,0.04);
    }

   .division-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  min-height:24px;
  padding:0 4px 2px;
  border-bottom:1px solid rgba(255,255,255,0.12);
  margin-bottom:2px;
}

.division-head.right{
  flex-direction:row-reverse;
}

.division-code{
  min-width:54px;
  text-align:center;
  font-size:12px;
  font-weight:900;
  letter-spacing:1px;
  text-transform:uppercase;
  color:#fff;
  flex:0 0 auto;
}

.division-buyer{
  min-width:100px;
  max-width:none;
  flex:1 1 50px;
  padding:1px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:900;
  text-align:center;
  background:rgba(14,189,20,0.86);
  border:1px solid rgba(255,255,255,0.2);
  color:rgba(255,255,255,0.92);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

    .division-grid{
      display:grid;
      gap:4px;
    }

    body[data-sport="NFL"] .division-grid{
      grid-template-columns:repeat(4, 1fr);
    }

    body[data-sport="NBA"] .division-grid,
    body[data-sport="MLB"] .division-grid,
    body[data-sport="CUSTOM"] .division-grid{
      grid-template-columns:repeat(5, 1fr);
    }

.team{
  position:relative;
  height:var(--team-height, 60px);
  border-radius:10px;
  
  overflow:hidden;
  background:
    var(--custom-tile-bg, none) center/cover no-repeat,
    linear-gradient(180deg, rgba(255,255,255,0.04), rgba(0,0,0,0.60));
  border:2px solid rgba(255,255,255,0.84);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.06),
    0 6px 14px rgba(0,0,0,0.24);
  isolation:isolate;
}

body[data-sport="CUSTOM"] .team img{
  opacity:.18;
  mix-blend-mode:screen;
}

    .team img{
      position:relative;
      z-index:1;
      width:100%;
      height:100%;
      object-fit:cover;
      filter:drop-shadow(0 8px 12px rgba(0,0,0,0.45));
    }

    .fallback-code{
      position:absolute;
      inset:0;
      z-index:1;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:15px;
      font-weight:900;
      letter-spacing:1px;
      text-transform:uppercase;
      color:#fff;
      text-shadow:0 2px 10px rgba(0,0,0,0.75);
      padding:6px;
      text-align:center;
    }

    .division-group.sold .team img,
    .division-group.sold .fallback-code{
      opacity:.24;
      filter:grayscale(1) brightness(.45);
    }

  .division-group.sold .division-buyer{
  background:rgba(216,20,20,0.90);
  border-color:rgba(255,255,255,0.28);
  box-shadow:
    0 0 14px rgba(216,20,20,0.22),
    inset 0 0 10px rgba(255,255,255,0.04);
}

    .division-group.sold::before{
      content:"✕";
      position:absolute;
      inset:0;
      z-index:18;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:82px;
      font-weight:900;
      color:#fff3df;
      text-shadow:
        0 0 10px rgba(255,101,28,0.65),
        0 0 16px rgba(65,190,255,0.55),
        0 8px 18px rgba(0,0,0,0.85);
      pointer-events:none;
    }

    .division-group.sold::after{
      content:"";
      position:absolute;
      inset:0;
      z-index:15;
      background:rgba(0,0,0,0.42);
      pointer-events:none;
    }

.sold-buyer-overlay{
  position:absolute;
  inset:0;
  z-index:26;
  display:flex;
  align-items:;
  justify-content:center;
  padding:12px 18px;
  text-align:center;
  pointer-events:none;
  font-size:28px;
  line-height:1.02;
  font-weight:1000;
  letter-spacing:1px;
  text-transform:uppercase;
  color:#ffffff;
  text-shadow:
  0 3px 10px rgba(0, 0, 0, 0.95), 0 0 19px rgb(0 0 0), 0 0 25px rgb(0 0 0);
  word-break:break-word;
}

body[data-sport="NFL"] .sold-buyer-overlay{
  font-size:24px;
}

body[data-sport="NBA"] .sold-buyer-overlay,
body[data-sport="MLB"] .sold-buyer-overlay,
body[data-sport="CUSTOM"] .sold-buyer-overlay{
  font-size:22px;
}

    .control-bar{
      position:relative;
      border-radius:14px;
      overflow:visible;
      border:1px solid rgba(255,255,255,0.12);
      background:
        linear-gradient(180deg,
          rgba(255,118,40,0.24) 0%,
          rgba(0,0,0,0.66) 44%,
          rgba(92,198,255,0.24) 100%);
      box-shadow:
        inset 0 0 18px rgba(0,0,0,0.30),
        0 0 18px rgba(0,0,0,0.18);
      display:flex;
      flex-direction:column;
      justify-content:flex-end;
      align-items:stretch;
      padding:10px 7px;
      gap:24px;
    }

.brand-logo{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%, -50%);
  width:100%;
  pointer-events:none;
  z-index:1;
  display:flex;
  justify-content:center;
  align-items:center;
}

.brand-logo img{
  width:340px;
  max-width:none;
  height:auto;
  opacity:.98;
  position:relative;
  top:-170px;
  animation:logoBreathe 5.8s ease-in-out infinite;
  transform-origin:center center;
  filter:
    drop-shadow(0 10px 18px rgba(0,0,0,0.72))
    drop-shadow(0 0 12px rgba(255,106,31,0.14))
    drop-shadow(0 0 12px rgba(77,197,255,0.14));
}

@keyframes logoBreathe{
  0%{
    transform:scale(1);
  }
  50%{
    transform:scale(1.055);
  }
  100%{
    transform:scale(1);
  }
}

    .btn{
      position:relative;
      z-index:2;
      border:none;
      outline:none;
      cursor:pointer;
      border-radius:12px;
      padding:10px 8px;
      font-size:18px;
      font-weight:900;
      text-transform:uppercase;
      letter-spacing:.8px;
      color:#fff;
      border:2px solid rgba(255,255,255,0.16);
      background:
        linear-gradient(180deg, rgb(108 182 222), rgb(14 33 51));
      box-shadow:
        0 8px 16px rgba(0,0,0,0.28),
        inset 0 1px 0 rgba(255,255,255,0.10);
      transition:transform .62s ease, filter .42s ease;
    }

    .btn:hover{ filter:brightness(1.36); }
    .btn:active{ transform:translateY(3px); }

    .stat-box{
      position:relative;
      z-index:2;
      border-radius:12px;
      padding:7px 4px;
      text-align:center;
      background:
        linear-gradient(180deg, rgba(0,0,0,0.34), rgba(0,0,0,0.56));
      border:2px solid rgba(255,255,255,0.88);
      box-shadow:
        inset 0 0 14px rgba(0,0,0,0.26),
        0 0 12px rgba(255,255,255,0.04);
    }

    .stat-box .value{
      font-size:24px;
      font-weight:900;
      color:#fff8ec;
      text-shadow:0 2px 0 rgba(0,0,0,0.8);
      line-height:1;
    }

    .stat-box .label{
      margin-top:3px;
      font-size:12px;
      font-weight:900;
      letter-spacing:1px;
      text-transform:uppercase;
      color:rgba(255,255,255,0.86);
    }

    .sold-stat{
      cursor:pointer;
    }

    .ticker{
      position:relative;
      height:42px;
      overflow:hidden;
      border-radius:12px;
      border:1px solid rgba(255,255,255,0.12);
      background:
        linear-gradient(90deg,
          rgba(150,28,8,0.70),
          rgba(0,0,0,0.72) 50%,
          rgba(16,88,128,0.70));
    }

    .ticker-track{
      display:flex;
      width:max-content;
      animation:tickerMarquee var(--ticker-duration) linear infinite;
      will-change:transform;
    }

    .ticker-text{
      display:inline-block;
      line-height:42px;
      white-space:nowrap;
      padding-right:52px;
      font-size:18px;
      font-weight:900;
      letter-spacing:.9px;
      text-transform:uppercase;
      color:#f4fbff;
      text-shadow:0 2px 10px rgba(0,0,0,0.76);
    }

    @keyframes tickerMarquee{
      0%{ transform:translateX(0); }
      100%{ transform:translateX(-50%); }
    }



 .sold-controls-wrap{
  margin-top:0;
  overflow:hidden;
  max-height:0;
  opacity:0;
  transform:translateY(-6px);
  transition:max-height .22s ease, opacity .18s ease, transform .18s ease, margin-top .18s ease;
}

    .sold-controls-wrap.active{
      max-height:120px;
      opacity:1;
      transform:translateY(0);
    }

    .sold-controls{
      display:flex;
      gap:4px;
      flex-wrap:wrap;
      align-items:center;
      padding:5px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,0.10);
      background:
       linear-gradient(90deg, rgba(255, 88, 20, 0.14), rgba(0, 0, 0, 0.26), rgb(64 200 255 / 31%));
    }

    .breaktype-buttons{
      display:flex;
      align-items:center;
      gap:6px;
      flex-wrap:wrap;
      min-width:0;
    }

    .breaktype-btn,
    .pill-btn{
      border:none;
      outline:none;
      cursor:pointer;
      white-space:nowrap;
      font-weight:900;
      text-transform:uppercase;
      letter-spacing:1px;
      color:#eef8ff;
      border-radius:999px;
      border:2px solid rgba(255,255,255,0.14);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.10), rgba(0,0,0,0.30));
      box-shadow:0 8px 18px rgba(0,0,0,0.25);
      transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    }

    .breaktype-btn{
      padding:8px 11px;
      font-size:16px;
    }

    .pill-btn{
      padding:5px 6px;
      font-size:14px;
    }

    .breaktype-btn:hover,
    .pill-btn:hover{
      transform:translateY(-1px);
      box-shadow:0 10px 20px rgba(0,0,0,0.35);
    }

    .breaktype-btn.active{
      border-color:rgba(255,164,92,0.78);
      box-shadow:
        0 0 0 2px rgba(81,193,255,0.10),
        0 10px 20px rgba(0,0,0,0.35);
      background:
        linear-gradient(90deg, rgba(255,94,26,0.34), rgba(0,136,210,0.34));
    }

    .pill-btn.red{
      background:
        linear-gradient(180deg, rgba(255,94,26,0.88), rgba(0,136,210,0.88));
      color:#fff;
    }

    .sold-wrap{
      margin-top:8px;
      border-radius:14px;
      background:rgba(0,0,0,0.38);
      border:1px solid rgba(255,255,255,0.10);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03);
      padding:10px;
      min-height:84px;
    }

    .sold-grid{
      display:grid;
      grid-template-columns:repeat(4, 1fr);
      gap:10px;
    }

    .sold-item{
      display:flex;
      align-items:center;
      gap:8px;
      padding:7px 8px;
      border-radius:999px;
      background:
        linear-gradient(90deg, rgba(255,255,255,0.06), rgba(0,0,0,0.30));
      border:1px solid rgba(255,255,255,0.10);
    }

    .sold-code{
      min-width:62px;
      text-align:center;
      padding:8px 10px;
      border-radius:999px;
      font-size:11px;
      font-weight:900;
      letter-spacing:.8px;
      text-transform:uppercase;
      color:#fff;
      background:rgba(216,20,20,0.18);
      border:1px solid rgba(216,20,20,0.36);
    }

    .sold-item input{
      width:100%;
      border:none;
      outline:none;
      border-radius:999px;
      background:rgba(0,0,0,0.52);
      color:#fff;
      padding:10px 12px;
      font-size:14px;
      font-weight:900;
      border:1px solid rgba(255,255,255,0.10);
    }

    .sold-empty{
      padding:18px 12px;
      border-radius:12px;
      border:1px dashed rgba(255,255,255,0.12);
      background:rgba(0,0,0,0.22);
      text-align:center;
      font-size:14px;
      font-weight:900;
      letter-spacing:1px;
      text-transform:uppercase;
      color:rgba(255,255,255,0.68);
      grid-column:1 / -1;
    }

    .sse-status{
      margin-left:auto;
      display:flex;
      align-items:center;
      gap:8px;
      padding:6px 10px;
      border-radius:999px;
      border:2px solid rgba(255,255,255,0.18);
      background:rgba(0,0,0,0.25);
      font-weight:900;
      font-size:12px;
      letter-spacing:0.7px;
      text-transform:uppercase;
      white-space:nowrap;
      color:rgba(242,238,230,0.92);
    }

    .sse-status .dot{
      width:10px;
      height:10px;
      border-radius:50%;
      background:#666;
      box-shadow:0 0 8px rgba(255,255,255,0.15);
    }

    .sse-status.connected .dot{
      background:#3cff8a;
      box-shadow:0 0 10px rgba(60,255,138,0.7);
    }

    .sse-status.error .dot{
      background:#ff2f2f;
      box-shadow:0 0 10px rgba(255,47,47,0.7);
    }

    .sse-status.connecting .dot{
      background:#ffd45a;
      box-shadow:0 0 10px rgba(255,212,90,0.7);
    }

    .obs-modal{
      position:fixed;
      inset:0;
      z-index:99999;
      display:none;
      align-items:center;
      justify-content:center;
      background:rgba(0,0,0,0.76);
      padding:20px;
    }

    .obs-modal.show{
      display:flex;
    }

    .obs-modal-inner{
      width:min(760px, 94vw);
      border-radius:18px;

function loadSportTileHeights(){
  try{
    const raw = localStorage.getItem(LS.SPORT_TILE_HEIGHTS)
    const parsed = raw ? JSON.parse(raw) : {}
    return {
      nfl: Number(parsed?.nfl) || 55,
      nba: Number(parsed?.nba) || 75,
      mlb: Number(parsed?.mlb) || 75,
      custom: Number(parsed?.custom) || 75
    }
  }catch(_){
    return { nfl:55, nba:75, mlb:75, custom:75 }
  }
}

function saveSportTileHeights(next){
  localStorage.setItem(LS.SPORT_TILE_HEIGHTS, JSON.stringify(next))
}

function applySportSizing(){
  const heights = loadSportTileHeights()
  const h = Number(heights[currentBreakType]) || 60
  document.documentElement.style.setProperty("--team-height", `${h}px`)

  const bg = currentBreakType === "custom" ? (localStorage.getItem(LS.CUSTOM_TILE_BG) || "") : ""
  document.documentElement.style.setProperty(
    "--custom-tile-bg",
    bg ? `url("${bg.replace(/"/g, '\\"')}")` : "none"
  )
}

function applyBoardHeight(){
  const cfg = getActiveConfig()

  if (currentBreakType !== "custom"){
    document.documentElement.style.setProperty("--board-height", `${395}px`)
    return
  }

  const leftRows = Array.isArray(cfg.left) ? cfg.left.length : 0
  const rightRows = Array.isArray(cfg.right) ? cfg.right.length : 0
  const rows = Math.max(leftRows, rightRows, 1)

  document.documentElement.style.setProperty("--custom-rows", String(rows))

  const tileH = Number(loadSportTileHeights().custom) || 75
  const headerH = 28
  const rowTopPad = 28
  const groupVerticalGap = 6
  const tileGap = 4

  // Custom rows are division groups. Approximate height per division group:
  // title row + tile row + borders/gaps
  const perGroup = rowTopPad + tileH + tileGap
  const boardHeight = Math.max(220, 16 + headerH + (rows * perGroup) + ((rows - 1) * groupVerticalGap))

  document.documentElement.style.setProperty("--board-height", `${boardHeight}px`)
}

function csvSplitLine(line){
  const out = []
  let cur = ""
  let inQuotes = false

  for (let i = 0; i < line.length; i++){
    const ch = line[i]
    const next = line[i + 1]

    if (ch === '"'){
      if (inQuotes && next === '"'){
        cur += '"'
        i++
      } else {
        inQuotes = !inQuotes
      }
    } else if (ch === "," && !inQuotes){
      out.push(cur.trim())
      cur = ""
    } else {
      cur += ch
    }
  }

  out.push(cur.trim())
  return out.map(v => v.replace(/^"|"$/g, "").trim())
}

function parseCustomCSV(text){
  const lines = String(text || "")
    .replace(/\r/g, "")
    .split("\n")
    .map(v => v.trim())
    .filter(Boolean)

  if (lines.length < 2) throw new Error("CSV needs a header and at least one row.")

  const headers = csvSplitLine(lines[0]).map(v => v.toLowerCase())
  const idx = (name) => headers.indexOf(name)

  const sideIdx = idx("side")
  const divIdx = idx("division")
  const slotIdx = idx("slot")
  const codeIdx = idx("code")
  const nameIdx = idx("name")
  const imageIdx = idx("image")

  if (sideIdx === -1 || divIdx === -1 || codeIdx === -1){
    throw new Error("CSV headers must include: side, division, code")
  }

  const leftMap = new Map()
  const rightMap = new Map()

  function pushRow(targetMap, divisionCode, team){
    if (!targetMap.has(divisionCode)){
      targetMap.set(divisionCode, {
        code: divisionCode,
        teams: []
      })
    }
    targetMap.get(divisionCode).teams.push(team)
  }

  for (let i = 1; i < lines.length; i++){
    const cols = csvSplitLine(lines[i])
    const sideRaw = String(cols[sideIdx] || "").toLowerCase()
    const divisionCode = String(cols[divIdx] || "").trim()
    const slot = parseInt(cols[slotIdx] || "", 10)
    const code = String(cols[codeIdx] || "").trim()
    const name = nameIdx === -1 ? "" : String(cols[nameIdx] || "").trim()
    const image = imageIdx === -1 ? "" : String(cols[imageIdx] || "").trim()

    if (!divisionCode || !code) continue

    const team = {
      code,
      name: name || code,
      image,
      _slot: Number.isFinite(slot) ? slot : 9999
    }

    if (sideRaw === "right" || sideRaw === "r"){
      pushRow(rightMap, divisionCode, team)
    } else {
      pushRow(leftMap, divisionCode, team)
    }
  }

  const normalizeSide = (map) => {
    return Array.from(map.values()).map(div => {
      div.teams.sort((a, b) => a._slot - b._slot)
      div.teams = div.teams.map(({ _slot, ...rest }) => rest)
      return div
    })
  }

  return {
    name: "CUSTOM",
    leftTitle: "CUSTOM LEFT",
    rightTitle: "CUSTOM RIGHT",
    left: normalizeSide(leftMap),
    right: normalizeSide(rightMap)
  }
}

      const key = String(code || "").toUpperCase().trim()
      if (!key || !boardState[key]) return

      boardState[key].sold = !!sold
      boardState[key].buyer = sold ? (buyerName || "SOLD") : ""

        soldTeams.add(key)

        if (existing) existing.buyer = boardState[key].buyer
        else soldTeamsList.push({ code:key, buyer:boardState[key].buyer })

        soldTeamsList = soldTeamsList.filter(x => x.code !== key)
      }

      buildLayout()
    }

      }
      hydrateBoardState()

    function breakIdMatches(payload){
      const incoming = String(payload?.breakId || payload?.break_id || payload?.breakNumber || payload?.break || "").trim()
      if (!incoming) return true
      return incoming === currentBreakId()
    }

    function inferDivisionCode(payload, sport){
      const direct = String(
        payload?.selectionCode ||
        payload?.divisionCode ||
        payload?.division ||
        payload?.entryCode ||
        payload?.entry ||
        payload?.teamCode ||
        payload?.code ||
        ""
      ).toUpperCase().trim()

      const cfg = getActiveConfig()
      const validCodes = new Set([...cfg.left, ...cfg.right].map(d => String(d.code).toUpperCase()))

      if (direct && validCodes.has(direct)) return direct

      if (direct){
        const mapped = TEAM_TO_DIVISION[`${sport}:${direct}`]
        if (mapped) return mapped
      }

      const title = String(
        payload?.title ||
        payload?.itemTitle ||
        payload?.listingTitle ||
        payload?.listing_name ||
        payload?.name ||
        ""
      ).toUpperCase()

      for (const code of validCodes){
        if (title.includes(code)) return code
      }

      for (const key of Object.keys(TEAM_TO_DIVISION)){
        const [sportKey, teamCode] = key.split(":")
        if (sportKey !== sport) continue
        if (title.includes(teamCode)) return TEAM_TO_DIVISION[key]
      }

      return ""
    }

    function handleSSEEvent(data){
      if (!data || !data.type) return
      if (!breakIdMatches(data)) return

      const eventType = String(data.type).toLowerCase()
      const incomingSport = String(data.breakType || data.sport || "").toLowerCase().trim()
      if (incomingSport && incomingSport !== currentBreakType && breakTypes[incomingSport]) {
        currentBreakType = incomingSport
        hydrateBoardState()
        buildLayout()
      }

      if (eventType === "reset"){
        resetSoldState()
        return
      }

      if (eventType === "set_break"){
        const n = parseInt(data.breakNumber, 10)
        if (Number.isFinite(n) && n > 0) applyBreakNumber(n)
        return
      }

      if (eventType === "set_sport"){
        const s = String(data.breakType || data.sport || "").toLowerCase().trim()
        if (s === "custom" || breakTypes[s]) {
          currentBreakType = s
          hydrateBoardState()
          buildLayout()
        }
        return
      }

      if (eventType === "set_title"){
        const newTitle = String(data.titleText || data.title || "").trim()
        if (newTitle){
          const cur = loadTitles()
          applyTitles(newTitle, cur.sub)
        }
        return
      }

      if (eventType === "set_ticker"){
        const raw = String(data.tickerText || "").trim()
        if (raw){
          saveTickerLines(raw.split("•").map(v => v.trim()).filter(Boolean))
          const speed = parseInt(data.tickerSpeed, 10)
          if (Number.isFinite(speed)) saveTickerSpeed(speed)
          refreshTicker()
        }
        return
      }

      const saleSport = currentBreakType
      const code = inferDivisionCode(data, saleSport)
      const buyer = String(data.buyerName || data.buyer || data.username || "SOLD").trim()
      const listingKey = data.saleId || data.id || data.listingId || null

      if (eventType === "buyer" || eventType === "buyer_update"){
        if (code) sseUpdateBuyer(code, buyer)
        return
      }

      if (eventType === "team_unsold"){
        if (code) sseMarkUnsold(code)
        if (listingKey && lastCodeByListingKey.get(listingKey) === code){
          lastCodeByListingKey.delete(listingKey)
        }
        return
      }

      if (["team_sold","sale","sold","purchase","whatnot_purchase"].includes(eventType)){
        if (!code) return

        if (listingKey){
          const prev = lastCodeByListingKey.get(listingKey)
          if (prev && prev !== code) sseMarkUnsold(prev)
          lastCodeByListingKey.set(listingKey, code)
        }

        if (!overlay_warmup){
          sseMarkSold(code, buyer)
        }
      }
    }

    function setSSEStatus(state, msg){
      const box = document.getElementById("sseStatus")
      const text = document.getElementById("sseText")
      box.classList.remove("connected","error","connecting")
      if (state) box.classList.add(state)
      text.textContent = msg || state || "OFF"
    }

    function getBridgeBase(){
      const q = new URLSearchParams(location.search).get("bridge")
      if (q){
        const cleaned = q.replace(/\/$/, "").replace(/\/(events|stream)(\/.*)?$/, "")
        localStorage.setItem(tsu.bridgeUrl, cleaned)
        return cleaned
      }
      return (localStorage.getItem(tsu.bridgeUrl) || "").replace(/\/$/, "")
    }

    function getBridgeKey(){
      const q = new URLSearchParams(location.search).get("key")
      if (q){
        localStorage.setItem(tsu.bridgeKey, q)
        return q
      }
      return localStorage.getItem(tsu.bridgeKey) || ""
    }

    function connectBridgeSSE(){
      const base = getBridgeBase()
      if (!base){
        setSSEStatus("error", "OFF")
        return
      }

      const channel = (new URLSearchParams(location.search).get("channel") || "main").toLowerCase()
      const url = `${base}/stream?channel=${encodeURIComponent(channel)}`

      if (sse) try{ sse.close() }catch(_){}

      setSSEStatus("connecting", "CONNECTING")
      sse = new EventSource(url)

      sse.onopen = () => setSSEStatus("connected", "ON")

      sse.onerror = () => {
        setSSEStatus("error", "RETRY")
      }

      sse.onmessage = (evt) => {
        try{
          const data = JSON.parse(evt.data)
          if (data?.type === "hello") return
          handleSSEEvent(data)
        }catch(_){}
      }

      ;["team_sold","team_unsold","sale","sold","purchase","whatnot_purchase","buyer","buyer_update","reset","set_break","set_sport","set_title","set_ticker"].forEach(name => {
        sse.addEventListener(name, (evt) => {
          try{
            const data = JSON.parse(evt.data)
            handleSSEEvent({ ...data, type:name })
          }catch(_){}
        })
      })
    }

    function bridgePostSafe(payload){
      const base = getBridgeBase()
      if (!base) return

      const key = getBridgeKey()
      fetch(`${base}/event${key ? `?key=${encodeURIComponent(key)}` : ""}`, {
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          ...(key ? { "x-bridge-key": key } : {})
        },
        body: JSON.stringify(payload)
      }).catch(() => {})
    }

  nfl: Math.max(30, Math.min(180, parseInt(document.getElementById("tileHeightNFL")?.value || "55", 10) || 55)),
  nba: Math.max(30, Math.min(180, parseInt(document.getElementById("tileHeightNBA")?.value || "75", 10) || 75)),
  mlb: Math.max(30, Math.min(180, parseInt(document.getElementById("tileHeightMLB")?.value || "75", 10) || 75)),
  custom: Math.max(30, Math.min(180, parseInt(document.getElementById("tileHeightCUSTOM")?.value || "75", 10) || 75))
}
      saveSportTileHeights(nextHeights)

      currentBreakType = "custom"
      hydrateBoardState()
      resetSoldState()
      applySportSizing()
    }catch(_){
      return
    }
  }

  closeModal()
  buildLayout()
}



    document.getElementById("tickerSpeedInput").addEventListener("input", () => {
      document.getElementById("tickerSpeedPill").textContent = `${document.getElementById("tickerSpeedInput").value}s`
    })

    document.getElementById("obsModal").addEventListener("click", (e) => {
      if (e.target.id === "obsModal") closeModal()
    })

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeModal()
    })

    function buildExportTSVButtonState(){
      document.getElementById("soldControlsWrap").classList.toggle("active", soldControlsVisible)
    }

    function initializeGrid(){
      hydrateBoardState()
      buildLayout()
    }

function buildLayoutBoot(){
  const titles = loadTitles()
  applyTitles(titles.main, titles.sub)
  applyBreakNumber(loadInt(LS.BREAK_NUMBER, DEFAULT_BREAK_NUMBER))
  refreshTicker()
  document.getElementById("brandLogo").src = localStorage.getItem(LS.LOGO_PATH) || DEFAULT_LOGO
  setLeagueUI()
  buildExportTSVButtonState()
  applySportSizing()
  initializeGrid()
}

    function overlayWarmup(){
      const base = getBridgeBase()
      if (!base) return
      const key = getBridgeKey()
      fetch(`${base}/events${key ? `?key=${encodeURIComponent(key)}` : ""}`, {
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          ...(key ? { "x-bridge-key": key } : {})
        },
        body: JSON.stringify({
          type:"overlay_warmup",
          overlay:"mcm-breaks",
          channel:(new URLSearchParams(location.search).get("channel") || "main").toLowerCase(),
          breakId: currentBreakId(),
          sport: currentBreakType,
          ts: Date.now()
        })
      }).catch(() => {})
    }

    window.addEventListener("DOMContentLoaded", () => {
      buildLayoutBoot()
      connectBridgeSSE()
      overlayWarmup()
      setTimeout(() => { overlay_warmup = false }, 1200)
    })
  </script>
</body>
