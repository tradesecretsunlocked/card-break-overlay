<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, initial-scale=1.0" />
<title>CommonGroundFinds – Shelf v1 (Ambient)</title>

<style>
:root {
  /* Canvas */
  --W: 1080px;
  --H: 1920px;

  --book-x-px: 616px; /* 👈 this is the ONLY value you will tune */


  /* Locked heights */
  --shelf-h: 280px;
  --ticker-h: 90px;

  /* Motion tuning */
  --drift-duration: 120s; /* slow = classy */

  /* Featured book tuning */
--book-x: 54%;        /* horizontal position (slightly right of center) */
--book-width: 70px;   /* spine width */
--book-top-trim: 40%; /* trims empty space from the top */
--book-bottom-trim: -27%; /* trims shelf plank from the bottom */
--book-height: 452px; /* actual visible spine height */



/* Featured book animation tuning */
--pull-distance: 300px;     /* how far the book drops */
--pull-scale: 1.35;         /* how much it comes forward */
--pull-duration: 800ms;    /* pull + return speed */
--hold-duration: 500ms;     /* pause before returning */



}

/* ===== Base ===== */
html, body {
  margin: 0;
  padding: 0;
  width: var(--W);
  height: var(--H);
  background: transparent;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

.stage {
  position: relative;
  width: var(--W);
  height: var(--H);
}




/* =========================================================
   TOP BOOKSHELF ZONE (AMBIENT, UNDER WHATNOT UI)
   ========================================================= */
.shelf-zone {
  position: relative;
  top: 0;
  left: 0;
  width: 100%;
  height: var(--shelf-h);
  z-index: 1;
  
}
.shelf-zone::after {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 2px;
  background: rgba(255,255,255,0.08);
}


/* Shelf image layer */
.shelf-image {
  position: absolute;
  inset: 0;                 /* fill the shelf-zone */
  width: 100%;
  height: 100%;
  object-fit: cover;        /* crop to fit (like background cover) */
  object-position: center bottom; /* keep books anchored */
  animation: shelfDrift var(--drift-duration) ease-in-out infinite alternate;
  filter: saturate(1.05) contrast(1.05);
  
}

/* =========================================================
   FEATURED BOOK (STEP 1: POSITION ONLY)
   ========================================================= */
.featured-book {
  position: absolute;
  top: calc(var(--shelf-h) - var(--book-height));
  height: var(--book-height);
 
  width: var(--book-width);
  overflow: hidden;
   pointer-events: none;
  z-index: 5;

  background-image: url("../../images/shelf.png");
  background-repeat: no-repeat;
  background-size: var(--W) auto;
 left: calc(var(--book-x-px) - (var(--book-width) / 2));
background-position-x: calc(var(--book-x-px) - (var(--book-width) / 2));


  box-shadow: 0 12px 24px rgba(0,0,0,0.4);
  display: none;
  transform-origin: center top;
}


.floating-layer {
  position: absolute;
  inset: 0;
  z-index: 10;
  pointer-events: none;
}


/* Debug visibility */
.debug .featured-book {
  display: block;
  outline: 3px solid lime;

  /* DEBUG VISIBILITY BOOST */
  background-blend-mode: normal;
  filter: brightness(1.25) contrast(1.2);
  box-shadow:
    0 40px 80px rgba(0,0,0,0.9),
    0 0 0 2px rgba(255,255,255,0.6);
}






/* Gentle vertical drift */
@keyframes shelfDrift {
  from { transform: translateY(0px); }
  to   { transform: translateY(-6px); }
}

@keyframes bookPull {
  0% {
    transform: translateY(0) scale(1);
    box-shadow: 0 12px 24px rgba(0,0,0,0.4);
  }

  30% {
    transform: translateY(0) scale(var(--pull-scale));
    box-shadow: 0 24px 48px rgba(0,0,0,0.55);
  }

  60% {
  transform: translateY(var(--pull-distance)) scale(var(--pull-scale));
  box-shadow: 0 36px 72px rgba(0,0,0,0.65);
  filter: brightness(1.08) contrast(1.05);
}

  80% {
    transform: translateY(var(--pull-distance)) scale(var(--pull-scale));
  }

  100% {
    transform: translateY(0) scale(1);
    box-shadow: 0 12px 24px rgba(0,0,0,0.4);
  }
}

/* =========================================================
   BOOK OPEN (STEP 3)
   ========================================================= */
.book-open {
  position: absolute;
  width: 100%;
  height: 100%;
transform-style: preserve-3d;
perspective: 1200px;
perspective-origin: center top;

}
.book-inner {
  position: absolute;
  inset: 0;
  transform-style: preserve-3d;
  transform: rotateY(-85deg) translateZ(40px);
}



.book-cover {
  position: absolute;
  width: 54%;                /* 👈 slightly wider than pages */
  top: -6px;                 /* 👈 extend above pages */
  bottom: -6px;              /* 👈 extend below pages */
  backface-visibility: hidden;
  transform-style: preserve-3d;
 
   z-index: 2; /* 👈 covers UNDER pages */

  background: linear-gradient(
    180deg,
    #2e6f4e,
    #1e4f37
  );

  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,0.08),
    0 18px 40px rgba(0,0,0,0.55);
}


.page.left {
  transform-origin: right center;
z-index: 3;
}

.page.right {
  transform-origin: left center;
z-index: 3;
}


.book-cover.left {
  left: 0;
   transform-origin: 100% 50%;
  transform: rotateY(0deg);

}


.book-cover.right {
  right: 0;
  transform-origin: 0% 50%;
  transform: rotateY(0deg);
  z-index: 2; /* 👈 behind page block */
}



.book-spine {
  position: absolute;
  left: 50%;
  top: 0;
  height: var(--book-height);
  width: var(--book-width);
  transform: translateX(-50%) translateZ(3px);
  z-index: 6;
  overflow: hidden;

  background-image: url("../../images/shelf.png");
  background-repeat: no-repeat;
  background-size: var(--W) auto;
  background-position-x: calc(
  var(--book-x) - (var(--book-width) / 2)
);
  background-position-y: calc(-1 * var(--shelf-book-baseline));




    
}

.book-spine::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 24px; /* covers shelf seam */

  pointer-events: none;
}


.book-spine::after {
  content: '';
  position: absolute;
  left: 2px;
  right: 2px;
  top: 12%;
  height: 2px;

}


.book-promo {
  max-width: 80%;
  max-height: 70%;
  margin: auto;
  text-align: center;
  font-size: 26px;
  font-weight: 700;
  line-height: 1.35;
  background: none;
  z-index: 10;
   font-family: "Georgia", "Times New Roman", serif;
  color: #2b2b2b;

  display: flex;
  flex-direction: column;
  justify-content: center;
  height: 100%;

}

/* Small category label */
.promo-eyebrow {
  font-size: 12px;
  letter-spacing: 0.18em;
  font-weight: 700;
  color: #7a7a7a;
  margin-bottom: 4px;
}

/* Main headline */
.promo-headline {
  font-size: 36px;
  line-height: 1.1;
  font-weight: 700;
  margin-bottom: 8px;
  margin-top:24px;
}

/* Thin book-style divider */
.promo-divider {
  width: 48px;
  height: 2px;
  background: rgba(0,0,0,0.18);
  margin-bottom: 16px;
}

/* Body copy */
.promo-body {
  font-size: 22px;
  line-height: 1.6;
  color: #444;
  margin-bottom: 10px;
}

/* Call-to-action */
.promo-cta {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #1e4f37;
}

.promo-right {
  padding-left: 36px;
}


/* ================================
   OPEN BOOK (FACE-ON VERSION)
   ================================ */
.open-book-stage.opened .book-spine {
  display: none;
}

.open-book-stage.dropping .book-spine {
  opacity: 0;
  
  
}

.open-book-stage.dropping ~ .shelf-zone::after {
  opacity: 0;
}



.open-book-stage {
  position: absolute;
  width: 510px;
  height: 380px;
  left: 50%;

 
  opacity: 0;
  perspective: 1200px;
  pointer-events: none;
  z-index: 3;
}

/* --- DROP PHASE: show ONLY the spine (same shelf slice), hide pages/covers --- */
.open-book-stage.spine-only .book-cover,
.open-book-stage.spine-only .book-pages {
  opacity: 0;
  visibility: hidden;
  transform: scaleX(.96);
}

.open-book-stage.spine-only .book-spine {
  opacity: 1;
  transform: translateX(-50%) translateZ(3px);
}

/* When we're NOT spine-only, pages/covers can show */
.open-book-stage:not(.spine-only) .book-cover,
.open-book-stage:not(.spine-only) .book-pages {
  opacity: 1;
  visibility: visible;
}


.book-pages::before {
  content: '';
  position: absolute;
  inset: 0;
 
  background: linear-gradient(
    180deg,
    rgba(0,0,0,0.12),
    rgba(0,0,0,0.05)
  );
}




.book-pages {
  position: absolute;
  top: 10px;
  bottom: 10px;
  left: 18px;
  right: 18px;

  display: flex;
  transform-style: preserve-3d;

  z-index: 4; /* 👈 pages ABOVE back cover, BELOW front cover */

  background: linear-gradient(180deg, #f7f3ea, #eee7da);

  box-shadow:
    inset 0 0 0 1px rgba(0,0,0,0.06),
    0 6px 12px rgba(0,0,0,0.25);

  border-radius: 2px;
}



.page {
  background-image:
    linear-gradient(180deg, #f8f5ee, #eee8dc),
    repeating-linear-gradient(
      90deg,
      rgba(0,0,0,0.015) 0px,
      rgba(0,0,0,0.015) 1px,
      
      transparent 2px,
      transparent 4px
    );
}

.page::after {
  content: '';
  position: absolute;
  top: 0;
  bottom: 0;
  width: 6px;
  background: linear-gradient(
    to right,
    rgba(0,0,0,0.12),
    transparent
  );
  pointer-events: none;
}

.page.left::after {
  right: 0;
}

.page.right::after {
  left: 0;
  transform: scaleX(-1);
}



.page.left {
  box-shadow:
    inset -12px 0 18px rgba(0,0,0,0.12);
}

.page.right {
  box-shadow:
    inset 12px 0 18px rgba(0,0,0,0.12);
}



/* Ensure covers start CLOSED */
.open-book-stage .book-cover.left,
.open-book-stage .book-cover.right {
  transform: rotateY(0deg);
}

/* Promo starts hidden */
.open-book-stage .book-promo {
  opacity: 0;
}

@keyframes openLeft {
  to { transform: rotateY(-25deg); }
}

@keyframes openRight {
  to { transform: rotateY(25deg); }
}



@keyframes promoFadeIn {
  to { opacity: 1; }
}


/* Depth + darkening overlay */
.shelf-shade {
  position: absolute;
  inset: 0;
  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,0.55),
      rgba(0,0,0,0.15) 60%,
      rgba(0,0,0,0.45)
    );
  pointer-events: none;
}

/* Subtle light sweep */
.shelf-sweep {
  position: absolute;
  top: -60%;
  left: -40%;
  width: 60%;
  height: 220%;
  background: linear-gradient(
    120deg,
    transparent 35%,
    rgba(255,255,255,0.06) 50%,
    transparent 65%
  );
  animation: shelfSweep 48s linear infinite;
  pointer-events: none;
}

@keyframes shelfSweep {
  from { transform: translateX(-30%) rotate(8deg); }
  to   { transform: translateX(260%) rotate(8deg); }
}

/* =========================================================
   TICKER BACKPLATE (TEXT FROM OBS)
   ========================================================= */
.ticker-zone {
  position: absolute;
  top: var(--shelf-h);
  left: 0;
  width: 100%;
  height: var(--ticker-h);
  z-index: 2;
  background: linear-gradient(180deg, #141c2e, #0b1220);
  border-bottom: 2px solid rgba(255,255,255,0.08);
  box-shadow: 0 10px 30px rgba(0,0,0,0.35);
}

.ticker-glass {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    90deg,
    rgba(255,255,255,0.05),
    rgba(255,255,255,0.01) 50%,
    rgba(255,255,255,0.05)
  );
  opacity: 0.4;
}

/* =========================================================
   PRODUCT CAMERA SAFE AREA
   ========================================================= */
.product-zone {
  position: absolute;
  top: calc(var(--shelf-h) + var(--ticker-h));
  left: 0;
  width: 100%;
  height: calc(100% - (var(--shelf-h) + var(--ticker-h)));
  z-index: 0;
}

.vignette {
  position: absolute;
  inset: 0;
  background: radial-gradient(
    circle at center,
    rgba(0,0,0,0) 45%,
    rgba(0,0,0,0.18) 75%,
    rgba(0,0,0,0.28) 100%
  );
  pointer-events: none;
}

/* =========================================================
   DEBUG MODE (?debug=1)
   ========================================================= */
.debug .shelf-zone { outline: 4px solid lime; }
.debug .ticker-zone { outline: 4px solid cyan; }
.debug .product-zone { outline: 4px solid red; }

#obsTriggerBtn {
  position: absolute;

  /* 👇 POSITION — tweak these if needed */
  top: 40px;
  left: 500px;

  /* 👇 SIZE OF CLICK ZONE */
  width: 180px;
  height: 300px;

  /* 👇 VERTICAL TEXT */
  writing-mode: vertical-rl;
  text-orientation: mixed;

  /* 👇 INVISIBLE BUT CLICKABLE */
  background: transparent;
  color: transparent;
  border: none;

  cursor: pointer;
  z-index: 9999;
}

/* Optional: faint hover glow for debugging */
#obsTriggerBtn:hover {
  background: rgba(255,255,255,0.06);
}



</style>
</head>

<div class="shelf-zone">
  <img src="../../images/shelf.png" class="shelf-image" />

  <div class="featured-book"></div>



  <div class="shelf-shade"></div>
  <div class="shelf-sweep"></div>
</div>

  <!-- OPEN BOOK LIVES HERE -->
  <div id="openBook" class="open-book-stage">
    <div class="book-cover left"></div>
    <div class="book-spine"></div>
    <div class="book-cover right"></div>

    <div class="book-pages">
      <div class="page left">

<script>
window.onload = function () {
  const CANVAS_WIDTH = 1080;

  // Debug mode from query string
  const qs = new URLSearchParams(location.search);
  if (qs.get("debug") === "1") {
    document.body.classList.add("debug");
  }

  const featuredBook = document.querySelector('.featured-book');
  const openBook = document.getElementById('openBook');

  if (!featuredBook || !openBook) {
    console.error("Missing .featured-book or #openBook");
    return;
  }

  // Read --pull-distance from CSS and parse it to a number
  const pullDistanceStr = getComputedStyle(document.documentElement).getPropertyValue('--pull-distance').trim();
  const pullDistance = parseFloat(pullDistanceStr);

  // Expose to console for manual triggering
  window.triggerBookPull = triggerBookPull;

 


function syncSpineBackgroundY(sourceEl, targetEl) {
  const shelfImg = document.querySelector('.shelf-image');
  const shelfRect = shelfImg.getBoundingClientRect();
  const sourceRect = sourceEl.getBoundingClientRect();

  // How far down the spine is from the top of the shelf image
  const offsetY = sourceRect.top - shelfRect.top;

  targetEl.style.backgroundPositionY = `-${offsetY}px`;
}

 let shelfRectCache = null;

function triggerBookPull() {
  featuredBook.style.display = 'block';
  syncSpineBackgroundY(featuredBook, featuredBook);


  const rect = featuredBook.getBoundingClientRect();
  shelfRectCache = rect;


  // Prep openBook as the DROPPING spine (same visual slice)
  openBook.classList.remove('opened');
  openBook.classList.add('spine-only');
  openBook.classList.add('dropping');


  // Make openBook visible NOW (but only spine shows due to spine-only class)
  openBook.style.opacity = 1;
const openSpine = openBook.querySelector('.book-spine');
syncSpineBackgroundY(featuredBook, openSpine);

  // Measure openBook base size (510x380 from your CSS)
  const openW = parseFloat(getComputedStyle(openBook).width);
  const openH = parseFloat(getComputedStyle(openBook).height);

  // Scale openBook down so its spine matches the shelf spine size
  const scaleX = rect.width / openW;
  const scaleY = rect.height / openH;

  // Place openBook exactly on top of the shelf spine
  openBook.style.left = (rect.left + rect.width / 2) + "px";
  openBook.style.top = rect.top + "px";

  // Hide the shelf spine slice so it looks removed from the shelf
featuredBook.style.display = 'none';


  // Animate openBook (spine-only) downward
openBook.animate(
  [
    
    {
      left: (rect.left + rect.width / 2) + "px",
      top: rect.top + "px",
      transform: `translate(-50%, 0) rotateY(0deg)`
    },
    {
      left: (rect.left + rect.width / 2) + "px",
      top: rect.top + "px",
      transform: `translate(-50%, 40px) rotateY(-20deg)`
    },
    {
      left: (rect.left + rect.width / 2) + "px",
      top: rect.top + "px",
      transform: `translate(-50%, ${pullDistance}px) rotateY(-55deg)`
    }
  ],
  {
    duration: 850,
    easing: "cubic-bezier(0.18, 0.95, 0.2, 1)",
    fill: "forwards"
  }
).onfinish = () => transitionToOpenBook(rect, scaleX, scaleY);
}

function transitionToOpenBook(rect, scaleX, scaleY) {
  openBook.classList.add('dropping');

  // Final open position (below ticker)
  const finalTop = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--shelf-h')) +
                   parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--ticker-h')) + 12;

  // Center X (1080/2)
  const finalLeft = 540;

  // Morph: move + scale up to full open-book size
  openBook.animate(
    [
      {
        left: (rect.left + rect.width / 2) + "px",
        top: rect.top + "px",
        transform: `translate(-50%, ${pullDistance}px) rotateY(-55deg) scale(${scaleX}, ${scaleY})`
      },
      {
        left: finalLeft + "px",
        top: finalTop + "px",
        transform: `translate(-50%, 0) rotateY(-15deg) scale(1, 1)`
      },
      {
        left: finalLeft + "px",
        top: finalTop + "px",
        transform: `translate(-50%, 0) rotateY(-4deg) scale(1, 1)`
      }
    ],
    {
      duration: 1200,
      easing: "cubic-bezier(0.15, 0.85, 0.2, 1)",
      fill: "forwards"
    }
  ).onfinish = () => {
  // Lock final transform so next animation starts from same state
  openBook.style.transform = 'translate(-50%, 0) rotateY(0deg) scale(1)';
  openPhase();
};

}

function openPhase() {
// Keep spine-only for a moment
setTimeout(() => {
  openBook.classList.remove('spine-only');
}, 180); // 👈 reveal pages/covers now

const settle = openBook.animate(
  [
    { transform: 'translate(-50%, 0) rotateY(0deg)' },   // 👈 MATCHES LOCKED STATE
    { transform: 'translate(-50%, -20px) rotateY(-15deg)' },
    { transform: 'translate(-50%, 0) rotateY(0deg)' }
  ],


    {
      duration: 1800,
      easing: 'cubic-bezier(0.15, 0.85, 0.2, 1)',
      fill: 'forwards'
    }
  );

  settle.onfinish = () => {
    // Add class to hide spine
    openBook.classList.add('opened');

// Open covers
document.querySelector('.book-cover.left').animate(
  [{ transform: 'rotateY(0deg)' }, { transform: 'rotateY(-8deg)' }],
  { duration: 500, easing: 'ease-out', fill: 'forwards' }
);

document.querySelector('.book-cover.right').animate(
  [{ transform: 'rotateY(0deg)' }, { transform: 'rotateY(8deg)' }],
  { duration: 500, easing: 'ease-out', fill: 'forwards' }
);



    // Fade in promo text
document.querySelectorAll('.book-promo').forEach((promo, i) => {
  promo.animate(
    [
      { opacity: 0, transform: 'translateY(12px)' },
      { opacity: 1, transform: 'translateY(0)' }
    ],
    {
      duration: 700,
      easing: 'cubic-bezier(0.15, 0.85, 0.2, 1)',
      fill: 'forwards',
      delay: i * 120 // subtle stagger between pages
    }
  );
});



    setTimeout(returnToShelf, 2500);
  };
}

function getShelfBookSnapPosition() {
  const root = getComputedStyle(document.documentElement);

  const bookX = parseFloat(root.getPropertyValue('--book-x-px'));
  const bookWidth = parseFloat(root.getPropertyValue('--book-width'));
  const shelfH = parseFloat(root.getPropertyValue('--shelf-h'));
  const bookH = parseFloat(root.getPropertyValue('--book-height'));

return {
  left: bookX,
  top: shelfH - bookH,
  width: bookWidth
};

}



  // Optional: test animation automatically on load
  // setTimeout(triggerBookPull, 1000); // uncomment to auto-play for testing


function returnToShelf() {
  if (!shelfRectCache) return;

  const rect = shelfRectCache;

  // Close covers first
  document.querySelector('.book-cover.left')?.animate(
    [{ transform: 'rotateY(-8deg)' }, { transform: 'rotateY(0deg)' }],
    { duration: 1200, easing: 'ease-in', fill: 'forwards' }
  );

  document.querySelector('.book-cover.right')?.animate(
    [{ transform: 'rotateY(8deg)' }, { transform: 'rotateY(0deg)' }],
    { duration: 1200, easing: 'ease-in', fill: 'forwards' }
  );

  // Bring spine back temporarily
  openBook.classList.remove('opened');
  openBook.classList.add('spine-only');

// Get the REAL shelf-aligned target (accounts for shelf drift)
featuredBook.style.display = 'block';
const targetRect = featuredBook.getBoundingClientRect();
featuredBook.style.display = 'none';

const currentRect = openBook.getBoundingClientRect();



openBook.animate(
  [
    {
      left: (currentRect.left + currentRect.width / 2) + 'px',
      top: currentRect.top + 'px',
      transform: 'translateX(-50%) rotateY(0deg) scale(1)'
    },
    {
      left: (targetRect.left + targetRect.width / 2) + 'px',
      top: targetRect.top + 'px',
      transform: 'translateX(-50%) rotateY(0deg) scale(1)'
    }
  ],
  {
    duration: 1000,
    easing: 'cubic-bezier(0.25, 0.9, 0.3, 1)',
    fill: 'forwards'
  }
).onfinish = () => {
   
    // Hide floating book
    openBook.style.opacity = 0;
    openBook.classList.remove('spine-only');

    // Restore shelf spine illusion
    featuredBook.style.display = 'block';
    featuredBook.style.opacity = 1;

    // Reset state
    openBook.classList.remove('dropping');
    openBook.classList.remove('opened');
  };
}

document.getElementById('obsTriggerBtn').onclick = () => {
  triggerBookPull();
};

};
</script>

<!-- OBS CONTROL BUTTON -->
<button id="obsTriggerBtn">TRIGGER BOOK</button>
