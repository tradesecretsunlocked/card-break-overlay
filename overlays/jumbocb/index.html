    body {
      margin: 0;
      background: transparent;
      font-family: 'Arial Black', Arial, sans-serif;
      width: 920px;
      min-height: 520px;
      user-select: none;
    }

  .container {
    border: 4px solid #0052FF;
    border-radius: 12px;
    padding: 6px;
    width: auto;
    box-shadow: 0 0 20px rgba(0,0,0,0.6);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    animation: pulse-glow 12s linear infinite;
  }
  .container::after {
    content: "";
    position: absolute;
    inset: -2px;
    border-radius: inherit;
    background: conic-gradient(from 0deg, rgba(0,82,255,0.12), rgba(0,0,0,0), rgba(0,82,255,0.12));
    animation: sweep 9s linear infinite;
    pointer-events: none;
    opacity: 0.35;
  }

  .header {
    background: linear-gradient(90deg, #0052FF 0%, #001D4A 40%, #003A9F 100%);
    color: #fff;
    padding: 4px 10px;
    margin: -6px -6px 6px -6px;
    border-radius: 6px 6px 0 0;
    font-weight: 900;
    font-size: 20px;
    letter-spacing: 1px;
    display:flex;
    align-items:center;
    gap:8px;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
  }

  .top-wrap {
    display: grid;
    grid-template-columns: 1fr 2fr 1fr;
    gap: 6px;
    margin-bottom: 0;
  }

  .camera-box {
    position: relative;
    border-radius: 12px;
    border: 4px solid transparent;
    background:#ffffff;
    height: 210px;
    box-shadow:
      inset 0 0 10px rgba(0,0,0,0.7),
      0 0 16px rgba(0,162,255,0.6),
      0 0 26px rgba(0,162,255,0.5);
    background-image:
      linear-gradient(135deg, rgba(0,162,255,0.12), rgba(0,0,0,0.7)),
      radial-gradient(circle at 20% 20%, rgba(0,162,255,0.18), transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(0,162,255,0.18), transparent 50%);
    animation: camera-glow 6s ease-in-out infinite;
  }

  .camera-box::before {
    content:"";
    display:block;
    text-align:center;
    color:#2c2c2c;
    font-size:14px;
    margin-top:6px;
    font-weight:800;
  }
  .camera-box::after {
    content: "";
    position: absolute;
    inset: -6px;
    border-radius: inherit;
    padding: 4px;
    background: linear-gradient(90deg,
      rgba(0,162,255,0.25),
      rgba(255,255,255,0.9),
      rgba(0,162,255,0.25)
    );
    background-size: 220% 220%;
    background-position: 0% 0%;
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask-composite: exclude;
    -webkit-mask-composite: xor;
    box-shadow: 0 0 18px rgba(0,162,255,0.45);
    pointer-events: none;
    animation: border-track 10s linear infinite;
  }

.side-column {
  display:grid;
  grid-template-columns: 1fr 1fr;  /* 2 columns */
  gap:4px;
}


   .header-icon {
    width:22px;

    border-radius:50%;

    .main-content {

      letter-spacing: 2px;
      margin-top: 4px;
    }

    .teams-grid {

    }

     .team {
    height:50px;
    background:#000;
    border:3px solid #ffffff;
    border-radius:6px;
    overflow:hidden;
    position:relative;
  }
   .team img {
     width:100%;
     height:100%;
     object-fit:cover;
   }
   .team.sold img {
     opacity:0.25;
     filter:grayscale(100%) brightness(.4);
   }
   .team.sold::before {
     content: "X";

     top: 50%;
     left: 50%;
     transform: translate(-50%, -50%);
     color: #ff4d4d;
     font-weight: 900;
     font-size: 24px;
     text-shadow: 0 0 4px rgba(0,0,0,0.6);
     background: rgba(0,0,0,0.6);
     padding: 4px 10px;
     border-radius: 12px;
     border: 2px solid rgba(255,255,255,0.65);
   }
   .team:not(.sold):hover::after {
     content: "";
     position: absolute;
     inset: 0;
     background: linear-gradient(120deg, rgba(255,255,255,0) 20%, rgba(255,255,255,0.9) 50%, rgba(255,255,255,0) 80%);
     animation: shimmer 0.6s ease-out forwards;
     pointer-events: none;
   }
   .team:not(.sold):hover {
     box-shadow: 0 0 14px rgba(0,82,255,0.95);
     animation: wiggle 0.32s ease-in-out;
   }
  .team.placeholder {
    visibility: hidden;
    border: none;
    background: transparent;
    pointer-events: none;
  }

  @keyframes shimmer {
    0% { transform: translateX(-80%); opacity: 0.8; }
    100% { transform: translateX(80%); opacity: 0; }
  }
  @keyframes sweep {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  @keyframes pulse-glow {
    0%, 100% { box-shadow: 0 0 18px rgba(0,82,255,0.35); }
    50% { box-shadow: 0 0 24px rgba(0,82,255,0.55); }
  }
  @keyframes wiggle {
    0% { transform: translateX(0) scale(1); }
    25% { transform: translateX(-4px) scale(1.04); }
    50% { transform: translateX(4px) scale(1.04); }
    75% { transform: translateX(-2px) scale(1.02); }
    100% { transform: translateX(0) scale(1); }
  }
  @keyframes camera-glow {
    0%, 100% { filter: drop-shadow(0 0 10px rgba(0,162,255,0.35)); }
    50% { filter: drop-shadow(0 0 18px rgba(0,162,255,0.75)); }
  }
  @keyframes border-track {
    0% { background-position: 0% 0%; }
    25% { background-position: 100% 0%; }
    50% { background-position: 100% 100%; }
    75% { background-position: 0% 100%; }
    100% { background-position: 0% 0%; }

  function makeTeamDiv(team, index) {
    const teamDiv = document.createElement('div');
    teamDiv.className = 'team';
    teamDiv.dataset.teamIndex = index;
    teamDiv.onclick = () => toggleTeam(index);

    if (team.image) {
      const img = document.createElement('img');
      img.src = team.image;
      img.alt = team.name;
      img.onerror = () => {
        teamDiv.textContent = team.code;
      };
      teamDiv.appendChild(img);
    } else {
      teamDiv.textContent = team.code;
    }
    return teamDiv;
  }

function initializeGrid() {
  const { teams } = breakTypes[currentBreakType];

  soldTeams = new Set();
  soldTeamsList = [];

  const left = document.getElementById("leftColumn");
  const right = document.getElementById("rightColumn");
  const bottom = document.getElementById("bottomGrid");

  left.innerHTML = "";
  right.innerHTML = "";
  bottom.innerHTML = "";

  // place teams
  teams.forEach((team, i) => {
    const div = makeTeamDiv(team, i);
    if (i < 8) left.appendChild(div);
    else if (i < 16) right.appendChild(div);
    else bottom.appendChild(div);
  });

  // -----------------------------
  // FIX: Only center if remainder > 0
  // -----------------------------
  const tiles = Array.from(bottom.children);
  const fullRows = Math.floor(tiles.length / 8);
  const remainder = tiles.length % 8;

  bottom.innerHTML = '';
  let idx = 0;

  // Add full rows
  for (let r = 0; r < fullRows; r++) {
    for (let c = 0; c < 8; c++) bottom.appendChild(tiles[idx++]);
  }

  // Only pad if there's a partial row
  if (remainder > 0) {
    const pads = 8 - remainder;
    const leftPad = Math.floor(pads / 2);
    const rightPad = pads - leftPad;

    const makeSpacer = () => {
      const s = document.createElement("div");
      s.className = "team placeholder";
      return s;
    };

    for (let j = 0; j < leftPad; j++) bottom.appendChild(makeSpacer());
    while (idx < tiles.length) bottom.appendChild(tiles[idx++]);
    for (let j = 0; j < rightPad; j++) bottom.appendChild(makeSpacer());
  }

  updateHeader();
  updateStats();
  updateSoldList();
  updateBreakIdDisplay();
}



  function toggleTeam(index) {
    const teamDiv = document.querySelector(`[data-team-index="${index}"]`);
    if (!teamDiv) return;
    const listIndex = soldTeamsList.findIndex(e => e.index === index);

    if (soldTeams.has(index)) {
      soldTeams.delete(index);
      teamDiv.classList.remove('sold');
      if (listIndex !== -1) soldTeamsList.splice(listIndex, 1);
    } else {
      soldTeams.add(index);
      teamDiv.classList.add('sold');
      if (listIndex === -1) soldTeamsList.push({ index, buyer: '' });
    }
    updateStats();
    updateSoldList();
  }

  function updateStats() {
    const currentBreak = breakTypes[currentBreakType];
    const totalTeams = breakTypes[currentBreakType].teams.length;
    const soldCount = soldTeams.size;
    const teamsLeft = totalTeams - soldCount;
    document.getElementById('teamsLeft').textContent = teamsLeft;
    document.getElementById('teamsSold').textContent = soldCount;
  }

function updateHeader() {
  const currentBreak = breakTypes[currentBreakType];
  document.getElementById("headerMain").textContent =
    `JUMBO'S CARD BREAKS - ${currentBreak.name}`;

  // NEW — keep break number synced with header
  updateBreakIdDisplay();
}



  


  function resetAll() {
    soldTeams.clear();
    soldTeamsList = [];
    document.querySelectorAll('.team').forEach(team => team.classList.remove('sold'));
    updateStats();
    updateSoldList();
  }

  function changeBreakType() {
    const types = Object.keys(breakTypes);
    currentBreakType = types[(types.indexOf(currentBreakType) + 1) % types.length];
    initializeGrid();
  }

  function updateSoldList() {
    const soldListDiv = document.getElementById('soldList');
    soldListDiv.innerHTML = '';
    const currentBreak = breakTypes[currentBreakType];

    soldTeamsList.forEach(entry => {
      const team = currentBreak.teams[entry.index];
      const row = document.createElement('div');
      row.className = 'sold-row';

      if (team.image) {
        const img = document.createElement('img');
        img.src = team.image;
        img.className = 'sold-team-img';
        row.appendChild(img);
      }

      const name = document.createElement('span');
      name.className = 'sold-team-name';
      name.textContent = team.name || team.code;
      row.appendChild(name);

      const input = document.createElement('input');
      input.className = 'sold-buyer-input';
      input.type = 'text';
      input.placeholder = 'Buyer';
      input.value = entry.buyer || '';
      input.oninput = (e) => { entry.buyer = e.target.value; };
      row.appendChild(input);

      soldListDiv.appendChild(row);
    });
  }

  initializeGrid();
</script>

<script>
// ---------------- DAILY GLOBAL BREAK COUNTER ----------------

// Load existing counters
let breakDayData = JSON.parse(localStorage.getItem("breakDayData") || "{}");

// Get current date YYYY-MM-DD
function getDatePart(d = new Date()) {
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

function loadOrResetDailyCounter() {
  const today = getDatePart();

  // If no data, or old date, reset counter
  if (!breakDayData.date || breakDayData.date !== today) {
    breakDayData = {
      date: today,
      counter: 1
    };
    saveBreakCounter();
  }
}

function saveBreakCounter() {
  localStorage.setItem("breakDayData", JSON.stringify(breakDayData));
}

// Ensure valid state on load
loadOrResetDailyCounter();

// ---------------- BREAK ID BUILDER ----------------
function isDevBridge() {
  try { return BRIDGE_BASE.includes("-dev."); } catch { return false; }
}

function computeBreakId(sport) {
  const base = `${breakDayData.date}-${sport}-${breakDayData.counter}`.toLowerCase();
  return isDevBridge() ? `${base}-dev` : base;
}

function getCurrentBreakId() {
  return computeBreakId(currentBreakType);
}

// ---------------- TRIGGER NEW BREAK ----------------
function startNewBreakCycle() {
  const today = getDatePart();

  // If a new day started, reset counter
  if (today !== breakDayData.date) {
    breakDayData.date = today;
    breakDayData.counter = 1;
  } else {
    // Same day — increment break #
    breakDayData.counter += 1;
  }

  saveBreakCounter();

  // Clear all team states
  soldTeams.clear();
  soldTeamsList = [];
  document.querySelectorAll(".team").forEach(t => t.classList.remove("sold"));

  updateStats();
  updateSoldList();
  updateBreakIdDisplay();

}

// ---------------- PATCH RESET BUTTON ----------------
const originalReset = resetAll;
resetAll = function() {
  originalReset();       // original behavior
  startNewBreakCycle();  // increment day counter + reset teams
};

// ---------------- PATCH SPORT BUTTON ----------------
const originalChange = changeBreakType;
changeBreakType = function () {

  // Change sport AND rebuild grid
  originalChange();

  // FULL HARD RESET — do AFTER the rebuild
  soldTeams.clear();
  soldTeamsList = [];

  // remove sold state on NEW grid
  document.querySelectorAll(".team").forEach(t => t.classList.remove("sold"));

  updateStats();
  updateSoldList();

  // increment break number
  startNewBreakCycle();

  // final header sync
  updateHeader();
  updateBreakIdDisplay();
};




</script>
<script>
function updateBreakIdDisplay() {
  const el = document.getElementById("breakIdDisplay");
  if (!el) return;
  el.textContent = getCurrentBreakId();
}
</script>


<script>
  /* ===== Real-time hookup (SSE) ===== */

/* 1) Dynamic bridge selection */
  function param(k){ return new URLSearchParams(location.search).get(k); }

  const DEFAULT_BRIDGE = "https://tsu-bridge-jumbocb.onrender.com";

  const BRIDGE_BASE =
    param("bridge") ||
    localStorage.getItem("tsu.bridge.base") ||
    DEFAULT_BRIDGE;

  const STREAM_URL = `${BRIDGE_BASE}/stream`;

  // ---------------- EXTENSION ↔ OVERLAY BRIDGE SYNC ----------------
window.addEventListener("message", (e) => {
  if (e.data === "TSU_REQUEST_BRIDGE") {
    window.postMessage({
      source: "TSU_OVERLAY",
      type: "TSU_BRIDGE_INFO",
      bridge: BRIDGE_BASE   // ← already defined in overlay
    }, "*");
  }
});


  /* 2) Auto Break ID: YYYY-MM-DD + "-" + sport (nba/nfl/mlb) */
 
/* 3) Helpers to apply updates */
  function teamCodeToIndex(code) {
    const t = breakTypes[currentBreakType].teams;
    return t.findIndex(x => (x.code || x) === code);
  }

  function setBuyerForTeamCode(teamCode, buyerName) {
    const idx = teamCodeToIndex(teamCode);
    if (idx === -1) return;
    if (!soldTeams.has(idx)) toggleTeam(idx);
    const entry = soldTeamsList.find(e => e.index === idx);
    if (entry) { entry.buyer = buyerName; updateSoldList(); }
  }

/* 4) Subscribe to SSE */
  let es;
function startSSE() {
  es = new EventSource(STREAM_URL);

  // ==========================================================
  //  SSE CONNECTED → SEND WARMUP PING (Fix Render Cold Start)
  // ==========================================================
  es.onopen = () => {
    console.log("SSE connected — sending warmup ping");
    sendWarmupPing(); // main warmup
  };

  // Backup warmup in case Render wakes slowly
  setTimeout(() => {
    console.log("Backup warmup ping fired");
    sendWarmupPing();
  }, 2000);

  // ---- Warmup Ping Function ----
  function sendWarmupPing() {
    const ACTIVE_BRIDGE =
  window.tsu_bridge ||
  localStorage.getItem("tsu.active_bridge") ||
  BRIDGE_BASE;

fetch(`${ACTIVE_BRIDGE}/events`, {

      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        breakId: "warmup",
        breakType: currentBreakType,
        teamCode: "WARMUP",   // ignored
        buyerName: "ping",
        ts: Date.now()
      })
    }).catch(e => console.warn("Warmup ping failed:", e));
  }
  // ==========================================================


  // -------- EXISTING ONMESSAGE HANDLER ----------
  es.onmessage = (e) => {
    try {
      const data = JSON.parse(e.data);
      const myBreakId = getCurrentBreakId();
      if (data.breakId !== myBreakId) return;
      if (data.breakType !== currentBreakType) return;

      if (data.type === "reset") {
        resetAll();
        return;
      }
      if (data.teamCode && data.buyerName) {
        setBuyerForTeamCode(data.teamCode, data.buyerName);
      }
    } catch {}
  };

  es.onerror = () => {
    es.close();
    setTimeout(startSSE, 1500);
  };
}
startSSE();

/* 5) Single test helper — uses the same base as the overlay */
  window.__postTestSale = async (teamCode="TEN", buyerName="Tester") => {
    const payload = {
      breakId: getCurrentBreakId(),
      breakType: currentBreakType,
      teamCode,
      buyerName,
      ts: Date.now()
    };

  const TEST_KEY =
  param("key") ||
  localStorage.getItem("tsu.bridge.key") ||
  "4393fb29177e139f69cf4b48bdbd51dd";

const ACTIVE_BRIDGE =
  window.tsu_bridge ||
  localStorage.getItem("tsu.active_bridge") ||
  BRIDGE_BASE;

await fetch(`${ACTIVE_BRIDGE}/events`, {

  method: "POST",
  headers: {
    "Content-Type": "application/json",
    ...(TEST_KEY ? { "x-bridge-key": TEST_KEY } : {})
  },
  body: JSON.stringify(payload)
});

};
</script>
