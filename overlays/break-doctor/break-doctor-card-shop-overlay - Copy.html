<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=920, initial-scale=1.0"/>
  <title>Break Doctor Card Shop – Box Break Overlay</title>

  <style>
   :root{
  --bg0:#020407;
  --bg1:#070b12;
  --panel:#060a10;
  --tile:#05080d;

  --doctorGreen:#11f08a;
  --doctorGreenDeep:#0a7c53;
  --doctorTeal:#27d7ff;
  --doctorRed:#ff3a34;
  --doctorRedDeep:#9f1717;
  --doctorRed2:#ff6b62;

  --silver:#f3f7fa;
  --steel:#8ea2ad;

  --gold:#ffd36a;
  --goldBorder: rgba(255,211,106,0.38);
  --border: rgba(255,255,255,0.14);
  --text:#ffffff;
  --muted: rgba(255,255,255,0.78);

  --neonGreenGlow: rgba(17,240,138,0.34);
  --neonGreenGlow2: rgba(17,240,138,0.16);
  --neonRedGlow: rgba(255,58,52,0.34);
  --neonRedGlow2: rgba(255,58,52,0.16);
  --neonBlueGlow: rgba(39,215,255,0.18);
  --glass: rgba(0,0,0,0.42);

  --tileH: 52px;
  --gap: 3px;
  --cols: 8;
}
    *{ box-sizing:border-box; }

    body{
      margin:0;
      background:transparent;
      font-family:"Arial Black", Arial, sans-serif;
      user-select:none;
      overflow:hidden;
    }

    .overlay-wrap{
      position: relative;
      width: 1080px;
      height: 840px;
      
      overflow: visible;
    }

    .bg-video{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit: contain;
      object-position: center;
      z-index:0;
      pointer-events:none;
      top:-99px;
    }

    .bg-dim{
      position:absolute;
      inset:0;
      background: rgba(0,0,0,0.26);
      z-index:1;
      pointer-events:none;
    }

    .container,
    .sold-list-container,
    .popup-mask{
      position: relative;
      z-index: 2;
      margin: 8px 0 0 0;
      width: 1080px;
    }

 .container{
  position: relative;
  background:
    radial-gradient(820px 260px at 18% 0%, rgba(17,240,138,0.12), transparent 62%),
    radial-gradient(820px 260px at 82% 0%, rgba(255,58,52,0.14), transparent 62%),
    radial-gradient(980px 500px at 50% 100%, rgba(39,215,255,0.06), transparent 60%),
    linear-gradient(180deg, #020407 0%, #060912 42%, #03050a 100%);
  border: 3px solid rgba(255,255,255,0.12);
  border-radius: 14px;
  padding: 6px;
  box-shadow:
    0 0 28px rgba(0,0,0,0.82),
    0 0 22px rgba(17,240,138,0.10),
    0 0 24px rgba(255,58,52,0.10);
  display:flex;
  height:435px;
  flex-direction:column;
  overflow:hidden;
}

.container::before{
  content:"";
  position:absolute;
  inset:-30px -30px 0 -30px;
  pointer-events:none;
  background:
    radial-gradient(circle at 18% 10%, rgba(17,240,138,0.10) 0 2px, transparent 3px),
    radial-gradient(circle at 82% 16%, rgba(255,58,52,0.10) 0 2px, transparent 3px),
    radial-gradient(circle at 50% 70%, rgba(39,215,255,0.06) 0 2px, transparent 3px),
    repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.035) 0px,
      rgba(255,255,255,0.035) 1px,
      rgba(0,0,0,0) 3px,
      rgba(0,0,0,0) 6px
    );
  opacity:.22;
}

.container::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  border-radius:14px;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,0.05),
    inset 0 0 28px rgba(17,240,138,0.05),
    inset 0 0 28px rgba(255,58,52,0.05);
}



.header{
  position: relative;
  background:
    linear-gradient(90deg,
      rgba(0,0,0,0.90) 0%,
      rgba(17,240,138,0.14) 24%,
      rgba(0,0,0,0.58) 50%,
      rgba(255,58,52,0.16) 76%,
      rgba(0,0,0,0.90) 100%);
  color: #fff;
  padding: 6px 10px;
  margin: -6px -6px 6px -6px;
  border-radius: 8px 8px 0 0;
  display:flex;
  align-items:center;
  justify-content: space-between;
  gap:10px;
  border: 2px solid rgba(255,255,255,0.10);
  box-shadow:
    0 0 0 1px rgba(0,0,0,0.60),
    0 0 18px rgba(17,240,138,0.10),
    0 0 18px rgba(255,58,52,0.10),
    inset 0 0 0 1px rgba(255,255,255,0.04);
  overflow:hidden;
}

.header::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(90deg,
      transparent 0%,
      rgba(17,240,138,0.22) 18%,
      transparent 36%,
      transparent 62%,
      rgba(255,58,52,0.22) 82%,
      transparent 100%);
  opacity:.85;
}



.header-text{
  font-size: 18px;
  font-weight: 900;
  letter-spacing: 1px;
  color:#f7fbff;
  text-shadow:
    0 2px 10px rgba(0,0,0,0.90),
    0 0 10px rgba(17,240,138,0.14),
    0 0 10px rgba(255,58,52,0.14);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

    .header-left{
      display:flex;
      align-items:center;
      gap:10px;
      min-width: 0;
    }

.header-icon{
  width:18px;
  height:18px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,0.88);
  background: radial-gradient(circle at 30% 30%, #ffffff, var(--doctorGreen), var(--doctorRed));
  box-shadow:
    0 0 10px rgba(17,240,138,0.48),
    0 0 12px rgba(255,58,52,0.34);
  flex: 0 0 auto;
}

    .header-text{
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-right{
      display:flex;
      align-items:center;
      gap:10px;
      flex: 0 0 auto;
    }

 .break-pill{
  display:flex;
  align-items:center;
  gap:8px;
  padding: 4px 12px;
  border-radius: 999px;
  border: 2px solid rgba(255,255,255,0.14);
  background:
    linear-gradient(135deg, rgba(0,0,0,0.76), rgba(8,14,22,0.86));
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,0.04),
    0 0 12px rgba(17,240,138,0.08),
    0 0 12px rgba(255,58,52,0.08);
  font-weight: 900;
  letter-spacing: 1px;
  text-transform: uppercase;
  white-space: nowrap;
  color:#fff;
}

.break-pill .label{
  opacity: .92;
  font-size: 19px;
  color:#dce8ef;
}

.break-pill .value{
  font-size: 19px;
  color: #ffffff;
  text-shadow:
    0 0 8px rgba(17,240,138,0.12),
    0 0 8px rgba(255,58,52,0.12);
}

    .main-content{
      display:flex;
      flex-direction:column;
      gap: 6px;
      flex:1;
      min-height:0;
    }

  .teams-wrapper{
  position: relative;
  background:
    linear-gradient(180deg, rgba(0,0,0,0.26) 0%, rgba(0,0,0,0.48) 100%);
  border-radius: 10px;
  padding: 6px;
  border: 2px solid rgba(255,255,255,0.12);
  box-shadow:
    inset 0 0 0 1px rgba(17,240,138,0.08),
    inset 0 0 0 2px rgba(255,58,52,0.06),
    0 0 18px rgba(0,0,0,0.35);
  flex:1;
  min-height:280px;
  overflow: visible;
}

.teams-wrapper::before{
  content:"";
  position:absolute;
  left:-6%;
  right:-6%;
  top:-12px;
  height:130px;
  pointer-events:none;
  background:
    radial-gradient(420px 100px at 28% 52%, rgba(17,240,138,0.28), transparent 62%),
    radial-gradient(420px 100px at 72% 52%, rgba(255,58,52,0.28), transparent 62%),
    linear-gradient(180deg, rgba(255,255,255,0.03), transparent 70%);
  opacity:.72;
  mix-blend-mode:screen;
  z-index:0;
}

.teams-wrapper::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:10px;
  pointer-events:none;
  background:
    linear-gradient(90deg, rgba(17,240,138,0.0), rgba(17,240,138,0.16), rgba(17,240,138,0.0)),
    linear-gradient(90deg, rgba(255,58,52,0.0), rgba(255,58,52,0.14), rgba(255,58,52,0.0));
  background-size: 220% 100%, 220% 100%;
  background-position: -140% 0, 140% 0;
  background-repeat:no-repeat;
  animation: doctorBorderSweep 7.5s linear infinite;
}

@keyframes doctorBorderSweep{
  0%   { background-position: -140% 0, 140% 0; }
  100% { background-position: 140% 0, -140% 0; }
}

.teams-wrapper > .row-grid{
  position:relative;
  z-index:2;
}

    .row-grid{
      display:grid;
      gap: var(--gap);
      margin-bottom: 6px;
      grid-template-columns: repeat(var(--cols), 1fr);
      align-items: stretch;
    }

.team{
  background:
    radial-gradient(120px 40px at 30% 18%, rgba(17,240,138,0.07), transparent 58%),
    radial-gradient(120px 40px at 70% 82%, rgba(255,58,52,0.07), transparent 58%),
    rgba(0,0,0,0.82);
  border: 2px solid rgba(255,255,255,0.14);
  border-radius: 6px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  position:relative;
  height: var(--tileH);
  overflow:hidden;
  transition: transform 0.1s, box-shadow 0.1s, border-color 0.2s;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,0.03),
    0 0 0 rgba(0,0,0,0);
}

.team:hover{
  transform: translateY(-2px) scale(1.03);
  box-shadow:
    0 0 12px rgba(17,240,138,0.18),
    0 0 12px rgba(255,58,52,0.16);
  border-color: rgba(255,255,255,0.28);
}


    .team img{
      width:100%;
      height:100%;
      object-fit: cover;
      border-radius: 4px;
    }

    .team img.nfl-small{ object-fit: cover; }

    .team .fallback-code{
      color:#fff;
      font-size: 14px;
      letter-spacing: 1px;
      opacity: 0.92;
    }

    .team.sold img{
      opacity: 0.92;
      filter: grayscale(50%) brightness(0.45);
    }

    .team.flash{
      animation: soldFlash 260ms ease;
    }

@keyframes soldFlash{
  0%{ box-shadow: 0 0 0 rgba(255,58,52,0.0); }
  50%{ box-shadow: 0 0 18px rgba(255,58,52,0.55); }
  100%{ box-shadow: 0 0 0 rgba(255,58,52,0.0); }
}

    .team.sold::after{
      content:"X";
      position:absolute;
      font-size: 20px;
      color: #ffffff;
      text-shadow: 0 0 3px #000;
      z-index: 10;
      background: rgba(196,22,28,0.95);
      border-radius: 50%;
      width: 26px;
      height: 26px;
      display:flex;
      align-items:center;
      justify-content:center;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      border: 2px solid #ffffff;
    }

.logo-slot{
  border-radius: 10px;
  height: var(--tileH);
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
  background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
  border: 2px solid rgba(255,255,255,0.10);
  overflow:visible;
  position:relative;
  box-shadow:
    0 0 16px rgba(17,240,138,0.12),
    0 0 16px rgba(255,58,52,0.12);
}

.logo-slot img{
  height: 155px;
  width: auto;
  object-fit: contain;
  position:absolute;
  top: -83px;
  z-index: 999;
  filter:
    drop-shadow(0 8px 16px rgba(0,0,0,0.72))
    drop-shadow(0 0 14px rgba(17,240,138,0.16))
    drop-shadow(0 0 14px rgba(255,58,52,0.16));
  animation: logoBreath 4s ease-in-out infinite;
}

@keyframes logoBreath{
  0%{ transform:scale(1); }
  50%{ transform:scale(1.06); }
  100%{ transform:scale(1); }
}


.ticker-slot{
  border-radius: 10px;
  height: var(--tileH);
  display:flex;
  align-items:center;
  overflow:hidden;
  background:
    linear-gradient(90deg,
      rgba(0,0,0,0.82) 0%,
      rgba(17,240,138,0.10) 22%,
      rgba(0,0,0,0.52) 50%,
      rgba(255,58,52,0.10) 78%,
      rgba(0,0,0,0.82) 100%);
  border: 2px solid rgba(255,255,255,0.14);
  padding: 0 10px;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,0.04),
    0 0 14px rgba(17,240,138,0.08),
    0 0 14px rgba(255,58,52,0.08);
}

    .ticker-track{
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
      will-change: transform;
      animation: tickerMarquee linear infinite;
      animation-duration: var(--tickerDur, 24s);
    }

    .ticker-copy{
      display:inline-block;
      padding-right: 48px;
      font-weight: 900;
      letter-spacing: 0.8px;
      color: #fff;
      font-size: 22px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.60);
    }

    @keyframes tickerMarquee{
      0%   { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

.controls-row{
  margin-top: 6px;
  display:flex;
  gap: 6px;
  align-items: stretch;
  flex-direction: row;
  justify-content: space-evenly;
  background:
    linear-gradient(182deg, rgba(0,0,0,0.92), rgba(10,14,22,0.88));
  border-radius: 10px;
  padding: 6px;
  border: 2px solid rgba(255,255,255,0.12);
  box-shadow:
    inset 0 0 0 1px rgba(17,240,138,0.05),
    inset 0 0 0 2px rgba(255,58,52,0.04);
}

.stat-box{
  background:
    linear-gradient(135deg, rgba(0,0,0,0.72) 0%, rgba(9,15,24,0.92) 100%);
  color:#fff;
  border-radius: 8px;
  text-align:center;
  font-weight:900;
  padding: 4px 0;
  box-shadow:
    0 2px 6px rgba(0,0,0,0.35),
    0 0 12px rgba(17,240,138,0.05),
    0 0 12px rgba(255,58,52,0.05);
  display:flex;
  flex-direction:column;
  min-width:100px;
  justify-content:center;
  font-size: 18px;
  border: 2px solid rgba(255,255,255,0.14);
}
.promo-box{
  flex:1;
  background:
    linear-gradient(90deg,
      rgba(0,0,0,0.92) 0%,
      rgba(17,240,138,0.14) 24%,
      rgba(0,0,0,0.58) 50%,
      rgba(255,58,52,0.16) 76%,
      rgba(0,0,0,0.92) 100%);
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  font-weight:900;
  color:#fff;
  border:2px solid rgba(255,255,255,0.16);
  text-shadow:
    0 2px 8px rgba(0,0,0,0.9),
    0 0 10px rgba(17,240,138,0.12),
    0 0 10px rgba(255,58,52,0.12);
  overflow:hidden;
  position:relative;
  box-shadow:
    0 0 18px rgba(17,240,138,0.10),
    0 0 18px rgba(255,58,52,0.10);
}

.promo-box::before{
  content:"";
  position:absolute;
  inset:-2px;
  border-radius:14px;
  padding:2px;
  background:
    linear-gradient(90deg,
      transparent 0%,
      rgba(17,240,138,0.0) 10%,
      rgba(17,240,138,0.85) 24%,
      rgba(255,255,255,0.88) 34%,
      rgba(255,58,52,0.85) 46%,
      rgba(255,58,52,0.0) 60%,
      transparent 100%);
  -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  pointer-events:none;
  animation: wickTrace 3.2s linear infinite;
}

.promo-box::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.04) 0px,
      rgba(255,255,255,0.04) 1px,
      rgba(0,0,0,0) 3px,
      rgba(0,0,0,0) 6px
    );
  pointer-events:none;
  opacity:.20;
}
#promoText{
  position:relative;
  z-index:2;
  padding:0 14px;
  text-align:center;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  letter-spacing: 1px;
  text-shadow:
    0 2px 10px rgba(0,0,0,0.95),
    0 0 12px rgba(17,240,138,0.14),
    0 0 12px rgba(255,58,52,0.14);
}

.promo-flip{
  animation: promoFlip .6s ease;
}

@keyframes promoFlip{
  0%{ transform:rotateX(90deg); opacity:0; }
  100%{ transform:rotateX(0deg); opacity:1; }
}

@keyframes wickTrace{
  0%   { transform: translateX(-120%); }
  100% { transform: translateX(120%); }
}


    .stat-label{
      font-size: 11px;
      letter-spacing: 1px;
      margin-top: 2px;
      opacity: 0.95;
    }
.btn{
  background:
    linear-gradient(135deg, rgba(255,58,52,0.82) 0%, rgba(22,10,12,0.96) 100%);
  color:#fff;
  border: 2px solid rgba(255,255,255,0.14);
  border-radius: 8px;
  cursor:pointer;
  font-weight: 900;
  font-size: 14px;
  letter-spacing: 0.5px;
  text-shadow: 1px 1px 2px rgba(0,0,0,0.65);
  box-shadow:
    0 2px 6px rgba(0,0,0,0.35),
    0 0 10px rgba(255,58,52,0.08);
  display:flex;
  align-items:center;
  justify-content:center;
  gap: 6px;
  padding: 10px 10px;
}

.btn.secondary{
  background:
    linear-gradient(135deg, rgba(17,240,138,0.78) 0%, rgba(8,32,24,0.96) 100%);
  color:#fff;
  border: 2px solid rgba(255,255,255,0.14);
  text-shadow: none;
  box-shadow:
    0 2px 6px rgba(0,0,0,0.35),
    0 0 10px rgba(17,240,138,0.08);
}

.btn.ghost{
  background:
    linear-gradient(181deg, rgba(0,0,0,0.76) 0%, rgba(11,15,23,0.96) 100%);
  border: 2px solid rgba(255,255,255,0.14);
  box-shadow:
    0 2px 6px rgba(0,0,0,0.35),
    0 0 8px rgba(39,215,255,0.05);
}

    .btn:active{ transform: translateY(1px); box-shadow:none; }
.sold-list-container{
  width: 1080px;
  background:
    linear-gradient(180deg, rgba(0,0,0,0.88) 0%, rgba(8,10,16,0.96) 100%);
  border: 2px solid rgba(255,255,255,0.12);
  border-radius: 10px;
  padding: 6px 7px 8px;
  text-align:center;
  overflow: hidden;
  box-shadow:
    0 8px 22px rgba(0,0,0,0.48),
    0 0 16px rgba(17,240,138,0.05),
    0 0 16px rgba(255,58,52,0.05);
}

    .sold-top-row{
      display:flex;
      align-items:center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }

    .sold-list-title{
      font-size: 16px;
      font-weight: 900;
      color:#ffffff;
      letter-spacing: 1px;
      text-align:left;
      padding-left: 2px;
    }

    .sold-controls{
      display:flex;
      gap: 6px;
      align-items:center;
      justify-content:flex-end;
      flex-wrap: wrap;
    }

    .sold-list-grid{
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px 12px;
    }

.sold-row{
  display:flex;
  align-items:center;
  gap: 6px;
  margin-bottom: 2px;
  background: rgba(0,0,0,0.58);
  border-radius: 7px;
  padding: 2px 4px;
  border: 2px solid rgba(255,255,255,0.12);
  box-shadow: inset 0 0 0 1px rgba(17,240,138,0.03);
}
    .sold-team-img{
      width: 24px;
      height: 24px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid #ffffff;
      background:#000;
    }

    .sold-team-name{
      font-weight: 900;
      color:#f9fafb;
      min-width: 60px;
      text-transform: capitalize;
      font-size: 13px;
      opacity: 0.95;
    }

    .sold-buyer-input{
      font-size: 13px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 4px;
      font-weight: 800;
      padding: 2px 4px;
      width: 100%;
      background: rgba(0,0,0,0.35);
      color:#f9fafb;
      outline:none;
    }

    .sse{
      display:flex;
      align-items:center;
      gap: 6px;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      opacity: 0.95;
      padding: 6px 8px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.18);
      color:#fff;
    }

    .sse .dot{
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #666;
      box-shadow: 0 0 8px rgba(255,255,255,0.15);
    }

/******************************************************************

 ******************************************************************/
function yyyymmddChicago(d = new Date()){
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: "America/Chicago",
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
  }).formatToParts(d);

  const y = parts.find(p => p.type === "year")?.value;
  const m = parts.find(p => p.type === "month")?.value;
  const day = parts.find(p => p.type === "day")?.value;
  return `${y}-${m}-${day}`;
}

function computeBreakId(){
  const date = yyyymmddChicago();
  const sport = String(currentBreakType || "").toLowerCase();
  const n = loadBreakNumber();
  return `${date}-${sport}-${n}`;
}

function breakIdMatches(payload){
  const incoming = String(payload?.breakId || "").trim();
  if (!incoming) return true;
  if (incoming === computeBreakId()) return true;

  const sport = String(currentBreakType || "").toLowerCase();
  const n = String(loadBreakNumber());
  return incoming.endsWith(`-${sport}-${n}`);
}

      const box = document.getElementById("exportBox");

      if (!box) return;

      const text = box.value || "";
      try{
        await navigator.clipboard.writeText(text);
        if (btn) btn.textContent = "COPIED!";
        setTimeout(() => { if (btn) btn.textContent = "COPY"; }, 900);

        box.focus();
        box.select();
        try{

          setTimeout(() => { if (btn) btn.textContent = "COPY"; }, 900);

    const SCORES_BY_SPORT = { nba: "", nfl: "", mlb: "" };
    const SCORES_UPDATED_AT = { nba: 0, nfl: 0, mlb: 0 };

 let sseMain = null;
let sseSports = null;
let mainState = "off";
let sportsState = ENABLE_SCORES ? "off" : "disabled";

let PROMO_MESSAGES = [];
let promoIndex = 0;
let promoTimer = null;

/******************************************************************
 * PROMO ROTATOR
 ******************************************************************/
function loadPromos(){
  try{
    const raw = localStorage.getItem(PROMO_KEY);
    if (!raw) return ["FAST SHIPPING","LIVE BREAKS","GOOD LUCK"];
    const arr = JSON.parse(raw);
    return Array.isArray(arr) && arr.length ? arr : ["FAST SHIPPING","LIVE BREAKS","GOOD LUCK"];
  }catch(_){
    return ["FAST SHIPPING","LIVE BREAKS","GOOD LUCK"];
  }
}

function savePromos(arr){
  localStorage.setItem(PROMO_KEY, JSON.stringify(arr));
}

function loadPromoSpeed(){
  const n = parseInt(localStorage.getItem(PROMO_SPEED_KEY) || "8000", 10);
  return Number.isFinite(n) ? n : 8000;
}

function rotatePromo(){
  if (!PROMO_MESSAGES.length) return;

  promoIndex = (promoIndex + 1) % PROMO_MESSAGES.length;
  const el = document.getElementById("promoText");
  if (!el) return;

  el.classList.remove("promo-flip");
  void el.offsetWidth;
  el.classList.add("promo-flip");
  el.textContent = PROMO_MESSAGES[promoIndex];
}

function startPromo(){
  PROMO_MESSAGES = loadPromos();
  promoIndex = 0;

  const el = document.getElementById("promoText");
  if (el) el.textContent = PROMO_MESSAGES[0] || "BREAK DOCTOR CARD SHOP";

  if (promoTimer) clearInterval(promoTimer);
  promoTimer = setInterval(rotatePromo, loadPromoSpeed());
}

function openPromoPopup(){
  const input = document.getElementById("promoInput");
  const slider = document.getElementById("promoSpeedSlider");
  if (input) input.value = PROMO_MESSAGES.join("\n");
  if (slider) slider.value = String(loadPromoSpeed());
  showPopup("promoPopup");
}

function closePromoPopup(){ hidePopup("promoPopup"); }

function applyPromoPopup(){
  const lines = (document.getElementById("promoInput")?.value || "")
    .split("\n")
    .map(x => x.trim())
    .filter(Boolean);

  PROMO_MESSAGES = lines.length ? lines : ["FAST SHIPPING","LIVE BREAKS","GOOD LUCK"];
  promoIndex = 0;

  savePromos(PROMO_MESSAGES);
  localStorage.setItem(PROMO_SPEED_KEY, document.getElementById("promoSpeedSlider")?.value || "8000");

  const el = document.getElementById("promoText");
  if (el){
    el.classList.remove("promo-flip");
    void el.offsetWidth;
    el.classList.add("promo-flip");
    el.textContent = PROMO_MESSAGES[0];
  }

  startPromo();
  closePromoPopup();
}

    /******************************************************************
     * HEADER
     ******************************************************************/
    function setHeader(){
      const b = breakTypes[currentBreakType];
      const custom = loadCustomTitle();
      document.getElementById("headerText").textContent = custom ? custom : `BREAK DOCTOR CARD SHOP • ${b.name} BREAK`;
    }

    function setBreakNumber(n){
      const safe = Number.isFinite(n) && n > 0 ? n : 1;
      document.getElementById("breakNumberDisplay").textContent = String(safe);
      saveBreakNumber(safe);
    }

    /******************************************************************
     * TICKER
     ******************************************************************/
    function getDefaultTickerText(){
      return TICKER_LINES.join(" • ");
    }

    function normalizeScorePayloadToText(data){
      if (!data) return "";

      if (typeof data.text === "string" && data.text.trim()) return data.text.trim();

      if (Array.isArray(data.lines) && data.lines.length){
        return data.lines.map(s => String(s).trim()).filter(Boolean).join(" • ");
      }

      const league = String(data.league || data.sport || "").toUpperCase();
      if (Array.isArray(data.games) && data.games.length){
        const chunks = data.games.slice(0, 10).map(g => {
          const a = String(g.away || g.a || g.awayTeam || "").toUpperCase();
          const h = String(g.home || g.h || g.homeTeam || "").toUpperCase();
          const as = (g.awayScore ?? g.as ?? g.aScore);
          const hs = (g.homeScore ?? g.hs ?? g.hScore);
          const st = String(g.status || g.state || g.clock || "").trim();

          const scorePart = (Number.isFinite(+as) && Number.isFinite(+hs)) ? `${a} ${as}-${hs} ${h}` : `${a} vs ${h}`;
          return st ? `${scorePart} (${st})` : scorePart;
        });

        const prefix = league ? `${league}: ` : "SCORES: ";
        return prefix + chunks.join(" • ");
      }

      return "";
    }

    function isFreshSportScore(sport){
      return (Date.now() - (SCORES_UPDATED_AT[sport] || 0)) < 1000 * 60 * 20;
    }

    function getScoresAllSportsText(){
      if (!ENABLE_SCORES) return "";

      const order = ["nba","nfl","mlb"];
      const parts = [];

      for (const s of order){
        const txt = (SCORES_BY_SPORT[s] || "").trim();
        if (txt && isFreshSportScore(s)) parts.push(txt);
      }

      return parts.join(" • ");
    }

    function buildTickerLine(){
      const a = getDefaultTickerText();
      const b = getScoresAllSportsText();
      return b ? `${a} • ${b}` : a;
    }

    function updateTickerMarquee(){
      const line = ` ${buildTickerLine()} `;
      document.querySelectorAll(".ticker-track").forEach(track => {
        const copies = track.querySelectorAll(".ticker-copy");
        if (copies.length < 2) return;

        copies[0].textContent = line;
        copies[1].textContent = line;

        requestAnimationFrame(() => {
          const halfWidth = copies[0].getBoundingClientRect().width;
          const pxPerSec = loadTickerSpeed();
          const dur = Math.max(12, Math.round(halfWidth / pxPerSec));
          document.documentElement.style.setProperty("--tickerDur", `${dur}s`);
        });
      });
    }

    /******************************************************************
     * IMAGE HELPERS
     ******************************************************************/
    function attachFallbackImage(img, primary, fallback){
      img.src = primary;
      img.onerror = () => {
        if (img.dataset.fallbackTried === "1") return;
        img.dataset.fallbackTried = "1";
        img.src = fallback;
      };
    }

    /******************************************************************
     * TILES
     ******************************************************************/
    function makeTeamDiv(team){
      const d = document.createElement("div");
      d.className = "team";
      d.dataset.teamCode = String(team.code || "");
      d.onclick = () => toggleTeam(team.code);

      if (team.image){
        const img = document.createElement("img");
        img.src = team.image;
        img.alt = team.name || team.code || "";
        if (currentBreakType === "nfl") img.classList.add("nfl-small");
        img.onerror = () => {
          d.innerHTML = `<div class="fallback-code">${team.code || "?"}</div>`;
        };
        d.appendChild(img);
      } else {
        d.innerHTML = `<div class="fallback-code">${team.code || "?"}</div>`;
      }

      if (soldTeams.has(team.code)) d.classList.add("sold");
      return d;
    }

    function makeLogoSlot(spanCols){
      const slot = document.createElement("div");
      slot.className = "logo-slot";
      slot.style.gridColumn = `span ${spanCols}`;

      const img = document.createElement("img");
      img.alt = "Break Doctor Card Shop Logo";
      attachFallbackImage(img, LOGO_PRIMARY, LOGO_FALLBACK);
      slot.appendChild(img);

      return slot;
    }

    function makeTickerSlot(spanCols){
      const slot = document.createElement("div");
      slot.className = "ticker-slot";
      slot.style.gridColumn = `span ${spanCols}`;

      const track = document.createElement("div");
      track.className = "ticker-track";

      const c1 = document.createElement("span");
      c1.className = "ticker-copy";

      const c2 = document.createElement("span");
      c2.className = "ticker-copy";

      track.appendChild(c1);
      track.appendChild(c2);
      slot.appendChild(track);
      return slot;
    }

     * LAYOUT BUILDER
     ******************************************************************/

      const wrap = document.getElementById("teamsWrapper");

      if (config.layout === "NBA_MLB_30"){

        const r1 = document.createElement("div");

        r1.appendChild(makeLogoSlot(2));
        for (let i=0;i<3;i++) r1.appendChild(makeTeamDiv(teams[idx++]));

          wrap.appendChild(row);
        }

        const r5 = document.createElement("div");
        r5.className = "row-grid";
        r5.appendChild(makeTickerSlot(8));
        wrap.appendChild(r5);
      }

      if (config.layout === "NFL_32"){
        let idx = 0;

        const r1 = document.createElement("div");
        r1.className = "row-grid";
        for (let i=0;i<4;i++) r1.appendChild(makeTeamDiv(teams[idx++]));
        r1.appendChild(makeLogoSlot(2));
        for (let i=0;i<4;i++) r1.appendChild(makeTeamDiv(teams[idx++]));
        wrap.appendChild(r1);

        const r2 = document.createElement("div");
        r2.className = "row-grid";
        for (let i=0;i<10;i++) r2.appendChild(makeTeamDiv(teams[idx++]));
        wrap.appendChild(r2);

        const r3 = document.createElement("div");
        r3.className = "row-grid";
        for (let i=0;i<10;i++) r3.appendChild(makeTeamDiv(teams[idx++]));
        wrap.appendChild(r3);

        const r4 = document.createElement("div");
        r4.className = "row-grid";
        r4.appendChild(makeTeamDiv(teams[idx++]));
        r4.appendChild(makeTeamDiv(teams[idx++]));
        r4.appendChild(makeTickerSlot(6));
        r4.appendChild(makeTeamDiv(teams[idx++]));
        r4.appendChild(makeTeamDiv(teams[idx++]));
        wrap.appendChild(r4);
      }

      setHeader();

    /******************************************************************
     * SOLD STATE
     ******************************************************************/
    function toggleTeam(code, buyerFromAutomation=""){
      const tile = document.querySelector(`[data-team-code="${code}"]`);
      if (!tile) return;

      const listIndex = soldTeamsList.findIndex(e => e.code === code);

      if (soldTeams.has(code)){
        soldTeams.delete(code);
        tile.classList.remove("sold");
        if (listIndex !== -1) soldTeamsList.splice(listIndex, 1);
      } else {
        soldTeams.add(code);
        tile.classList.add("sold");
        tile.classList.add("flash");
        setTimeout(()=>tile.classList.remove("flash"), 280);

        if (listIndex === -1) soldTeamsList.push({ code, buyer: buyerFromAutomation || "" });
      }

      saveSoldState();
      updateStats();
      updateSoldList();
    }

    function updateStats(){
      const total = breakTypes[currentBreakType].teams.length;
      const sold = soldTeams.size;
      document.getElementById("teamsLeft").textContent = String(total - sold);
      document.getElementById("teamsSold").textContent = String(sold);
    }

    function updateSoldList(){
      const soldListDiv = document.getElementById("soldList");
      soldListDiv.innerHTML = "";
      const currentBreak = breakTypes[currentBreakType];

      soldTeamsList.forEach(entry => {
        const team = currentBreak.teams.find(t => t.code === entry.code);
        if (!team) return;

        const row = document.createElement("div");
        row.className = "sold-row";

        if (team.image){
          const img = document.createElement("img");
          img.src = team.image;
          img.className = "sold-team-img";
          img.onerror = () => {
            img.style.display = "none";
          };
          row.appendChild(img);
        }

        const name = document.createElement("span");
        name.className = "sold-team-name";
        name.textContent = team.name || team.code;
        row.appendChild(name);

        const input = document.createElement("input");
        input.className = "sold-buyer-input";
        input.type = "text";
        input.placeholder = "Buyer";
        input.value = entry.buyer || "";
        input.oninput = (e) => {
          entry.buyer = e.target.value || "";
          saveSoldState();
        };
        row.appendChild(input);

        soldListDiv.appendChild(row);
      });
    }

    function resetAll(){
      soldTeams.clear();
      soldTeamsList = [];
      lastCodeByListingKey.clear();
      document.querySelectorAll(".team").forEach(t => t.classList.remove("sold"));
      saveSoldState();
      updateStats();
      updateSoldList();
      buildLayout();
    }

    function newBreak(){
      resetAll();
      setBreakNumber(loadBreakNumber() + 1);
    }

    function cycleSport(){
      const types = Object.keys(breakTypes);
      const idx = types.indexOf(currentBreakType);
      currentBreakType = types[(idx + 1) % types.length];
      localStorage.setItem(SPORT_KEY, currentBreakType);
      resetSportStateIfNeeded();
      buildLayout();
    }

function setSport(type){
  if (!breakTypes[type]) return;
  currentBreakType = type;
  localStorage.setItem(SPORT_KEY, currentBreakType);
  resetSportStateIfNeeded();
  buildLayout();
  updateTickerMarquee();
}


    function resetSportStateIfNeeded(){
      soldTeams.clear();
      soldTeamsList = [];
      lastCodeByListingKey.clear();
      saveSoldState();
    }

    function restoreState(){
      const saved = loadSoldState();
      if (!saved) return;

      if (saved.sport === currentBreakType) {
        soldTeams = new Set(saved.soldTeams || []);
        soldTeamsList = Array.isArray(saved.soldTeamsList) ? saved.soldTeamsList : [];
        lastCodeByListingKey = new Map(Array.isArray(saved.lastCodeByListingKey) ? saved.lastCodeByListingKey : []);
      }
    }

    /******************************************************************
     * EXPORT
     ******************************************************************/
    function formatNow(){
      return new Date().toISOString();
    }

    function buildExportTSV(){
      const breakNum = loadBreakNumber();
      const sport = currentBreakType.toUpperCase();
      const date = formatNow();
      let tsv = "Team\tBuyer\tDate\tBreak#\tSport\n";

      const currentBreak = breakTypes[currentBreakType];
      soldTeamsList.forEach(entry => {
        const teamObj = currentBreak.teams.find(t => t.code === entry.code);
        const teamName = (teamObj?.name || entry.code || "").toString();
        const buyer = (entry.buyer || "").toString().replace(/\t|\n/g, " ").trim();
        tsv += `${teamName}\t${buyer}\t${date}\t${breakNum}\t${sport}\n`;
      });

      return tsv;
    }

    /******************************************************************
     * SSE
     ******************************************************************/
 const BRIDGE_LS = {
  URL: "tsu.bridge",
  KEY: "tsu.key",
  OVERLAY: "tsu.overlayId",
  CHANNEL: "tsu.channel",
  URL_LEGACY: "tsu.bridgeUrl",
  KEY_LEGACY: "tsu.bridgeKey",
};


function cleanUrl(u){ return String(u || "").trim().replace(/\/$/, ""); }

function normalizeBridge(u){
  return cleanUrl(u).replace(/\/(events|stream)(\/.*)?$/, "");
}

function getBridgeBase() {
  const q = getParam("bridge");
  if (q) {
    const cleaned = normalizeBridge(q);
    localStorage.setItem(BRIDGE_LS.URL, cleaned);
    return cleaned;
  }

  const std = localStorage.getItem(BRIDGE_LS.URL);
  if (std) return std.trim().replace(/\/$/, "");

  const legacy = localStorage.getItem(BRIDGE_LS.URL_LEGACY);
  if (legacy) {
    const cleaned = String(legacy).trim().replace(/\/$/, "");
    localStorage.setItem(BRIDGE_LS.URL, cleaned);
    return cleaned;
  }

  return "";
}

function getBridgeKey() {
  const q = getParam("key");
  if (q) {
    const k = q.trim();
    localStorage.setItem(BRIDGE_LS.KEY, k);
    return k;
  }

  const std = (localStorage.getItem(BRIDGE_LS.KEY) || "").trim();
  if (std) return std;

  const legacy = (localStorage.getItem(BRIDGE_LS.KEY_LEGACY) || "").trim();
  if (legacy) {
    localStorage.setItem(BRIDGE_LS.KEY, legacy);
    return legacy;
  }

  return "";
}

function getChannel() {
  const q = (getParam("channel") || localStorage.getItem(BRIDGE_LS.CHANNEL) || "main");
  const ch = String(q).trim().toLowerCase() || "main";
  localStorage.setItem(BRIDGE_LS.CHANNEL, ch);
  return ch;
}

function getScoresChannel(){
  return (getParam("scoresChannel") || "sports").toLowerCase();
}

function getOverlayId() {
  const q = (getParam("overlay") || localStorage.getItem(BRIDGE_LS.OVERLAY) || "texas-hobby-house-overlay");
  const id = String(q).trim().toLowerCase() || "texas-hobby-house-overlay";
  localStorage.setItem(BRIDGE_LS.OVERLAY, id);
  return id;
}

async function bridgePost(payload) {
  if (!bridgeEnabled()) return;

  const base = getBridgeBase();
  const key = getBridgeKey();

  await fetch(`${base}/events`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      ...(key ? { "x-bridge-key": key } : {}),
    },
    body: JSON.stringify(payload),
  }).catch(() => {});
}

function bridgeEnabled() {
  return !!getBridgeBase();
}
