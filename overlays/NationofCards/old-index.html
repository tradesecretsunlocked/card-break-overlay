<!DOCTYPE html>
<html lang="en">
<!--
  This overlay reuses much of the logic from the original LuxCards box break demo
  but adapts the colour palette and branding for the Nation of Cards (NOC) brand.

  Key differences from the original overlay:
    • Uses NOC brand colours (deep blue, royal blue, crimson red) on the
      container, header and controls.
    • Displays the Nation of Cards logo in the centre of the control bar.
    • Introduces a select dropdown to switch between the available break
      configurations (NBA, NFL, MLB). The changeBreakType() function
      automatically updates the grid and stats when the user selects a
      different sport.
    • Splits the grid into two halves separated by a subtle divider to
      highlight conferences or leagues. For example, NFL teams are divided
      into AFC and NFC; NBA and MLB teams are divided evenly between east
      and west or national and american leagues. The number of teams on
      each side is calculated automatically from the break configuration.

  This file is fully self‑contained and can be loaded directly in a
  browser or embedded into OBS as a browser source. The styling
  intentionally remains close to the original LuxCards layout for
  familiarity while honouring the Nation of Cards look and feel.
-->
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=950, initial-scale=1.0" />
  <title>Nation of Cards – Box Break Overlay</title>
  <style>
    :root {
      /* Nation of Cards colour palette */
      --noc-bg: rgba(0, 0, 0, 0); /* transparent background outside the board */
      --noc-blue-dark: #061437;
      --noc-blue: #2247d3;
      --noc-blue-light: #869df5;
      --noc-red: #d63a3a;
      --noc-purple: #884cc4;
      --noc-offwhite: #f5faff;
    }
    body {
      margin: 0;
      background: var(--noc-bg);
      font-family: 'Arial Black', Arial, sans-serif;
      width: 100%;
      max-width: 950px;
      min-height: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 0;
      margin-inline: auto;
      box-sizing: border-box;
    }
    .container {
      width: 100%;
      max-width: 950px;
      min-height: 300px;
      max-height: 360px;
      border-radius: 18px;
      padding: 6px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow: visible;
      /* semi‑transparent dark background to distinguish the board from OBS */
      background: rgba(6, 20, 55, 0.85);
      border: 3px solid var(--noc-blue-light);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    }
    .header {
      background: linear-gradient(90deg, var(--noc-red) 0%, var(--noc-purple) 50%, var(--noc-blue) 100%);
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 18px;
      font-weight: 900;
      border-radius: 14px;
      padding: 2px 14px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header select {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      padding: 4px 8px;
      cursor: pointer;
    }
    .main-content {
      flex: 1;
      min-height: 0;
      background: linear-gradient(180deg, rgba(15, 38, 92, 0.96), rgba(6, 16, 45, 0.97));
      border-radius: 14px;
      border: 2px solid rgba(134, 158, 253, 0.45);
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
    }
    .teams-wrapper {
      display: grid;
      grid-template-columns: 1fr 1fr; /* left and right sides */
      gap: 6px;
      flex: 1;
      min-height: 0;
    }
    .teams-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(0, 1fr));
      gap: 4px;
      width: 100%;
      height: 100%;
    }
    .team {
      background: #0b1f45;
      border: 2px solid rgba(134, 158, 253, 0.85);
      border-radius: 9px;
      min-height: 0;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 14px rgba(0, 0, 0, 0.5);
      cursor: pointer;
    }
    .team img {
      width: 90%;
      height: 90%;
      object-fit: cover;
      border-radius: 7px;
    }
    .team.sold {
      border-color: var(--noc-red);
      filter: grayscale(0.4) brightness(0.8);
    }
    .team.sold::after {
      content: "✔";
      position: absolute;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.95);
      color: var(--noc-red);
      font-size: 32px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.42);
    }
    .control-bar {
      display: grid;
      grid-template-columns: 1fr 0.75fr 1.5fr 0.75fr 1fr;
      gap: 8px;
      background: linear-gradient(90deg, rgba(134, 158, 253, 0.95), rgba(93, 122, 243, 0.95));
      border-radius: 14px;
      padding: 2px 9px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      align-items: center;
      max-height: 54px;
      min-height: 52px;
      position: relative;
    }
    .btn {
      border: none;
      border-radius: 12px;
      font-weight: 900;
      font-size: 14px;
      letter-spacing: .5px;
      text-transform: uppercase;
      color: #fff;
      padding: 6px 0px;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25);
      background: linear-gradient(135deg, var(--noc-red), #e24d76);
    }
    .stat-box {
      background: #0f2455;
      border-radius: 12px;
      color: #fff;
      border: 2px solid rgba(255, 255, 255, 0.2);
      padding: 2px 4px;
      text-align: center;
      box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .stat-box .value {
      font-size: 20px;
      font-weight: 800;
    }
    .stat-box .label {
      font-size: 11px;
      letter-spacing: 1px;
      color: #d9ecff;
    }
    .brand-mark {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 2px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.9);
      border: 2px solid rgba(134, 158, 253, 0.45);
      box-shadow: inset 0 0 14px rgba(0, 0, 0, 0.45);
    }
    .brand-mark img {
      height: 60px;
      max-width: 140px;
    }
    .sold-list-container {
      width: 100%;
      max-width: 950px;
      margin: 4px auto 0;
      background: linear-gradient(90deg, #b1426c, #305cc9);
      border: 3px solid var(--noc-blue-light);
      border-radius: 14px;
      padding: 2px;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
      color: #fff;
      text-align: center;
    }
    .sold-list-title {
      font-size: 17px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 4px;
    }
    .sold-list-grid {
      display: grid;
      gap: 6px 18px;
    }
    .sold-row {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      padding: 3px 6px;
      overflow-x: hidden;
    }
    .sold-team-img {
      width: 22px;
      height: 22px;
      border-radius: 4px;
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }
    .sold-team-name {
      color: #fff;
      font-size: 13px;
      text-transform: capitalize;
    }
    .sold-buyer-input {
      flex: 1;
      border: none;
      border-radius: 8px;
      padding: 3px 5px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header with sport name and drop‑down menu -->
    <div class="header">
      <span id="headerText">NBA Box Break</span>
      <select id="breakSelect" onchange="changeBreakTypeSelect(this.value)">
        <option value="nba">NBA</option>
        <option value="nfl">NFL</option>
        <option value="mlb">MLB</option>
      </select>
    </div>
    <div class="main-content">
      <div class="teams-wrapper">
        <div class="teams-grid" id="teamsGridLeft"></div>
        <div class="teams-grid" id="teamsGridRight"></div>
      </div>
      <div class="control-bar">
        <button class="btn" onclick="resetAll()">Reset Break</button>
        <div class="stat-box">
          <div class="value" id="teamsLeft">30</div>
          <div class="label">Left</div>
        </div>
        <div class="brand-mark">
          <!-- Use the transparent logo so it blends into any background -->
          <img src="../Nation of Cards Logo Transparent.png" alt="Nation of Cards" />
        </div>
        <div class="stat-box">
          <div class="value" id="teamsSold">0</div>
          <div class="label">Sold</div>
        </div>
        <button class="btn" onclick="changeBreakType()">Next Sport</button>
      </div>
    </div>
  </div>
  <div class="sold-list-container">
    <div class="sold-list-title">Sold Teams</div>
    <div id="soldList" class="sold-list-grid"></div>
  </div>
  <script>
    // Base path determination (copied from original file) – ensures images load
    const BASE = (() => {
      const { hostname } = window.location;
      if (hostname.endsWith('github.io')) {
        const parts = location.pathname.split('/').filter(Boolean);
        const repo = parts.length ? parts[0] : '';
        return `/${repo}/`;
      }
      return '../../';
    })();
    const imgPath = (f) => `${BASE}images/nba/${f}`;
    const imgPathNFL = (f) => `${BASE}images/nfl/${f}`;
    const imgPathMLB = (f) => `${BASE}images/mlb/${f}`;
    const imgPathLogo = (f) => `${BASE}images/logos/${f}`;

    // Configuration for each break type. Each entry lists the teams and defines
    // how to split them evenly between left and right sides.
    const breakTypes = {
      nba: {
        name: 'NBA',
        teams: [
          { code: 'ATL', name: 'hawks', image: imgPath('hawks.png') },
          { code: 'BOS', name: 'celtics', image: imgPath('celtics.png') },
          { code: 'BKN', name: 'nets', image: imgPath('nets.png') },
          { code: 'CHA', name: 'hornets', image: imgPath('hornets.png') },
          { code: 'CHI', name: 'bulls', image: imgPath('bulls.png') },
          { code: 'CLE', name: 'cavaliers', image: imgPath('cavaliers.png') },
          { code: 'DAL', name: 'mavericks', image: imgPath('mavericks.png') },
          { code: 'DEN', name: 'nuggets', image: imgPath('nuggets.png') },
          { code: 'DET', name: 'pistons', image: imgPath('pistons.png') },
          { code: 'GSW', name: 'warriors', image: imgPath('warriors.png') },
          { code: 'HOU', name: 'rockets', image: imgPath('rockets.png') },
          { code: 'IND', name: 'pacers', image: imgPath('pacers.png') },
          { code: 'LAC', name: 'clippers', image: imgPath('clippers.png') },
          { code: 'LAL', name: 'lakers', image: imgPath('lakers.png') },
          { code: 'MEM', name: 'grizzlies', image: imgPath('grizzlies.png') },
          { code: 'MIA', name: 'heat', image: imgPath('heat.png') },
          { code: 'MIL', name: 'bucks', image: imgPath('bucks.png') },
          { code: 'MIN', name: 'timberwolves', image: imgPath('timberwolves.png') },
          { code: 'NOP', name: 'pelicans', image: imgPath('pelicans.png') },
          { code: 'NYK', name: 'knicks', image: imgPath('knicks.png') },
          { code: 'OKC', name: 'thunder', image: imgPath('thunder.png') },
          { code: 'ORL', name: 'magic', image: imgPath('magic.png') },
          { code: 'PHI', name: '76ers', image: imgPath('76ers.png') },
          { code: 'PHX', name: 'suns', image: imgPath('suns.png') },
          { code: 'POR', name: 'blazers', image: imgPath('blazers.png') },
          { code: 'SAC', name: 'kings', image: imgPath('kings.png') },
          { code: 'SAS', name: 'spurs', image: imgPath('spurs.png') },
          { code: 'TOR', name: 'raptors', image: imgPath('raptors.png') },
          { code: 'UTA', name: 'jazz', image: imgPath('jazz.png') },
          { code: 'WAS', name: 'wizards', image: imgPath('wizards.png') }
        ],
      },
      nfl: {
        name: 'NFL',
        teams: [
          { code: 'ARI', name: 'cardinals',  image: imgPathNFL('cardinals.png') },
          { code: 'ATL', name: 'falcons',    image: imgPathNFL('falcons.png') },
          { code: 'BAL', name: 'ravens',     image: imgPathNFL('ravens.png') },
          { code: 'BUF', name: 'bills',      image: imgPathNFL('bills.png') },
          { code: 'CAR', name: 'panthers',   image: imgPathNFL('panthers.png') },
          { code: 'CHI', name: 'bears',      image: imgPathNFL('bears.png') },
          { code: 'CIN', name: 'bengals',    image: imgPathNFL('bengals.png') },
          { code: 'CLE', name: 'browns',     image: imgPathNFL('browns.png') },
          { code: 'DAL', name: 'cowboys',    image: imgPathNFL('cowboys.png') },
          { code: 'DEN', name: 'broncos',    image: imgPathNFL('broncos.png') },
          { code: 'DET', name: 'lions',      image: imgPathNFL('lions.png') },
          { code: 'GB',  name: 'packers',    image: imgPathNFL('packers.png') },
          { code: 'HOU', name: 'texans',     image: imgPathNFL('texans.png') },
          { code: 'IND', name: 'colts',      image: imgPathNFL('colts.png') },
          { code: 'JAX', name: 'jaguars',    image: imgPathNFL('jaguars.png') },
          { code: 'KC',  name: 'chiefs',     image: imgPathNFL('chiefs.png') },
          { code: 'LV',  name: 'raiders',    image: imgPathNFL('raiders.png') },
          { code: 'LAC', name: 'chargers',   image: imgPathNFL('chargers.png') },
          { code: 'LAR', name: 'rams',       image: imgPathNFL('rams.png') },
          { code: 'MIA', name: 'dolphins',   image: imgPathNFL('dolphins.png') },
          { code: 'MIN', name: 'vikings',    image: imgPathNFL('vikings.png') },
          { code: 'NE',  name: 'patriots',   image: imgPathNFL('patriots.png') },
          { code: 'NO',  name: 'saints',     image: imgPathNFL('saints.png') },
          { code: 'NYG', name: 'giants',     image: imgPathNFL('giants.png') },
          { code: 'NYJ', name: 'jets',       image: imgPathNFL('jets.png') },
          { code: 'PHI', name: 'eagles',     image: imgPathNFL('eagles.png') },
          { code: 'PIT', name: 'steelers',   image: imgPathNFL('steelers.png') },
          { code: 'SF',  name: '49ers',      image: imgPathNFL('49ers.png') },
          { code: 'SEA', name: 'seahawks',   image: imgPathNFL('seahawks.png') },
          { code: 'TB',  name: 'buccaneers', image: imgPathNFL('buccaneers.png') },
          { code: 'TEN', name: 'titans',     image: imgPathNFL('titans.png') },
          { code: 'WAS', name: 'commanders', image: imgPathNFL('commanders.png') }
        ],
      },
      mlb: {
        name: 'MLB',
        teams: [
          { code: 'ARI', name: 'diamondbacks', image: imgPathMLB('diamondbacks.png') },
          { code: 'ATL', name: 'braves',        image: imgPathMLB('braves.png') },
          { code: 'BAL', name: 'orioles',       image: imgPathMLB('orioles.png') },
          { code: 'BOS', name: 'redsox',        image: imgPathMLB('redsox.png') },
          { code: 'CHC', name: 'cubs',          image: imgPathMLB('cubs.png') },
          { code: 'CWS', name: 'whitesox',      image: imgPathMLB('whitesox.png') },
          { code: 'CIN', name: 'reds',          image: imgPathMLB('reds.png') },
          { code: 'CLE', name: 'guardians',     image: imgPathMLB('guardians.png') },
          { code: 'COL', name: 'rockies',       image: imgPathMLB('rockies.png') },
          { code: 'DET', name: 'tigers',        image: imgPathMLB('tigers.png') },
          { code: 'HOU', name: 'astros',        image: imgPathMLB('astros.png') },
          { code: 'KC',  name: 'royals',        image: imgPathMLB('royals.png') },
          { code: 'LAA', name: 'angels',        image: imgPathMLB('angels.png') },
          { code: 'LAD', name: 'dodgers',       image: imgPathMLB('dodgers.png') },
          { code: 'MIA', name: 'marlins',       image: imgPathMLB('marlins.png') },
          { code: 'MIL', name: 'brewers',       image: imgPathMLB('brewers.png') },
          { code: 'MIN', name: 'twins',         image: imgPathMLB('twins.png') },
          { code: 'NYM', name: 'mets',          image: imgPathMLB('mets.png') },
          { code: 'NYY', name: 'yankees',       image: imgPathMLB('yankees.png') },
          { code: 'OAK', name: 'athletics',     image: imgPathMLB('athletics.png') },
          { code: 'PHI', name: 'phillies',      image: imgPathMLB('phillies.png') },
          { code: 'PIT', name: 'pirates',       image: imgPathMLB('pirates.png') },
          { code: 'SD',  name: 'padres',        image: imgPathMLB('padres.png') },
          { code: 'SF',  name: 'giants',        image: imgPathMLB('giants.png') },
          { code: 'SEA', name: 'mariners',      image: imgPathMLB('mariners.png') },
          { code: 'STL', name: 'cardinals',     image: imgPathMLB('cardinals.png') },
          { code: 'TB',  name: 'rays',          image: imgPathMLB('rays.png') },
          { code: 'TEX', name: 'rangers',       image: imgPathMLB('rangers.png') },
          { code: 'TOR', name: 'bluejays',      image: imgPathMLB('bluejays.png') },
          { code: 'WAS', name: 'nationals',     image: imgPathMLB('nationals.png') }
        ],
      }
    };

    let currentBreakType = 'nba';
    let soldTeams = new Set();
    let soldTeamsList = [];

    function initializeGrids() {
      const leftGrid = document.getElementById('teamsGridLeft');
      const rightGrid = document.getElementById('teamsGridRight');
      const { teams } = breakTypes[currentBreakType];
      leftGrid.innerHTML = '';
      rightGrid.innerHTML = '';
      soldTeams.clear();
      soldTeamsList = [];
      // Split teams evenly between left and right groups
      const half = Math.ceil(teams.length / 2);
      const leftTeams = teams.slice(0, half);
      const rightTeams = teams.slice(half);
      // Determine column counts for each half: evenly distribute up to 4 columns
      const colsLeft = Math.ceil(Math.sqrt(leftTeams.length));
      const colsRight = Math.ceil(Math.sqrt(rightTeams.length));
      leftGrid.style.gridTemplateColumns = `repeat(${colsLeft}, 1fr)`;
      rightGrid.style.gridTemplateColumns = `repeat(${colsRight}, 1fr)`;
      leftTeams.forEach((team, index) => {
        const div = createTeamDiv(team, index);
        leftGrid.appendChild(div);
      });
      rightTeams.forEach((team, index) => {
        const div = createTeamDiv(team, half + index);
        rightGrid.appendChild(div);
      });
      updateHeader();
      updateStats();
      updateSoldList();
    }

    function createTeamDiv(team, index) {
      const teamDiv = document.createElement('div');
      teamDiv.className = 'team';
      teamDiv.dataset.teamIndex = index;
      teamDiv.onclick = () => toggleTeam(index);
      if (team && team.image) {
        const img = document.createElement('img');
        img.src = team.image;
        img.alt = team.name;
        img.onerror = () => {
          teamDiv.innerHTML = team.code;
          teamDiv.classList.add('text-only');
        };
        teamDiv.appendChild(img);
      } else {
        teamDiv.textContent = team.code;
        teamDiv.classList.add('text-only');
      }
      return teamDiv;
    }

    function toggleTeam(index) {
      const teamDiv = document.querySelector(`[data-team-index="${index}"]`);
      const listIndex = soldTeamsList.findIndex(e => e.index === index);
      if (soldTeams.has(index)) {
        soldTeams.delete(index);
        teamDiv.classList.remove('sold');
        if (listIndex !== -1) soldTeamsList.splice(listIndex, 1);
      } else {
        soldTeams.add(index);
        teamDiv.classList.add('sold');
        if (listIndex === -1) soldTeamsList.push({ index, buyer: '' });
      }
      updateStats();
      updateSoldList();
    }

    function updateStats() {
      const { teams } = breakTypes[currentBreakType];
      const totalTeams = teams.length;
      const soldCount = soldTeams.size;
      const teamsLeft = totalTeams - soldCount;
      document.getElementById('teamsLeft').textContent = teamsLeft;
      document.getElementById('teamsSold').textContent = soldCount;
      // update labels depending on break type
      const leftLabel = document.querySelectorAll('.stat-box .label')[0];
      leftLabel.textContent = 'Left';
    }

    function updateHeader() {
      const { name } = breakTypes[currentBreakType];
      document.getElementById('headerText').textContent = `${name} Box Break`;
    }

    function resetAll() {
      soldTeams.clear();
      soldTeamsList = [];
      document.querySelectorAll('.team').forEach(team => team.classList.remove('sold'));
      updateStats();
      updateSoldList();
    }

    function changeBreakType() {
      const types = Object.keys(breakTypes);
      currentBreakType = types[(types.indexOf(currentBreakType) + 1) % types.length];
      document.getElementById('breakSelect').value = currentBreakType;
      initializeGrids();
    }
    function changeBreakTypeSelect(value) {
      currentBreakType = value;
      initializeGrids();
    }
    function updateSoldList() {
      const soldListDiv = document.getElementById('soldList');
      soldListDiv.innerHTML = '';
      const { teams } = breakTypes[currentBreakType];
      soldTeamsList.forEach(entry => {
        const team = teams[entry.index];
        const row = document.createElement('div');
        row.className = 'sold-row';
        if (team.image) {
          const img = document.createElement('img');
          img.src = team.image;
          img.className = 'sold-team-img';
          row.appendChild(img);
        }
        const name = document.createElement('span');
        name.className = 'sold-team-name';
        name.textContent = team.name || team.code;
        row.appendChild(name);
        const input = document.createElement('input');
        input.className = 'sold-buyer-input';
        input.type = 'text';
        input.placeholder = 'Buyer name';
        input.value = entry.buyer || '';
        input.oninput = (e) => { entry.buyer = e.target.value; };
        row.appendChild(input);
        soldListDiv.appendChild(row);
      });
      // Determine columns for sold list based on break type: 2 or 3 columns
      const soldCols = currentBreakType === 'mlb' ? 3 : 3;
      soldListDiv.style.gridTemplateColumns = `repeat(${soldCols}, 1fr)`;
    }
    // Initialize the grids once DOM is ready
    window.addEventListener('DOMContentLoaded', initializeGrids);
  </script>
</body>
</html>
