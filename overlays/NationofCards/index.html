<!DOCTYPE html>
<html lang="en">
<!--
  Nation of Cards – Multi‑sport Break Overlay

  This overlay is designed to mirror the look shown in the screenshot provided.
  Teams are divided by conference and division (e.g. AFC/NFC in NFL) with
  a vertical control bar separating the left and right sides.  The control
  bar contains buttons to reset and cycle the sport, counters for sold and
  remaining teams, and the Nation of Cards logo.  A scrolling ticker
  displays the slogan at the bottom.  A scoreboard area sits beneath the
  team grids and can be populated via the breakTypes configuration in the
  script.

  All assets (team logos and the NOC logo) should be placed in an
  `images` directory relative to this file following the same folder
  structure used by the existing TSU overlays (e.g. `images/nfl/bills.png`).
-->
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nation of Cards – Break Overlay</title>
  <!-- Import the Bungee Shade font for the brand mark -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    :root {
      /* Colour palette pulled from the provided logo */
      --primary-color: #000041; /* dark navy */
      --secondary-color: #8d0100; /* rich crimson */
      --text-color: #ffffff; /* white */
      --border-color: rgba(255, 255, 255, 0.45);
      --team-cols: 5;
      --team-height: 45px;
       --teams-h: 350px;


    }

    * {

    }

    body {
  margin: 0;
  padding: 0;
  width: 100%;
  max-width: 1080px;
  min-height: 600px;
  margin-inline: auto;
  font-family: Arial, sans-serif;
  color: var(--text-color);

  /* change this */
  background: #000; /* solid */

  display: flex;
  flex-direction: column;
  align-items: center;
  user-select: none;
}

    /* Outer container with gradient background and border */
.overlay-container {
    width: 100%;
  height: 100%;
  max-width:1080px;
  max-height: 750px; /* or whatever your OBS scene height is */
  overflow: hidden;
  

  /* change this */
  background: linear-gradient(180deg, #061437, #000014); /* solid */

  border: 4px solid var(--secondary-color);
  border-radius: 16px;
  padding: 8px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
  display: flex;
  flex-direction: column;
  gap: 8px;
}

    /* Header with brand and sport selector */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(90deg, var(--secondary-color), var(--primary-color));
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 4px 8px;

      letter-spacing: 1px;
    }

    .header .brand {

      flex-direction: column;
    }

    .brand-title {

      font-size: 26px;
      line-height: 1;
      margin-bottom: 2px;
      text-transform: uppercase;
    }

    .brand-slogan {

      color: var(--text-color);
      border: 1px solid var(--border-color);

/* Header Text button: matches pill controls but slightly beefier */
.header-text-btn{

}

/* Optional: keep it aligned nicely in the control panel row */

    /* Main section containing team grids and scoreboard */
  .main {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;

  width: 100%;
  min-height: 0;       /* KEY: lets the grid use its fixed height */
}


    /* Teams section splits into left conference, control bar, right conference */
.teams-section {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 12px;

 height: var(--teams-h);       /* KEY: real height so children can scroll */
  min-height: 0;       /* KEY: allows overflow children to shrink */

  align-items: stretch;
  background: linear-gradient(82deg, #7a1e13d6, #ffffff47, #03013f);
}


 .conference {
  display: flex;
  flex-direction: column;
  
  border: 2px solid var(--border-color);
  border-radius: 12px;
  padding: 4px;
  background: rgba(0, 0, 30, 0.6);
min-width:450px;
  max-height: 100%;
  min-height: 0;          /* IMPORTANT: allows inner scrolling in flex/grid */
  overflow-y: auto;       /* scroll vertically */
  overflow-x: hidden;     /* no sideways nonsense */
  flex-wrap: nowrap;      /* DO NOT wrap into extra columns */
}


    .conference-title {
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 4px;
      text-transform: uppercase;
      border-bottom: 1px solid var(--border-color);
    }

    

    .division-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-color);
      margin: 2px 0;
      text-transform: uppercase;
    }

.division-teams {
  display: grid;
  grid-template-columns: repeat(var(--team-cols), 1fr);
  gap: 4px;
}





    .team {
      position: relative;
      z-index: 1;
      background: var(--primary-color);
 
      border-radius: 8px;
      height: var(--team-height);
      flex:1 1 0; /* equal width, never shrink below 0 */
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.2s;
    
  border: 2px solid rgba(255,255,255,0.25);

  transition:
    transform 0.18s ease,
    box-shadow 0.18s ease;
}

.team .sold-x {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 46px;
  font-weight: 900;
  line-height: 1;

  color: #ff1f1f;
  text-shadow:
    0 0 6px rgba(255,31,31,0.9),
    0 0 14px rgba(255,31,31,0.7),
    0 4px 12px rgba(0,0,0,0.8);

  z-index: 20;
  pointer-events: none;

  opacity: 0;
  transform: scale(0.9);
  transition: opacity 0.15s ease, transform 0.15s ease;
}

.team.sold .sold-x {
  opacity: 1;
  transform: scale(1);
}


.team:hover {
  transform: translateY(-2px) scale(1.015);
  box-shadow: 0 6px 16px rgba(0,0,0,0.45);
   animation: wiggle 0.32s ease;
}

.team::before {
  content: '';
  position: absolute;
  inset: -12px;
  border-radius: 12px;

  background: radial-gradient(
    circle,
    rgba(255,255,255,0.9) 0%,
    rgba(255,255,255,0.45) 35%,
    rgba(255,255,255,0.15) 55%,
    transparent 70%
  );

  filter: blur(18px);
  opacity: 0.6;

  z-index: -1;
  animation: tile-glow-pulse 3.2s ease-in-out infinite;
  pointer-events: none;
}



@keyframes tile-glow-pulse {
  0% {
    opacity: 0.25;
    transform: scale(0.9);
  }
  50% {
    opacity: 0.85;
    transform: scale(0.50);
  }
  100% {
    opacity: 0.25;
    transform: scale(0.9);
  }
}



@keyframes logo-breathe {
  0% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.08);
  }
  100% {
    transform: scale(1);
  }
}



.team.sold::before {
  opacity: 0.15;
  animation: none;
}

.team::after {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: inherit;
  padding: 2px;

  background: conic-gradient(
    from 0deg,
    transparent,
    rgba(255,255,255,0.35),
    transparent 10%
  );

  mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
  mask-composite: exclude;

  pointer-events: none;
  animation: border-spin 7.5s linear infinite;
  opacity: 0.45;
}

@keyframes border-spin {
  to {
    transform: rotate(360deg);
  }
}

.sse-status{

  function getQueryParam(name) {
  return new URLSearchParams(window.location.search).get(name);
}

function isAdminMode(){
  const v = (getQueryParam('admin') || '').toLowerCase();
  return v === '1' || v === 'true' || v === 'yes' || v === 'on';
}

function applyAdminVisibility(){
  const show = isAdminMode();
  const btn = document.getElementById('mockBtn');
  if (btn) btn.style.display = show ? 'inline-flex' : 'none';
}


function applyNilText(){
  const el = document.getElementById('nilTextInput');
  const raw = el ? el.value : '';
  const lines = raw.split('\n').map(l => l.trim()).filter(Boolean);

  const entries = lines.map((name, i) => ({
    name,
    code: makeCodeFromName(name, i),
    image: ''
  }));

  setNilEntries(entries);
  closeNilModal();
}


function importNilCsv(){
  const file = document.getElementById('nilCsvInput').files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = e => {
    const lines = e.target.result.split('\n');
    const entries = lines
      .map(l => l.split(',')[0]?.trim())
      .filter(Boolean)
      .map((name, i) => ({ name, code: makeCodeFromName(name, i) }));

    setNilEntries(entries);
    closeNilModal();
  };
  reader.readAsText(file);
}

// ===============================
// SSE Bridge (supports /stream AND legacy /events?key=...)
// ===============================
let sse = null;

// Read from URL first, then localStorage fallback (so OBS can reload cleanly)
const BRIDGE_URL = (() => {
  const q = new URLSearchParams(location.search).get('bridge');
  if (q) {
    const cleaned = q.replace(/\/$/, '');
    localStorage.setItem('noc.bridge', cleaned);
    return cleaned;
  }
  const saved = localStorage.getItem('noc.bridge');
  return saved ? saved.replace(/\/$/, '') : "";
})();

const BRIDGE_KEY = (() => {
  const q = new URLSearchParams(location.search).get('key');
  if (q) {
    localStorage.setItem('noc.key', q);
    return q;
  }
  return localStorage.getItem('noc.key') || "";
})();

// Reconnect loop like your working overlay
function connectSSE(url){
  if (sse) { try { sse.close(); } catch(_){} }
  setSSEStatus('error', 'connecting');

  try{
    sse = new EventSource(url);

    sse.onopen = () => {
      console.log('[SSE] open');
      setSSEStatus('connected', 'connected');
    };

    sse.onmessage = (e) => {
      try{
        const data = JSON.parse(e.data);
        console.log('[SSE] message', data);
        handleSSEEvent(data);
      }catch(err){
        console.warn('[SSE] bad payload', e.data);
      }
    };

    sse.onerror = (err) => {
      console.warn('[SSE] error', err);
      setSSEStatus('error', 'reconnecting');
      try { sse.close(); } catch(_) {}
      sse = null;
      setTimeout(() => connectSSE(url), 2500);
    };
  }catch(e){
    console.warn('[SSE] failed to create EventSource', e);
    setSSEStatus('error', 'failed');
  }
}

function normalizeBridge(u){
  return String(u||'')
    .trim()
    .replace(/\/$/, '')
    .replace(/\/(events|stream)(\/.*)?$/,''); // strips accidental /events or /stream
}

function initSSE(){
  if (!BRIDGE_URL){
    setSSEStatus('error', 'missing bridge');
    return;
  }

  const base = normalizeBridge(BRIDGE_URL);
  const url = `${base}/stream`;

  console.log('[SSE] connecting:', url);
  connectSSE(url);
}

/* ===== NIL TEXT AUTOFIT ===== */
function fitTextToTile(el, opts = {}) {
  if (!el) return;

  const max = opts.max ?? 18;
  const min = opts.min ?? 10;
  const step = opts.step ?? 1;

  // Reset then shrink until it fits both width and height
  let size = max;
  el.style.fontSize = size + "px";

  // Force layout read
  const fits = () => (el.scrollWidth <= el.clientWidth) && (el.scrollHeight <= el.clientHeight);

  while (size > min && !fits()) {
    size -= step;
    el.style.fontSize = size + "px";
  }
}

function fitAllNilTiles() {
  if (currentBreakType !== "nil") return;
  requestAnimationFrame(() => {
    document.querySelectorAll(".team-label").forEach((el) => {
      fitTextToTile(el, { max: 18, min: 10, step: 1 });
    });
  });
}

// CSV handler (first column = name; skips header if it smells like one)
function parseNilCsv(text){
  const rows = text.split(/\r?\n/).map(r => r.trim()).filter(Boolean);
  if (!rows.length) return [];

  // If header row contains "name" or "item" assume it's a header
  const first = rows[0].toLowerCase();
  const startIndex = (first.includes('name') || first.includes('item')) ? 1 : 0;

  const names = rows.slice(startIndex)
    .map(r => r.split(',')[0]?.trim())
    .filter(Boolean);

  return names.map((name, i) => ({
    name,
    code: makeCodeFromName(name, i),
    image: ''
  }));
}

const NIL_STORE_KEY = 'noc.nil.entries';

function loadNilEntries(){
  try{
    const raw = localStorage.getItem(NIL_STORE_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  }catch{
    return [];
  }
}

function saveNilEntries(entries){
  localStorage.setItem(NIL_STORE_KEY, JSON.stringify(entries || []));
}

function makeCodeFromName(name, idx){
  const cleaned = (name || '').toUpperCase().replace(/[^A-Z0-9]+/g,'').slice(0,8);
  const n = String(idx+1).padStart(3,'0');
  return cleaned ? `${cleaned}${n}` : `NIL${n}`;
}

function buildNilBreakTypeFromEntries(entries){
  const safe = (entries || []).filter(e => e && (e.name || '').trim().length);

  const mid = Math.ceil(safe.length / 2);
  const left = safe.slice(0, mid);
  const right = safe.slice(mid);

  const leftTeams = left.map((e, i) => ({
    code: e.code || makeCodeFromName(e.name, i),
    name: e.name,
    image: e.image || ''
  }));

  const rightTeams = right.map((e, i) => ({
    code: e.code || makeCodeFromName(e.name, mid + i),
    name: e.name,
    image: e.image || ''
  }));

  return {
    name: 'NIL',
    conferences: ['Left', 'Right'],          // ✅ must be real keys
    divisions: {
      Left: { Spots: leftTeams },
      Right: { Spots: rightTeams }
    },
    scoreboard: []
  };
}

    function handleSSEEvent(data) {
  switch (data.type) {

    case 'team_sold':
      if (data.sport && data.sport !== currentBreakType) return;
      sseMarkSold(data.code, data.buyer);
      break;

    case 'team_unsold':
      sseMarkUnsold(data.code);
      break;

    case 'buyer_update':
      sseUpdateBuyer(data.code, data.buyer);
      break;

    case 'reset':
      resetAll();
      break;

    case 'set_break':
      const out = document.getElementById('breakIdDisplay');
      if (out) out.textContent = data.value || '—';
      break;

    case 'set_sport':
      setBreakType(data.sport);
      break;
  }
}

function sseMarkSold(code, buyer = '') {
  if (soldTeams.has(code)) return;

  soldTeams.add(code);
  soldTeamsList.push({ code, buyer });

  const tile = document.querySelector(`[data-team-code="${code}"]`);
  if (tile) tile.classList.add('sold');

  updateStats();
  renderSoldPanel();
}

document.addEventListener('change', (e) => {
  if (e.target && e.target.id === 'nilCsvInput') {
    const file = e.target.files && e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (ev) => {
      const text = String(ev.target.result || '');
      const entries = parseNilCsv(text);
      setNilEntries(entries);
      closeNilModal();
    };
    reader.readAsText(file);
  }
});


function sseMarkUnsold(code) {
  soldTeams.delete(code);
  soldTeamsList = soldTeamsList.filter(t => t.code !== code);

  const tile = document.querySelector(`[data-team-code="${code}"]`);
  if (tile) tile.classList.remove('sold');

  updateStats();
  renderSoldPanel();
}

function sseUpdateBuyer(code, buyer) {
  const entry = soldTeamsList.find(t => t.code === code);
  if (entry) entry.buyer = buyer;
  renderSoldPanel();
}
