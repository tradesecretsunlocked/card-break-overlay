<!DOCTYPE html>
<html lang="en">
<!--
  Nation of Cards – Multi‑sport Break Overlay

  This overlay is designed to mirror the look shown in the screenshot provided.
  Teams are divided by conference and division (e.g. AFC/NFC in NFL) with
  a vertical control bar separating the left and right sides.  The control
  bar contains buttons to reset and cycle the sport, counters for sold and
  remaining teams, and the Nation of Cards logo.  A scrolling ticker
  displays the slogan at the bottom.  A scoreboard area sits beneath the
  team grids and can be populated via the breakTypes configuration in the
  script.

  All assets (team logos and the NOC logo) should be placed in an
  `images` directory relative to this file following the same folder
  structure used by the existing TSU overlays (e.g. `images/nfl/bills.png`).
-->
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nation of Cards – Break Overlay</title>
  <!-- Import the Bungee Shade font for the brand mark -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bungee+Shade&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* Colour palette pulled from the provided logo */
      --primary-color: #000041; /* dark navy */
      --secondary-color: #8d0100; /* rich crimson */
      --text-color: #ffffff; /* white */
      --border-color: rgba(255, 255, 255, 0.45);
      --team-cols: 5;
      --team-height: 45px;
      


    }

    * {
      box-sizing: border-box;
    }

    body {
  margin: 0;
  padding: 0;
  width: 100%;
  
  min-height: 600px;
  margin-inline: auto;
  font-family: Arial, sans-serif;
  color: var(--text-color);

  /* change this */
  background: #000; /* solid */

  display: flex;
  flex-direction: column;
  align-items: center;
  user-select: none;
}

    /* Outer container with gradient background and border */
.overlay-container {
  width: 100%;
  

  /* change this */
  background: linear-gradient(180deg, #061437, #000014); /* solid */

  border: 4px solid var(--secondary-color);
  border-radius: 16px;
  padding: 8px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
  display: flex;
  flex-direction: column;
  gap: 8px;
}

    /* Header with brand and sport selector */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(90deg, var(--secondary-color), var(--primary-color));
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 4px 8px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .header .brand {
      display: flex;
      flex-direction: column;
    }

    .brand-title {
      font-family: 'Bungee Shade', sans-serif;
      font-size: 26px;
      line-height: 1;
      margin-bottom: 2px;
      text-transform: uppercase;
    }

    .brand-slogan {
      font-size: 12px;
      font-weight: 600;
      margin-top: 2px;
      margin-bottom: -7px;
      opacity: 0.99;
    }

    .sport-select {
      background: var(--primary-color);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 4px 8px;
      font-weight: 600;
      cursor: pointer;
    }

    .header-right{
  display:flex;
  align-items:center;
  gap: 10px;
}

.break-id-box{
  display:flex;
  align-items:center;
  gap: 8px;
  padding: 6px 10px;
  border-radius: 10px;
  background: #000014;
  border: 2px solid var(--border-color);
  box-shadow: inset 0 0 10px rgba(255,255,255,0.04);
}

.break-id-label{
  font-size: 14px;
  opacity: 0.8;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.break-id-value{
  font-size: 16px;
  font-weight: 900;
  letter-spacing: 0.5px;
}


    /* Main section containing team grids and scoreboard */
    .main {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* Teams section splits into left conference, control bar, right conference */
    .teams-section {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 12px;
     align-items: stretch;
     background:linear-gradient(
82deg, #7a1e13d6, #ffffff47, #03013f);
    }

    .conference {
      display: flex;
      flex-direction: column;
      gap: 2px;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 4px;
      background: rgba(0, 0, 30, 0.6);
      max-height: 100%;
      overflow: visible;
      
    }

    .conference-title {
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 4px;
      text-transform: uppercase;
      border-bottom: 1px solid var(--border-color);
    }

    .division {
      
    }

    .division-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-color);
      margin: 2px 0;
      text-transform: uppercase;
    }

.division-teams {
  display: grid;
  grid-template-columns: repeat(var(--team-cols), 1fr);
  gap: 4px;
}





    .team {
      position: relative;
      z-index: 1;
      background: var(--primary-color);
 
      border-radius: 8px;
      height: var(--team-height);
      flex:1 1 0; /* equal width, never shrink below 0 */
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: visible;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.2s;
    
  border: 2px solid rgba(255,255,255,0.25);

  transition:
    transform 0.18s ease,
    box-shadow 0.18s ease;
}

.team .sold-x {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 46px;
  font-weight: 900;
  line-height: 1;

  color: #ff1f1f;
  text-shadow:
    0 0 6px rgba(255,31,31,0.9),
    0 0 14px rgba(255,31,31,0.7),
    0 4px 12px rgba(0,0,0,0.8);

  z-index: 20;
  pointer-events: none;

  opacity: 0;
  transform: scale(0.9);
  transition: opacity 0.15s ease, transform 0.15s ease;
}

.team.sold .sold-x {
  opacity: 1;
  transform: scale(1);
}


.team:hover {
  transform: translateY(-2px) scale(1.015);
  box-shadow: 0 6px 16px rgba(0,0,0,0.45);
   animation: wiggle 0.32s ease;
}

.team::before {
  content: '';
  position: absolute;
  inset: -12px;
  border-radius: 12px;

  background: radial-gradient(
    circle,
    rgba(255,255,255,0.9) 0%,
    rgba(255,255,255,0.45) 35%,
    rgba(255,255,255,0.15) 55%,
    transparent 70%
  );

  filter: blur(18px);
  opacity: 0.6;

  z-index: -1;
  animation: tile-glow-pulse 3.2s ease-in-out infinite;
  pointer-events: none;
}



@keyframes tile-glow-pulse {
  0% {
    opacity: 0.25;
    transform: scale(0.9);
  }
  50% {
    opacity: 0.85;
    transform: scale(0.50);
  }
  100% {
    opacity: 0.25;
    transform: scale(0.9);
  }
}



@keyframes logo-breathe {
  0% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.08);
  }
  100% {
    transform: scale(1);
  }
}



.team.sold::before {
  opacity: 0.15;
  animation: none;
}

.team::after {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: inherit;
  padding: 2px;

  background: conic-gradient(
    from 0deg,
    transparent,
    rgba(255,255,255,0.35),
    transparent 10%
  );

  mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
  mask-composite: exclude;

  pointer-events: none;
  animation: border-spin 7.5s linear infinite;
  opacity: 0.45;
}

@keyframes border-spin {
  to {
    transform: rotate(360deg);
  }
}



/* NFL: most teams → smallest tiles */
.overlay-container.sport-nfl {
  --team-height: 55px;
}

/* NBA / MLB: medium density */
.overlay-container.sport-nba,
.overlay-container.sport-mlb {
  --team-height: 79px;
}

/* NHL: slightly taller, logos need air */
.overlay-container.sport-nhl {
  --team-height: 64px;
}

/* NIL: very few tiles → make them feel important */
.overlay-container.sport-nil {
  --team-height: 132px;
}


 

.team:hover::before {
  opacity: 1;
  animation: shimmer 0.6s ease forwards;
}




@keyframes wiggle {
  0% { transform: translateY(-2px) rotate(0deg); }
  25% { transform: translateY(-2px) rotate(0.6deg); }
  50% { transform: translateY(-2px) rotate(-0.6deg); }
  100% { transform: translateY(-2px) rotate(0deg); }
}




/* NIL ONLY: force 2 rows per side (4 tiles total per side) */
.overlay-container.sport-nil .division-teams {

}

.overlay-container.sport-nil .division-teams .team {

  min-width: 90px;
     /* slightly taller so badges breathe */
}

  <script>

  // Dynamic base path for images
  const BASE = (() => {
    const isGhPages = location.hostname.endsWith('github.io');
    if (isGhPages) {
      const parts = location.pathname.split('/').filter(Boolean);
      const repo = parts.length ? parts[0] : '';
      return `/${repo}/`;
    }
    return '../..\/'; 
  }        )();
    
  function getQueryParam(name) {
  return new URLSearchParams(window.location.search).get(name);
}

let bridgeURL = getQueryParam('bridge');
const bridgeKey = getQueryParam('key');


    // Path helper functions for each sport
    const imgPathNFL = (f) => `${BASE}images/nfl/${f}`;
    const imgPathNBA = (f) => `${BASE}images/nba/${f}`;
    const imgPathMLB = (f) => `${BASE}images/mlb/${f}`;
    const imgPathNHL = (f) => `${BASE}images/nhl/${f}`;
    const imgPathNIL = (f) => `${BASE}images/nil/${f}`;

    /*
      breakTypes defines rosters and scoreboard entries for each sport.  Each
      entry contains:
        - name: display name
        - conferences: ordered list of conference names
        - divisions: object keyed by conference name, each containing an object
          keyed by division name with an array of team objects (code, name, image).
        - scoreboard: array of game objects (home, away, scores, period, time)
    */
    const breakTypes = {
      nfl: {
        name: 'NFL',
        conferences: ['AFC', 'NFC'],
        divisions: {
          AFC: {

function toggleSoldPanel() {
  soldPanelVisible = !soldPanelVisible;

  const panel = document.getElementById('soldPanel');
  const slot = document.getElementById('soldPanelSlot');
  if (!panel || !slot) return;

  slot.style.display = soldPanelVisible ? 'block' : 'none';
  panel.classList.toggle('hidden', !soldPanelVisible);

  const btn = document.querySelector('.sold-toggle-btn');
  if (btn) btn.classList.toggle('active', soldPanelVisible);
}






function renderSoldPanel() {
  const panel = document.getElementById('soldPanel');
  const slot = document.getElementById('soldPanelSlot');
  if (!panel || !slot) return;

  if (soldTeamsList.length === 0) {
    slot.style.display = 'none';
    return;
  }

  slot.style.display = 'block';
  panel.innerHTML = '';

  soldTeamsList.forEach(entry => {
    const teamDiv = document.querySelector(`[data-team-code="${entry.code}"]`);
    if (!teamDiv) return;

    const img = teamDiv.querySelector('img');
    const src = img ? img.src : '';

    const item = document.createElement('div');
    item.className = 'sold-item';

    if (src) {
      const logo = document.createElement('img');
      logo.src = src;
      item.appendChild(logo);
    }

    const buyerInput = document.createElement('input');
    buyerInput.className = 'buyer-input';
    buyerInput.type = 'text';
    buyerInput.placeholder = 'Buyer';
    buyerInput.value = entry.buyer || '';
    buyerInput.addEventListener('input', e => {
      entry.buyer = e.target.value;
    });

    item.appendChild(buyerInput);
    panel.appendChild(item);
  });

  if (soldPanelVisible) panel.classList.remove('hidden');

soldPanelVisible = true;
slot.style.display = 'block';
panel.classList.remove('hidden');


  
}



    // Build one conference column
    function buildConference(container, confName, divisions) {
      const title = document.createElement('div');
      title.className = 'conference-title';
      title.textContent = confName;
      container.appendChild(title);
      Object.keys(divisions).forEach(divName => {
        const divisionWrap = document.createElement('div');
        divisionWrap.className = 'division';
        const divTitle = document.createElement('div');
        divTitle.className = 'division-name';
        divTitle.textContent = divName;
        divisionWrap.appendChild(divTitle);
        const teamGrid = document.createElement('div');
        teamGrid.className = 'division-teams';
        divisions[divName].forEach(teamObj => {
          const teamDiv = document.createElement('div');
          teamDiv.className = 'team';
          teamDiv.dataset.teamCode = teamObj.code;
          teamDiv.onclick = () => toggleTeam(teamObj.code);
          const img = document.createElement('img');
          img.src = teamObj.image;
          img.alt = teamObj.name;

          img.onerror = () => {
            teamDiv.textContent = teamObj.code;
          };
          teamDiv.appendChild(img);

const soldX = document.createElement('div');
soldX.className = 'sold-x';
soldX.textContent = '✕';
teamDiv.appendChild(soldX);

teamGrid.appendChild(teamDiv);

        });
        divisionWrap.appendChild(teamGrid);
        container.appendChild(divisionWrap);
      });
    }

    // Toggle sold state
    function toggleTeam(code) {
      const sel = `[data-team-code="${code}"]`;
      const teamDiv = document.querySelector(sel);
      if (!teamDiv) return;
      const existingIndex = soldTeamsList.findIndex(entry => entry.code === code);
      if (soldTeams.has(code)) {
        soldTeams.delete(code);
        teamDiv.classList.remove('sold');
        if (existingIndex !== -1) soldTeamsList.splice(existingIndex, 1);
      } else {
        soldTeams.add(code);
        teamDiv.classList.add('sold');
        if (existingIndex === -1) soldTeamsList.push({ code: code, buyer: '' });
      }
      updateStats();
      renderSoldPanel();
    }

    // Update counters
    function updateStats() {
      const config = breakTypes[currentBreakType];
      let total = 0;
      config.conferences.forEach(conf => {
        Object.values(config.divisions[conf]).forEach(div => {
          total += div.length;
        });
      });
      const sold = soldTeams.size;
      document.getElementById('teamsLeft').textContent = total - sold;
      document.getElementById('teamsSold').textContent = sold;
    }

    function renderBreakTypeButtons() {

  types.forEach((t) => {
    const btn = document.createElement('button');
    btn.className = 'breaktype-btn' + (t === currentBreakType ? ' active' : '');
    btn.textContent = breakTypes[t].name; // NFL, NBA, etc
    btn.onclick = () => setBreakType(t);
    wrap.appendChild(btn);
  });
}

    function initSSE() {
  if (!bridgeURL || sse) return;

  const sseURL = `${bridgeURL.replace(/\/$/, '')}/events?key=${bridgeKey}`;

  sse = new EventSource(sseURL);

  sse.onmessage = (e) => {
    try {
      const data = JSON.parse(e.data);
      handleSSEEvent(data);
    } catch (err) {
      console.warn('Invalid SSE payload', e.data);
    }
  };

  sse.onerror = () => {
    console.warn('SSE connection lost');
  };
}

    function handleSSEEvent(data) {
  switch (data.type) {

    case 'team_sold':
      if (data.sport && data.sport !== currentBreakType) return;
      sseMarkSold(data.code, data.buyer);
      break;

    case 'team_unsold':
      sseMarkUnsold(data.code);
      break;

    case 'buyer_update':
      sseUpdateBuyer(data.code, data.buyer);
      break;

    case 'reset':
      resetAll();
      break;

    case 'set_break':
      const out = document.getElementById('breakIdDisplay');
      if (out) out.textContent = data.value || '—';
      break;

    case 'set_sport':
      setBreakType(data.sport);
      break;
  }
}

function sseMarkSold(code, buyer = '') {
  if (soldTeams.has(code)) return;

  soldTeams.add(code);
  soldTeamsList.push({ code, buyer });

  const tile = document.querySelector(`[data-team-code="${code}"]`);
  if (tile) tile.classList.add('sold');

  updateStats();
  renderSoldPanel();
}

function sseMarkUnsold(code) {
  soldTeams.delete(code);
  soldTeamsList = soldTeamsList.filter(t => t.code !== code);

  const tile = document.querySelector(`[data-team-code="${code}"]`);
  if (tile) tile.classList.remove('sold');

  updateStats();
  renderSoldPanel();
}

function sseUpdateBuyer(code, buyer) {
  const entry = soldTeamsList.find(t => t.code === code);
  if (entry) entry.buyer = buyer;
  renderSoldPanel();
}


   

  </script>
</body>
