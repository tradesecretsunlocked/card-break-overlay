<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080, initial-scale=1" />
<title>Bigger Than Cardboard — Neon Facecam Overlay</title>
<style>
  /* ============================================================
     BIGGER THAN CARDBOARD — Neon Facecam Overlay (electric pulse)
     1920x1080 canvas • centered cam box • transparent everywhere else
     Self-contained: real logo + banner embedded, no external assets.
     Reskin via --line / --line-hot / --primary at :root.
     ============================================================ */
  :root{
    --primary:#16233b;      /* BTC navy  */
    --secondary:#2568f0;    /* BTC blue  */
    --line:#3b82ff;         /* neon border line */
    --line-hot:#eaf3ff;     /* travelling pulse core */
    --glow:#2f7bff;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;}
  .stage{position:fixed;inset:0;pointer-events:none;
    font-family:"Arial Narrow","Helvetica Neue",Arial,sans-serif;}

  /* ---- neon border (drawn in absolute canvas coords) ---- */
  .neon{position:absolute;inset:0;width:1920px;height:1080px;
    filter:
      drop-shadow(0 0 4px var(--glow))
      drop-shadow(0 0 12px rgba(47,123,255,0.75))
      drop-shadow(0 0 26px rgba(47,123,255,0.45));}

  .baseline{fill:none;stroke:var(--line);stroke-width:22px;opacity:.92;
    animation:lineBreathe 4.4s ease-in-out infinite;}
  .innerglow{fill:none;stroke:rgba(47, 122, 252, 0.458);stroke-width:15;
    filter:blur(4px);}
  /* travelling runners: a short bright dash chasing around the path */
  .runner{fill:none;stroke:var(--line-hot);stroke-linecap:round;}
  .runnerA{stroke-width:5;stroke-dasharray:330 3830;
    animation:race 4s linear infinite;}
  .runnerB{stroke-width:3;stroke:#8fc0ff;stroke-dasharray:180 3980;
    animation:race 4s linear infinite;animation-delay:-2s;opacity:.8;}
  .corner{fill:none;stroke:var(--line-hot);stroke-width:4;stroke-linecap:round;
    filter:drop-shadow(0 0 6px var(--glow));opacity:.9;}

  @keyframes race{ to{ stroke-dashoffset:-4160; } }   /* = perimeter 2*(1300+780) */
  @keyframes lineBreathe{ 0%,100%{opacity:.8} 50%{opacity:1} }

  /* ---- BTC seal emblem straddling the top border ---- */
  .emblem{position:absolute;left:960px;top:150px;
    width:168px;height:168px;transform:translate(-50%,-50%);}
  .emblem .halo{position:absolute;inset:-6px;border-radius:50%;
    box-shadow:0 0 22px 5px rgba(47,123,255,0.65),0 0 54px 12px rgba(47,123,255,0.30);
    animation:pulse 3.4s ease-in-out infinite;}
  .emblem .ring{position:absolute;inset:-11px;border-radius:50%;
    border:2px solid var(--line);
    box-shadow:0 0 10px var(--glow), inset 0 0 8px rgba(47,123,255,0.4);}
  .emblem img{position:relative;width:100%;height:100%;object-fit:contain;
    border-radius:50%;filter:drop-shadow(0 4px 12px rgba(0,0,0,0.6));}

  /* ---- wordmark on an angular bottom tab ---- */
  .tab{position:absolute;left:960px;top:930px;
    width:440px;height:126px;transform:translate(-50%,-50%);}
  .tab svg.plate{position:absolute;inset:0;width:100%;height:100%;
    filter:drop-shadow(0 0 6px var(--glow)) drop-shadow(0 0 18px rgba(47,123,255,0.6));}
  .tab .plate .fill{fill:rgba(10,18,34,0.96);stroke:var(--line);stroke-width:3;}
  .tab .wm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    overflow:hidden;}
  .tab .wm img{width:88%;height:118%;object-fit:contain;
    mix-blend-mode:screen;filter:brightness(1.18) saturate(1.12) contrast(1.05);}
  .tab::after{content:"";position:absolute;top:0;bottom:0;width:34%;left:-60%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,0.22),transparent);
    transform:skewX(-18deg);mix-blend-mode:screen;
    clip-path:polygon(9.1% 4.8%,90.9% 4.8%,98.6% 50%,90.9% 95.2%,9.1% 95.2%,1.4% 50%);
    animation:shimmer 7s ease-in-out infinite;}

  /* intro */
  .intro{animation:fadeIn 1s ease both;}
  .intro.d1{animation-delay:.15s}.intro.d2{animation-delay:.3s}

  @keyframes pulse{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.04)}}
  @keyframes shimmer{0%{left:-60%}55%{left:120%}100%{left:120%}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
</style>
</head>
