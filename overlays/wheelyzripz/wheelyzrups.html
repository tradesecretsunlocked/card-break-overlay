<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wheely's Ripz — TikTok Break Overlay</title>

  <style>
    :root{
      /* Brand */
      --bg0:#050607;
      --bg1:#0b0d10;
      --panel:#0e1116;
      --panel2:#0b0f15;
      --silver:#c9c9c9;
      --white:#ffffff;
      --red:#d41b1b;
      --red2:#8e0f0f;
      --muted:#8a8f99;

      --stroke: rgba(255,255,255,0.50);
      --stroke2: rgba(255,255,255,0.08);

      --glowR: rgba(212,27,27,0.55);
      --glowW: rgba(255,255,255,0.10);

      --radius: 16px;
      --radius2: 12px;

      /* Canvas: choose your OBS browser source size */
      --W: 1080px;
     --H: 560px;

      /* Layout */
      --pad: 10px;
      --gap: 8px;

      /* Tiles */
      --tileH: 75px;
      --tileRadius: 14px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:transparent;
      font-family: Arial Black, Arial, sans-serif;
      user-select:none;
      overflow:hidden;
    }

    /* This stage is the actual overlay canvas */
    .stage{
      width: var(--W);
      height: var(--H);
      position: relative;
      overflow: visible !important;
      background:
        radial-gradient(900px 900px at 20% 12%, rgba(212,27,27,0.18), transparent 55%),
        radial-gradient(700px 900px at 90% 35%, rgba(255,255,255,0.06), transparent 60%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      border-radius: 0px;
      margin:0 auto;
    }

    /* Optional: scale to fit when previewed in a normal browser window */
   .fit{
  position: absolute;
  inset:0;
}

    .frame{
      position:absolute;
      inset: var(--pad);
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      border: 3px solid rgba(212,27,27,0.55);
      box-shadow:
        0 20px 60px rgba(0,0,0,0.55),
        0 0 28px rgba(212,27,27,0.25);
     overflow: visible !important;
    }

    .header{
      height: 75px;
      display:flex;
      align-items:center;
      gap: 14px;
      padding: 5px 5px;
      background:
        linear-gradient(90deg, rgba(212,27,27,0.30), rgba(255,255,255,0.04) 45%, rgba(0,0,0,0.18) 100%);
      border-bottom: 1px solid var(--stroke);
      overflow: visible !important;
    }

    .brand-left{
      display:flex;
      align-items:center;
      gap: 22px;
      min-width: 0;
      flex: 1;
    }
    .brand-logo{
      width: 160px;
      height: 100px;
      border-radius: 18px;
      border: 2px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.22);
      display:inline-grid;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      box-shadow: 0 0 18px rgba(212,27,27,0.18);
    }
    .brand-logo img{
      width: 93%;
      height: 100%;
      object-fit: contain;
      display:block;
      filter: drop-shadow(0 8px 18px rgba(0,0,0,0.45));
    }

    .brand-text{
      display:flex;
      flex-direction:column;
      gap: 4px;
      min-width:0;
    }
    .brand-title{
      font-size: 34px;
      letter-spacing: 1.2px;
      color: var(--white);
      text-transform: uppercase;
      line-height:1;
      text-shadow: 0 3px 10px rgba(0,0,0,0.55);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .brand-sub{
      font-size: 16px;
      color: rgba(255,255,255,0.78);
      letter-spacing: 0.6px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .header-right{
      display:flex;
      align-items:center;
      gap: 10px;
    }

    .pill{
      height: 44px;
      padding: 0 12px;
      border-radius: 999px;
      display:flex;
      align-items:center;
      gap: 10px;
      background: rgba(0,0,0,0.34);
      border: 1px solid rgba(255,255,255,0.14);
      box-shadow: inset 0 0 12px rgba(255,255,255,0.04);
      color: var(--white);
      position: relative;
    }
    .pill label{
      font-size: 12px;
      opacity: 0.75;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }
   .pill select{
  background: rgba(0,0,0,0.65);
  color: #fff;
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 10px;
  padding: 6px 28px 6px 10px;
  font-weight: 900;
  appearance: none;
  -webkit-appearance: none;
  cursor: pointer;
  position: relative;
  z-index: 9999;
}
.pill::after{
  content:"▼";
  position:absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 10px;
  pointer-events:none;
  opacity:.8;
}

.pill select:focus{
  border-color: rgba(212,27,27,0.65);
  box-shadow: 0 0 0 2px rgba(212,27,27,0.18);
}

.group * {
  pointer-events: none;
}

.group {
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 14px;
  padding: 5px;
  background: rgba(0,0,0,0.20);
  display: flex;
  flex-direction: column;
  gap: 4px;
  pointer-events: auto;
  position: relative;
  z-index: 5;
 
}


.group::after {
  pointer-events: none;
}




.group-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 15px;
  letter-spacing: 1.4px;
  text-transform: uppercase;
  color: #fff;
  padding-bottom: 0px;
  border-bottom: 1px solid rgba(255,255,255,0.18);
}

.division-buyer {
  min-width: 140px;
  padding: 2px 1px;
  border-radius: 10px;
  font-size: 16px;
  font-weight: 900;
  text-align: center;
  background: rgba(14,189,20,0.86);
  border: 1px solid rgba(255,255,255,0.2);
  color: rgba(255,255,255,0.85);
}

.direction-icons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 2px 2px;
}

.direction-icons img {
  width: 100%;
  max-height: 80px;
  object-fit: contain;
  filter: drop-shadow(0 8px 16px rgba(0,0,0,0.6));
}

.conference-logo {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 6px 0;
  background:linear-gradient(45deg, #e10000, #0025d9);
}

.conference-logo img {
  width: 70%;
  max-height: 90px;
  object-fit: contain;
  filter: drop-shadow(0 10px 20px rgba(0,0,0,0.6));
}


    .main{
      position:absolute;
      left:0; right:0;
      top:72px;
      bottom: 132px; /* ticker space */
      padding: var(--pad);
      display:grid;
          grid-template-columns: 1fr 350px 1fr;
  align-items: stretch;
  grid-template-rows: 1fr;
      gap: var(--gap);
    }

    .panel{
      background: linear-gradient(180deg, rgba(0,0,0,0.35), rgba(0,0,0,0.20));
      border: 2px solid var(--stroke);
      border-radius: var(--radius);

        inset 0 0 18px rgba(255,255,255,0.04),

    }

    .panel-hd{
      height: 56px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding: 0 1px;
      border-bottom: 1px solid var(--stroke2);
      background: linear-gradient(90deg, rgba(212,27,27,0.18), rgba(255,255,255,0.03));
    }
    .panel-hd .ttl{
      font-size: 16px;
      letter-spacing: 1px;
      text-transform: uppercase;

    }
    .panel-hd .mini{
      font-size: 12px;
      color: rgba(255,255,255,0.7);
      letter-spacing: 0.6px;
    }


.panel.board.left {
  animation: afcGlow 8s linear infinite;
}

.panel.board.right {
  animation: nfcGlow 8s linear infinite;
}

@keyframes afcGlow {
  0% { box-shadow: 0 0 0 rgba(212,27,27,0); }
  50% { box-shadow: 0 0 22px rgba(212,27,27,0.45); }
  100% { box-shadow: 0 0 0 rgba(212,27,27,0); }
}

@keyframes nfcGlow {
  0% { box-shadow: 0 0 0 rgba(0,80,255,0); }
  50% { box-shadow: 0 0 22px rgba(0,80,255,0.45); }
  100% { box-shadow: 0 0 0 rgba(0,80,255,0); }
}



    /* Board area */
    .board{
      display:flex;
      flex-direction:column;
      min-height: 383px;
    }
    .board-body{
      padding: 4px;
      min-height: 0;
      height: 100%;
      overflow:hidden;
      display:flex;
      flex-direction:column;

    }

    .metrics{

      gap: 10px;
    }
    .metric{

    .metric .num{

    }
    .metric .lbl{

      letter-spacing: 1px;

    }

  .grid{
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 5px;
  min-height: 0;
  height: 100%;
  overflow: auto;
  padding-right: 0px;
}

/* TEAM break layout */
.grid.team {
  grid-template-columns: repeat(4, 1fr
  );
}


    /* Scrollbar */
    .grid::-webkit-scrollbar{width:8px}
    .grid::-webkit-scrollbar-thumb{
      background: rgba(255,255,255,0.12);
      border-radius: 999px;
    }
    .grid::-webkit-scrollbar-track{background: rgba(0,0,0,0.12)}

    .tile{
      height: var(--tileH);
      border-radius: var(--tileRadius);
      border: 1px solid rgba(255,255,255,0.12);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.06), rgba(0,0,0,0.22));
      box-shadow:
        inset 0 0 18px rgba(255,255,255,0.03),
        0 10px 22px rgba(0,0,0,0.32);
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding: 10px 12px;
      position:relative;
      overflow:hidden;
    }

    /* TEAM MODE: logo-only tiles */
.tile.team-only {
  padding: 0;
}

.tile.team-only .logoBox {
  width: 100%;
  height: 100%;
  border-radius: inherit;
  border: none;
  background: transparent;
}

.tile.team-only .logoBox img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}



    .tile:before{
      content:"";
      position:absolute;
      inset:-2px;
      background: radial-gradient(420px 120px at 20% 10%, rgba(212,27,27,0.16), transparent 55%);
      pointer-events:none;
    }

    .tile-left{
      display:flex;
      align-items:center;
      gap: 4px;
      
      position:relative;

    }
    .logoBox{

    }
    .logoBox img{

.tile.division-team {

}

.tile.division-team .logoBox {

}

.tile.division-team .logoBox img {
  object-fit: contain;
}


    .tile-name{
      display: none;
    }
    .tile-code{
  display: none;
    }

    .tile-right{
      display:flex;
      align-items:center;
      gap: 10px;
      position:relative;
      z-index:1;
    }

    .buyerTag{
      min-width: 180px;
      max-width: 220px;
      padding: 10px 12px;

      letter-spacing: 0.4px;

    .tile.sold{

    }

      content:"SOLD";

      font-size: 14px;

      border: 1px solid rgba(255,255,255,0.16);

    }

/* =========================
   SOLD OVERLAY "X"
   ========================= */

/* Base X overlay (shared) */
.tile.sold::before,
.group.sold::before {
  content: "✕";
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 1000;
  color: rgb(212, 27, 27);
  text-shadow:
    0 0 18px rgba(212,27,27,0.55),
    0 0 36px rgba(212,27,27,0.35);
  pointer-events: none;
  z-index: 20;
}

/* Darken background slightly when sold */
.tile.sold::after,
.group.sold::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.45);
  pointer-events: none;
  z-index: 15;
}

/* TEAM tiles */
.tile.sold::before {
  font-size: 64px;
}

/* Division / Directional groups */
.group.sold::before {
  font-size: 96px;
}

/* Conference (bigger visual target) */
body[data-break="CONFERENCE"] .group.sold::before {
  font-size: 120px;
}


/* Hover lift + micro-wiggle */
.tile{
  transition:
    transform .22s cubic-bezier(.2,.8,.2,1),
    box-shadow .22s ease,
    filter .22s ease,
    opacity .22s ease;
  will-change: transform;
}

/* Hover lift + tilt */
.tile:not(.sold):hover{
  transform: translateY(-6px) scale(1.035) rotate(-0.6deg);
  box-shadow:
    inset 0 0 22px rgba(255,255,255,0.06),
    0 22px 48px rgba(0,0,0,0.55);
  filter: brightness(1.12) saturate(1.05);
  z-index: 5;
}

/* Shimmer sweep */
.tile::after{
  content:"";
  position:absolute;
  inset:-60% -80%;
  background: linear-gradient(115deg,
    transparent 30%,
    rgba(255,255,255,0.10) 42%,
    rgba(255,255,255,0.30) 50%,
    rgba(255,255,255,0.10) 58%,
    transparent 70%
  );
  transform: translateX(-120%) rotate(10deg);
  opacity: 0;
  pointer-events:none;
}

.tile:not(.sold):hover::after{
  opacity: 1;
  animation: tileShimmer 0.85s ease-out forwards;
}

@keyframes tileShimmer{
  to { transform: translateX(120%) rotate(10deg); }
}

/* Subtle idle pulse for available tiles */
.tile:not(.sold){
  animation: tileIdlePulse 3.6s ease-in-out infinite;
}

@keyframes tileIdlePulse{
  0%,100%{ filter: brightness(1); }
  50%{ filter: brightness(1.05); }
}
@keyframes tileBreath{
  0%,100%{ filter: brightness(1); }
  50%{ filter: brightness(1.06); }
}
/* Active click feedback */
.tile:not(.sold):active{
  transform: translateY(-2px) scale(1.01);
  filter: brightness(0.98);
}
/* Sold tiles stay boring on purpose */
.tile.sold{
  animation:none !important;
  transform:none !important;
  filter: grayscale(35%) brightness(0.9);
}

/* =========================
   GROUP-LEVEL INTERACTION
   ========================= */

.group{
  transition:
    transform .28s cubic-bezier(.2,.9,.2,1),
    box-shadow .28s ease,
    filter .28s ease;
  will-change: transform;
}

/* Hover lift for group-based breaks */
.group:not(.sold):hover{
  transform: translateY(-6px) scale(1.025);
  box-shadow:
    0 28px 60px rgba(0,0,0,0.55),
    inset 0 0 22px rgba(255,255,255,0.06);
  filter: brightness(1.08) saturate(1.05);
  z-index: 6;
}

/* Shimmer sweep across entire group */
.group::after{
  content:"";
  position:absolute;
  inset:-60% -80%;
  background: linear-gradient(115deg,
    transparent 30%,
    rgba(255,255,255,0.10) 42%,
    rgba(255,255,255,0.30) 50%,
    rgba(255,255,255,0.10) 58%,
    transparent 70%
  );
  transform: translateX(-120%) rotate(10deg);
  opacity: 0;
  pointer-events:none;
}

.group:not(.sold):hover::after{
  opacity: 1;
  animation: groupShimmer 1s ease-out forwards;
}

@keyframes groupShimmer{
  to { transform: translateX(120%) rotate(10deg); }
}

/* Sold groups stay quiet */
.group.sold{
  filter: grayscale(40%) brightness(0.9) opacity(.5);
  animation:none;
}

  buyerModal.classList.add("open");
  buyerModal.setAttribute("aria-hidden", "false");
  buyerModalKey.textContent = selectionCode;

  // prefill existing buyer if already sold
  const cur = boardState[selectionCode] || { sold:false, buyer:"" };
  buyerModalInput.value = (cur && cur.buyer && cur.sold) ? cur.buyer : "";
  buyerModalInput.focus();
}

function closeBuyerModal(){
  buyerModal.classList.remove("open");
  buyerModal.setAttribute("aria-hidden", "true");
  PENDING_ASSIGN = null;
}

function saveBuyerModal(){
  if (!PENDING_ASSIGN) return;

  const { selectionCode, soldNext } = PENDING_ASSIGN;
  const name = (buyerModalInput.value || "").trim();

  applySale({
    selectionCode,
    buyerName: soldNext ? (name || "Unknown") : "",
    sold: soldNext,
    source: "modal"
  });

  closeBuyerModal();
}

function clearBuyerModal(){
  buyerModalInput.value = "";
  buyerModalInput.focus();
}

function renderTEAM(){
  const items = getActiveItems();
console.log("renderTEAM items:", getActiveItems().length);



  BOARDS.LEFT.classList.add("team");
  BOARDS.RIGHT.classList.add("team");
  BOARDS.LEFT.closest(".panel").classList.add("left");
BOARDS.RIGHT.closest(".panel").classList.add("right");


  // NFL stays AFC / NFC split
  if (STATE.league === "NFL"){
    const left  = items.filter(t => AFC_CODES.has(t.code));
    const right = items.filter(t => NFC_CODES.has(t.code));

    left.forEach(i  => buildTile(i, BOARDS.LEFT));
    right.forEach(i => buildTile(i, BOARDS.RIGHT));

    updateMetrics();
    return;
  }

  // NBA / MLB: split evenly across LEFT and RIGHT
  const mid = Math.ceil(items.length / 2);
  const leftItems = items.slice(0, mid);
  const rightItems = items.slice(mid);

  leftItems.forEach(i => buildTile(i, BOARDS.LEFT));
  rightItems.forEach(i => buildTile(i, BOARDS.RIGHT));

  updateMetrics();
}

    function getActiveItems(){

      const league = STATE.league;
      const mode = STATE.mode;

      if (league === "NFL"){
        if (mode === "TEAM") return NFL_TEAMS;
        if (mode === "DIVISION") return NFL_DIVISIONS;
        if (mode === "CONFERENCE") return NFL_CONFERENCE;
        if (mode === "DIRECTIONAL") return NFL_DIRECTIONAL;
        return NFL_TEAMS;
      }

      if (league === "NBA"){
        return NBA_TEAMS;
      }

      if (league === "MLB"){
        return MLB_TEAMS;
      }

      return NFL_TEAMS;
    }



    function imgSrcFor(item){
      const league = STATE.league;
      const base = PATH[league] || PATH.NFL;
      // Fall back to league logo if missing
      return base + (item.logo || (league.toLowerCase() + ".png"));
    }

    function loadState(){
      const raw = localStorage.getItem(storageKey());
      boardState = raw ? JSON.parse(raw) : {};
    }

    function saveState(){
      localStorage.setItem(storageKey(), JSON.stringify(boardState));
    }



    function updateMetrics(){
  let keys = [];

  if (STATE.league === "NFL" && STATE.mode === "DIVISION"){
    keys = Object.keys(NFL_DIVISION_MAP); // 8 divisions
  }
  else if (STATE.league === "NFL" && STATE.mode === "CONFERENCE"){
    keys = NFL_CONFERENCE.map(c => c.code); // AFC, NFC
  }
  else if (STATE.league === "NFL" && STATE.mode === "DIRECTIONAL"){
    keys = Object.keys(DIRECTION_MAP); // NORTH, EAST, SOUTH, WEST
  }
  else {
    keys = getActiveItems().map(x => x.code);
  }

  let sold = 0;
  keys.forEach(k => {
    const st = boardState[k];
    if (st && st.sold) sold++;
  });

  remainingNum.textContent = keys.length - sold;
  soldNum.textContent = sold;
}

    // ---------- APPLY SALE (BOARD UPDATE) ----------
 function applySale(evt){
if (!evt.selectionCode) return;


  const st = boardState[evt.selectionCode] || { sold:false, buyer:"" };
  const nextSold = (typeof evt.sold === "boolean") ? evt.sold : true;

  st.sold = nextSold;
  st.buyer = nextSold ? (evt.buyerName || st.buyer || "Unknown") : "";

  boardState[evt.selectionCode] = st;
  saveState();

  soldPanel.classList.remove("open");

  // Group modes
const group = document.querySelector(`.group[data-key="${evt.selectionCode}"]`);
if (group){
  group.classList.toggle("sold", st.sold);
  const buyerBox = group.querySelector(".division-buyer");
  if (buyerBox) buyerBox.textContent = st.sold ? st.buyer : "Available";
}


  // TEAM tiles
  const tile = document.querySelector(`.tile[data-key="${evt.selectionCode}"]`);
  if (tile){
    tile.classList.toggle("sold", st.sold);
  }

  updateMetrics();
  renderSoldPanel();

}

       if (cycleLeagueBtn) cycleLeagueBtn.addEventListener("click", cycleLeague);
if (cycleModeBtn)   cycleModeBtn.addEventListener("click", cycleMode);

      // Bridge boot
      ACTIVE_BRIDGE = detectBridgeBase();
      BRIDGE_KEY = detectBridgeKey();

      localStorage.setItem("tsu.active_bridge", ACTIVE_BRIDGE);
      localStorage.setItem("tsu.bridge.base", ACTIVE_BRIDGE);
      if (BRIDGE_KEY) localStorage.setItem("tsu.bridge.key", BRIDGE_KEY);

      if (!didBoot){
        didBoot = true;
        warmupPing("boot");
        startSSE();
      }


      if (soldMetric){
  soldMetric.addEventListener("click", () => {
    soldPanel.classList.toggle("open");
    renderSoldPanel();
  });
}
    }

    function cycleLeague(){
  const idx = LEAGUES.indexOf(STATE.league);
  const nextLeague = LEAGUES[(idx + 1) % LEAGUES.length];
  const nextMode = (MODES_BY_LEAGUE[nextLeague] || ["TEAM"])[0];
  setState(nextLeague, nextMode, { persist:true, rebuild:true });
}

function cycleMode(){
  const modes = MODES_BY_LEAGUE[STATE.league] || ["TEAM"];
  const idx = modes.indexOf(STATE.mode);
  const nextMode = modes[(idx + 1) % modes.length];
  setState(STATE.league, nextMode, { persist:true, rebuild:true });
}


    boot();

const promoBreak = document.getElementById("promoBreak");
const promoLogo  = document.getElementById("promoLogo");
const breakIdDisplay = document.getElementById("breakIdDisplay");

let promoState = "break";

function cyclePromo(){
  if (promoState === "break"){
    promoBreak.classList.remove("active");
    promoLogo.classList.add("active");
    promoState = "logo";
  } else {
    promoLogo.classList.remove("active");
    promoBreak.classList.add("active");
    promoState = "break";
  }
}
renderSoldPanel();

promoBreak.classList.add("active");
setInterval(cyclePromo, 12000);


  </script>
