<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920, initial-scale=1.0" />
  <title>Wheely's Ripz — Card Repair (Vertical Simple)</title>

  <style>
    :root{
      --W: 1080px;
      --H: 1920px;

      --bg0:#050607;
      --bg1:#0b0d10;
      --panel:#0e1116;
      --stroke: rgba(255,255,255,0.18);
      --stroke2: rgba(255,255,255,0.08);

      --white:#ffffff;
      --muted: rgba(255,255,255,0.72);

      --red:#d41b1b;
      --redGlow: rgba(212,27,27,0.35);

      --radius: 18px;
    }

    *{ box-sizing:border-box; }
    html, body { height:100%; }
    body{
      margin:0;
      background: transparent;
      font-family: Arial Black, Arial, sans-serif;
      overflow:hidden;
      user-select:none;
    }

    /* Canvas */
    .stage{
      width: var(--W);
      height: var(--H);
      position: relative;
      margin: 0 auto;
      background:
        radial-gradient(1100px 900px at 20% 12%, rgba(212,27,27,0.18), transparent 55%),
        radial-gradient(900px 1100px at 90% 35%, rgba(255,255,255,0.06), transparent 60%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
    }

    .frame{
      position:absolute;
      inset: 14px;
      border-radius: 26px;
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      border: 3px solid rgba(212,27,27,0.55);
      box-shadow:
        0 20px 60px rgba(0,0,0,0.55),
        0 0 34px rgba(212,27,27,0.22);
      overflow:hidden;
    }

    /* Header */
    .header{
      height: 150px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 14px;
      padding: 14px 16px;
      background:
        linear-gradient(90deg, rgba(212,27,27,0.30), rgba(255,255,255,0.04) 45%, rgba(0,0,0,0.18) 100%);
      border-bottom: 1px solid rgba(255,255,255,0.22);
    }

    .brand{
      display:flex;
      align-items:center;
      gap: 14px;
      min-width:0;
    }

    .brand-logo{
      width: 120px;
      height: 120px;
      border-radius: 18px;
      border: 2px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.24);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      box-shadow: 0 0 18px rgba(212,27,27,0.18);
      flex: 0 0 auto;
    }
    .brand-logo img{
      width: 92%;
      height: 92%;
      object-fit: contain;
      display:block;
      filter: drop-shadow(0 8px 18px rgba(0,0,0,0.45));
    }

    .brand-text{
      display:flex;
      flex-direction:column;
      gap: 6px;
      min-width:0;
    }
    .brand-title{
      font-size: 44px;
      letter-spacing: 1.2px;
      color: var(--white);
      text-transform: uppercase;
      line-height: 1;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      text-shadow: 0 3px 12px rgba(0,0,0,0.6);
    }
    .brand-sub{
      font-size: 18px;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.78);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    /* Control Bar (admin/manual only) */
    .controls{
      display:none;
      align-items:center;
      gap: 10px;
      padding: 10px 14px;
      border-top: 1px solid rgba(255,255,255,0.10);
      background: rgba(0,0,0,0.28);
    }
    .controls.on{ display:flex; }

    .btn{
      height: 46px;
      padding: 0 14px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(0,0,0,0.34);
      color: rgba(255,255,255,0.92);
      font-weight: 1000;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      cursor:pointer;
      box-shadow: inset 0 0 14px rgba(255,255,255,0.03);
      transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
    }
    .btn:hover{
      background: rgba(212,27,27,0.22);
      box-shadow: 0 0 18px rgba(212,27,27,0.18), inset 0 0 14px rgba(255,255,255,0.03);
      transform: translateY(-1px);
    }
    .btn.red{
      border-color: rgba(212,27,27,0.55);
      background: rgba(212,27,27,0.22);
    }

    .hint{
      margin-left:auto;
      font-size: 12px;
      letter-spacing: .6px;
      color: rgba(255,255,255,0.72);
      opacity: .9;
      white-space:nowrap;
    }

    /* Optional ticker under header */
    .tickerWrap{
      display:none;
      border-bottom: 1px solid rgba(255,255,255,0.10);
      background: linear-gradient(90deg, rgba(212,27,27,0.22), rgba(255,255,255,0.04) 55%, rgba(0,0,0,0.18));
    }
    .tickerWrap.on{ display:block; }

    .ticker{
      height: 74px;
      display:flex;
      align-items:center;
      overflow:hidden;
      position:relative;
      padding: 0 16px;
    }
    .ticker:before{
      content:"";
      position:absolute;
      inset:-2px;
      background: radial-gradient(900px 120px at 20% 50%, rgba(255,255,255,0.08), transparent 60%);
      pointer-events:none;
    }
    .tickerText{
      width:100%;
      font-size: 34px;
      font-weight: 1000;
      letter-spacing: 0.8px;
      color: rgba(255,255,255,0.92);
      text-shadow: 0 2px 14px rgba(0,0,0,0.65);
      white-space:nowrap;
      overflow:hidden;
      position:relative;
      z-index:1;
    }
    .marquee{
      display:inline-block;
      padding-left: 100%;
      animation: scroll 18s linear infinite;
    }
    @keyframes scroll{
      0%{ transform: translateX(0) }
      100%{ transform: translateX(-100%) }
    }

    /* Content area just to keep the overlay from feeling empty */
    .content{
      position:absolute;
      left: 0;
      right: 0;
      top: 150px; /* header */
      bottom: 0;
      display:flex;
      align-items:center;
      justify-content:center;
      pointer-events:none;
    }
    .ghostLabel{
      font-size: 22px;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.22);
      text-transform: uppercase;
      text-align:center;
      padding: 0 22px;
    }

    /* Text Input Modal (OBS Interact-friendly) */
    .modal{
      position:absolute;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      background: rgba(0,0,0,0.70);
      z-index: 9999;
      pointer-events:auto;
    }
    .modal.on{ display:flex; }

    .modalCard{
      width: min(720px, 92%);
      border-radius: 18px;
      border: 2px solid rgba(255,255,255,0.18);
      background: linear-gradient(180deg, rgba(18,18,20,0.98), rgba(8,8,10,0.98));
      box-shadow: 0 28px 80px rgba(0,0,0,0.65), 0 0 24px rgba(212,27,27,0.20);
      padding: 16px;
    }

    .modalHd{
      display:flex;
      align-items:baseline;
      justify-content:space-between;
      gap: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.10);
    }
    .modalTitle{
      font-size: 18px;
      font-weight: 1000;
      letter-spacing: 0.8px;
      color: #fff;
      text-transform: uppercase;
    }
    .modalSub{
      font-size: 12px;
      opacity: .75;
      letter-spacing: .8px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.82);
    }

    .modalInput{
      margin-top: 12px;
      width: 100%;
      height: 52px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.22);
      background: rgba(0,0,0,0.55);
      color: #fff;
      padding: 0 12px;
      font-size: 16px;
      font-weight: 900;
      outline: none;
    }
    .modalInput:focus{
      border-color: rgba(212,27,27,0.70);
      box-shadow: 0 0 0 3px rgba(212,27,27,0.18);
    }

    .modalActions{
      margin-top: 12px;
      display:flex;
      gap: 10px;
      justify-content:flex-end;
    }

    .btnGhost{
      background: rgba(0,0,0,0.35);
    }
    .btnPrimary{
      border-color: rgba(212,27,27,0.55);
      background: rgba(212,27,27,0.35);
      box-shadow: 0 0 18px rgba(212,27,27,0.18);
    }

    .modalHint{
      margin-top: 10px;
      font-size: 12px;
      opacity: .75;
      line-height: 1.2;
      color: rgba(255,255,255,0.78);
    }
  </style>
</head>

<body>
  <div class="stage">
    <div class="frame" id="frame">

      <!-- HEADER -->
      <div class="header">
        <div class="brand">
          <div class="brand-logo" aria-label="Logo">
            <!-- Update path as needed -->
            <img src="../../images/logos/wripz-logo.png" alt="Wheely's Ripz">
          </div>
          <div class="brand-text">
            <div class="brand-title">Wheely's Ripz</div>
            <div class="brand-sub">Card Repair Showcase</div>
          </div>
        </div>
      </div>

      <!-- OPTIONAL TICKER -->
      <div class="tickerWrap" id="tickerWrap">
        <div class="ticker">
          <div class="tickerText" title="Ticker text">
            <span class="marquee" id="tickerMarquee"></span>
          </div>
        </div>
      </div>

      <!-- CONTROL BAR (admin/manual only) -->
      <div class="controls" id="controls">
        <button class="btn" id="toggleTickerBtn">Toggle Ticker</button>
        <button class="btn" id="editTickerBtn">Edit Text</button>
        <button class="btn red" id="resetTickerBtn">Reset</button>
        <div class="hint" id="hint">Controls hidden (admin=0)</div>
      </div>

      <!-- Just a faint label so it doesn't feel empty -->
      <div class="content">
        <div class="ghostLabel">
          Full-screen vertical layout (1080×1920)<br>
          Intended for repair cam + hands work
        </div>
      </div>

      <!-- TEXT INPUT MODAL -->
      <div class="modal" id="modal" aria-hidden="true">
        <div class="modalCard" role="dialog" aria-modal="true">
          <div class="modalHd">
            <div class="modalTitle">Ticker Text</div>
            <div class="modalSub">OBS: right-click source → Interact</div>
          </div>

          <input
            id="modalInput"
            class="modalInput"
            type="text"
            placeholder="Type ticker text…"
            autocomplete="off"
            spellcheck="false"
          />

          <div class="modalActions">
            <button class="btn btnGhost" id="modalCancel">Cancel</button>
            <button class="btn btnGhost" id="modalClear">Clear</button>
            <button class="btn btnPrimary" id="modalSave">Save</button>
          </div>

          <div class="modalHint">
            Tip: Keep it short, humans can only read so fast.
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    /************************************************************
     *  WHEELY'S RIPZ — SIMPLE VERTICAL OVERLAY
     *  - Header + optional ticker + control bar
     *  - Single-file, OBS-ready
     ************************************************************/

    const params = new URLSearchParams(location.search);
    const ADMIN  = params.get("admin") === "1";
    const MANUAL = params.get("manual") === "1";
    const CAN_CLICK = ADMIN || MANUAL;

    // Storage keys
    const K_TICKER_TEXT = "wripz.simple.tickerText";
    const K_TICKER_ON   = "wripz.simple.tickerOn";

    // DOM
    const controls      = document.getElementById("controls");
    const hint          = document.getElementById("hint");
    const tickerWrap    = document.getElementById("tickerWrap");
    const tickerMarquee = document.getElementById("tickerMarquee");

    const toggleTickerBtn = document.getElementById("toggleTickerBtn");
    const editTickerBtn   = document.getElementById("editTickerBtn");
    const resetTickerBtn  = document.getElementById("resetTickerBtn");

    const modal       = document.getElementById("modal");
    const modalInput  = document.getElementById("modalInput");
    const modalCancel = document.getElementById("modalCancel");
    const modalClear  = document.getElementById("modalClear");
    const modalSave   = document.getElementById("modalSave");

    function loadTicker(){
      const t = localStorage.getItem(K_TICKER_TEXT);
      const on = localStorage.getItem(K_TICKER_ON);

      const text = (t && t.trim()) ? t.trim() : "Card Repair Live • Cleaning • Resleeving • Edge Work • IG: @wheelysripz";
      const enabled = (on === null) ? true : (on === "1");

      tickerMarquee.textContent = text;
      tickerWrap.classList.toggle("on", enabled);
    }

    function setTickerEnabled(enabled){
      tickerWrap.classList.toggle("on", !!enabled);
      localStorage.setItem(K_TICKER_ON, enabled ? "1" : "0");
    }

    function openModal(){
      modal.classList.add("on");
      modal.setAttribute("aria-hidden","false");
      modalInput.value = tickerMarquee.textContent || "";
      modalInput.focus();
    }

    function closeModal(){
      modal.classList.remove("on");
      modal.setAttribute("aria-hidden","true");
    }

    function saveModal(){
      const v = (modalInput.value || "").trim();
      tickerMarquee.textContent = v || " ";
      localStorage.setItem(K_TICKER_TEXT, v);
      // if they edit text, assume they want ticker on
      setTickerEnabled(true);
      closeModal();
    }

    function resetTicker(){
      localStorage.removeItem(K_TICKER_TEXT);
      localStorage.removeItem(K_TICKER_ON);
      loadTicker();
    }

    // Click outside closes modal
    modal.addEventListener("click", (e) => {
      if (e.target === modal) closeModal();
    });

    // Modal keys
    modalInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") saveModal();
      if (e.key === "Escape") closeModal();
    });

    // Controls only in admin/manual
    if (CAN_CLICK){
      controls.classList.add("on");
      hint.textContent = ADMIN ? "Admin controls active" : "Manual controls active";
    } else {
      hint.textContent = "Controls hidden (admin=0)";
    }

    // Wire buttons
    if (toggleTickerBtn) toggleTickerBtn.addEventListener("click", () => {
      if (!CAN_CLICK) return;
      const enabled = tickerWrap.classList.contains("on");
      setTickerEnabled(!enabled);
    });

    if (editTickerBtn) editTickerBtn.addEventListener("click", () => {
      if (!CAN_CLICK) return;
      openModal();
    });

    if (resetTickerBtn) resetTickerBtn.addEventListener("click", () => {
      if (!CAN_CLICK) return;
      resetTicker();
    });

    if (modalCancel) modalCancel.addEventListener("click", closeModal);
    if (modalClear)  modalClear.addEventListener("click", () => { modalInput.value=""; modalInput.focus(); });
    if (modalSave)   modalSave.addEventListener("click", saveModal);

    // Boot
    loadTicker();
  </script>
</body>
</html>
