<!DOCTYPE html>
<html lang="en">
<!--
  Wheely's Ripz TikTok Overlay – Single‑file edition

  This overlay is tailored for vertical TikTok streams (1080×1920). It
  supports multiple break formats (team, conference, directional and
  divy) across NFL, NBA and MLB. A 16:9 facecam slot sits beside the
  assignment area and a chat feed runs down the right side. A
  scrolling message bar is provided along the bottom for announcements
  or promotions (e.g. RatedRookies.com). All CSS and JavaScript are
  contained in this file. To customise logos or colours, place your
  images under an `images/` directory relative to this file or adjust
  the <img src> paths below.

  TSU sale bridge hooks are stubbed at the bottom for automation.
-->
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, initial-scale=1.0" />
  <title>Wheely's Ripz Break Overlay</title>
  <!-- Display fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bungee+Shade&family=Anton&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* Brand palette – dark canvas with red highlights */
      --navy: #0b2341;
      --blue: #1d499e;
      --blue-light: #2b6dc0;
      --red: #b00000;
      --white: #ffffff;
      --border: rgba(255, 255, 255, 0.2);
      --team-border: rgba(255, 255, 255, 0.4);
      --header-gradient: linear-gradient(90deg, var(--red), var(--blue));
      --panel-bg: #141414;
      --chat-bg: #1f1f1f;
      --ticker-bg: var(--red);
      --ticker-color: var(--white);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: transparent;
      font-family: Arial, sans-serif;
      color: var(--white);
    }

    /* Root wrapper uses grid to define header, main and ticker areas */
    #overlay-root {
      display: grid;
      grid-template-rows: 72px 1fr 40px;
      grid-template-columns: 1fr;
      width: 100%;
      height: 100%;
      background: var(--navy);
    }

    /* Header bar */
    .header-band {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: var(--panel-bg);
      border-bottom: 2px solid var(--red);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-left img {
      height: 46px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 0 6px rgba(0, 0, 0, 0.5));
    }

    .header-title {
      font-family: 'Bungee Shade', sans-serif;
      font-size: 32px;
      line-height: 1;
      letter-spacing: 1px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-right select {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      color: var(--white);
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }

    .header-right img {
      height: 38px;
      width: auto;
      filter: drop-shadow(0 0 6px rgba(0, 0, 0, 0.5));
    }

    /* Control bar sits below header inside assignment panel */
    .control-bar {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      padding: 8px;
      background: var(--panel-bg);
      border: 2px solid var(--border);
      border-radius: 10px;
      margin-bottom: 8px;
    }

    .control-bar .btn {
      background: var(--red);
      color: var(--white);
      border: none;
      border-radius: 8px;
      padding: 6px 4px;
      font-weight: 700;
      font-size: 14px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    }

    .control-bar .stat-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--navy);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px;
    }

    .control-bar .stat-box .value {
      font-size: 18px;
      font-weight: 700;
    }

    .control-bar .stat-box .label {
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      opacity: 0.8;
    }

    .control-bar .center-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
    }

    .control-bar .center-logo img {
      max-height: 40px;
      width: auto;
    }

    /* Main grid divides into assignment, camera and chat feed */
    .main-grid {
      display: grid;
      grid-template-columns: 4fr 3fr 3fr;
      grid-template-rows: 1fr;
      gap: 10px;
      padding: 10px;
      height: 100%;
    }

    .assignment-panel {
      display: flex;
      flex-direction: column;
      background: var(--panel-bg);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 8px;
      overflow-y: auto;
    }

    .facecam-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      background: var(--panel-bg);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 8px;
    }

    .facecam-frame {
      width: 100%;
      max-width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border: 2px solid var(--red);
      border-radius: var(--border-radius, 12px);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .facecam-placeholder {
      font-size: 14px;
      opacity: 0.6;
      text-align: center;
    }

    .chat-panel {
      display: flex;
      flex-direction: column;
      background: var(--chat-bg);
      border: 2px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .chat-title {
      padding: 8px;
      font-weight: 800;
      border-bottom: 1px solid #333;
      background: var(--panel-bg);
    }

    .chat-feed {
      flex: 1;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto;
    }

    .chat-msg {
      font-size: 12px;
      background: #1a1a1a;
      padding: 4px 6px;
      border-radius: 6px;
      line-height: 1.25;
    }

    /* Assignment grids */
    .assignment-grid {
      display: grid;
      gap: 6px;
    }

    .assignment-tile {
      background: #1a1a1a;
      border: 2px solid var(--team-border);
      border-radius: 10px;
      padding: 6px;
      text-align: center;
      font-weight: 700;
      font-size: 14px;
      position: relative;
      cursor: pointer;
    }

    .assignment-tile.sold {
      opacity: 0.5;
      filter: grayscale(0.7);
    }

    .assignment-tile.sold::after {
      content: '\2715'; /* X mark */
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 20px;
      color: var(--red);
    }

    .assignment-direction {
      font-size: 20px;
    }

    .assignment-buyer {
      font-size: 12px;
      color: #bbbbbb;
    }

    /* Scroll ticker */
    .scroll-slot {
      grid-area: 3 / 1 / 4 / 4;
      background: var(--ticker-bg);
      overflow: hidden;
      display: flex;
      align-items: center;
      padding: 0 8px;
    }

    .scroll-text {
      display: inline-block;
      white-space: nowrap;
      animation: ticker-scroll 16s linear infinite;
      font-weight: 700;
      color: var(--ticker-color);
    }

    @keyframes ticker-scroll {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }
  </style>
</head>
<body>
  <div id="overlay-root">
    <!-- HEADER -->
    <div class="header-band">
      <div class="header-left">
        <!-- Replace src with your Wheely's Ripz logo path -->
        <img src="images/logos/wripz-logo.png" alt="Wheely's Ripz" onerror="this.style.display='none'" />
        <span class="header-title">Wheely's Ripz</span>
      </div>
      <div class="header-right">
        <select id="sportSelect" onchange="changeSport(this.value)">
          <option value="nfl">NFL</option>
          <option value="nba">NBA</option>
          <option value="mlb">MLB</option>
        </select>
        <select id="breakSelect" onchange="changeBreakType(this.value)">
          <option value="team">Team</option>
          <option value="conference">Conference</option>
          <option value="directional">Directional</option>
          <option value="divy">Divy</option>
        </select>
        <!-- Rated Rookies promotion graphic -->
        <img src="images/logos/ratedrookiesURL.png" alt="Rated Rookies" onerror="this.style.display='none'" />
      </div>
    </div>
    <!-- MAIN GRID -->
    <div class="main-grid">
      <!-- Assignment panel -->
      <div class="assignment-panel">
        <!-- Control bar for stats and actions -->
        <div class="control-bar">
          <button class="btn" onclick="resetAll()">Reset</button>
          <div class="stat-box">
            <div class="value" id="remainingCount">0</div>
            <div class="label">Remaining</div>
          </div>
          <div class="center-logo">
            <img src="images/logos/wripz-logo.png" alt="Logo" onerror="this.style.display='none'" />
          </div>
          <div class="stat-box">
            <div class="value" id="soldCount">0</div>
            <div class="label">Sold</div>
          </div>
          <button class="btn" onclick="cycleSport()">Next</button>
        </div>
        <!-- Dynamic assignment content will render here -->
        <div id="assignmentContainer"></div>
      </div>
      <!-- Facecam panel -->
      <div class="facecam-panel">
        <div class="facecam-frame" id="cameraFrame">
          <span class="facecam-placeholder">Camera Feed</span>
        </div>
      </div>
      <!-- Chat panel -->
      <div class="chat-panel">
        <div class="chat-title">Live Chat</div>
        <div class="chat-feed" id="chatFeed"></div>
      </div>
    </div>
    <!-- Ticker / scroll message -->
    <div class="scroll-slot">
      <!-- The scroll message starts empty; call updateTicker(text) to set content dynamically -->
      <div class="scroll-text" id="scrollText"></div>
    </div>
  </div>

    let currentSport = 'nfl';
    let currentBreak = 'team';
    let soldSet = new Set();

    // Utility: get team object by code
    function getTeam(sportKey, code) {
      return sportsData[sportKey].teams.find(t => t.code === code);
    }

    // Render assignment area based on break type
    function renderAssignments() {
      const assignmentContainer = document.getElementById('assignmentContainer');
      assignmentContainer.innerHTML = '';
      soldSet.clear();
      updateStats();
      const sportCfg = sportsData[currentSport];
      if (!sportCfg) return;
      switch (currentBreak) {
        case 'team':
          renderTeamBreak(sportCfg);
          break;
        case 'conference':
          renderConferenceBreak(sportCfg);
          break;
        case 'directional':
          renderDirectionalBreak(sportCfg);
          break;
        case 'divy':
          renderDivyBreak(sportCfg);
          break;
        default:
          renderTeamBreak(sportCfg);
      }
    }

    // Team break: show all teams in a grid with centre logo inserted halfway
    function renderTeamBreak(sportCfg) {
      const assignmentContainer = document.getElementById('assignmentContainer');
      const totalTeams = sportCfg.teams.length;
      // Determine columns: NFL & NBA use 8 columns, MLB uses 10
      const cols = currentSport === 'mlb' ? 10 : 8;
      const grid = document.createElement('div');
      grid.className = 'assignment-grid';
      grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
      // Insert teams; halfway through insert a logo tile
      const midIndex = Math.floor(totalTeams / 2);
      sportCfg.teams.forEach((teamObj, index) => {
        if (index === midIndex) {
          // centre logo tile
          const logoTile = document.createElement('div');
          logoTile.className = 'assignment-tile';
          logoTile.style.background = 'transparent';
          logoTile.style.border = 'none';
          const logoImg = document.createElement('img');
          logoImg.src = 'images/logos/wripz-logo.png';
          logoImg.alt = 'Logo';
          logoImg.style.width = '80%';
          logoImg.style.objectFit = 'contain';
          logoImg.onerror = () => (logoImg.style.display = 'none');
          logoTile.appendChild(logoImg);
          grid.appendChild(logoTile);
        }
        const tile = document.createElement('div');
        tile.className = 'assignment-tile';
        tile.dataset.code = teamObj.code;
        tile.onclick = () => toggleSold(teamObj.code);
        const img = document.createElement('img');
        img.src = teamObj.image;
        img.alt = teamObj.name;
        img.style.width = '80%';
        img.style.objectFit = 'contain';
        img.onerror = () => {
          img.style.display = 'none';
          tile.textContent = teamObj.code;
        };
        tile.appendChild(img);
        grid.appendChild(tile);
      });
      assignmentContainer.appendChild(grid);
      updateStats();
    }

    // Conference break: show two columns with divisions
    function renderConferenceBreak(sportCfg) {
      const assignmentContainer = document.getElementById('assignmentContainer');
      const wrapper = document.createElement('div');
      wrapper.style.display = 'flex';
      wrapper.style.gap = '10px';
      Object.keys(sportCfg.conferences).forEach(confName => {
        const confDiv = document.createElement('div');
        confDiv.style.flex = '1';
        confDiv.style.background = '#1a1a1a';
        confDiv.style.border = `2px solid ${getComputedStyle(document.body).getPropertyValue('--team-border')}`;
        confDiv.style.borderRadius = '8px';
        confDiv.style.padding = '6px';
        // Title
        const title = document.createElement('div');
        title.style.textAlign = 'center';
        title.style.fontWeight = '800';
        title.style.marginBottom = '4px';
        title.textContent = confName;
        confDiv.appendChild(title);
        const divs = sportCfg.conferences[confName];
        Object.keys(divs).forEach(divName => {
          const divSection = document.createElement('div');
          divSection.style.marginBottom = '6px';
          const divLabel = document.createElement('div');
          divLabel.style.fontSize = '12px';
          divLabel.style.color = '#bbbbbb';
          divLabel.style.textTransform = 'uppercase';
          divLabel.style.marginBottom = '2px';
          divLabel.textContent = divName;
          divSection.appendChild(divLabel);
          const teamsRow = document.createElement('div');
          teamsRow.style.display = 'grid';
          teamsRow.style.gridTemplateColumns = 'repeat(auto-fill, minmax(40px, 1fr))';
          teamsRow.style.gap = '4px';
          divs[divName].forEach(code => {
            const teamObj = getTeam(currentSport, code);
            const tdiv = document.createElement('div');
            tdiv.className = 'assignment-tile';
            tdiv.dataset.code = code;
            tdiv.onclick = () => toggleSold(code);
            const img = document.createElement('img');
            img.src = teamObj.image;
            img.alt = teamObj.name;
            img.style.width = '90%';
            img.style.objectFit = 'contain';
            img.onerror = () => {
              img.style.display = 'none';
              tdiv.textContent = code;
            };
            tdiv.appendChild(img);
            teamsRow.appendChild(tdiv);
          });
          divSection.appendChild(teamsRow);
          confDiv.appendChild(divSection);
        });
        wrapper.appendChild(confDiv);
      });
      assignmentContainer.appendChild(wrapper);
      updateStats();
    }

    // Directional break: group teams by cardinal direction (East, West, North, South)
    // The goal is to assign buyers to geographic directions spanning both conferences.
    // For NFL we merge AFC and NFC divisions with the same name (e.g. AFC East & NFC East)
    // into a single "East" group. For NBA and MLB we map divisions to East/West or
    // closest approximation (e.g. Atlantic counts as East, Pacific counts as West).
    function renderDirectionalBreak(sportCfg) {
      const assignmentContainer = document.getElementById('assignmentContainer');
      assignmentContainer.innerHTML = '';
      const groups = {};
      // Helper to normalise division names into cardinal directions
      function normaliseDirection(name) {
        const n = name.toLowerCase();
        if (n.includes('east')) return 'East';
        if (n.includes('west')) return 'West';
        if (n.includes('north')) return 'North';
        if (n.includes('south')) return 'South';
        // NBA/MLB special cases
        if (n.includes('atlantic') || n.includes('southeast') || n.includes('central')) return 'East';
        if (n.includes('northwest') || n.includes('pacific') || n.includes('southwest')) return 'West';
        return 'Other';
      }
      // Build groups from conference/division structure
      if (sportCfg.conferences) {
        Object.values(sportCfg.conferences).forEach(divObj => {
          Object.keys(divObj).forEach(divName => {
            const dir = normaliseDirection(divName);
            groups[dir] = groups[dir] || [];
            divObj[divName].forEach(code => {
              const teamObj = getTeam(currentSport, code);
              if (teamObj) groups[dir].push(teamObj);
            });
          });
        });
      }
      // If no groups were created (e.g., sport without conferences), fallback to first four groups
      const groupNames = Object.keys(groups).length ? Object.keys(groups) : ['East','West','North','South'];
      const wrapper = document.createElement('div');
      wrapper.style.display = 'grid';
      // Two columns; groups will wrap into rows automatically
      wrapper.style.gridTemplateColumns = '1fr 1fr';
      wrapper.style.gap = '8px';
      groupNames.forEach(dir => {
        const panel = document.createElement('div');
        panel.style.background = '#1a1a1a';
        panel.style.border = `2px solid ${getComputedStyle(document.body).getPropertyValue('--team-border')}`;
        panel.style.borderRadius = '8px';
        panel.style.padding = '6px';
        // Title
        const title = document.createElement('div');
        title.className = 'assignment-direction';
        title.style.textAlign = 'center';
        title.style.marginBottom = '4px';
        title.textContent = dir;
        panel.appendChild(title);
        const teams = groups[dir] || [];
        teams.forEach(teamObj => {
          const tile = document.createElement('div');
          tile.className = 'assignment-tile';
          tile.dataset.code = teamObj.code;
          tile.onclick = () => toggleSold(teamObj.code);
          const img = document.createElement('img');
          img.src = teamObj.image;
          img.alt = teamObj.name;
          img.style.width = '90%';
          img.style.objectFit = 'contain';
          img.onerror = () => {
            img.style.display = 'none';
            tile.textContent = teamObj.code;
          };
          tile.appendChild(img);
          panel.appendChild(tile);
        });
        wrapper.appendChild(panel);
      });
      assignmentContainer.appendChild(wrapper);
      updateStats();
    }

    // Divy break: divide teams evenly into spots (cards or positions)
    function renderDivyBreak(sportCfg) {
      const assignmentContainer = document.getElementById('assignmentContainer');
      const spots = sportCfg.divySpots || 8;
      const divyWrap = document.createElement('div');
      divyWrap.style.display = 'grid';
      divyWrap.style.gridTemplateColumns = `repeat(${Math.ceil(Math.sqrt(spots))}, 1fr)`;
      divyWrap.style.gap = '6px';
      // Distribute teams across spots evenly
      const teamsPerSpot = Math.ceil(sportCfg.teams.length / spots);
      for (let i = 0; i < spots; i++) {
        const spotDiv = document.createElement('div');
        spotDiv.style.background = '#1a1a1a';
        spotDiv.style.border = `2px solid ${getComputedStyle(document.body).getPropertyValue('--team-border')}`;
        spotDiv.style.borderRadius = '8px';
        spotDiv.style.padding = '6px';
        const title = document.createElement('div');
        title.className = 'assignment-direction';
        title.style.textAlign = 'center';
        title.style.marginBottom = '4px';
        title.textContent = `Spot ${i + 1}`;
        spotDiv.appendChild(title);
        const teamsForSpot = sportCfg.teams.slice(i * teamsPerSpot, (i + 1) * teamsPerSpot);
        teamsForSpot.forEach(teamObj => {
          const tile = document.createElement('div');
          tile.className = 'assignment-tile';
          tile.dataset.code = teamObj.code;
          tile.onclick = () => toggleSold(teamObj.code);
          const img = document.createElement('img');
          img.src = teamObj.image;
          img.alt = teamObj.name;
          img.style.width = '90%';
          img.style.objectFit = 'contain';
          img.onerror = () => {
            img.style.display = 'none';
            tile.textContent = teamObj.code;
          };
          tile.appendChild(img);
          spotDiv.appendChild(tile);
        });
        divyWrap.appendChild(spotDiv);
      }
      assignmentContainer.appendChild(divyWrap);
      updateStats();
    }

    // Toggle sold/unsold for a team/spot by code
    function toggleSold(code) {
      if (soldSet.has(code)) {
        soldSet.delete(code);
      } else {
        soldSet.add(code);
      }
      // update class on all matching tiles
      document.querySelectorAll(`[data-code="${code}"]`).forEach(el => {
        if (soldSet.has(code)) {
          el.classList.add('sold');
        } else {
          el.classList.remove('sold');
        }
      });
      updateStats();
    }

    // Update counters
    function updateStats() {
      // remaining = total assignments minus sold
      let total = 0;
      if (currentBreak === 'team') {
        total = sportsData[currentSport].teams.length;
      } else if (currentBreak === 'conference') {
        const confs = sportsData[currentSport].conferences;
        Object.values(confs).forEach(divObj => {
          Object.values(divObj).forEach(arr => total += arr.length);
        });
      } else if (currentBreak === 'directional') {
        // Directional break uses all teams grouped by direction
        total = sportsData[currentSport].teams.length;
      } else if (currentBreak === 'divy') {
        total = sportsData[currentSport].teams.length;
      }
      const sold = soldSet.size;
      document.getElementById('remainingCount').textContent = total - sold;
      document.getElementById('soldCount').textContent = sold;
    }

    // Change sport selection
    function changeSport(value) {
      if (sportsData[value]) {
        currentSport = value;
        renderAssignments();
      }
    }

    // Change break type selection
    function changeBreakType(value) {
      currentBreak = value;
      renderAssignments();
    }

    // Cycle through sports when clicking Next
    function cycleSport() {
      const keys = Object.keys(sportsData);
      const idx = keys.indexOf(currentSport);
      currentSport = keys[(idx + 1) % keys.length];
      document.getElementById('sportSelect').value = currentSport;
      renderAssignments();
    }

    // Reset all sold markers
    function resetAll() {
      soldSet.clear();
      document.querySelectorAll('.assignment-tile').forEach(el => el.classList.remove('sold'));
      updateStats();
    }

    // Chat feed demonstration: append a message
    function appendChatMessage(msg) {
      const chatFeed = document.getElementById('chatFeed');
      const el = document.createElement('div');
      el.className = 'chat-msg';
      el.textContent = msg;
      chatFeed.appendChild(el);
      chatFeed.scrollTop = chatFeed.scrollHeight;
    }

    // Demo: populate chat feed with dummy messages
    function seedChat() {
      const sample = [
        'Welcome to the break!',
        'Spots still available!',
        'Awesome pull!',
        'Visit ratedrookies.com now!'
      ];
      let idx = 0;
      setInterval(() => {
        appendChatMessage(sample[idx % sample.length]);
        idx++;
      }, 8000);
    }

    // Scroll ticker update function
    function updateTicker(text) {
      const ticker = document.getElementById('scrollText');
      ticker.textContent = text;
      ticker.style.animation = 'none';
      void ticker.offsetWidth;
      ticker.style.animation = '';
    }

    // Initialise overlay
    window.addEventListener('DOMContentLoaded', () => {
      renderAssignments();
      seedChat();
    });

  </script>
