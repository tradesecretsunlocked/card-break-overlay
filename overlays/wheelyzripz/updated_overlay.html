<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wheely's Ripz — TikTok Break Overlay (Updated)</title>

  <!--
    This file contains an updated version of the Wheely's Ripz overlay.
    Changes include fully implemented directional and conference break
    types. The directional break groups the AFC/NFC divisions by
    compass direction (North, East, South, West). Each direction
    occupies one slot on the board and displays all the teams from the
    corresponding AFC and NFC divisions. Conference breaks display
    AFC and NFC separately, with all member teams on their respective
    side. The existing team and division modes are retained.
  -->

  <style>
    :root{
      /* Brand */
      --bg0:#050607;
      --bg1:#0b0d10;
      --panel:#0e1116;
      --panel2:#0b0f15;
      --silver:#c9c9c9;
      --white:#ffffff;
      --red:#d41b1b;
      --red2:#8e0f0f;
      --muted:#8a8f99;

      --stroke: rgba(255,255,255,0.50);
      --stroke2: rgba(255,255,255,0.08);

      --glowR: rgba(212,27,27,0.55);
      --glowW: rgba(255,255,255,0.10);

      --radius: 16px;
      --radius2: 12px;

      /* Canvas: choose your OBS browser source size */
      --W: 1080px;
     --H: 540px;

      /* Layout */
      --pad: 10px;
      --gap: 8px;

      /* Tiles */
      --tileH: 75px;
      --tileRadius: 14px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:transparent;
      font-family: Arial Black, Arial, sans-serif;
      user-select:none;
      overflow:hidden;
    }

    /* This stage is the actual overlay canvas */
    .stage{
      width: var(--W);
      height: var(--H);
      position: relative;
      overflow:hidden;
      background:
        radial-gradient(900px 900px at 20% 12%, rgba(212,27,27,0.18), transparent 55%),
        radial-gradient(700px 900px at 90% 35%, rgba(255,255,255,0.06), transparent 60%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      border-radius: 0px;
      margin:0 auto;
    }

    /* Optional: scale to fit when previewed in a normal browser window */
   .fit{
      position: absolute;
      inset:0;
    }

    .frame{
      position:absolute;
      inset: var(--pad);
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      border: 3px solid rgba(212,27,27,0.55);
      box-shadow:
        0 20px 60px rgba(0,0,0,0.55),
        0 0 28px rgba(212,27,27,0.25);
      overflow:hidden;
    }

    .header{
      height: 75px;
      display:flex;
      align-items:center;
      gap: 14px;
      padding: 5px 5px;
      background:
        linear-gradient(90deg, rgba(212,27,27,0.30), rgba(255,255,255,0.04) 45%, rgba(0,0,0,0.18) 100%);
      border-bottom: 1px solid var(--stroke);
    }

    .brand-left{
      display:flex;
      align-items:center;
      gap: 22px;
      min-width: 0;
      flex: 1;
    }
    .brand-logo{
      width: 160px;
      height: 100px;
      border-radius: 18px;
      border: 2px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.22);
      display:inline-grid;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      box-shadow: 0 0 18px rgba(212,27,27,0.18);
    }
    .brand-logo img{
      width: 93%;
      height: 100%;
      object-fit: contain;
      display:block;
      filter: drop-shadow(0 8px 18px rgba(0,0,0,0.45));
    }

    .brand-text{
      display:flex;
      flex-direction:column;
      gap: 4px;
      min-width:0;
    }
    .brand-title{
      font-size: 34px;
      letter-spacing: 1.2px;
      color: var(--white);
      text-transform: uppercase;
      line-height:1;
      text-shadow: 0 3px 10px rgba(0,0,0,0.55);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .brand-sub{
      font-size: 16px;
      color: rgba(255,255,255,0.78);
      letter-spacing: 0.6px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .header-right{
      display:flex;
      align-items:center;
      gap: 10px;
    }

    .pill{
      height: 44px;
      padding: 0 12px;
      border-radius: 999px;
      display:flex;
      align-items:center;
      gap: 10px;
      background: rgba(0,0,0,0.34);
      border: 1px solid rgba(255,255,255,0.14);
      box-shadow: inset 0 0 12px rgba(255,255,255,0.04);
      color: var(--white);
    }
    .pill label{
      font-size: 12px;
      opacity: 0.75;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }
    .pill select{
      background: rgba(255,255,255,0.06);
      color: var(--white);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 10px;
      padding: 6px 10px;
      font-weight: 900;
      letter-spacing: 0.4px;
      outline:none;
      cursor:pointer;
    }

    /* Group container (for divisions/directions/conferences) */
    .group {
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 5px;
      background: rgba(0,0,0,0.20);
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .group-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 15px;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: #fff;
      padding-bottom: 0px;
      border-bottom: 1px solid rgba(255,255,255,0.18);
    }

    .division-buyer {
      min-width: 140px;
      padding: 2px 1px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 900;
      text-align: center;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.85);
    }

    .main{
      position:absolute;
      left:0; right:0;
      top:72px;
      bottom: 132px; /* ticker space */
      padding: var(--pad);
      display:grid;
      grid-template-columns: 1fr 350px 1fr;
      align-items: stretch;
      grid-template-rows: 1fr;
      gap: var(--gap);
    }

    .panel{
      background: linear-gradient(180deg, rgba(0,0,0,0.35), rgba(0,0,0,0.20));
      border: 2px solid var(--stroke);
      border-radius: var(--radius);
      box-shadow:
        inset 0 0 18px rgba(255,255,255,0.04),
        0 14px 40px rgba(0,0,0,0.35);
      overflow:hidden;
      position:relative;
    }

    /* Boards */
    .board{
      display:flex;
      flex-direction:column;
      min-height: 375px;
    }
    .board-body{
      padding: 4px;
      min-height: 0;
      height: 100%;
      overflow:hidden;
      display:flex;
      flex-direction:column;
      gap: 12px;
    }

    /* Grid container (used in team & division/direction rows) */
    .grid{
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
      min-height: 0;
      height: 100%;
      overflow: auto;
      padding-right: 0px;
    }
    .grid.team {
      grid-template-columns: repeat(4, 1fr);
    }

    /* Scrollbar */
    .grid::-webkit-scrollbar{width:8px}
    .grid::-webkit-scrollbar-thumb{
      background: rgba(255,255,255,0.12);
      border-radius: 999px;
    }
    .grid::-webkit-scrollbar-track{background: rgba(0,0,0,0.12)}

    /* Tile styles */
    .tile{
      height: var(--tileH);
      border-radius: var(--tileRadius);
      border: 1px solid rgba(255,255,255,0.12);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.06), rgba(0,0,0,0.22));
      box-shadow:
        inset 0 0 18px rgba(255,255,255,0.03),
        0 10px 22px rgba(0,0,0,0.32);
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding: 10px 12px;
      position:relative;
      overflow:hidden;
    }
    .tile.team-only {
      padding: 0;
    }
    .tile.team-only .logoBox {
      width: 100%;
      height: 100%;
      border-radius: inherit;
      border: none;
      background: transparent;
    }
    .tile.team-only .logoBox img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .tile::before{
      content:"";
      position:absolute;
      inset:-2px;
      background: radial-gradient(420px 120px at 20% 10%, rgba(212,27,27,0.16), transparent 55%);
      pointer-events:none;
    }
    .tile-left{
      display:flex;
      align-items:center;
      gap: 4px;
      position:relative;
      z-index:1;
    }
    .logoBox{
      width: 54px;
      height: 54px;
      border-radius: 14px;
      background: rgba(0,0,0,0.28);
      border: 1px solid rgba(255,255,255,0.12);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }
    .logoBox img{
      width: 100%;
      height: 100%;
      object-fit:cover;
      display:block;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.5));
    }

    /* Division/directional/conference team tile (logo only) */
    .tile.division-team {
      height: 50px;
      padding: 0;
      border-radius: 10px;
    }
    .tile.division-team .logoBox {
      width: 100%;
      height: 100%;
      border-radius: inherit;
      border: none;
      background: transparent;
    }
    .tile.division-team .logoBox img {
      object-fit: contain;
    }

    .tile-name,
    .tile-code{
      display: none;
    }
    .tile-right{
      display:flex;
      align-items:center;
      gap: 10px;
      position:relative;
      z-index:1;
    }
    .buyerTag{
      min-width: 180px;
      max-width: 220px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(0,0,0,0.30);
      color: rgba(255,255,255,0.88);
      font-weight: 900;
      font-size: 14px;
      letter-spacing: 0.4px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      text-align:center;
      box-shadow: inset 0 0 14px rgba(255,255,255,0.04);
    }
    .tile.sold{
      opacity: 0.58;
      filter: grayscale(35%);
    }
    .tile.sold:after{
      content:"SOLD";
      position:absolute;
      right: 14px;
      top: 10px;
      font-size: 14px;
      font-weight: 1000;
      letter-spacing: 1.4px;
      color: rgba(255,255,255,0.85);
      background: rgba(212,27,27,0.40);
      border: 1px solid rgba(255,255,255,0.16);
      padding: 6px 10px;
      border-radius: 999px;
      box-shadow: 0 0 18px rgba(212,27,27,0.25);
    }

    /* Sidebar */
    .side{
      display:flex;
      flex-direction:column;
      gap: var(--gap);
      height:100%;
      margin-top:auto;
    }

    .cam{
      padding: 0px;
    }
    .camBox{
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 18px;
      border: 2px solid rgba(212,27,27,0.65);
      background:
        radial-gradient(600px 220px at 30% 20%, rgba(212,27,27,0.16), transparent 55%),
        rgba(0,0,0,0.35);
      box-shadow:
        0 14px 40px rgba(0,0,0,0.40),
        0 0 26px rgba(212,27,27,0.22),
        inset 0 0 22px rgba(255,255,255,0.04);
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      overflow:hidden;
    }
    .camBox .camLabel{
      font-size: 16px;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.70);
      text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(0,0,0,0.6);
    }

    /* Metrics */
    .metrics{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .metric{
      border-radius: 14px;
      padding: 10px 12px;
      border: 2px solid rgba(255,255,255,0.50);
      background: rgba(0,0,0,0.28);
      box-shadow: inset 0 0 16px rgba(255,255,255,0.03);
      display:flex;
      flex-direction:row;
      gap: 4px;
      align-items:center;
      justify-content:center;
      min-height: 62px;
    }
    .metric .num{
      font-size: 22px;
      color: var(--white);
      letter-spacing: 0.6px;
      text-shadow: 0 2px 12px rgba(0,0,0,0.55);
    }
    .metric .lbl{
      font-size: 12px;
      color: rgba(255,255,255,0.70);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Promo logo in sidebar */
    .promo{
      padding: 10px 12px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap: 12px;
    }
    .promo img{
      width: 100%;
      max-height: 52px;
      object-fit: fill;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.55));
      opacity: 0.95;
    }

    /* Ticker */
    .ticker{
      position:absolute;
      left:0; right:0;
      bottom:0;
      height: 66px;
      padding: 4px var(--pad) 18px var(--pad);
      display:flex;
      flex-direction:column;
      gap: 10px;
      background: linear-gradient(180deg, transparent, rgba(0,0,0,0.52));
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .tickerBox{
      height: 40px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.14);
      background:
        linear-gradient(90deg, rgba(212,27,27,0.25), rgba(255,255,255,0.04) 55%, rgba(0,0,0,0.22));
      box-shadow:
        0 14px 40px rgba(0,0,0,0.35),
        inset 0 0 18px rgba(255,255,255,0.04);
      display:flex;
      align-items:center;
      overflow:hidden;
      position:relative;
    }
    .tickerBox:before{
      content:"";
      position:absolute;
      inset: -2px;
      background: radial-gradient(800px 120px at 20% 30%, rgba(255,255,255,0.08), transparent 60%);
      pointer-events:none;
    }
    .tickerText{
      width: 100%;
      padding: 0 18px;
      font-size: 22px;
      letter-spacing: 0.8px;
      color: rgba(255,255,255,0.92);
      font-weight: 1000;
      white-space: nowrap;
      overflow:hidden;
      text-shadow: 0 2px 14px rgba(0,0,0,0.65);
    }
    .marquee{
      display:inline-block;
      padding-left: 100%;
      animation: scroll 18s linear infinite;
    }
    @keyframes scroll{
      0%{ transform: translateX(0) }
      100%{ transform: translateX(-100%) }
    }

    /* Admin controls */
    .admin{
      display:none;
      gap: 10px;
      align-items:center;
      justify-content:flex-end;
      padding: 0 var(--pad);
    }
    .admin.on{ display:flex; }
    .btn{
      height: 44px;
      padding: 0 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(0,0,0,0.32);
      color: rgba(255,255,255,0.92);
      font-weight: 1000;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      cursor:pointer;
      box-shadow: inset 0 0 14px rgba(255,255,255,0.03);
    }
    .btn.red{
      border-color: rgba(212,27,27,0.55);
      box-shadow: 0 0 18px rgba(212,27,27,0.18), inset 0 0 14px rgba(255,255,255,0.03);
    }

    .hint{
      font-size: 12px;
      color: rgba(255,255,255,0.65);
      letter-spacing: 0.4px;
    }
  </style>
</head>

<body>
  <div class="stage">
    <div class="fit" id="fit">
      <div class="frame">

        <!-- HEADER -->
        <div class="header">
          <div class="brand-left">

            <div class="brand-text">
              <div class="brand-title">Wheely's Ripz</div>
              <div class="brand-sub">Live Breaks • Random Spots • Clean Boards</div>
            </div>
            <div class="brand-logo">
              <img src="../../images/logos/wripz-logo.png" alt="Wheely's Ripz"/>
            </div>
          </div>

          <div class="header-right">
            <div class="pill">
              <label>League</label>
              <select id="leagueSel">
                <option value="NFL">NFL</option>
                <option value="NBA">NBA</option>
                <option value="MLB">MLB</option>
              </select>
            </div>

            <div class="pill">
              <label>Break</label>
              <select id="breakSel">
                <option value="TEAM">Team</option>
                <option value="DIVISION">Divisions (NFL)</option>
                <option value="CONFERENCE">Conference (NFL)</option>
                <option value="DIRECTIONAL">Directional (NFL)</option>
              </select>
            </div>
          </div>
        </div>

        <!-- MAIN -->
        <div class="main">

          <!--Left BOARD -->
          <div class="panel board">
             <div class="board-body" id="boardLeft">
              <div class="grid" id="gridLeft"></div>
            </div>
          </div>

          <!-- SIDE -->
          <div class="side">
            <div class="panel cam">
              <div style="padding:0px;">
                <div class="camBox">
                  <div class="camLabel">Face Cam</div>
                </div>
              </div>
            </div>
            <div class="panel promo">
              <img src="../../images/logos/ratedrookiesURL.png" alt="ratedrookies.com"/>
            </div>
          
            <div class="admin" id="adminBar">
              <button class="btn red" id="resetBtn">Reset Board</button>
              <button class="btn" id="demoSaleBtn">Demo Sale</button>
              <div class="hint" id="connHint">SSE: not connected</div>
            </div>
            <div class="metrics">
              <div class="metric">
                <div class="num" id="soldNum">0</div>
                <div class="lbl">Sold</div>
              </div>
              <div class="metric">
                <div class="num" id="remainingNum">0</div>
                <div class="lbl">Remaining</div>
              </div>
            </div>
          </div>
        <!-- RIGHT BOARD -->
        <div class="panel board">
          <div class="board-body" id="boardRight">
            <div class="grid" id="gridRight"></div>
          </div>
        </div>

        </div>
        <!-- TICKER -->
        <div class="ticker">
          <div class="tickerBox">
            <div class="tickerText" title="Click text to edit (admin mode)">
              <span class="marquee" id="tickerMarquee">Type your scrolling promo text here… giveaways… website… shipping… whatever you want.</span>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    /************************************************************
     *  Updated overlay script with directional and conference modes
     ************************************************************/

    // ---------- URL FLAGS ----------
    const params = new URLSearchParams(location.search);
    const ADMIN = params.get("admin") === "1";

    // ---------- ASSET PATHS ----------
    const PATH = {
      NFL: "../../images/nfl/",

      MLB: "../../images/mlb/"
    };

    // ---------- DATA (CODES + LOGOS) ----------
    const NFL_TEAMS = [

    const AFC_CODES = new Set([
      "BAL","BUF","CIN","CLE","DEN","HOU","IND","JAX",
      "KC","LAC","LV","MIA","NE","NYJ","PIT","TEN"
    ]);

    const NFC_CODES = new Set([
      "ARI","ATL","CAR","CHI","DAL","DET","GB","LAR",
      "MIN","NO","NYG","PHI","SEA","SF","TB","WAS"
    ]);

    const NFL_DIVISION_MAP = {
      AFCE: ["BUF","MIA","NE","NYJ"],
      AFCN: ["BAL","CIN","CLE","PIT"],
      AFCS: ["HOU","IND","JAX","TEN"],
      AFCW: ["DEN","KC","LAC","LV"],

      NFCN: ["CHI","DET","GB","MIN"],
      NFCS: ["ATL","CAR","NO","TB"],
      NFCW: ["ARI","LAR","SEA","SF"]
    };

    const NFL_DIVISIONS = [
      { code:"AFCE", name:"AFC East",   logo:"afc.png" },
      { code:"AFCN", name:"AFC North",  logo:"afc.png" },
      { code:"AFCS", name:"AFC South",  logo:"afc.png" },
      { code:"AFCW", name:"AFC West",   logo:"afc.png" },
      { code:"NFCE", name:"NFC East",   logo:"nfc.png" },
      { code:"NFCN", name:"NFC North",  logo:"nfc.png" },
      { code:"NFCS", name:"NFC South",  logo:"nfc.png" },
      { code:"NFCW", name:"NFC West",   logo:"nfc.png" }
    ];

    const NFL_CONFERENCE = [
      { code:"AFC", name:"AFC Conference", logo:"afc.png" },
      { code:"NFC", name:"NFC Conference", logo:"nfc.png" }
    ];

    const NFL_DIRECTIONAL = [
      { code:"NORTH", name:"North", logo:"nfl.png" },
      { code:"EAST",  name:"East",  logo:"nfl.png" },
      { code:"SOUTH", name:"South", logo:"nfl.png" },
      { code:"WEST",  name:"West",  logo:"nfl.png" }
    ];

    // Map directions to divisions (pair of AFC/NFC divisions)
    const DIRECTION_MAP = {
      NORTH: ["AFCN","NFCN"],
      EAST:  ["AFCE","NFCE"],
      SOUTH: ["AFCS","NFCS"],
      WEST:  ["AFCW","NFCW"]
    };

    // For NBA/MLB we’ll just map codes to filenames as you already have them.
    // If your filenames differ, update these arrays once and you’re done.
    const NBA_TEAMS = [
      { code:"ATL", name:"Atlanta Hawks", logo:"hawks.png" },
      { code:"BOS", name:"Boston Celtics", logo:"celtics.png" },
      { code:"BKN", name:"Brooklyn Nets", logo:"nets.png" },
      { code:"CHA", name:"Charlotte Hornets", logo:"hornets.png" },
      { code:"CHI", name:"Chicago Bulls", logo:"bulls.png" },
      { code:"CLE", name:"Cleveland Cavaliers", logo:"cavaliers.png" },
      { code:"DAL", name:"Dallas Mavericks", logo:"mavericks.png" },
      { code:"DEN", name:"Denver Nuggets", logo:"nuggets.png" },
      { code:"DET", name:"Detroit Pistons", logo:"pistons.png" },
      { code:"GSW", name:"Golden State Warriors", logo:"warriors.png" },
      { code:"HOU", name:"Houston Rockets", logo:"rockets.png" },
      { code:"IND", name:"Indiana Pacers", logo:"pacers.png" },
      { code:"LAC", name:"LA Clippers", logo:"clippers.png" },
      { code:"LAL", name:"Los Angeles Lakers", logo:"lakers.png" },
      { code:"MEM", name:"Memphis Grizzlies", logo:"grizzlies.png" },
      { code:"MIA", name:"Miami Heat", logo:"heat.png" },
      { code:"MIL", name:"Milwaukee Bucks", logo:"bucks.png" },
      { code:"MIN", name:"Minnesota Timberwolves", logo:"timberwolves.png" },
      { code:"NOP", name:"New Orleans Pelicans", logo:"pelicans.png" },
      { code:"NYK", name:"New York Knicks", logo:"knicks.png" },
      { code:"OKC", name:"Oklahoma City Thunder", logo:"thunder.png" },
      { code:"ORL", name:"Orlando Magic", logo:"magic.png" },
      { code:"PHI", name:"Philadelphia 76ers", logo:"76ers.png" },
      { code:"PHX", name:"Phoenix Suns", logo:"suns.png" },
      { code:"POR", name:"Portland Trail Blazers", logo:"blazers.png" },
      { code:"SAC", name:"Sacramento Kings", logo:"kings.png" },
      { code:"SAS", name:"San Antonio Spurs", logo:"spurs.png" },
      { code:"TOR", name:"Toronto Raptors", logo:"raptors.png" },
      { code:"UTA", name:"Utah Jazz", logo:"jazz.png" },
      { code:"WAS", name:"Washington Wizards", logo:"wizards.png" }
    ];

    const MLB_TEAMS = [
      { code:"ARI", name:"Arizona Diamondbacks", logo:"diamondbacks.png" },
      { code:"ATL", name:"Atlanta Braves", logo:"braves.png" },
      { code:"BAL", name:"Baltimore Orioles", logo:"orioles.png" },
      { code:"BOS", name:"Boston Red Sox", logo:"redsox.png" },
      { code:"CHC", name:"Chicago Cubs", logo:"cubs.png" },
      { code:"CWS", name:"Chicago White Sox", logo:"whitesox.png" },
      { code:"CIN", name:"Cincinnati Reds", logo:"reds.png" },
      { code:"CLE", name:"Cleveland Guardians", logo:"guardians.png" },
      { code:"COL", name:"Colorado Rockies", logo:"rockies.png" },
      { code:"DET", name:"Detroit Tigers", logo:"tigers.png" },
      { code:"HOU", name:"Houston Astros", logo:"astros.png" },
      { code:"KC",  name:"Kansas City Royals", logo:"royals.png" },
      { code:"LAA", name:"Los Angeles Angels", logo:"angels.png" },
      { code:"LAD", name:"Los Angeles Dodgers", logo:"dodgers.png" },
      { code:"MIA", name:"Miami Marlins", logo:"marlins.png" },
      { code:"MIL", name:"Milwaukee Brewers", logo:"brewers.png" },
      { code:"MIN", name:"Minnesota Twins", logo:"twins.png" },
      { code:"NYM", name:"New York Mets", logo:"mets.png" },
      { code:"NYY", name:"New York Yankees", logo:"yankees.png" },
      { code:"OAK", name:"Oakland Athletics", logo:"athletics.png" },
      { code:"PHI", name:"Philadelphia Phillies", logo:"phillies.png" },
      { code:"PIT", name:"Pittsburgh Pirates", logo:"pirates.png" },
      { code:"SD",  name:"San Diego Padres", logo:"padres.png" },
      { code:"SEA", name:"Seattle Mariners", logo:"mariners.png" },
      { code:"SF",  name:"San Francisco Giants", logo:"giants.png" },
      { code:"STL", name:"St. Louis Cardinals", logo:"cardinals.png" },
      { code:"TB",  name:"Tampa Bay Rays", logo:"rays.png" },
      { code:"TEX", name:"Texas Rangers", logo:"rangers.png" },
      { code:"TOR", name:"Toronto Blue Jays", logo:"bluejays.png" },
      { code:"WSH", name:"Washington Nationals", logo:"nationals.png" }
    ];

    // ---------- UI ELEMENTS ----------
    const leagueSel = document.getElementById("leagueSel");
    const breakSel  = document.getElementById("breakSel");
    const gridLeft  = document.getElementById("gridLeft");
    const gridRight = document.getElementById("gridRight");
    const remainingNum = document.getElementById("remainingNum");
    const soldNum = document.getElementById("soldNum");
    const adminBar = document.getElementById("adminBar");
    const resetBtn = document.getElementById("resetBtn");
    const demoSaleBtn = document.getElementById("demoSaleBtn");
    const connHint = document.getElementById("connHint");
    const tickerMarquee = document.getElementById("tickerMarquee");

    const BOARDS = {
      LEFT: gridLeft,
      RIGHT: gridRight
    };

    let ACTIVE_BRIDGE = null;
    let BRIDGE_KEY = "";
    let eventSource = null;
    let didBoot = false;
    let ACTIVE_BREAK_ID = null;
    // Stored board: { key: { sold:boolean, buyer:string } }
    let boardState = {};

    // ---------- STORAGE KEYS ----------
    function storageKey(){
      return `wripz.${leagueSel.value}.${breakSel.value}.state`;
    }
    function tickerKey(){
      return `wripz.ticker`;
    }

    // ---------- ADMIN MODE ----------
    if (ADMIN){
      adminBar.classList.add("on");
      tickerMarquee.contentEditable = "true";
      tickerMarquee.style.outline = "none";
      tickerMarquee.style.cursor = "text";
      tickerMarquee.addEventListener("input", () => {
        localStorage.setItem(tickerKey(), tickerMarquee.textContent.trim());
      });
    }

    // ---------- BUILD LIST BY MODE ----------
    function buildTile(item, targetGrid){
      const key = item.code;
      const st = boardState[key] || { sold:false, buyer:"" };
      const isTeamMode = breakSel.value === "TEAM";

      const tile = document.createElement("div");
      tile.className = "tile" + (st.sold ? " sold" : "");
      tile.dataset.key = key;

      // TEAM mode: logo only
      if (isTeamMode){
        tile.classList.add("team-only");
        const logoBox = document.createElement("div");
        logoBox.className = "logoBox";
        const img = document.createElement("img");
        img.src = imgSrcFor(item);
        img.alt = item.code;
        logoBox.appendChild(img);
        tile.appendChild(logoBox);
        if (ADMIN){
          tile.style.cursor = "pointer";
          tile.addEventListener("click", () => {
            const next = !st.sold;
            const buyerName = next ? (prompt("Buyer name?") || "").trim() : "";
            applySale({ selectionCode: key, buyerName, sold: next, source: "admin-click" });
          });
        }
        targetGrid.appendChild(tile);
        return;
      }

      // NON-TEAM mode: full tile with name and buyer tag
      const left = document.createElement("div");
      left.className = "tile-left";
      const logoBox = document.createElement("div");
      logoBox.className = "logoBox";
      const img = document.createElement("img");
      img.src = imgSrcFor(item);
      img.alt = item.code;
      logoBox.appendChild(img);
      const nameWrap = document.createElement("div");
      nameWrap.style.minWidth = "0";
      const nm = document.createElement("div");
      nm.className = "tile-name";
      nm.textContent = item.name;
      const cd = document.createElement("div");
      cd.className = "tile-code";
      cd.textContent = item.code;
      nameWrap.appendChild(nm);
      nameWrap.appendChild(cd);
      left.appendChild(logoBox);
      left.appendChild(nameWrap);
      const right = document.createElement("div");
      right.className = "tile-right";
      const buyer = document.createElement("div");
      buyer.className = "buyerTag";
      buyer.textContent = st.buyer || "Available";
      right.appendChild(buyer);
      tile.appendChild(left);
      tile.appendChild(right);
      if (ADMIN){
        tile.style.cursor = "pointer";
        tile.addEventListener("click", () => {
          const next = !st.sold;
          const buyerName = next ? (prompt("Buyer name?") || "").trim() : "";
          applySale({ selectionCode: key, buyerName, sold: next, source:"admin-click" });
        });
      }
      targetGrid.appendChild(tile);
    }

    // Build a minimal logo tile for divisions/directions/conferences
    function buildDivisionTeamTile(team){
      const tile = document.createElement("div");
      tile.className = "tile division-team";
      const logoBox = document.createElement("div");
      logoBox.className = "logoBox";
      const img = document.createElement("img");
      img.src = imgSrcFor(team);
      img.alt = team.code;
      logoBox.appendChild(img);
      tile.appendChild(logoBox);
      return tile;
    }

    // ---------- REBUILD BOARDS ----------
    function rebuildBoards_TEAM(){
      console.log("REBUILD -> league:", leagueSel.value, "mode:", breakSel.value);
      loadState();
      BOARDS.LEFT.innerHTML = "";
      BOARDS.RIGHT.innerHTML = "";
      // reset grid classes every rebuild
      BOARDS.LEFT.className = "grid";
      BOARDS.RIGHT.className = "grid";
      const mode   = breakSel.value;
      if (mode === "TEAM") {
        renderTEAM();
        return;
      }
      if (mode === "DIVISION") {
        renderDIVISION();
        return;
      }
      if (mode === "DIRECTIONAL") {
        renderDIRECTIONAL();
        return;
      }
      if (mode === "CONFERENCE") {
        renderCONFERENCE();
        return;
      }
    }

    // Render TEAM board: split teams by conference
    function renderTEAM(){
      const items = getActiveItems();
      BOARDS.LEFT.classList.add("team");
      BOARDS.RIGHT.classList.add("team");
      if (leagueSel.value === "NFL"){
        const left  = items.filter(t => AFC_CODES.has(t.code));
        const right = items.filter(t => NFC_CODES.has(t.code));
        left.forEach(i  => buildTile(i, BOARDS.LEFT));
        right.forEach(i => buildTile(i, BOARDS.RIGHT));
      } else {
        items.forEach(i => buildTile(i, BOARDS.LEFT));
      }
      updateMetrics();
    }

    // Render DIVISION board: group by each division
    function renderDIVISION(){
      BOARDS.LEFT.className = "";
      BOARDS.RIGHT.className = "";
      BOARDS.LEFT.innerHTML = "";
      BOARDS.RIGHT.innerHTML = "";
      const AFC_DIVS = ["AFCE","AFCN","AFCS","AFCW"];
      const NFC_DIVS = ["NFCE","NFCN","NFCS","NFCW"];
      function renderSide(target, divCodes){
        divCodes.forEach(divCode => {
          const divMeta = NFL_DIVISIONS.find(d => d.code === divCode);
          const state = boardState[divCode] || { sold:false, buyer:"" };
          const group = document.createElement("div");
          group.className = "group";
          group.dataset.key = divCode;
          const title = document.createElement("div");
          title.className = "group-title";
          title.textContent = divMeta.name;
          const buyer = document.createElement("div");
          buyer.className = "division-buyer";
          buyer.textContent = state.buyer || "Available";
          title.appendChild(buyer);
          group.appendChild(title);
          const row = document.createElement("div");
          row.className = "grid team";
          row.style.height = "auto";
          row.style.overflow = "hidden";
          NFL_DIVISION_MAP[divCode]
            .map(teamByCode)
            .forEach(team => row.appendChild(buildDivisionTeamTile(team)));
          group.appendChild(row);
          if (ADMIN){
            group.style.cursor = "pointer";
            group.addEventListener("click", () => {
              const next = !state.sold;
              const buyerName = next ? prompt("Buyer name?") || "" : "";
              applySale({ selectionCode: divCode, buyerName, sold: next });
            });
          }
          if (state.sold) group.classList.add("sold");
          target.appendChild(group);
        });
      }
      renderSide(BOARDS.LEFT, AFC_DIVS);
      renderSide(BOARDS.RIGHT, NFC_DIVS);
      updateMetrics();
    }

    // Render DIRECTIONAL board: group by North/East/South/West
    function renderDIRECTIONAL(){
      BOARDS.LEFT.className = "";
      BOARDS.RIGHT.className = "";
      BOARDS.LEFT.innerHTML = "";
      BOARDS.RIGHT.innerHTML = "";
      // determine side codes: first two directions on left, last two on right
      const LEFT_DIRS = ["NORTH","EAST"];
      const RIGHT_DIRS = ["SOUTH","WEST"];
      function renderSide(target, dirCodes){
        dirCodes.forEach(dirCode => {
          const dirMeta = NFL_DIRECTIONAL.find(d => d.code === dirCode);
          const state = boardState[dirCode] || { sold:false, buyer:"" };
          const group = document.createElement("div");
          group.className = "group";
          group.dataset.key = dirCode;
          const title = document.createElement("div");
          title.className = "group-title";
          title.textContent = dirMeta.name;
          const buyer = document.createElement("div");
          buyer.className = "division-buyer";
          buyer.textContent = state.buyer || "Available";
          title.appendChild(buyer);
          group.appendChild(title);
          const row = document.createElement("div");
          row.className = "grid team";
          row.style.height = "auto";
          row.style.overflow = "hidden";
          // collect teams from both divisions mapped to this direction
          DIRECTION_MAP[dirCode].forEach(divCode => {
            NFL_DIVISION_MAP[divCode]
              .map(teamByCode)
              .forEach(team => row.appendChild(buildDivisionTeamTile(team)));
          });
          group.appendChild(row);
          if (ADMIN){
            group.style.cursor = "pointer";
            group.addEventListener("click", () => {
              const next = !state.sold;
              const buyerName = next ? prompt("Buyer name?") || "" : "";
              applySale({ selectionCode: dirCode, buyerName, sold: next });
            });
          }
          if (state.sold) group.classList.add("sold");
          target.appendChild(group);
        });
      }
      renderSide(BOARDS.LEFT, LEFT_DIRS);
      renderSide(BOARDS.RIGHT, RIGHT_DIRS);
      updateMetrics();
    }

    // Render CONFERENCE board: split AFC vs NFC
    function renderCONFERENCE(){
      BOARDS.LEFT.className = "";
      BOARDS.RIGHT.className = "";
      BOARDS.LEFT.innerHTML = "";
      BOARDS.RIGHT.innerHTML = "";
      // Left: AFC; Right: NFC
      function renderConf(target, confCode){
        const confMeta = NFL_CONFERENCE.find(c => c.code === confCode);
        const state = boardState[confCode] || { sold:false, buyer:"" };
        const group = document.createElement("div");
        group.className = "group";
        group.dataset.key = confCode;
        const title = document.createElement("div");
        title.className = "group-title";
        title.textContent = confMeta.name;
        const buyer = document.createElement("div");
        buyer.className = "division-buyer";
        buyer.textContent = state.buyer || "Available";
        title.appendChild(buyer);
        group.appendChild(title);
        const row = document.createElement("div");
        row.className = "grid team";
        row.style.height = "auto";
        row.style.overflow = "hidden";
        const teams = (confCode === "AFC") ? NFL_TEAMS.filter(t => AFC_CODES.has(t.code)) : NFL_TEAMS.filter(t => NFC_CODES.has(t.code));
        teams.forEach(team => row.appendChild(buildDivisionTeamTile(team)));
        group.appendChild(row);
        if (ADMIN){
          group.style.cursor = "pointer";
          group.addEventListener("click", () => {
            const next = !state.sold;
            const buyerName = next ? prompt("Buyer name?") || "" : "";
            applySale({ selectionCode: confCode, buyerName, sold: next });
          });
        }
        if (state.sold) group.classList.add("sold");
        target.appendChild(group);
      }
      renderConf(BOARDS.LEFT, "AFC");
      renderConf(BOARDS.RIGHT, "NFC");
      updateMetrics();
    }

    // ---------- UTILITY FUNCTIONS ----------
    function getActiveItems(){
      const league = leagueSel.value;
      const mode = breakSel.value;
      if (league === "NFL"){
        if (mode === "TEAM") return NFL_TEAMS;
        if (mode === "DIVISION") return NFL_DIVISIONS;
        if (mode === "CONFERENCE") return NFL_CONFERENCE;
        if (mode === "DIRECTIONAL") return NFL_DIRECTIONAL;
        return NFL_TEAMS;
      }
      if (league === "NBA") return NBA_TEAMS;
      if (league === "MLB") return MLB_TEAMS;
      return NFL_TEAMS;
    }

    // Adjust break selector choices based on league
    function refreshBreakOptions(){
      const league = leagueSel.value;
      const cur = breakSel.value;
      if (league === "NFL"){
        breakSel.innerHTML = `
          <option value="TEAM">Team</option>
          <option value="DIVISION">Divisions (NFL)</option>
          <option value="CONFERENCE">Conference (NFL)</option>
          <option value="DIRECTIONAL">Directional (NFL)</option>
        `;
        if ([...breakSel.options].some(o => o.value === cur)) breakSel.value = cur;
        return;
      }
      breakSel.innerHTML = `<option value="TEAM">Team</option>`;
      breakSel.value = "TEAM";
    }

    function imgSrcFor(item){
      const league = leagueSel.value;
      const base = PATH[league] || PATH.NFL;
      return base + (item.logo || (league.toLowerCase() + ".png"));
    }
    function loadState(){
      const raw = localStorage.getItem(storageKey());
      boardState = raw ? JSON.parse(raw) : {};
    }
    function saveState(){
      localStorage.setItem(storageKey(), JSON.stringify(boardState));
    }

    function updateMetrics(){
      let keys = [];
      if (leagueSel.value === "NFL" && breakSel.value === "DIVISION"){
        keys = Object.keys(NFL_DIVISION_MAP);
      } else if (leagueSel.value === "NFL" && breakSel.value === "CONFERENCE"){
        keys = NFL_CONFERENCE.map(c => c.code);
      } else if (leagueSel.value === "NFL" && breakSel.value === "DIRECTIONAL"){
        keys = Object.keys(DIRECTION_MAP);
      } else {
        keys = getActiveItems().map(x => x.code);
      }
      let sold = 0;
      keys.forEach(k => {
        const st = boardState[k];
        if (st && st.sold) sold++;
      });
      remainingNum.textContent = keys.length - sold;
      soldNum.textContent = sold;
    }

    // ---------- APPLY SALE (BOARD UPDATE) ----------
    function applySale(evt){
      // evt: { selectionCode, buyerName, sold }
      const selectionCode = evt.selectionCode;
      const items = getActiveItems();
      const exists = items.some(i => i.code === selectionCode);
      // if not part of active items (e.g. direction or conference), still proceed
      const st = boardState[selectionCode] || { sold:false, buyer:"" };
      const nextSold = (typeof evt.sold === "boolean") ? evt.sold : true;
      st.sold = nextSold;
      st.buyer = nextSold ? (evt.buyerName || st.buyer || "Unknown") : "";
      boardState[selectionCode] = st;
      saveState();
      // Update UI: mark groups sold/un-sold
      const group = document.querySelector(`.group[data-key="${selectionCode}"]`);
      if (group){
        group.classList.toggle("sold", st.sold);
        const buyerBox = group.querySelector(".division-buyer");
        if (buyerBox){
          buyerBox.textContent = st.sold ? st.buyer : "Available";
        }
      }
      updateMetrics();
    }

    // ---------- RESET ----------
    function resetBoard(){
      boardState = {};
      saveState();
      rebuildBoards_TEAM();
    }

    // ---------- TICKER ----------
    function loadTicker(){
      const t = localStorage.getItem(tickerKey());
      if (t && t.trim()) tickerMarquee.textContent = t.trim();
    }
    loadTicker();

    // ---------- BRIDGE (simplified, no SSE actions here) ----------
    function detectBridgeBase(){
      if (params.has("bridge")) return params.get("bridge");
      return null;
    }
    function detectBridgeKey(){
      if (params.has("key")) return params.get("key");
      return "";
    }

    function boot(){
      if (!ADMIN){
        connHint.textContent = "SSE: hidden (admin=0)";
      }
      refreshBreakOptions();
      // Restore last selected league/mode
      const lastLeague = localStorage.getItem("wripz.lastLeague");
      const lastMode   = localStorage.getItem("wripz.lastMode");
      if (lastLeague && ["NFL","NBA","MLB"].includes(lastLeague)) {
        leagueSel.value = lastLeague;
      }
      refreshBreakOptions();
      if (leagueSel.value === "NFL") {
        breakSel.value = (lastMode && ["TEAM","DIVISION","CONFERENCE","DIRECTIONAL"].includes(lastMode)) ? lastMode : "TEAM";
      } else {
        breakSel.value = "TEAM";
      }
      rebuildBoards_TEAM();
      // Save selections on change
      leagueSel.addEventListener("change", () => {
        localStorage.setItem("wripz.lastLeague", leagueSel.value);
        refreshBreakOptions();
        rebuildBoards_TEAM();
      });
      breakSel.addEventListener("change", () => {
        localStorage.setItem("wripz.lastMode", breakSel.value);
        rebuildBoards_TEAM();
      });
      // Buttons
      if (resetBtn) resetBtn.addEventListener("click", resetBoard);
      if (demoSaleBtn) demoSaleBtn.addEventListener("click", () => {
        const items = getActiveItems();
        const pick = items[Math.floor(Math.random()*items.length)];
        applySale({ selectionCode: pick.code, buyerName: "demoBuyer", sold:true });
      });
    }
    boot();
  </script>
