<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, initial-scale=1.0" />
  <title>HIT CHASERS – NBA Break Overlay</title>

  <style>
    :root{
      /* HIT CHASERS – prestige */
      --bg0:#050505;
      --bg1:#0b0b0b;

      --gold:#d8b24c;
      --gold2:#ffdd7a;
      --ink:#000000;
      --white:#ffffff;

      --panel: rgba(10,10,10,0.92);
      --stroke: rgba(216,178,76,0.55);
      --stroke2: rgba(255,221,122,0.35);

      --W:1080px;
      --H:auto;

      --radius:16px;
      --tileR:14px;

      --camW: 520px;
      --camH: 300px;

      --bannerH: 85px;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      background:transparent;
      font-family: Arial, sans-serif;
      color: var(--white);
      user-select:none;
    }

    .overlay{
      width: var(--W);
      background: radial-gradient(circle at 35% 0%, #1a1a1a 0%, #0b0b0b 45%, #050505 100%);
      border-radius: var(--radius);
      border: 2px solid rgba(255,255,255,0.08);
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.8),
        0 16px 40px rgba(0,0,0,0.75),
        0 0 30px rgba(216,178,76,0.18);
      padding: 20px;
      inset:20px;
      position: relative;
      overflow: hidden;
    }

    /* subtle ambient dust */
    .overlay::before{
      content:"";
      position:absolute; inset:-40px;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,221,122,0.08), transparent 55%),
        radial-gradient(circle at 85% 35%, rgba(216,178,76,0.08), transparent 60%),
        radial-gradient(circle at 35% 85%, rgba(255,255,255,0.05), transparent 55%);
      filter: blur(10px);
      opacity: .85;
      pointer-events:none;
    }

    /* Header */
    .header{
      position: relative;
      height: 78px;
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(0,0,0,0.65), rgba(0,0,0,0.25));
      border: 1px solid rgba(255,255,255,0.08);
      display:flex;
      align-items:center;
      padding: 10px 14px;
      overflow: visible;
      z-index: 5;
    }

    .brand-left{
      display:flex;
      align-items:center;
      gap: 10px;
      min-width: 240px;
    }

    .brand-left .title{
      font-weight: 900;
      letter-spacing: 2px;
      font-size: 28px;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 2px 0 rgba(0,0,0,0.85);
      opacity: 0.92;
    }

    .brand-center{
      position:absolute;
      left:50%;
      top: 70%;
      transform: translate(-50%,-50%);
      pointer-events:none;
      z-index: 5;
    }
    .brand-center img{
      height: 140px;
      width:auto;
      filter:
        drop-shadow(0 10px 18px rgba(0,0,0,0.65))
        drop-shadow(0 0 10px rgba(255, 206, 73, 0.604));
    }

    .header-right{
      margin-left:auto;
      display:flex;
      align-items:center;
      gap: 10px;
    }

    .break-pill{
      display:flex;
      align-items:center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(255,255,255,0.10);
      box-shadow: inset 0 0 0 1px rgba(216,178,76,0.10);
    }
    .break-pill .label{
      font-size: 24px;
      letter-spacing: 1px;
      opacity: .90;
      text-transform: uppercase;
    }
    .break-pill .value{
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 0.5px;
      color: var(--gold2);
      text-shadow: 0 2px 0 rgba(0,0,0,0.8);
      min-width: 36px;
      text-align:right;
    }

    /* Main area */
    .main{
      margin-top: 10px;
      display:grid;
      grid-template-columns: 255px 1fr 255px;
      gap: 10px;
      z-index: 2;
      position: relative;
    }

    /* ===== Border Wick Sweep (reusable) ===== */
    .wick{
      position: relative;
      border-radius: 14px;
    }
    .wick::after{
      content:"";
      position:absolute; inset:4px;
      border-radius: inherit;
      pointer-events:none;
      z-index: 0;


      /* “hot wick” highlight */
      background:
        linear-gradient(130deg,
          transparent 0%,
          rgba(255,221,122,0) 35%,
          rgba(255,221,122,0.85) 50%,
          rgba(216,178,76,0.45) 56%,
          rgba(255,221,122,0) 70%,
          transparent 100%);
      background-size: 300% 300%;
      animation: wickRun 5.5s linear infinite;

      /* mask to border only */
      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      mask-composite: exclude;
      padding: 2px;

      filter: blur(7px);
      opacity: 0.95;
      mix-blend-mode: screen;
    }

    @keyframes wickRun{
      0%   { background-position:   0% 50%; }
      100% { background-position: 100% 50%; }
    }

    /* Team boards */
    .board{
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 14px;
      padding: 4px;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(216,178,76,0.12);
    }
    .board > *{ position: relative; z-index: 2; }

    .colgrid{
      display:grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 5px;
    }

    /* Center stack */
    .center{
      display:flex;
      flex-direction: column;
      gap: 10px;
      align-items: stretch;
      justify-content: space-evenly;
    }

    .cam{
      height: var(--camH);
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(0,0,0,0.25));
      border: 1px solid rgba(255,255,255,0.10);
      box-shadow:
        inset 0 0 0 2px rgba(0,0,0,0.35),
        0 0 0 1px rgba(216,178,76,0.15);
      position: relative;
      overflow: hidden;
    }

    /* gives “camera glass” feel without text */
    .cam::before{
      content:"";
      position:absolute; inset:0;
      background:
        radial-gradient(circle at 30% 30%, rgba(255,255,255,0.10), transparent 55%),
        radial-gradient(circle at 70% 70%, rgba(216,178,76,0.10), transparent 55%),
        linear-gradient(180deg, rgba(255,255,255,0.05), rgba(0,0,0,0.20));
      opacity: .9;
      pointer-events:none;
    }

    /* Bottom teams (10 teams) */
    .bottomGrid{
      display:grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }

    /* Tiles */
    .tile{
      height: 66px;
      border-radius: var(--tileR);
      background: rgba(10,10,10,0.78);
      border: 2px solid var(--gold);
      box-shadow:
        inset 0 0 0 1px rgba(0,0,0,0.55),
        0 6px 14px rgba(0,0,0,0.45);
      position: relative;
      overflow: hidden;
      cursor: pointer;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .tile img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.6));
      z-index: 2;
      position: relative;
    }

    /* subtle gold underglow, moving slightly */
    .tile::before{
      content:"";
      position:absolute;
      inset:-18px;
      background: radial-gradient(circle at 20% 70%, rgba(216,178,76,0.35), transparent 55%);
      filter: blur(14px);
      opacity: 0.55;
      animation: tileGlowDrift 4.5s ease-in-out infinite;
      z-index: 1;
      pointer-events:none;
    }
    @keyframes tileGlowDrift{
      0%   { transform: translate(-4px, 2px) scale(0.98); opacity: 0.40; }
      50%  { transform: translate(6px,-2px) scale(1.05); opacity: 0.65; }
      100% { transform: translate(-4px, 2px) scale(0.98); opacity: 0.40; }
    }

    .tile.sold img{
      filter: grayscale(1) brightness(0.45);
      opacity: 0.95;
    }
    .tile.sold::after{
      content:"✕";
      position:absolute; inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size: 54px;
      font-weight: 900;
      color: rgba(255,221,122,0.95);
      text-shadow:
        0 0 10px rgba(216,178,76,0.60),
        0 0 18px rgba(255,221,122,0.45),
        0 8px 22px rgba(0,0,0,0.85);
      z-index: 3;
      pointer-events:none;
    }
    .tile.sold::before{
      opacity: 0.12;
      animation: none;
    }

.sideStack{
  display:flex;
  flex-direction: column;
  gap: 6px;
}

.infoPanel{
  background: rgba(0,0,0,0.35);
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: 14px;
  padding: 10px 12px;
  box-shadow: inset 0 0 0 1px rgba(216,178,76,0.12);
  min-height: 108px; /* tune */
}

.infoPanel > *{ position: relative; z-index: 2; }

.infoTitle{
  font-weight: 900;
  letter-spacing: 1px;
  font-size: 12px;
  text-transform: uppercase;
  color: var(--gold2);
  opacity: 0.95;
  margin-bottom: 8px;
}

.infoBody{
  display:flex;
  flex-direction: column;
  gap: 8px;
  font-weight: 800;
}

.scoreRow{
  display:flex;
  justify-content: space-between;
  gap: 8px;
  font-size: 12px;
  opacity: 0.95;
}

.muted{ opacity: 0.75; font-weight: 800; }


    /* Promo banner (rotating 3 slides) */
    .banner{
  margin-top: 10px;
  height: var(--bannerH);
  border-radius: 14px;
  background: rgba(0,0,0,0.55);
  border: 1px solid rgba(255,255,255,0.10);
  box-shadow: inset 0 0 0 1px rgba(216,178,76,0.12);
  overflow:hidden;
  position: relative;
  z-index: 2;
}

/* each slide fills the whole bar */
.banner-inner{
  position:absolute;
  inset:0;
  opacity: 0;
  transform: translateY(50px);
  transition: opacity .85s ease, transform .85s ease;
  border-radius: 14px;
  overflow:hidden;
}

/* active slide visible */
.banner-inner.active{
  opacity: 1;
  transform: translateY(0);
}

/* background image takes whole slide */
.banner-inner .bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit: cover;
  opacity: 0.92;
  filter: saturate(1.05) contrast(1.02);
}

/* overlay layer so text is readable */
.banner-inner::after{
  content:"";
  position:absolute;
  inset:0;
 
}

/* content floats above */
.banner-content{
  position: relative;
  z-index: 2;
  height:100%;
  display:flex;
  align-items:center;
  gap: 2px;
  padding: 0 4px;
  border:solid 1px var(--gold2);
  border-radius: inherit;
}

.banner-badge{
  min-width: 44px;
  height: 44px;
  border-radius: 12px;
  background: linear-gradient(135deg, rgba(255,221,122,0.30), rgba(216,178,76,0.10));
  border: 1px solid rgba(255,255,255,0.12);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight: 900;
  color: var(--gold2);
  box-shadow: 0 10px 20px rgba(0,0,0,0.35);

  display:none;
}

.banner-text{
  display:flex;
  flex-direction:column;
  gap: 2px;
  line-height: 1.05;
  text-shadow: 0 2px 0 rgba(0,0,0,0.85);
}

.banner-text .top{
  font-size: 12px;
  letter-spacing: 1px;
  text-transform: uppercase;
  opacity: 0.85;
}
.banner-text .main{
  font-size: 20px;
  font-weight: 900;
  letter-spacing: 0.4px;
}


    /* Bottom control bar */
    .controls{
      margin-top: 10px;
      display:grid;
      grid-template-columns: 260px 1fr 1fr 260px;
      gap: 10px;
      z-index: 2;
      position: relative;
      /* border:solid 1px var(--gold2);*/
  border-radius: inherit;
    }

    .ctl{
      height: 65px;
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(0,0,0,0.60), rgba(0,0,0,0.30));
      border: 1px solid var(--gold2);
      box-shadow: inset 0 0 0 1px rgba(216,178,76,0.12);
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      position: relative;
      overflow:hidden;
      font-size:25px;
      cursor: pointer;
    }

    .ctl:active{ transform: translateY(1px); }
    .ctl.btn{
      color: var(--gold2);
    }

    .stat{
      flex-direction: column;
      gap: 2px;
      cursor: default;
    }
    .stat .v{
      font-size: 30px;
      color: #fff;
      text-shadow: 0 2px 0 rgba(0,0,0,0.85);
    }
    .stat .l{
      font-size: 16px;
      opacity: 0.85;
    }

    /* Sold panel */
    .sold-wrap{
      width: var(--W);
      margin-top: 10px;
      border-radius: 14px;
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(255,255,255,0.10);
      box-shadow: inset 0 0 0 1px rgba(216,178,76,0.12);
      padding: 10px;
      display:none;
    }
    .sold-wrap.active{ display:block; }

    .sold-top{
      display:flex;
      align-items:center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .pill{
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.14);
      color:#fff;
      font-weight: 900;
      font-size: 12px;
      letter-spacing: .7px;
      text-transform: uppercase;
      cursor:pointer;
    }
    .pill:hover{
      border-color: rgba(255,221,122,0.35);
      box-shadow: 0 0 0 2px rgba(216,178,76,0.15);
    }

    .sold-grid{
      display:grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .sold-item{
      display:flex;
      align-items:center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.10);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.45);
    }
    .sold-item img{
      height: 34px;
      width:auto;
      object-fit: contain;
      filter: drop-shadow(0 10px 16px rgba(0,0,0,0.55));
    }
    .sold-item input{
      width: 100%;
      border: none;
      outline: none;
      background: rgba(0,0,0,0.55);
      color: #fff;
      border-radius: 999px;
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 900;
    }

    /* Export popup */
    .popup{
      position: fixed;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      background: rgba(0,0,0,0.75);
      z-index: 99999;
    }
    .popup.active{ display:flex; }
    .popup-card{
      width: 720px;
      max-width: 92%;
      background: linear-gradient(135deg, rgba(25,25,25,0.98), rgba(10,10,10,0.98));
      border-radius: 16px;
      padding: 16px;
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 20px 60px rgba(0,0,0,0.85);
      display:flex;
      flex-direction:column;
      gap: 10px;
    }
    .popup-card h2{
      margin:0;
      font-size: 16px;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-align:center;
      color: var(--gold2);
    }
    .popup-card textarea{
      width:100%;
      height:220px;
      resize:none;
      background:#000;
      color:#00ff9c;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      padding: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 13px;
    }
    .popup-btns{
      display:flex;
      gap: 10px;
    }
    .popup-btns button{
      flex:1;
      padding: 12px;
      border: none;
      border-radius: 12px;
      font-weight: 900;
      cursor:pointer;
      background: rgba(216,178,76,0.95);
      color:#000;
    }

  </style>
</head>

<script>
  /* =========================
     Paths (standard BASE)
  ========================== */
  const BASE = (() => {
    const isGhPages = location.hostname.endsWith('github.io');
    if (isGhPages) {
      const parts = location.pathname.split('/').filter(Boolean);
      const repo = parts.length ? parts[0] : '';
      return `/${repo}/`;
    }
    return '../../';
  })();

  const LOGO_PATH = `${BASE}images/logos/primary.png`;         // <-- drop Hit Chasers logo here
  const nbaImg = (f) => `${BASE}images/nba/${f}`;
  const bannerImg = (f) => `${BASE}images/ads/${f}`;           // <-- optional banner images here

  document.getElementById('brandLogo').src = LOGO_PATH;

  // === Bridge URL (NO KEY in URL) ===
// Provide via ?bridge=https://YOUR-RENDER-APP.onrender.com
// Falls back to localStorage value (set once)
const BRIDGE_URL = (() => {
  const q = new URLSearchParams(location.search).get('bridge');
  if (q) {
    localStorage.setItem('tsu.bridge', q.replace(/\/$/, ''));
    return q.replace(/\/$/, '');

function $id(id){ return document.getElementById(id); }
function safeText(id, val){
  const el = $id(id);
  if (!el) return;
  el.textContent = String(val ?? "");
}

// normalize "Phoenix Suns", "phoenix-suns", "PHX SUNS", etc.
function norm(s){
  return String(s || "")
    .toLowerCase()
    .replace(/&/g, "and")
    .replace(/[^a-z0-9]+/g, " ")
    .trim();
}

// Build a lookup once (code/name/city+name variants)
const NBA_LOOKUP = (() => {
  const map = new Map();

  // Official-ish city+team variants (enough for Whatnot titles)
  const CITY = {
    ATL:"atlanta", BOS:"boston", BKN:"brooklyn", CHA:"charlotte", CHI:"chicago",
    CLE:"cleveland", DAL:"dallas", DEN:"denver", DET:"detroit", GSW:"golden state",
    HOU:"houston", IND:"indiana", LAC:"la clippers", LAL:"la lakers",
    MEM:"memphis", MIA:"miami", MIL:"milwaukee", MIN:"minnesota",
    NOP:"new orleans", NYK:"new york", OKC:"oklahoma city", ORL:"orlando",
    PHI:"philadelphia", PHX:"phoenix", POR:"portland", SAC:"sacramento",
    SAS:"san antonio", TOR:"toronto", UTA:"utah", WAS:"washington"
  };

  for (const t of NBA){
    const code = t.code.toUpperCase();
    const name = norm(t.name);                 // "suns"
    const codeNorm = norm(code);               // "phx"
    const city = norm(CITY[code] || "");       // "phoenix"
    const cityName = norm(`${CITY[code] || ""} ${t.name}`); // "phoenix suns"

    // keys → code
    if (codeNorm) map.set(codeNorm, code);
    if (name) map.set(name, code);
    if (city) map.set(city, code);
    if (cityName) map.set(cityName, code);

    // common aliases
    if (code === "PHI") map.set("sixers", "PHI");
    if (code === "POR") map.set("trail blazers", "POR");
  }

  return map;
})();

function inferNBACodeFromTitle(title){
  const t = norm(title);
  if (!t) return null;

  // exact matches first
  if (NBA_LOOKUP.has(t)) return NBA_LOOKUP.get(t);

  // substring scan (handles "Donruss ... - Phoenix Suns" etc.)
  // longest keys first to avoid "la" matching everything
  const keys = Array.from(NBA_LOOKUP.keys()).sort((a,b) => b.length - a.length);
  for (const k of keys){
    if (k.length < 3) continue;
    if (t.includes(k)) return NBA_LOOKUP.get(k);
  }

  return null;
}

function handleSSEEvent(data){
  try{
    if (!data || typeof data !== "object") return;

    // Some bridges send {event:..., data:{...}} or {type:..., ...}
    const payload = data.data && typeof data.data === "object" ? data.data : data;
    const type = String(payload.type || payload.event || "").toLowerCase();
    if (!type) return;

    console.log("[Overlay] SSE IN:", payload);

    if (type === "team_sold" || type === "sold" || type === "sale"){
      const code = (payload.code || "").toUpperCase() || inferNBACodeFromTitle(payload.title);

      if (code){
        markSold(code);

        if (payload.buyer){
          const row = soldList.find(x => x.code === code);
          if (row) row.buyer = payload.buyer;
        }
      } else {
        console.warn("[Overlay] Could not match team from:", payload.title || payload);
      }

      if (Number.isFinite(payload.amount)) {
        setHighBid(Math.max(highBid, payload.amount));
      }

      updateBuyerStats(payload.buyer, payload.amount);
    }

    if (type === "team_unsold" || type === "unsold"){
      const code = (payload.code || "").toUpperCase() || inferNBACodeFromTitle(payload.title);
      if (code) markUnsold(code);
    }

    if (type === "reset") resetAll();

    if ((type === "set_break" || type === "break_set") && Number.isInteger(payload.value) && payload.value > 0){
      breakNum = payload.value;
      saveBreakNum();
      elBreak.textContent = breakNum;
    }

    if (type === "banner_set" && Number.isInteger(payload.index)){
      bannerIdx = ((payload.index % BANNERS.length) + BANNERS.length) % BANNERS.length;
      const slides = document.querySelectorAll('.banner-inner');
      slides.forEach((s, i) => s.classList.toggle('active', i === bannerIdx));
    }

    if (type === "scores" && Array.isArray(payload.games)){
      setScoreboard(payload.games);
    }

    if (type === "set_title" && typeof payload.value === "string"){
      setHeaderTitle(payload.value);
    }

    if (type === "stream_stats"){
      // IMPORTANT: do not crash if those elements aren't present
      if (typeof payload.topBuyer === "string") safeText("topBuyerText", payload.topBuyer || "—");
      if (typeof payload.lastSale === "string") safeText("lastSaleText", payload.lastSale || "—");
    }

    updateStats();
    renderSoldPanel();
  }catch(err){
    console.error("[Overlay] handleSSEEvent crash:", err, data);
  }
}

let _esMain = null;
let _esSports = null;

function connectSSEOne(url, slot){
  if (slot.ref) { try { slot.ref.close(); } catch(_){} }
  console.log("[Overlay] Connecting SSE:", url);

  const es = new EventSource(url);
  slot.ref = es;

  es.onopen = () => console.log("[Overlay] SSE OPEN:", url);
  es.onerror = () => {
    console.warn("[Overlay] SSE ERROR (retrying in 2.5s):", url);
    try { es.close(); } catch(_) {}
    slot.ref = null;
    setTimeout(() => connectSSEOne(url, slot), 2500);
  };

  es.onmessage = (e) => {
    try { handleSSEEvent(JSON.parse(e.data)); } catch {}
  };

  const EVENTS = ["hello","reset","team_sold","team_unsold","set_break","break_set","set_title","stream_stats","scores","banner_set"];
  EVENTS.forEach((name) => {
    es.addEventListener(name, (e) => {
      try { handleSSEEvent(JSON.parse(e.data)); } catch {}
    });
  });
}

function connectBothChannels(bridgeUrl){
  connectSSEOne(`${bridgeUrl}/stream?channel=main`, { get ref(){ return _esMain; }, set ref(v){ _esMain=v; } });
  connectSSEOne(`${bridgeUrl}/stream?channel=sports`, { get ref(){ return _esSports; }, set ref(v){ _esSports=v; } });
}

  if (BRIDGE_URL) {
    connectBothChannels(BRIDGE_URL);
    console.log("[Overlay] SSE connected:", BRIDGE_URL);
  } else {
    console.warn("[Overlay] No BRIDGE_URL set. Add ?bridge=https://... to the overlay URL");
  }

  setInterval(rotateBanner, 9000);
});


</script>
</body>
