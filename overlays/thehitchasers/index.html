<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, initial-scale=1.0" />
  <title>HIT CHASERS – NBA Break Overlay</title>

  <style>
    :root{
      /* HIT CHASERS – prestige */
      --bg0:#050505;
      --bg1:#0b0b0b;

      --gold:#d8b24c;
      --gold2:#ffdd7a;
      --ink:#000000;
      --white:#ffffff;

      --panel: rgba(10,10,10,0.92);
      --stroke: rgba(216,178,76,0.55);
      --stroke2: rgba(255,221,122,0.35);

      --W:1080px;
      --H:auto;

      --radius:16px;
      --tileR:14px;

      --camW: 520px;
      --camH: 300px;

      --bannerH: 64px;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      background:transparent;
      font-family: Arial, sans-serif;
      color: var(--white);
      user-select:none;
    }

    .overlay{
      width: var(--W);
      background: radial-gradient(circle at 35% 0%, #1a1a1a 0%, #0b0b0b 45%, #050505 100%);
      border-radius: var(--radius);
      border: 2px solid rgba(255,255,255,0.08);
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.8),
        0 16px 40px rgba(0,0,0,0.75),
        0 0 30px rgba(216,178,76,0.18);
      padding: 10px;
      position: relative;
      overflow: hidden;
    }

    /* subtle ambient dust */
    .overlay::before{
      content:"";
      position:absolute; inset:-40px;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,221,122,0.08), transparent 55%),
        radial-gradient(circle at 85% 35%, rgba(216,178,76,0.08), transparent 60%),
        radial-gradient(circle at 35% 85%, rgba(255,255,255,0.05), transparent 55%);
      filter: blur(10px);
      opacity: .85;
      pointer-events:none;
    }

    /* Header */
    .header{
      position: relative;
      height: 78px;
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(0,0,0,0.65), rgba(0,0,0,0.25));
      border: 1px solid rgba(255,255,255,0.08);
      display:flex;
      align-items:center;
      padding: 10px 14px;
      overflow: visible;
      z-index: 5;
    }

    .brand-left{
      display:flex;
      align-items:center;
      gap: 10px;
      min-width: 240px;
    }

    .brand-left .title{
      font-weight: 900;
      letter-spacing: 2px;
      font-size: 28px;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 2px 0 rgba(0,0,0,0.85);
      opacity: 0.92;
    }

    .brand-center{
      position:absolute;
      left:50%;
      top: 70%;
      transform: translate(-50%,-50%);
      pointer-events:none;
      z-index: 5;
    }
    .brand-center img{
      height: 140px;
      width:auto;
      filter:
        drop-shadow(0 10px 18px rgba(0,0,0,0.65))
        drop-shadow(0 0 10px rgba(255, 206, 73, 0.604));
    }

    .header-right{
      margin-left:auto;
      display:flex;
      align-items:center;
      gap: 10px;
    }

    .break-pill{
      display:flex;
      align-items:center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(255,255,255,0.10);
      box-shadow: inset 0 0 0 1px rgba(216,178,76,0.10);
    }
    .break-pill .label{
      font-size: 24px;
      letter-spacing: 1px;
      opacity: .90;
      text-transform: uppercase;
    }
    .break-pill .value{
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 0.5px;
      color: var(--gold2);
      text-shadow: 0 2px 0 rgba(0,0,0,0.8);
      min-width: 36px;
      text-align:right;
    }

    /* Main area */
    .main{
      margin-top: 10px;
      display:grid;
      grid-template-columns: 255px 1fr 255px;
      gap: 10px;
      z-index: 2;
      position: relative;
    }

    /* ===== Border Wick Sweep (reusable) ===== */
    .wick{
      position: relative;
      border-radius: 14px;
    }
    .wick::after{
      content:"";
      position:absolute; inset:4px;
      border-radius: inherit;
      pointer-events:none;
      z-index: 0;


      /* “hot wick” highlight */
      background:
        linear-gradient(130deg,
          transparent 0%,
          rgba(255,221,122,0) 35%,
          rgba(255,221,122,0.85) 50%,
          rgba(216,178,76,0.45) 56%,
          rgba(255,221,122,0) 70%,
          transparent 100%);
      background-size: 300% 300%;
      animation: wickRun 5.5s linear infinite;

      /* mask to border only */
      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      mask-composite: exclude;
      padding: 2px;

      filter: blur(7px);
      opacity: 0.95;
      mix-blend-mode: screen;
    }

    @keyframes wickRun{
      0%   { background-position:   0% 50%; }
      100% { background-position: 100% 50%; }
    }

    /* Team boards */
    .board{
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 14px;
      padding: 4px;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(216,178,76,0.12);
    }
    .board > *{ position: relative; z-index: 2; }

    .colgrid{
      display:grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 5px;
    }

    /* Center stack */
    .center{
      display:flex;
      flex-direction: column;
      gap: 10px;
      align-items: stretch;
      justify-content: space-evenly;
    }

    .cam{
      height: var(--camH);
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(0,0,0,0.25));
      border: 1px solid rgba(255,255,255,0.10);
      box-shadow:
        inset 0 0 0 2px rgba(0,0,0,0.35),
        0 0 0 1px rgba(216,178,76,0.15);
      position: relative;
      overflow: hidden;
    }

    /* gives “camera glass” feel without text */
    .cam::before{
      content:"";
      position:absolute; inset:0;
      background:
        radial-gradient(circle at 30% 30%, rgba(255,255,255,0.10), transparent 55%),
        radial-gradient(circle at 70% 70%, rgba(216,178,76,0.10), transparent 55%),
        linear-gradient(180deg, rgba(255,255,255,0.05), rgba(0,0,0,0.20));
      opacity: .9;
      pointer-events:none;
    }

    /* Bottom teams (10 teams) */
    .bottomGrid{
      display:grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }

    /* Tiles */
    .tile{
      height: 66px;
      border-radius: var(--tileR);
      background: rgba(10,10,10,0.78);
      border: 2px solid var(--gold);
      box-shadow:
        inset 0 0 0 1px rgba(0,0,0,0.55),
        0 6px 14px rgba(0,0,0,0.45);
      position: relative;
      overflow: hidden;
      cursor: pointer;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .tile img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.6));
      z-index: 2;
      position: relative;
    }

    /* subtle gold underglow, moving slightly */
    .tile::before{
      content:"";
      position:absolute;
      inset:-18px;
      background: radial-gradient(circle at 20% 70%, rgba(216,178,76,0.35), transparent 55%);
      filter: blur(14px);
      opacity: 0.55;
      animation: tileGlowDrift 4.5s ease-in-out infinite;
      z-index: 1;
      pointer-events:none;
    }
    @keyframes tileGlowDrift{
      0%   { transform: translate(-4px, 2px) scale(0.98); opacity: 0.40; }
      50%  { transform: translate(6px,-2px) scale(1.05); opacity: 0.65; }
      100% { transform: translate(-4px, 2px) scale(0.98); opacity: 0.40; }
    }

    .tile.sold img{
      filter: grayscale(1) brightness(0.45);
      opacity: 0.95;
    }
    .tile.sold::after{
      content:"✕";
      position:absolute; inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size: 54px;
      font-weight: 900;
      color: rgba(255,221,122,0.95);
      text-shadow:
        0 0 10px rgba(216,178,76,0.60),
        0 0 18px rgba(255,221,122,0.45),
        0 8px 22px rgba(0,0,0,0.85);
      z-index: 3;
      pointer-events:none;
    }
    .tile.sold::before{
      opacity: 0.12;
      animation: none;
    }

.sideStack{
  display:flex;
  flex-direction: column;
  gap: 6px;
}

.infoPanel{
  background: rgba(0,0,0,0.35);
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: 14px;
  padding: 10px 12px;
  box-shadow: inset 0 0 0 1px rgba(216,178,76,0.12);
  min-height: 108px; /* tune */
}

.infoPanel > *{ position: relative; z-index: 2; }

.infoTitle{
  font-weight: 900;
  letter-spacing: 1px;
  font-size: 12px;
  text-transform: uppercase;
  color: var(--gold2);
  opacity: 0.95;
  margin-bottom: 8px;
}

.infoBody{
  display:flex;
  flex-direction: column;
  gap: 8px;
  font-weight: 800;
}

.scoreRow{
  display:flex;
  justify-content: space-between;
  gap: 8px;
  font-size: 12px;
  opacity: 0.95;
}

.muted{ opacity: 0.75; font-weight: 800; }


    /* Promo banner (rotating 3 slides) */
    .banner{
  margin-top: 10px;
  height: var(--bannerH);
  border-radius: 14px;
  background: rgba(0,0,0,0.55);
  border: 1px solid rgba(255,255,255,0.10);
  box-shadow: inset 0 0 0 1px rgba(216,178,76,0.12);
  overflow:hidden;
  position: relative;
  z-index: 2;
}

/* each slide fills the whole bar */
.banner-inner{
  position:absolute;
  inset:0;
  opacity: 0;
  transform: translateY(50px);
  transition: opacity .85s ease, transform .85s ease;
  border-radius: 14px;
  overflow:hidden;
}

/* active slide visible */
.banner-inner.active{
  opacity: 1;
  transform: translateY(0);
}

/* background image takes whole slide */
.banner-inner .bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit: cover;
  opacity: 0.92;
  filter: saturate(1.05) contrast(1.02);
}

/* overlay layer so text is readable */
.banner-inner::after{
  content:"";
  position:absolute;
  inset:0;
 
}

/* content floats above */
.banner-content{
  position: relative;
  z-index: 2;
  height:100%;
  display:flex;
  align-items:center;
  gap: 2px;
  padding: 0 4px;
  border:solid 1px var(--gold2);
  border-radius: inherit;
}

.banner-badge{
  min-width: 44px;
  height: 44px;
  border-radius: 12px;
  background: linear-gradient(135deg, rgba(255,221,122,0.30), rgba(216,178,76,0.10));
  border: 1px solid rgba(255,255,255,0.12);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight: 900;
  color: var(--gold2);
  box-shadow: 0 10px 20px rgba(0,0,0,0.35);
}

.banner-text{
  display:flex;
  flex-direction:column;
  gap: 2px;
  line-height: 1.05;
  text-shadow: 0 2px 0 rgba(0,0,0,0.85);
}

.banner-text .top{
  font-size: 12px;
  letter-spacing: 1px;
  text-transform: uppercase;
  opacity: 0.85;
}
.banner-text .main{
  font-size: 20px;
  font-weight: 900;
  letter-spacing: 0.4px;
}


    /* Bottom control bar */
    .controls{
      margin-top: 10px;
      display:grid;
      grid-template-columns: 260px 1fr 1fr 260px;
      gap: 10px;
      z-index: 2;
      position: relative;
      /* border:solid 1px var(--gold2);*/
  border-radius: inherit;
    }

    .ctl{
      height: 65px;
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(0,0,0,0.60), rgba(0,0,0,0.30));
      border: 1px solid var(--gold2);
      box-shadow: inset 0 0 0 1px rgba(216,178,76,0.12);
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      position: relative;
      overflow:hidden;
      font-size:25px;
      cursor: pointer;
    }

    .ctl:active{ transform: translateY(1px); }
    .ctl.btn{
      color: var(--gold2);
    }

    .stat{
      flex-direction: column;
      gap: 2px;
      cursor: default;
    }
    .stat .v{
      font-size: 30px;
      color: #fff;
      text-shadow: 0 2px 0 rgba(0,0,0,0.85);
    }
    .stat .l{
      font-size: 16px;
      opacity: 0.85;
    }

    /* Sold panel */
    .sold-wrap{
      width: var(--W);
      margin-top: 10px;
      border-radius: 14px;
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(255,255,255,0.10);
      box-shadow: inset 0 0 0 1px rgba(216,178,76,0.12);
      padding: 10px;
      display:none;
    }
    .sold-wrap.active{ display:block; }

    .sold-top{
      display:flex;
      align-items:center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .pill{
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.14);
      color:#fff;
      font-weight: 900;
      font-size: 12px;
      letter-spacing: .7px;
      text-transform: uppercase;
      cursor:pointer;
    }
    .pill:hover{
      border-color: rgba(255,221,122,0.35);
      box-shadow: 0 0 0 2px rgba(216,178,76,0.15);
    }

    .sold-grid{
      display:grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .sold-item{
      display:flex;
      align-items:center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.10);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.45);
    }
    .sold-item img{
      height: 34px;
      width:auto;
      object-fit: contain;
      filter: drop-shadow(0 10px 16px rgba(0,0,0,0.55));
    }
    .sold-item input{
      width: 100%;
      border: none;
      outline: none;
      background: rgba(0,0,0,0.55);
      color: #fff;
      border-radius: 999px;
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 900;
    }

    /* Export popup */
    .popup{
      position: fixed;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      background: rgba(0,0,0,0.75);
      z-index: 99999;
    }
    .popup.active{ display:flex; }
    .popup-card{
      width: 720px;
      max-width: 92%;
      background: linear-gradient(135deg, rgba(25,25,25,0.98), rgba(10,10,10,0.98));
      border-radius: 16px;
      padding: 16px;
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 20px 60px rgba(0,0,0,0.85);
      display:flex;
      flex-direction:column;
      gap: 10px;
    }
    .popup-card h2{
      margin:0;
      font-size: 16px;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-align:center;
      color: var(--gold2);
    }
    .popup-card textarea{
      width:100%;
      height:220px;
      resize:none;
      background:#000;
      color:#00ff9c;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      padding: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 13px;
    }
    .popup-btns{
      display:flex;
      gap: 10px;
    }
    .popup-btns button{
      flex:1;
      padding: 12px;
      border: none;
      border-radius: 12px;
      font-weight: 900;
      cursor:pointer;
      background: rgba(216,178,76,0.95);
      color:#000;
    }

  </style>
</head>

    <div class="main">

 <!-- LEFT STACK -->

   <div class="infoTitle">STREAM STATS</div>

<script>
  /* =========================
     Paths (standard BASE)
  ========================== */
  const BASE = (() => {
    const isGhPages = location.hostname.endsWith('github.io');
    if (isGhPages) {
      const parts = location.pathname.split('/').filter(Boolean);
      const repo = parts.length ? parts[0] : '';
      return `/${repo}/`;
    }
    return '../../';
  })();

  const LOGO_PATH = `${BASE}images/logos/primary.png`;         // <-- drop Hit Chasers logo here
  const nbaImg = (f) => `${BASE}images/nba/${f}`;
  const bannerImg = (f) => `${BASE}images/ads/${f}`;           // <-- optional banner images here

  document.getElementById('brandLogo').src = LOGO_PATH;

  // === Bridge URL (NO KEY in URL) ===
// Provide via ?bridge=https://YOUR-RENDER-APP.onrender.com
// Falls back to localStorage value (set once)
const BRIDGE_URL = (() => {
  const q = new URLSearchParams(location.search).get('bridge');
  if (q) {
    localStorage.setItem('tsu.bridge', q.replace(/\/$/, ''));
    return q.replace(/\/$/, '');
  }
  const saved = localStorage.getItem('tsu.bridge');
  return saved ? saved.replace(/\/$/, '') : "";
})();


  /* =========================
     NBA Teams (30)
     File names match Jumbo standard: hawks.png, celtics.png, 76ers.png, etc.
  ========================== */
  const NBA = [
    {code:'ATL', name:'hawks',        image:nbaImg('hawks.png')},
    {code:'BOS', name:'celtics',      image:nbaImg('celtics.png')},
    {code:'BKN', name:'nets',         image:nbaImg('nets.png')},
    {code:'CHA', name:'hornets',      image:nbaImg('hornets.png')},
    {code:'CHI', name:'bulls',        image:nbaImg('bulls.png')},
    {code:'CLE', name:'cavaliers',    image:nbaImg('cavaliers.png')},
    {code:'DAL', name:'mavericks',    image:nbaImg('mavericks.png')},
    {code:'DEN', name:'nuggets',      image:nbaImg('nuggets.png')},
    {code:'DET', name:'pistons',      image:nbaImg('pistons.png')},
    {code:'GSW', name:'warriors',     image:nbaImg('warriors.png')},
    {code:'HOU', name:'rockets',      image:nbaImg('rockets.png')},
    {code:'IND', name:'pacers',       image:nbaImg('pacers.png')},
    {code:'LAC', name:'clippers',     image:nbaImg('clippers.png')},

  /* =========================
     State

  let breakNum = 1;
  let bannerIdx = 0;
  let soldOpen = false;
  let highBid = 0;
  let buyerTotals = new Map();  // buyer -> total spent
  let lastSaleBuyer = '';



  const elBreak = document.getElementById('breakId');
  const leftGrid = document.getElementById('leftGrid');
  const rightGrid = document.getElementById('rightGrid');
  const bottomGrid = document.getElementById('bottomGrid');

  function saveBreakNum(){
    localStorage.setItem('hit.breakNum', String(breakNum));
  }
  function loadBreakNum(){
    const saved = parseInt(localStorage.getItem('hit.breakNum'), 10);
    breakNum = Number.isInteger(saved) && saved > 0 ? saved : 1;
    elBreak.textContent = breakNum;
  }

  function buildTile(team){
    const d = document.createElement('div');
    d.className = 'tile';
    d.dataset.teamCode = team.code;

    const img = document.createElement('img');
    img.src = team.image;
    img.alt = team.name;
    img.onerror = () => { d.textContent = team.code; };

    d.appendChild(img);
    d.addEventListener('click', () => toggleTeam(team.code));
    return d;
  }

  function renderTeams(){
    leftGrid.innerHTML = '';
    rightGrid.innerHTML = '';
    bottomGrid.innerHTML = '';

    // Layout: 10 left, 10 right, 10 bottom (no empties)
    const left10 = NBA.slice(0,10);
    const right10 = NBA.slice(10,20);
    const bottom10 = NBA.slice(20,30);

    left10.forEach(t => leftGrid.appendChild(buildTile(t)));
    right10.forEach(t => rightGrid.appendChild(buildTile(t)));
    bottom10.forEach(t => bottomGrid.appendChild(buildTile(t)));

    // re-apply sold state
    soldSet.forEach(code => {
      const el = document.querySelector(`[data-team-code="${code}"]`);
      if (el) el.classList.add('sold');
    });

    updateStats();
    renderSoldPanel();
  }

function setHighBid(val){
  highBid = Number.isFinite(val) ? val : 0;
  document.getElementById('highBidText').textContent =
    highBid > 0 ? `$${highBid.toFixed(2)}` : '—';
}


  function markSold(code){
    const el = document.querySelector(`[data-team-code="${code}"]`);
    if (!el) return;
    soldSet.add(code);
    el.classList.add('sold');
    if (!soldList.some(x => x.code === code)) soldList.push({code, buyer:''});
  }

  function markUnsold(code){
    const el = document.querySelector(`[data-team-code="${code}"]`);
    if (!el) return;
    soldSet.delete(code);
    el.classList.remove('sold');
    const idx = soldList.findIndex(x => x.code === code);
    if (idx !== -1) soldList.splice(idx, 1);
  }

  function toggleTeam(code){
    soldSet.has(code) ? markUnsold(code) : markSold(code);
    updateStats();
    renderSoldPanel();
  }

  function updateStats(){
    document.getElementById('soldCount').textContent = soldSet.size;
    document.getElementById('leftCount').textContent = 30 - soldSet.size;
  }

  function toggleSold(){
    soldOpen = !soldOpen;
    soldWrap.classList.toggle('active', soldOpen);
  }

  function renderSoldPanel(){
    soldGrid.innerHTML = '';
    if (soldList.length === 0){
      soldOpen = false;
      soldWrap.classList.remove('active');
      return;
    }

    soldList.forEach(entry => {
      const tile = document.querySelector(`[data-team-code="${entry.code}"]`);
      const src = tile?.querySelector('img')?.src || '';

      const row = document.createElement('div');
      row.className = 'sold-item';

      if (src){
        const img = document.createElement('img');
        img.src = src;
        row.appendChild(img);
      }

      const input = document.createElement('input');
      input.value = entry.buyer || '';
      input.placeholder = 'Buyer';
      input.addEventListener('input', e => entry.buyer = e.target.value);
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter'){ e.preventDefault(); e.target.blur(); }
      });

      row.appendChild(input);
      soldGrid.appendChild(row);
    });

    soldOpen = true;
    soldWrap.classList.add('active');
  }

  /*scoreboard*/

function setScoreboard(games){
  const host = document.getElementById('scoreboard');
  host.innerHTML = '';

  games.slice(0,4).forEach(g => {
    const row = document.createElement('div');
    row.className = 'scoreRow';
    row.innerHTML = `
      <span>${g.away} ${g.awayScore}  •  ${g.home} ${g.homeScore}</span>
      <span class="muted">${g.status}</span>
    `;
    host.appendChild(row);
  });
}

function setTopBuyer(name){
  document.getElementById('topBuyerText').textContent = name || '—';
}
function setLastSale(name){
  document.getElementById('lastSaleText').textContent = name || '—';
}

function updateBuyerStats(buyer, amount){
  if (!buyer) return;

  // last sale = most recent buyer we saw
  lastSaleBuyer = buyer;
  setLastSale(lastSaleBuyer);

  const amt = Number.isFinite(amount) ? amount : 0;
  if (amt > 0){
    buyerTotals.set(buyer, (buyerTotals.get(buyer) || 0) + amt);

    // compute top buyer
    let topName = '';
    let topTotal = -1;
    for (const [name, total] of buyerTotals.entries()){
      if (total > topTotal){ topTotal = total; topName = name; }
    }
    setTopBuyer(topName);
  }
}


  function resetAll(){
    soldSet.clear();
    soldList = [];
    document.querySelectorAll('.tile').forEach(t => t.classList.remove('sold'));
    updateStats();
    renderSoldPanel();
    setHighBid(0);
    setTopBuyer('');
    setLastSale('');
  }

  function nextBreak(){
    resetAll();
    breakNum += 1;
    saveBreakNum();
    elBreak.textContent = breakNum;
    setHighBid(0);

  }

  function exportCSV(){
    const header = "Name,Break#,Team\n";
    const rows = soldList.map(x => {
      const buyer = (x.buyer || "").replace(/,/g," ");
      return `${buyer},${breakNum},${x.code}`;
    }).join("\n");
    return header + rows + (rows ? "\n" : "");
  }

  /* =========================
     Rotating Banner
  ========================== */
  function renderBanner(){
    const host = document.getElementById('banner');
    host.innerHTML = '';

    BANNERS.forEach((b, i) => {
  const slide = document.createElement('div');
  slide.className = 'banner-inner' + (i === bannerIdx ? ' active' : '');

  // background image (full width)
  if (b.image){
    const bg = document.createElement('img');
    bg.className = 'bg';
    bg.src = b.image;
    bg.alt = '';
    slide.appendChild(bg);
  }

  const content = document.createElement('div');
  content.className = 'banner-content';

  const badge = document.createElement('div');
  badge.className = 'banner-badge';
  badge.textContent = b.badge || '';

  const text = document.createElement('div');
  text.className = 'banner-text';

  const top = document.createElement('div');
  top.className = 'top';
  top.textContent = b.top || '';

  const main = document.createElement('div');
  main.className = 'main';
  main.textContent = b.main || '';

  text.appendChild(top);
  text.appendChild(main);

  content.appendChild(badge);
  content.appendChild(text);

  slide.appendChild(content);
  host.appendChild(slide);
});

  }

  function rotateBanner(){
    bannerIdx = (bannerIdx + 1) % BANNERS.length;
    const slides = document.querySelectorAll('.banner-inner');
    slides.forEach((s, i) => s.classList.toggle('active', i === bannerIdx));
  }

  /* =========================
     SSE-ready hooks
     Expected payload examples:
       {type:'team_sold', code:'LAL', buyer:'Mike'}
       {type:'team_unsold', code:'LAL'}
       {type:'set_break', value: 14}
       {type:'reset'}
       {type:'banner_set', index: 1}
  ========================== */
  function handleSSEEvent(data){
    if (!data || !data.type) return;



    
 /*   ------TEST REMOVING DUPLICATE TEAM SOLD -------
 
      if (data.type === 'team_sold'){
      if (data.code) markSold(data.code);
      if (data.buyer){
        const row = soldList.find(x => x.code === data.code);
        if (row) row.buyer = data.buyer;
      }
      if (Number.isFinite(data.amount)) {
  setHighBid(Math.max(highBid, data.amount));
  
  } */
  
if (data.type === "team_sold"){
  // If the extension didn’t send a code, infer it from the sale title
  const code = data.code || inferNBACodeFromTitle(data.title);

  if (code) markSold(code);

  if (data.buyer && code){
    const row = soldList.find(x => x.code === code);
    if (row) row.buyer = data.buyer;
  }

  if (Number.isFinite(data.amount)) {
    setHighBid(Math.max(highBid, data.amount));
  }

updateBuyerStats(data.buyer, data.amount);


}


    }
    if (data.type === 'team_unsold' && data.code) markUnsold(data.code);
    if (data.type === 'reset') resetAll();
    if (data.type === 'set_break' && Number.isInteger(data.value) && data.value > 0){
      breakNum = data.value;
      saveBreakNum();
      elBreak.textContent = breakNum;
    }
    if (data.type === 'banner_set' && Number.isInteger(data.index)){
      bannerIdx = ((data.index % BANNERS.length) + BANNERS.length) % BANNERS.length;
      const slides = document.querySelectorAll('.banner-inner');
      slides.forEach((s, i) => s.classList.toggle('active', i === bannerIdx));
    }

    if (data.type === 'scores' && Array.isArray(data.games)){
  setScoreboard(data.games);
}
if (data.type === 'stream_stats'){
  if (typeof data.topBuyer === 'string') document.getElementById('topBuyerText').textContent = data.topBuyer || '—';
  //if (typeof data.highBid === 'string') document.getElementById('highBidText').textContent = data.highBid || '—';
  if (typeof data.lastSale === 'string') document.getElementById('lastSaleText').textContent = data.lastSale || '—';
}


    updateStats();
    renderSoldPanel();
  

let _es = null;
function connectSSE(url){
  if (_es) { try { _es.close(); } catch(_){} }
  _es = new EventSource(url);

  _es.onmessage = (e) => {
    try { handleSSEEvent(JSON.parse(e.data)); } catch(_) {}
  };

  _es.onerror = () => {
    try { _es.close(); } catch(_) {}
    _es = null;
    setTimeout(() => connectSSE(url), 2500);
  };
}

function inferNBACodeFromTitle(title){
  const t = String(title || "").toLowerCase();

  // handle common nickname phrases first
  if (t.includes("sixers") || t.includes("76ers")) return "PHI";
  if (t.includes("trail blazers") || t.includes("blazers")) return "POR";

  // try direct code/name match
  for (const team of NBA){
    const code = team.code.toLowerCase();
    const name = team.name.toLowerCase();

    if (t.includes(code)) return team.code;              // "LAL", "BOS", etc.
    if (t.includes(name)) return team.code;              // "lakers", "celtics"
  }

  return null;
}



  // Optional: postMessage bridge (useful when wiring external control)
  window.addEventListener('message', (e) => {
    if (!e.data) return;
    // allow either object payloads or JSON strings
    let payload = e.data;
    if (typeof payload === 'string'){
      try { payload = JSON.parse(payload); } catch(_) { return; }
    }
    handleSSEEvent(payload);
  });

  document.getElementById('copyBtn').addEventListener('click', async () => {
    exportBox.focus();
    exportBox.select();
    try{
      await navigator.clipboard.writeText(exportBox.value);
      document.getElementById('copyBtn').textContent = 'Copied!';
      setTimeout(() => document.getElementById('copyBtn').textContent = 'Copy', 900);
    }catch(_){
      // fallback
      try{
        document.execCommand('copy');
        document.getElementById('copyBtn').textContent = 'Copied!';
        setTimeout(() => document.getElementById('copyBtn').textContent = 'Copy', 900);
      }catch(__){}
    }
  });

if (BRIDGE_URL) {

} else {

}


    // rotate every 9s (smooth/premium)
    setInterval(rotateBanner, 9000);
  });
