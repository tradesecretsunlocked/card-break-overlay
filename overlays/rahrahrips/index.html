<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, initial-scale=1.0" />
  <title>Rah Rah Rips — Multi-Sport Break Overlay</title>

  <style>
    :root{
      --bg0:#060608;
      --panel:#e2701c;
      --panel2:#0f1320;

      --ink:#ffffff;
      --muted:rgba(255,255,255,.72);

      --orange:#ff7a18;
      --orange2:#ffb36a;
      --line:rgba(255,122,24,.55);
      --glow:rgba(255,122,24,.25);

      --tileRadius:12px;
      --panelRadius:16px;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      background:transparent;
      font-family: Arial, sans-serif;
      color:var(--ink);
      user-select:none;
    }

    /* ---------- CANVAS ---------- */
    .overlay{
      width:1080px;
      margin:0 auto;
      padding:10px;
      background:
        radial-gradient(1100px 600px at 20% 0%, rgba(255,122,24,.18), transparent 60%),
        radial-gradient(900px 520px at 85% 40%, rgba(255,180,90,.12), transparent 55%),
        linear-gradient(180deg, #050508 3%, #241d17 100%);
      border:2px solid rgba(255, 122, 27, 0.685);
      border-radius:16px;
      box-shadow: 0 18px 40px rgba(0,0,0,.55);
      position:relative;
      overflow:hidden;
    }

    .overlay::before{
      content:'';
      position:absolute;
      inset:-40%;
      background: conic-gradient(
        from 210deg,
        rgba(255,122,24,.00),
        rgba(255,122,24,.10),
        rgba(255,122,24,.00),
        rgba(255,255,255,.05),
        rgba(255,122,24,.00)
      );
      filter: blur(22px);
      opacity:.6;
      animation: ambientSpin 18s linear infinite;
      pointer-events:none;
    }
    @keyframes ambientSpin{
      0%{ transform:rotate(0deg); }
      100%{ transform:rotate(360deg); }
    }

    /* keep content above ambient */
    .overlay > *{ position:relative; z-index:1; }

    /* ---------- HEADER ---------- */
    .header{
      display:grid;
      grid-template-columns: 1fr auto 1fr;
      align-items:center;
      gap:10px;
      border-radius:16px;
      padding:4px 4px 4px;
      border-bottom:2px solid rgba(255,255,255,.10);
      margin-top:10px;
      background:linear-gradient(45deg, var(--panel), #ffffffbd, #ff741d);
      position:relative;
      z-index: 50;
    }

    .brand{
      display:flex;
      flex-direction:column;
      gap:2px;
    }
    .brand .title{
      font-size:34px;
      font-weight:900;
      letter-spacing:.8px;
      text-transform:uppercase;
    }
    .brand .subtitle{
      font-size:12px;
      font-weight:700;
      letter-spacing:1.2px;
      color:var(--muted);
      text-transform:uppercase;
    }

    .logoWrap{
      display:flex;
      flex-direction: column;
      align-items:center;
      margin-top: 49px;
      justify-content:center;
       position:relative;
      z-index: 51;
    }
    #brandLogo{
      height:150px;
      width:auto;
      object-fit:contain;
      position:absolute;
      filter:
        drop-shadow(0 8px 18px rgba(0,0,0,.55))
        drop-shadow(0 0 18px rgba(255,122,24,.25));
      pointer-events:none;
      z-index: 52;
    }

    .headerRight{
      display:flex;
      justify-content:flex-end;
      gap:10px;
      align-items:center;
      
    }

    .pillRow{
      display:flex;
      gap:20px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .pill{
      border:2px solid rgba(255,122,24,.35);
      background: rgba(15,19,32,.75);
      color:var(--ink);
      padding:8px 10px;
      border-radius:999px;
      font-weight:900;
      letter-spacing:.8px;
      cursor:pointer;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);
      transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
      font-size:18px;
      text-transform:uppercase;
      white-space:nowrap;
    }
    .pill:hover{
      transform: translateY(-1px);
      box-shadow: 0 10px 18px rgba(0,0,0,.35);
    }
    .pill.active{
      border-color: rgba(255,122,24,.85);
      box-shadow:
        0 0 0 2px rgba(255,122,24,.18),
        0 14px 22px rgba(0,0,0,.35);
      background: linear-gradient(180deg, rgba(255,122,24,.25), rgba(15,19,32,.75));
    }
    .pill.danger{
      border-color: rgba(255,255,255,.18);
      background: rgba(10,10,12,.65);
    }
    .centerPill {
    font-size: 20px;
    font-weight: 600;
    border: 2px solid rgba(255, 140, 57, 0.808);
    color: var(--ink);
    padding: 16px 1px;
    background: rgba(15, 19, 32, .75);
    border-radius: 999px;
    }
    /* ---------- MAIN LAYOUT ---------- */
    .main{
      padding:10px 6px 8px;
    }

    .teamsSection{
      display:grid;
      grid-template-columns: 1fr 155px 1fr;
      gap:2px;
      align-items:stretch;
    }

    .conference{
      background: rgba(15,19,32,.62);
      border:2px solid rgba(223, 209, 209, 0.349);
      border-radius:14px;
      padding:3px;
      position:relative;
      overflow:hidden;
      min-height: 280px;
    }

    .conference::after{
      content:'';
      position:absolute;
      inset:-30%;
      background: linear-gradient(120deg,
        rgba(255,122,24,.20),
        rgba(255,255,255,.06),
        rgba(255,122,24,.18)
      );
      background-size: 200% 200%;
      opacity:.55;
      filter: blur(18px);
      animation: drift 10s ease-in-out infinite;
      pointer-events:none;
      z-index:0;
    }
    @keyframes drift{
      0%{ background-position: 0% 50%; }
      50%{ background-position: 100% 50%; }
      100%{ background-position: 0% 50%; }
    }
    .conference > *{ position:relative; z-index:1; }

    .division{
      margin-top:6px;
    }

    /* NO EMPTY SPACE IN TEAM ROWS:
       - fixed 5 columns
       - tight gaps
       - no placeholders
    */
  .divisionTeams{
  display:grid;
  grid-template-columns: repeat(var(--grid-cols, 5), 1fr);
  gap:4px;
}



    .team{
      position:relative;
      border-radius: var(--tileRadius);
      overflow:hidden;
      border:2px solid rgba(255, 255, 255, 0.829);
      background: rgba(0,0,0,.25);
      
      cursor:pointer;
      transform: translateZ(0);
      transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease, filter .12s ease;
    }

    .team::before{
      content:'';
      position:absolute;
      inset:-10px;
      border-radius: inherit;
      background: radial-gradient(circle at 50% 50%,
        rgba(255,122,24,.55),
        rgba(255,122,24,.15),
        transparent 65%
      );
      filter: blur(14px);
      opacity:.35;
      z-index:0;
      pointer-events:none;
      animation: tilePulse 3.2s ease-in-out infinite;
    }
    @keyframes tilePulse{
      0%{ opacity:.24; transform: scale(.98); }
      50%{ opacity:.45; transform: scale(1.03); }
      100%{ opacity:.24; transform: scale(.98); }
    }

    .team img{
      width:100%;
      height:65px;
      object-fit: cover;
      display:block;
      position:relative;
      z-index:1;
    }

    /* hover animation */
    .team:hover{
      transform: translateY(-2px) scale(1.02);
      border-color: rgba(255,122,24,.55);
      box-shadow: 0 12px 18px rgba(0,0,0,.35);
    }

    /* sold state */
    .team.sold{
      filter: grayscale(.85) brightness(.55);
      border-color: rgba(255,255,255,.08);
    }
    .team.sold::before{
      animation:none;
      opacity:.12;
    }

    .team.sold::after{
      content:'✓';
      position:absolute;
      left:50%;
      top:50%;
      transform: translate(-50%,-50%);
      width:30px;
      height:30px;
      border-radius:999px;
      display:flex;
      align-items:center;
      justify-content:center;
      background: rgba(255,255,255,.92);
      color: #111;
      font-weight: 900;
      box-shadow: 0 8px 14px rgba(0,0,0,.45);
      z-index:2;
      opacity:.95;
    }

    /* sold “pop” animation (brief flash) */
    .team.soldPop{
      animation: soldPop .42s ease;
    }
    @keyframes soldPop{
      0%{ transform: scale(1); }
      50%{ transform: scale(1.06); }
      100%{ transform: scale(1); }
    }

    /* ---------- CONTROL BAR ---------- */
    .controlBar{
      background: linear-gradient(180deg, rgba(255,122,24,.20), rgba(15,19,32,.72));
      border:2px solid rgba(255, 255, 255, 0.747);
      border-radius:14px;
      padding:8px;
      display:flex;
      flex-direction:column;
      gap:20px;
      justify-content:end;
      position: relative;
        z-index: 30;
        background: linear-gradient(180deg, rgb(210 101 21 / 52%), rgb(255 255 255 / 43%),rgb(210 101 21 / 52%));
    }

    .statBox{
      background: rgba(0,0,0,.35);
      border:2px solid rgba(255, 255, 255, 0.938);
      border-radius:12px;
      padding:8px 6px;
      text-align:center;
      cursor:default;
    }
    .statBox.clickable{ cursor:pointer; }
    .statBox .value{
      font-size:30px;
      font-weight:900;
      line-height:1.1;
      position: relative;
      z-index: 32;
    }
    .statBox .label{
      font-size:15px;
      letter-spacing:1.2px;
      text-transform:uppercase;
      color:var(--muted);
      margin-top:2px;
    }

    /* ---------- SOLD PANEL (BELOW GRID) ---------- */
    .soldWrap{
      margin-top:10px;
      padding:5px;
      border-radius:14px;
      border:2px solid rgba(255,255,255,.10);
      background: rgba(15,19,32,.55);
      display:none; /* shown when toggled + has entries */
    }

    .soldTopBar{
      display:flex;
      gap:8px;
      align-items:center;
      justify-content:space-between;
      padding-bottom:8px;
      border-bottom:1px solid rgba(255,255,255,.10);
      margin-bottom:10px;
    }

    .soldTitle{
      font-weight:900;
      letter-spacing:1.6px;
      text-transform:uppercase;
      font-size:20px;
      color:var(--muted);
    }

    .soldGrid{
      display:grid;
      grid-template-columns: repeat(4, 1fr);
      gap:0px;
      overflow:hidden;
    }

    .soldItem{
      display:flex;
      align-items:center;
      gap:0px;
      padding:4px 0px;
      border-radius:999px;
      background: rgba(255,255,255,.10);
      border:2px solid rgba(255,255,255,.10);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.15);
    }

    .soldItem img{
      height:26px;
      width:auto;
      object-fit:contain;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,.35));
    }

    .buyerInput{
      flex:1;
      min-width: 0;
      font-size:15px;
      font-weight:900;
      border:none;
      outline:none;
      border-radius:999px;
      padding:6px 0px;
      background: rgba(255,255,255,.88);
      color:#111;
    }
    .buyerInput::placeholder{ opacity:.55; }

    /* ---------- TICKER PLACEHOLDER ---------- */
    /* This is intentionally just a bar. Seller can place OBS text on top. */
    .tickerBar{
      margin-top:10px;
      height:42px;
      border-radius:999px;
      border:2px solid rgba(255, 224, 201, 0.555);
      background:
        linear-gradient(45deg, var(--panel), #ffffffbd, #ff741d);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.05);
      position:relative;
      overflow:hidden;
    }
    .tickerBar::after{
      content:'';
      position:absolute;
      inset:-40%;
      background: linear-gradient(90deg,
        transparent,
        rgba(255,122,24,.18),
        transparent
      );
      transform: translateX(-40%);
      animation: tickerSheen 3.8s ease-in-out infinite;
      pointer-events:none;
    }
    @keyframes tickerSheen{
      0%{ transform: translateX(-55%); opacity:.0; }
      25%{ opacity:.55; }
      50%{ opacity:.25; }
      100%{ transform: translateX(55%); opacity:0; }
    }

    /* ---------- EVENT VIDEO (optional, used by animationsEnabled) ---------- */
    .eventLayer{
      position:absolute;
      left:50%;
      top:28%;
      transform:translate(-50%,-50%);
      z-index:9999;
      pointer-events:none;
      display:none;
      align-items:center;
      justify-content:center;
    }
    .eventLayer video{
      width:260px;
      height:260px;
      border-radius:999px;
      object-fit:cover;
      box-shadow: 0 18px 30px rgba(0,0,0,.55);
    }
    .eventLayer.show{ display:flex; }
  </style>
</head>

<body>
  <div class="overlay" id="overlayRoot">
    <div class="header">
      <div class="brand">
        <div class="title">Rah Rah Rips</div>
        
      </div>

      <div class="logoWrap">
        <img id="brandLogo" alt="Rah Rah Rips logo" />
      </div>

      <div class="headerRight">
        <div class="pillRow" id="sportPills">
          <button class="pill active" data-sport="nfl">NFL</button>
          <button class="pill" data-sport="nba">NBA</button>
          <button class="pill" data-sport="mlb">MLB</button>
          
        </div>
      </div>
    </div>

    <div class="main">
      <div class="teamsSection">
        <div class="conference" id="leftConf"></div>

        <div class="controlBar">
          <div class="statBox clickable" id="soldStat">
            <div class="value" id="soldCount">0</div>
            <div class="label">Sold</div>
          </div>
<button class="centerPill" id="btnNext">Next Break</button>
          <div class="statBox">
            <div class="value" id="remainingCount">0</div>
            <div class="label">Remaining</div>
          </div>

          
        </div>

        <div class="conference" id="rightConf"></div>
      </div>
 <!-- TICKER PLACEHOLDER BAR (seller can add OBS text source over this) -->
      <div class="tickerBar"></div>
      <!-- SOLD PANEL (below layout) -->
      <div class="soldWrap" id="soldWrap">
        <div class="soldTopBar">
          <div class="soldTitle">Sold Teams</div>
          <div class="pillRow">
            <!-- room for future toggles if you want later -->
             <button class="pill danger" id="btnReset">Reset</button>
            <button class="pill" id="btnHideSold">Hide</button>
          </div>
        </div>
        <div class="soldGrid" id="soldGrid"></div>
      </div>

     
    </div>

    <div class="eventLayer" id="eventLayer">
      <video id="eventVideo" playsinline></video>
    </div>
  </div>

  <script>
    /* ========= Base path (matches holyhits pattern; works Local file + GH Pages) ========= */
    const BASE = (() => {
      const isGhPages = location.hostname.endsWith('github.io');
      if (isGhPages) {
        const parts = location.pathname.split('/').filter(Boolean);
        const repo = parts.length ? parts[0] : '';
        return `/${repo}/`;
      }
      return '../../';
    })();

    /* ========= Brand logo ========= */
    const brandLogo = document.getElementById('brandLogo');
    if (brandLogo) brandLogo.src = `${BASE}images/logos/rahrahrips-logo.png`;

    /* ========= Optional sold animation video (not required) ========= */
    let animationsEnabled = true;
    let lastAnimationTime = 0;
    const ANIMATION_COOLDOWN = 8000;

    function playAnimation(src, duration = 1500) {
      if (!animationsEnabled) return;
      const now = Date.now();
      if (now - lastAnimationTime < ANIMATION_COOLDOWN) return;

      const layer = document.getElementById('eventLayer');
      const video = document.getElementById('eventVideo');
      if (!layer || !video) return;

      lastAnimationTime = now;

      video.pause();
      video.currentTime = 0;
      video.src = src;
      video.volume = 0.0;

      layer.classList.add('show');
      video.play().catch(()=>{});

      clearTimeout(video._hideTimer);
      video._hideTimer = setTimeout(() => {
        video.pause();
        layer.classList.remove('show');
        video.src = '';
      }, duration);
    }

    /* ========= Asset helpers ========= */
    const imgNFL = f => `${BASE}images/nfl/${f}`;
    const imgNBA = f => `${BASE}images/nba/${f}`;
    const imgMLB = f => `${BASE}images/mlb/${f}`;

    /* ========= Data ========= */

      mlb: {
        name: 'MLB',
        layout: { gridCols: 5, gridOffset: 'none' },
        conferences: ['AL', 'NL'],
        divisions: {
          AL: {
            EAST: [
              { code:'BAL', name:'Orioles', image: imgMLB('orioles.png') },
              { code:'BOS', name:'Red Sox', image: imgMLB('redsox.png') },
              { code:'NYY', name:'Yankees', image: imgMLB('yankees.png') },
              { code:'TB',  name:'Rays', image: imgMLB('rays.png') },

              { code:'CLE', name:'Guardians', image: imgMLB('guardians.png') },

            ],
            WEST: [
              { code:'HOU', name:'Astros', image: imgMLB('astros.png') },

              { code:'SEA', name:'Mariners', image: imgMLB('mariners.png') },
              { code:'TEX', name:'Rangers', image: imgMLB('rangers.png') },
            ],
          },
          NL: {
            EAST: [
              { code:'ATL', name:'Braves', image: imgMLB('braves.png') },
              { code:'MIA', name:'Marlins', image: imgMLB('marlins.png') },

    };

    /* ========= State ========= */
    let currentSport = 'nfl';
    const soldSet = new Set();
    const soldList = []; // {code,buyer}

    /* ========= Render ========= */
    function buildConference(targetEl, confName, divisionsObj){
      targetEl.innerHTML = '';
      const frag = document.createDocumentFragment();

      // IMPORTANT: no visible division headers by request (tight grid)
      Object.keys(divisionsObj).forEach(divName => {
        const div = document.createElement('div');
        div.className = 'division';

        const grid = document.createElement('div');
        grid.className = 'divisionTeams';

        divisionsObj[divName].forEach(team => {
          const tile = document.createElement('div');
          tile.className = 'team';
          tile.dataset.teamCode = team.code;

          tile.addEventListener('click', () => toggleTeam(team.code));

          const img = document.createElement('img');
          img.src = team.image;
          img.alt = team.name;
          img.onerror = () => {
            // fallback: if a logo missing, show team code
            tile.innerHTML = '';
            tile.style.display = 'flex';
            tile.style.alignItems = 'center';
            tile.style.justifyContent = 'center';
            tile.style.fontWeight = '900';
            tile.style.letterSpacing = '1px';
            tile.textContent = team.code;
          };

          tile.appendChild(img);
          grid.appendChild(tile);
        });

        div.appendChild(grid);
        frag.appendChild(div);
      });

      targetEl.appendChild(frag);
    }
function applyGridLayout(cfg){
  const cols = cfg.layout?.gridCols || 5;
  document.documentElement.style.setProperty('--grid-cols', cols);
}

   function renderTeams(){
  const cfg = breakTypes[currentSport];
  if (!cfg) return;

  // 🔑 HOLYHITS GRID LOGIC
  applyGridLayout(cfg);

  soldSet.clear();
  soldList.length = 0;
  renderSoldPanel();

  const [leftName, rightName] = cfg.conferences;
  buildConference(leftConf, leftName, cfg.divisions[leftName]);
  buildConference(rightConf, rightName, cfg.divisions[rightName]);

  updateCounts();
}


    function updateCounts(){
      const cfg = breakTypes[currentSport];
      let total = 0;
      cfg.conferences.forEach(c => {
        Object.values(cfg.divisions[c]).forEach(arr => total += arr.length);
      });

      document.getElementById('soldCount').textContent = soldSet.size;
      document.getElementById('remainingCount').textContent = total - soldSet.size;
    }

    function toggleTeam(code){
      const tile = document.querySelector(`[data-team-code="${code}"]`);
      if (!tile) return;

      const idx = soldList.findIndex(x => x.code === code);

      if (soldSet.has(code)){
        soldSet.delete(code);
        tile.classList.remove('sold');
        if (idx !== -1) soldList.splice(idx, 1);
      } else {
        soldSet.add(code);
        tile.classList.add('sold');

        // sold "pop"
        tile.classList.remove('soldPop');
        void tile.offsetWidth;
        tile.classList.add('soldPop');
        setTimeout(() => tile.classList.remove('soldPop'), 450);

        if (idx === -1) soldList.push({ code, buyer: '' });

        // Optional: if you ever add a sold video, it goes here:
        // playAnimation(`${BASE}videos/sold.mp4`, 1200);
      }

      updateCounts();
      renderSoldPanel();
    }

    function renderSoldPanel(){
      const wrap = document.getElementById('soldWrap');
      const grid = document.getElementById('soldGrid');
      if (!wrap || !grid) return;

      grid.innerHTML = '';

      if (soldList.length === 0){
        wrap.style.display = 'none';
        return;
      }

      wrap.style.display = 'block';

      soldList.forEach(entry => {
        const tile = document.querySelector(`[data-team-code="${entry.code}"]`);
        if (!tile) return;

        const src = tile.querySelector('img')?.src || '';

        const item = document.createElement('div');
        item.className = 'soldItem';

        if (src){
          const logo = document.createElement('img');
          logo.src = src;
          item.appendChild(logo);
        }

        const input = document.createElement('input');
        input.className = 'buyerInput';
        input.type = 'text';
        input.placeholder = 'Buyer';
        input.value = entry.buyer || '';
        input.addEventListener('input', (e) => entry.buyer = e.target.value);

        item.appendChild(input);
        grid.appendChild(item);
      });
    }

    /* ========= UI wiring ========= */
    function setSport(s){
      if (!breakTypes[s]) return;
      currentSport = s;

      document.querySelectorAll('#sportPills .pill[data-sport]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.sport === s);
      });

      renderTeams();
    }

    function resetAll(){
      document.querySelectorAll('.team').forEach(t => t.classList.remove('sold','soldPop'));
      soldSet.clear();
      soldList.length = 0;
      updateCounts();
      renderSoldPanel();
    }

    function nextBreak(){
      resetAll();
    }

    /* ========= Boot ========= */
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('btnReset')?.addEventListener('click', resetAll);
      document.getElementById('btnNext')?.addEventListener('click', nextBreak);

      document.getElementById('soldStat')?.addEventListener('click', () => {
        const wrap = document.getElementById('soldWrap');
        if (!wrap) return;
        if (wrap.style.display === 'none') {
          if (soldList.length) wrap.style.display = 'block';
        } else {
          wrap.style.display = 'none';
        }
      });

      document.getElementById('btnHideSold')?.addEventListener('click', () => {
        const wrap = document.getElementById('soldWrap');
        if (wrap) wrap.style.display = 'none';
      });

      document.querySelectorAll('#sportPills .pill[data-sport]').forEach(btn => {
        btn.addEventListener('click', () => setSport(btn.dataset.sport));
      });

      setSport('nfl');
    });
  </script>
