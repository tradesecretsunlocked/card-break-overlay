<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Overlay Paused</title>
<style>
  :root {
    --primary: #ff4d4d;
    --secondary: #2b6cff;
    --bg-dark: #0a0b10;
    --panel: #12141c;
    --text-main: #f5f6fa;
    --text-dim: #8b8fa3;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    background: var(--bg-dark);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* ambient gradient wash, animated slowly so the screen never reads flat */
  .bg-wash {
    position: absolute;
    inset: -20%;
    background:
      radial-gradient(circle at 20% 30%, color-mix(in srgb, var(--secondary) 28%, transparent) 0%, transparent 55%),
      radial-gradient(circle at 80% 70%, color-mix(in srgb, var(--primary) 24%, transparent) 0%, transparent 55%);
    filter: blur(40px);
    animation: drift 14s ease-in-out infinite alternate;
  }

  @keyframes drift {
    0%   { transform: translate(0, 0) scale(1); }
    100% { transform: translate(-3%, 3%) scale(1.08); }
  }

  .card {
    position: relative;
    z-index: 1;
    width: min(520px, 88vw);
    background: linear-gradient(160deg, var(--panel) 0%, #0d0e15 100%);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 18px;
    padding: 42px 38px 36px;
    text-align: center;
    box-shadow: 0 30px 80px -20px rgba(0,0,0,0.6);
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--primary), var(--secondary));
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #fff;
    margin-bottom: 22px;
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #fff;
    animation: pulse 1.6s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.4; transform: scale(0.75); }
  }

  h1 {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 10px;
    letter-spacing: -0.01em;
  }

  p {
    font-size: 17px;
    line-height: 1.55;
    color: var(--text-dim);
    margin-bottom: 4px;
  }

  .client-name {
    color: var(--text-main);
    font-weight: 600;
  }

  .footer {
    margin-top: 28px;
    padding-top: 20px;
    border-top: 1px solid rgba(255,255,255,0.06);
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 0.02em;
  }

  .footer strong {
    color: var(--text-main);
    background: linear-gradient(90deg, var(--primary), var(--secondary));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
</style>
</head>
<body>

  <div class="bg-wash"></div>

  <div class="card">
    <span class="badge"><span class="dot"></span>Overlay Paused</span>
    <h1>This stream overlay is temporarily paused</h1>
    <p>The board for <span class="client-name" id="clientName">this account</span> is offline right now.</p>
    <p>If you weren't expecting this, reach out and we'll get it sorted.</p>
     <p>support@tradesecretsunlocked.com</p>
    <div class="footer">
      Managed by <strong>Trade Secrets Unlocked</strong>
    </div>
  </div>

<script>
  // ES6 only, no external deps — OBS-safe static page.
  // Set a client display name here per-deploy if you want it personalized;
  // defaults to generic copy above if left blank.
  (() => {
    const CLIENT_NAME = "Collect 4 Good"; // e.g. "Bigger Than Cardboard"
    if (CLIENT_NAME) {
      document.getElementById("clientName").textContent = CLIENT_NAME;
    }
  })();
</script>

</body>
</html>
