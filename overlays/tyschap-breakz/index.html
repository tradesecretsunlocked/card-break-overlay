<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, initial-scale=1.0" />
  <title>TySchap Breakz – Multi-Sport Break Overlay</title>

  <style>
    :root{
      /* =========================
         TYSCHAP BREAKZ — green / purple on black
      ========================== */

      /* Standard v2.4 sec 5: the two client brand colours are declared here as
         --primary / --secondary and ALIASED onto this family's own variables.
         The family variables keep their names and every rule keeps consuming
         them. Change the two values below to re-theme this overlay.
         NOTE: --secondary is a vivid purple, so it is aliased onto the second
         ACCENT rather than the background. A #BE38F3 page background would be
         unreadable, and the client supplied it as an accent. */
      --primary:   #76BB40;   /* green  */
      --secondary: #BE38F3;   /* purple */

      --bg0:#050505;
      --bg1:#0b0b0b;

      --orange:  var(--primary);
      --orange2: var(--secondary);
      --white:#ffffff;

      --panel: rgba(10,10,10,0.92);
      --stroke: rgba(118,187,64,0.55);
      --stroke2: rgba(190,56,243,0.35);

        --whiteStroke: rgba(255,255,255,0.18);
  --whiteStroke2: rgba(255,255,255,0.10);


      --W:1080px;
      --radius:16px;
      --tileR:14px;

      --camH: 300px;
      --bannerH: 70px;

      /* layout tuning */
      --sideW: 255px;
      --gap: 10px;

      /* bottom grid per sport (JS updates) */
      --bottomCols: 5;
      --tileH: 66px;

      /* LOCKED FOOTPRINT (2026-08-20)
         The overlay is a fixed-size OBS browser source. Its height must NEVER
         move when inner content changes: live score rows arriving, a longer
         header title, more promo text, more sold rows. Measured natural height
         with an empty scoreboard was 776px; with 8 score rows it grew to 880px,
         which shifts the whole scene in OBS. --H pins it. Inner regions flex
         into the leftover space and clip instead of pushing.
         2026-08-25 round 5: the header (65px) and the standalone promo banner
         row (10px margin + 70px) came out, and the banner moved into the
         controls row. That freed 145px of chrome. --H is reduced by the same
         145px so every remaining region keeps the exact size it had in round 4:
         tiles stay 70px, the camera hole and the sold FX landing do not move.
         The OBS browser source height must be set to 540. */
      --H: 540px;

      /* Controls row: every box except the ticker is this wide. Reset, Left,
         Sold and Next are trimmed to the narrowest width their labels still
         read at, so the ticker gets the rest of the row. */
      --ctlW: 90px;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      background:transparent;
      font-family: Arial, sans-serif;
      color: var(--white);
      user-select:none;
    }

    /* =========================
       OUTER OVERLAY (fixed size)
    ========================== */
    .overlay{
      width: var(--W);
      /* Locked footprint. Column flex so .main absorbs the leftover height
         instead of the content dictating the total. */
      height: var(--H);
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(circle at 35% 0%, #151515 0%, #0b0b0b 45%, #050505 100%);
      border-radius: var(--radius);
      border: 2px solid rgba(255,255,255,0.08);
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.85),
        0 16px 40px rgba(0,0,0,0.75),
        0 0 30px rgba(118,187,64,0.18);
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    /* ambient glow */
    .overlay::before{
      content:"";
      position:absolute; inset:-40px;
      background:
        radial-gradient(circle at 20% 20%, rgba(190,56,243,0.08), transparent 55%),
        radial-gradient(circle at 85% 35%, rgba(118,187,64,0.08), transparent 60%),
        radial-gradient(circle at 35% 85%, rgba(255,255,255,0.05), transparent 55%);
      filter: blur(10px);
      opacity: .90;
      pointer-events:none;
    }

    /* =========================
       HEADER
    ========================== */
.header{
  position: relative;
  flex: 0 0 auto;   /* locked footprint */
  height: 65px;
  border-radius: 14px;
  background: linear-gradient(274deg, rgb(196 14 229 / 82%), rgb(50 179 75));
  border: 1px solid rgba(255,255,255,0.14);
  display:flex;
  align-items:center;
  padding: 4px 30px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.10),
    inset 0 -1px 0 rgba(0,0,0,0.45);
  overflow: visible;      /* <-- was visible */
  isolation: isolate;    /* <-- keeps pseudo layers behind */
  z-index: 5;
}

/* faint skyline layer (behind content) */
.header::after{
  content:"";
  position:absolute;
  inset:0;
background-position: 50% 85%; /* center, bottom */
background-size: 140% auto; /* try 140–220% */
  background-image: var(--skyline);
  background-repeat: no-repeat;
  background-position:50% 85%;
  background-size: 94% 380%;

  opacity: 0.24;          /* "barely visible" */
  filter: blur(1.2px);
  pointer-events:none;
  z-index: 1;
}

/* optional soft glow like the example overlay */
.header::before{
  content:"";
  position:absolute;
  inset:-30%;
  background:
    radial-gradient(circle at 50% 120%, rgba(190,56,243,0.14), transparent 60%);
  opacity: .40;
  pointer-events:none;
  z-index: 0;
}

/* ensure header content stays above skyline */
.header > *{
  position: relative;
  z-index: 2;
}

/* 2026-08-25 round 5: the client asked for the top bar to be removed. The markup
   is deliberately KEPT in the DOM and hidden instead of deleted, because
   loadBreakNum() holds a hard reference to #breakId and the title loader writes
   to #headerTitle; deleting the nodes would throw on boot. display:none has to
   be explicit here, since .header{display:flex} above would beat the browser's
   hidden attribute. Delete this one rule to bring the header back. */
.header{ display:none !important; }

    .brand-left{
      display:flex;
      align-items:center;
      max-width:440;
      gap: 10px;
      min-width: 260px;
    }

    .brand-left .title{
      font-weight: 900;
      letter-spacing: 2px;
      font-size: 27px;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 2px 0 rgba(0,0,0,0.85);
      opacity: 0.94;
    }

    /* 2026-08-20: the centre header logo spot was removed at the client's
       request. The brand logo image element and its CSS are gone; the header now
       carries the text title on the left and the Break # pill on the right. */

    .header-right{
      margin-left:auto;
      display:flex;
      align-items:center;
      gap: 10px;
    }

    .break-pill{
      display:flex;
      align-items:center;
      gap: 12px;
      padding: 2px 4px;
      border-radius: 12px;
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(255,255,255,0.10);
      box-shadow: inset 0 0 0 1px rgba(118,187,64,0.12);
    }
    .break-pill .label{
      font-size: 24px;
      letter-spacing: 1px;
      opacity: .90;
      text-transform: uppercase;
    }
    .break-pill .value{
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 0.5px;
      color: white;
      text-shadow: 0 2px 0 rgba(0,0,0,0.8);
      min-width: 36px;
      text-align:right;
    }

    /* =========================
       MAIN GRID (fixed columns)
    ========================== */
    /* Scoped to the direct child of .overlay on purpose. The promo banner's
       message div built in renderBanner() is ALSO class="main", so an unscoped
       .main rule turns every banner message into a 3 column grid and centres the
       text in the 255px first column instead of in the banner. Symptom is banner
       text that sits off centre and appears to shift with message length.
       This defect is live in the source overlay (blue-light-rips). Do not unscope. */
    .overlay > .main{
      margin-top: 10px;
      /* absorbs leftover height inside the locked overlay */
      flex: 1 1 auto;
      min-height: 0;
      display:grid;
      grid-template-columns: var(--sideW) 1fr var(--sideW);
      gap: var(--gap);
      z-index: 2;
      position: relative;
    }

    /* ===== Border Wick Sweep (reusable) ===== */
    .wick{
      position: relative;
      border-radius: 14px;
    }
    .wick::after{
      content:"";
      position:absolute; inset: 2px;
      border-radius: inherit;
      pointer-events:none;
      z-index: 0;

      background:
    linear-gradient(130deg, #62ab4991 9%, 
    rgb(62 243 56 / 72%) 55%,
    rgb(93 255 0) 57%,
    rgba(118, 187, 64, 0.45) 47%,
    rgba(190, 56, 243, 0) 66%,
    #78ea59ad 104%);
      background-size: 300% 300%;
      animation: wickRun 5.5s linear infinite;

      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      mask-composite: exclude;
      padding: 2px;

      filter: blur(7px);
      opacity: 0.90;
      mix-blend-mode: screen;
    }
    @keyframes wickRun{
      0%   { background-position:   0% 50%; }
      100% { background-position: 100% 50%; }
    }

    /* Team boards */
    /* 2026-08-20: LIVE SCORES and STREAM STATS were removed, so the board is the
       only thing in the side stack. It now fills the full locked column height
       and its tiles stretch to share that space, instead of staying at a fixed
       66px and leaving a gap. */
    .board{
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 14px;
      padding: 4px;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(118,187,64,0.12);
    }
    .board > *{ position: relative; z-index: 2; }

    .colgrid{
      flex: 1 1 auto;
      min-height: 0;
      display:grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(var(--sideRows, 5), 1fr);
      gap: 5px;
    }
    /* side tiles are sized by the grid row, not by --tileH */
    .colgrid .tile{ height: 70px; min-height: 0; }

    /* Center stack */
    .center{
      display:flex;
      flex-direction: column;
      gap: 10px;
      align-items: stretch;
      justify-content: space-evenly;
      min-height: 0;   /* locked footprint */
    }

    .cam{
      /* absorbs whatever the bottom grid does not use, so the centre column
         always matches the side columns exactly */
      flex: 1 1 auto;
      min-height: 0;
      height: var(--camH);
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(0,0,0,0.25));
      border: 1px solid rgba(255,255,255,0.10);
      box-shadow:
        inset 0 0 0 2px rgba(0,0,0,0.35),
        0 0 0 1px rgba(118,187,64,0.16);
      position: relative;
      overflow: hidden;
    }
    .cam::before{
      content:"";
      position:absolute; inset:0;
      background:
        radial-gradient(circle at 30% 30%, rgba(255,255,255,0.10), transparent 55%),
        radial-gradient(circle at 70% 70%, rgba(118,187,64,0.10), transparent 55%),
        linear-gradient(180deg, rgba(255,255,255,0.05), rgba(0,0,0,0.20));
      opacity: .9;
      pointer-events:none;
    }
    /* Facecam background media (image OR looping video; seller can replace) */
    .cam-bg{
      position:absolute; inset:0;
      width:100%; height:100%;
      object-fit:cover;
      z-index:1;
      border-radius:inherit;
    }
    /* Hidden toggles (invisible on stream).
       LEFT stat box: STRICTLY the admin control panel (the pill row). It does
                       not touch the sold list. This replaced the invisible
                       top-left #adminToggle hotspot on 2026-08-25 round 5: that
                       hotspot lived behind the header, and the header is gone.
                       A visible control the seller can actually find beats an
                       invisible one, and OBS has no cursor so nothing shows on
                       stream.
       #soldListToggle: sits on the sold data box itself and shows/hides the
                       sold list only. It does not touch the admin panel. */
    /* 2026-08-20 fix. The first version was a 74x40 box pinned to the panel's
       top-right corner. It worked, but it was undiscoverable (no affordance at
       all) and it sat on top of the top-right sold-item's buyer input, so it
       stole clicks meant for that field. It is now a full-width strip along the
       very top edge of the sold panel, inside the panel's own 10px padding, so
       it overlaps no control in any state. It stays invisible on stream (OBS has
       no cursor, so the hover hint can never appear there) but shows a faint
       label under the mouse so the seller can find it. */
    #soldListToggle{
      position:absolute; top:0; left:0; right:0;
      height:14px;
      z-index:60; cursor:pointer;
      background:transparent;
      pointer-events:auto;
    }
    #soldListToggle::after{
      content: attr(data-label);
      position:absolute; top:1px; left:50%;
      transform: translateX(-50%);
      font-size:9px; font-weight:900; letter-spacing:1.2px;
      text-transform:uppercase;
      color:#0b0b0b;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      padding:1px 10px; border-radius:0 0 8px 8px;
      opacity:0;
      transition: opacity .15s ease;
      pointer-events:none;
      white-space:nowrap;
    }
    #soldListToggle:hover::after{ opacity:.92; }
    /* Chaser marker on team tiles */
    .chaseTag{
      position:absolute; top:3px; left:3px; z-index:4;
      font-size:9px; font-weight:900; letter-spacing:.5px;
      color:#10131c;
      background: linear-gradient(135deg,#ffd54a,#ffb300);
      padding:1px 5px; border-radius:6px;
      box-shadow:0 2px 6px rgba(0,0,0,.55);
      pointer-events:none; display:none;
    }
    .tile.chaser .chaseTag{ display:block; }

    /* CHASE indicator: live GOLD glow, not a flat amber outline. The pulse makes
       a chase tile read instantly on stream next to 30 unsold tiles. */
    .tile.chaser{
      border-color: rgba(255,196,0,0.95) !important;
      box-shadow:
        inset 0 0 0 2px rgba(255,205,60,0.90),
        0 0 14px rgba(255,190,20,0.70),
        0 0 30px rgba(255,170,0,0.42),
        0 6px 14px rgba(0,0,0,0.45) !important;
      animation: chaseGold 1.9s ease-in-out infinite;
    }
    @keyframes chaseGold{
      0%, 100%{
        box-shadow:
          inset 0 0 0 2px rgba(255,205,60,0.80),
          0 0 10px rgba(255,190,20,0.50),
          0 0 22px rgba(255,170,0,0.28),
          0 6px 14px rgba(0,0,0,0.45);
      }
      50%{
        box-shadow:
          inset 0 0 0 2px rgba(255,225,120,1),
          0 0 20px rgba(255,196,0,0.95),
          0 0 44px rgba(255,160,0,0.60),
          0 6px 14px rgba(0,0,0,0.45);
      }
    }
    /* gold wash over the tile's own green ambient glow */
    .tile.chaser::before{
      background: radial-gradient(circle at 50% 60%, rgba(255,196,0,0.45), transparent 60%);
      opacity: 0.85;
    }
    .tile.chaser .chaseTag{
      box-shadow: 0 2px 6px rgba(0,0,0,.55), 0 0 10px rgba(255,196,0,0.85);
    }
    .tile.sold.chaser{ animation: none; }
    .tile.sold .chaseTag{ display:none; }

.board,
.infoPanel,
.cam,
.banner,
.sold-wrap{
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.08),
    inset 0 0 0 1px rgba(118,187,64,0.10),
    0 10px 22px rgba(0,0,0,0.35);
  border: 1px solid rgba(255,255,255,0.14); /* slightly stronger white edge */
}



    /* Bottom teams (NBA/MLB = 10, NFL = 12) */
    .bottomGrid{
      flex: 0 0 auto;
      display:grid;
      grid-template-columns: repeat(var(--bottomCols), 1fr);
      gap: 6px;
    }

    /* Tiles */
    .tile{
      height: var(--tileH);
      border-radius: var(--tileR);
      background: rgba(10,10,10,0.78);
  border: 2px solid rgba(255, 255, 255, 0.836);
  box-shadow:
    inset 0 2px 0 rgba(255,255,255,0.10),   /* NEW white highlight */
    inset 0 0 0 1px rgba(0,0,0,0.55),
    0 6px 14px rgba(0,0,0,0.45);
      position: relative;
      overflow: hidden;
      cursor: pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      transition: transform .22s cubic-bezier(.2,.8,.25,1),
                  box-shadow .22s ease,
                  border-color .22s ease;
      will-change: transform;
    }

    /* Shimmer layer. buildTile() appends .fx to every tile; it stays idle until
       hover, then a single diagonal light sweep crosses the tile. */
    .tile .fx{
      position:absolute; inset:0;
      z-index: 3;
      pointer-events:none;
      border-radius: inherit;
      overflow: hidden;
      opacity: 0;
    }
    .tile .fx::after{
      content:"";
      position:absolute;
      top:-60%; bottom:-60%; left:-150%;
      width: 78%;
      background: linear-gradient(
        105deg,
        transparent 0%,
        rgba(118,187,64,0.30) 26%,
        rgba(255,255,255,0.55) 42%,
        rgba(255,255,255,1)    52%,
        rgba(190,56,243,0.60) 66%,
        transparent 100%);
      transform: rotate(8deg);
      filter: blur(1.5px);
      mix-blend-mode: screen;
    }

    /* Hover lift + shimmer. Chase tiles keep their gold pulse untouched, and a
       sold tile is finished, so neither takes the hover treatment. */
    .tile:not(.sold):hover{
      transform: translateY(-4px) scale(1.02);
      border-color: rgba(190,56,243,0.85);
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,0.16),
        inset 0 0 0 1px rgba(0,0,0,0.55),
        0 0 14px rgba(118,187,64,0.45),
        0 14px 24px rgba(0,0,0,0.62);
      z-index: 6;
    }
    .tile.chaser:not(.sold):hover{
      /* keep gold on a chase tile; lift only */
      border-color: rgba(255,225,120,1);
    }
    .tile:not(.sold):hover .fx{
      opacity: 1;
    }
    .tile:not(.sold):hover .fx::after{
      animation: tileShimmer 1.05s cubic-bezier(.25,.6,.3,1) forwards;
    }
    @keyframes tileShimmer{
      0%   { left:-150%; opacity:0; }
      10%  { opacity:1; }
      88%  { opacity:1; }
      100% { left:170%; opacity:0; }
    }

    /* Text stand-in when a team logo fails to load (Standard v2.4 sec 14). */
    .fallback-code{
      position:absolute; inset:0;
      display:flex; align-items:center; justify-content:center;
      font-weight:900; font-size:22px; letter-spacing:1px;
      color:#fff;
      text-shadow: 0 2px 6px rgba(0,0,0,0.85);
      z-index: 2;
    }

    .tile img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.6));
      z-index: 2;
      position: relative;
    }

    .tile::before{
      content:"";
      position:absolute;
      inset:-18px;
      background: radial-gradient(circle at 20% 70%, rgba(118,187,64,0.28), transparent 55%);
      filter: blur(14px);
      opacity: 0.55;
      animation: tileGlowDrift 4.5s ease-in-out infinite;
      z-index: 1;
      pointer-events:none;
    }
    @keyframes tileGlowDrift{
      0%   { transform: translate(-4px, 2px) scale(0.98); opacity: 0.38; }
      50%  { transform: translate(6px,-2px) scale(1.05); opacity: 0.62; }
      100% { transform: translate(-4px, 2px) scale(0.98); opacity: 0.38; }
    }

    .tile.sold img{
      filter: grayscale(1) brightness(0.45);
      opacity: 0.95;
    }
    .tile.sold::after{
      content:"✕";
      position:absolute; inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size: 54px;
      font-weight: 900;
      color: rgba(190,56,243,0.95);
      text-shadow:
        0 0 10px rgba(118,187,64,0.60),
        0 0 18px rgba(190,56,243,0.45),
        0 8px 22px rgba(0,0,0,0.85);
      z-index: 3;
      pointer-events:none;
    }
    .tile.sold::before{
      opacity: 0.12;
      animation: none;
    }

    /* ===== Team SOLD animation (flying card — no glass break, no audio) ===== */
    .sold-fx-layer{ position:fixed; inset:0; pointer-events:none; z-index:99990; overflow:visible; }
    .sold-fx-card{
      position:absolute; left:0; top:0; width:420px; height:250px; opacity:0;
      transform: translate3d(0,0,0) scale(.28); transform-origin:center center;
      filter: drop-shadow(0 18px 28px rgba(0,0,0,0.74)) drop-shadow(0 0 24px rgba(118,187,64,0.22)) drop-shadow(0 0 24px rgba(190,56,243,0.18));
      will-change: transform, opacity;
    }
    .sold-fx-card.play{ animation: soldFxCardTravel 1850ms cubic-bezier(.18,.84,.18,1) forwards; }
    .sold-fx-spin{ position:absolute; inset:0; transform-style:preserve-3d; will-change:transform; }
    .sold-fx-card.play .sold-fx-spin{ animation: soldFxSpin 760ms cubic-bezier(.2,.8,.2,1) 120ms forwards; }
    .sold-fx-inner{
      position:relative; width:100%; height:100%; border-radius:20px; overflow:hidden;
      background:
        radial-gradient(240px 110px at 20% 14%, rgba(118,187,64,0.20), transparent 60%),
        radial-gradient(240px 110px at 80% 86%, rgba(190,56,243,0.18), transparent 60%),
        linear-gradient(180deg, rgba(10,10,12,0.98), rgba(3,3,5,0.98));
      border:2px solid rgba(255,255,255,0.22);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06), 0 0 30px rgba(0,0,0,0.35);
      transform: translateZ(0); backface-visibility:hidden;
    }
    .sold-fx-inner::before{
      content:""; position:absolute; inset:0;
      background: repeating-linear-gradient(to bottom, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 1px, rgba(0,0,0,0) 3px, rgba(0,0,0,0) 6px);
      opacity:.12; pointer-events:none;
    }
    .sold-fx-team-img{
      position:absolute; inset:14px 14px 54px 14px; width:calc(100% - 28px); height:calc(100% - 68px);
      object-fit:cover; border-radius:14px; border:2px solid rgba(255,255,255,0.14); background:#000;
      box-shadow: 0 0 16px rgba(118,187,64,0.10), 0 0 16px rgba(190,56,243,0.10);
    }
    .sold-fx-name{
      position:absolute; left:14px; right:14px; bottom:14px; text-align:center;
      font-size:20px; letter-spacing:1px; font-weight:900; color:#fff; text-transform:uppercase;
      text-shadow: 0 2px 12px rgba(0,0,0,0.95), 0 0 12px rgba(118,187,64,0.18);
    }
    .sold-fx-stamp{
      position:absolute; left:50%; top:50%;
      transform: translate(-50%,-50%) rotate(-12deg) scale(1.8);
      padding:12px 28px; border-radius:14px; border:3px solid rgba(255,255,255,0.92);
      background: linear-gradient(135deg, rgba(118,187,64,0.96), rgba(12,40,140,0.98));
      color:#fff; font-size:40px; font-weight:900; letter-spacing:3px; text-transform:uppercase;

    @keyframes soldFxCardTravel{
      0%{ opacity:.25; transform: translate3d(var(--fx-start-x), var(--fx-start-y), 0) scale(.20); }
      20%{ opacity:1; transform: translate3d(var(--fx-mid-x), var(--fx-mid-y), 0) scale(.72); }

      100%{ opacity:0; transform: translate3d(var(--fx-end-x), calc(var(--fx-end-y) - 18px), 0) scale(.92); }

    @keyframes soldFxSpin{

      75%{ transform: perspective(1200px) rotateY(-8deg) rotateX(0deg); }
      100%{ transform: perspective(1200px) rotateY(0deg) rotateX(0deg); }

    @keyframes soldFxStamp{
      0%{ opacity:0; transform: translate(-50%,-105%) rotate(-18deg) scale(1.85); }
      60%{ opacity:1; transform: translate(-50%,-50%) rotate(-10deg) scale(.92); }
      100%{ opacity:1; transform: translate(-50%,-50%) rotate(-12deg) scale(1); }
    }
    @keyframes soldFxBurst{
      0%{ opacity:0; transform: scale(.55); }
      28%{ opacity:.78; }

    .sideStack{

        box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.10),

    .ticker{

    /* soft fade at both ends so text slides in and out instead of popping */
    .ticker::before,
    .ticker::after{
      content:"";

    }
    .ticker::before{ left:0;  background: linear-gradient(90deg, rgba(0,0,0,0.95), transparent); }

      align-items:center;

      will-change: transform;
      animation: tickerRun var(--tickerDur, 50s) linear infinite;

    /* the track holds the item list TWICE, so translating exactly -50% lands on

    @keyframes tickerRun{

    .tick-item{

    ========================== */
    .sold-wrap{

      font-size:16px;
      font-weight:900;
      outline:none;

  </style>
</head>

<body>
  <div class="overlay">

    <!-- 2026-08-25 round 5: HEADER REMOVED at the client's request. The markup is

<script>
  /* =========================
     Paths (standard BASE)
  ========================== */
  const BASE = (() => {
    const isGhPages = location.hostname.endsWith('github.io');
    if (isGhPages) {
      const parts = location.pathname.split('/').filter(Boolean);
      const repo = parts.length ? parts[0] : '';
      return `/${repo}/`;
    }
    return '../../';
  })();

// ===== Per-client settings (NO URL) =====
// Set this per overlay file:
//  - TYSCHAP BREAKZ: "tyschap-breakz"
//  - Apex: "apex"
//  - Wizard: "wizard"
const CLIENT_ID = "tyschap-breakz";

const LS = {
  get(k, d=""){ const v = localStorage.getItem(`${CLIENT_ID}.${k}`); return (v==null ? d : v); },
  set(k, v){ localStorage.setItem(`${CLIENT_ID}.${k}`, String(v)); }
};


  // 2026-08-20: header logo spot removed at client request. LOGO_PATH is kept
  // as the canonical brand asset reference (TSU standard: every asset resolves

  const CAM_DEFAULTS = ['16x9-updated.mp4', 'fc-bg.mp4'];

  function camResolve(v){

       straight out of Explorer instead of copying the file. */
    if (/^[A-Za-z]:[\\/]/.test(raw)){
      return 'file:///' + encodeURI(raw.replace(/\\/g, '/'));
    }
    if (/^\\\\/.test(raw)){

    }

    // banner image, so a seller can drop fc-bg.mp4 beside index.html.
    return new URL(raw, location.href).href;

  /* ===== BROWSED MEDIA THAT SURVIVES AN OBS RESTART (2026-08-28) =====
     A browsed clip used to vanish on restart and drop back to fc-bg.mp4. localStorage
     holds about 5MB per origin and base64 inflates a file by a third, so any real video
     blew the quota and could only be applied for the session. IndexedDB has no practical
     size limit and persists, so the FILE ITSELF now lives there and is re-attached on
     boot; localStorage keeps only a small "idb:<filename>" marker.
     Chromium refuses IndexedDB on file:// origins, so every call is guarded and falls
     back to the old behaviour: session-only blob, plus the filename saved so the seller
     can drop the file beside index.html for a permanent swap. */
  const CAM_IDB_DB = 'tyschap-breakz-media', CAM_IDB_STORE = 'files', CAM_IDB_KEY = 'camBg';
  const CAM_IDB_MARKER = 'idb:';

  function camIdbOpen(){
    return new Promise((res, rej) => {
      let req;
      try { req = indexedDB.open(CAM_IDB_DB, 1); } catch(e){ return rej(e); }
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(CAM_IDB_STORE)) db.createObjectStore(CAM_IDB_STORE);
      };
      req.onsuccess = () => res(req.result);
      req.onerror   = () => rej(req.error || new Error('indexeddb open failed'));
      req.onblocked = () => rej(new Error('indexeddb blocked'));
    });
  }
  function camIdbPut(blob, name, kind){
    return camIdbOpen().then(db => new Promise((res, rej) => {
      let tx;
      try { tx = db.transaction(CAM_IDB_STORE, 'readwrite'); } catch(e){ db.close(); return rej(e); }
      tx.objectStore(CAM_IDB_STORE).put({ blob, name, kind, savedAt: Date.now() }, CAM_IDB_KEY);
      tx.oncomplete = () => { db.close(); res(true); };
      tx.onerror    = () => { db.close(); rej(tx.error || new Error('indexeddb write failed')); };
      tx.onabort    = () => { db.close(); rej(tx.error || new Error('indexeddb write aborted')); };
    }));
  }
  function camIdbGet(){
    return camIdbOpen().then(db => new Promise((res, rej) => {
      let tx;
      try { tx = db.transaction(CAM_IDB_STORE, 'readonly'); } catch(e){ db.close(); return rej(e); }
      const rq = tx.objectStore(CAM_IDB_STORE).get(CAM_IDB_KEY);
      rq.onsuccess = () => { db.close(); res(rq.result || null); };
      rq.onerror   = () => { db.close(); rej(rq.error || new Error('indexeddb read failed')); };
    }));
  }
  function camIdbClear(){
    return camIdbOpen().then(db => new Promise((res) => {
      let tx;
      try { tx = db.transaction(CAM_IDB_STORE, 'readwrite'); } catch(e){ db.close(); return res(false); }
      tx.objectStore(CAM_IDB_STORE).delete(CAM_IDB_KEY);
      tx.oncomplete = () => { db.close(); res(true); };
      tx.onerror    = () => { db.close(); res(false); };
    })).catch(() => false);

  const CAM_MIME_BY_EXT = { mp4:'video/mp4', m4v:'video/x-m4v', mov:'video/quicktime',

                            png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg',

      vid.onerror = () => {

  function norm(s){
    return String(s || "")
      .toLowerCase()
      .replace(/&/g, "and")

      .trim();

  function buildLookup(teams){
    const map = new Map();
    for (const t of teams){
      const code = String(t.code || "").toUpperCase();
      if (!code) continue;
      map.set(norm(code), code);
      map.set(norm(t.name), code);
    }
    return map;
  }

  function inferCodeFromTitle(title){
    const teams = breakTypes[currentSport].teams;
    const lookup = buildLookup(teams);
    const t = norm(title);
    if (!t) return null;

    if (lookup.has(t)) return lookup.get(t);

    const m = String(title || "").match(/\b([A-Z]{2,4})\b/);
    if (m && m[1]) {
      const token = norm(m[1]);
      if (lookup.has(token)) return lookup.get(token);
    }

    const keys = Array.from(lookup.keys()).sort((a,b) => b.length - a.length);
    for (const k of keys){
      if (k.length < 3) continue;
      if (t.includes(k)) return lookup.get(k);
    }
    return null;
  }

function normalizeCodeAliases(code, sportKey){
  const c = String(code || "").toUpperCase().trim();
  const s = String(sportKey || "").toLowerCase();
  if (!c) return c;

  // Common feed aliases
  if (s === "mlb" && c === "WAS") return "WSH"; // Nationals (your MLB list uses WSH)

  return c;
}

  const s = String(sportKey || "").toLowerCase();

}

function playSoldAnimation(code){
  const team = getTeamByCode(code); if (!team) return;
  const fxLayer = document.getElementById("soldFxLayer");
  const tile = document.querySelector(`[data-team-code="${code}"]`);
  if (!fxLayer || !tile) return;
  const tileRect = tile.getBoundingClientRect();
  const layerRect = fxLayer.getBoundingClientRect();
  const cardW = 420, cardH = 250;
  const startCenterX = (tileRect.left - layerRect.left) + (tileRect.width/2);
  const startCenterY = (tileRect.top - layerRect.top) + (tileRect.height/2);
  const startX = startCenterX - cardW/2, startY = startCenterY - cardH/2;
  const endX = (layerRect.width/2) - cardW/2;

  // 2026-08-20: the card used to land at 19% of the viewport height, which is
  // squarely over the camera. On stream the OBS facecam source sits in that hole
  // and hides the whole animation: it looks perfect in a bare browser and is
  // invisible to viewers. The card now lands just BELOW the camera, in front of
  // the bottom row of team tiles. Anchored to the live #camFrame rect so it
  // follows the camera when --camH or the sport changes, then clamped so it can
  // never ride back up over the camera or run off the bottom of the layer.
  const endY = (() => {
    const camEl = document.getElementById('camFrame');
    const gridEl = document.getElementById('bottomGrid');
    const fallback = Math.max(40, layerRect.height * 0.19);
    if (!camEl) return fallback;
    const camR = camEl.getBoundingClientRect();
    const camBottom = (camR.bottom - layerRect.top);
    let y = camBottom + 6;                         // top edge just under the camera
    const minY = camBottom + 2;                    // never overlap the camera
    let maxY = layerRect.height - cardH - 8;       // never run off the bottom
    if (gridEl){
      // keep the card's top no lower than the bottom row of tiles, so it always
      // reads as sitting in front of the board
      const gR = gridEl.getBoundingClientRect();
      maxY = Math.min(maxY, (gR.bottom - layerRect.top) - 12);
    }
    if (maxY < minY) return Math.max(0, minY);
    return Math.min(Math.max(y, minY), maxY);
  })();
  const midX = startX + (endX-startX)*0.48, midY = startY + (endY-startY)*0.48 - 28;
  const card = document.createElement("div");
  card.className = "sold-fx-card";
  card.style.setProperty("--fx-start-x", `${startX}px`);
  card.style.setProperty("--fx-start-y", `${startY}px`);
  card.style.setProperty("--fx-mid-x", `${midX}px`);
  card.style.setProperty("--fx-mid-y", `${midY}px`);
  card.style.setProperty("--fx-end-x", `${endX}px`);
  card.style.setProperty("--fx-end-y", `${endY}px`);
  card.innerHTML = `
    <div class="sold-fx-spin">
      <div class="sold-fx-inner">
        <div class="sold-fx-burst"></div>
        ${team.image ? `<img class="sold-fx-team-img" src="${team.image}" alt="${team.name||team.code}">` : ""}
        <div class="sold-fx-stamp">SOLD</div>
        <div class="sold-fx-name">${String(team.name||team.code||'').toUpperCase()}</div>
      </div>
    </div>`;
  fxLayer.appendChild(card);
  const img = card.querySelector(".sold-fx-team-img");
  if (img) img.onerror = () => img.remove();
  requestAnimationFrame(() => card.classList.add("play"));
  setTimeout(() => card.remove(), 2100);
}

   The item list is rendered TWICE into the track and the keyframe translates

   which does NOT restart a running CSS animation, so a sale mid-scroll does not

========================== */
// Seller-editable from the admin panel: Ticker Text. Persisted per client.
const TICKER_SPEED_DEFAULT = 92;   // pixels per second
let TICKER_MSGS  = parseMsgList(LS.get('tickerMsgs',''));
let TICKER_STATS = (LS.get('tickerStats','1') !== '0');
let TICKER_SPEED = (() => {
  const v = parseInt(LS.get('tickerSpeed', String(TICKER_SPEED_DEFAULT)), 10);
  return (Number.isFinite(v) && v >= 20 && v <= 400) ? v : TICKER_SPEED_DEFAULT;
})();

let _tickerLast = '';
let _tickerDur = 0;
let _tickerTimer = null;
let _tickerForce = false;   // set when speed changes, to force a duration rewrite

function tickerItems(){
  const out = [];

  if (TICKER_STATS){
    const total = (typeof getSportCount === 'function') ? getSportCount() : 0;
    out.push(['Remaining', String(Math.max(0, total - soldSet.size))]);
    out.push(['Sold', String(soldSet.size)]);
    if (typeof highBid === 'number' && highBid > 0) out.push(['Highest Bid', '$' + highBid.toFixed(2)]);
    if (topBuyerName) out.push(['Top Buyer', topBuyerName]);
    if (typeof countChasersLeft === 'function') out.push(['Chasers Left', String(countChasersLeft())]);
  }

  // Live scores only appear when they are switched on for this client.
  if (SCORES_ENABLED){
    ['nfl','nba','mlb'].forEach(sp => {
      const games = scoresBySport[sp] || [];
      games.slice(0, 8).forEach(g => {
        if (!g) return;
        const line = `${g.away} ${g.awayScore}, ${g.home} ${g.homeScore}`;
        out.push([sportLabel(sp), g.status ? `${line} (${g.status})` : line]);
      });
    });
  }

  // The seller's own ticker lines. If they have not written any, fall back to
  // the promo banner messages so the bar is never blank out of the box.
  const msgs = (TICKER_MSGS && TICKER_MSGS.length) ? TICKER_MSGS : (PROMO_MSGS || []);
  msgs.forEach(m => { if (m) out.push(['', m]); });

  if (!out.length) out.push(['', 'TySchap Breakz']);
  return out;
}

function tickerHalfHTML(items){
  return items.map(([k, v]) => {
    const key = k ? `<span class="k">${escHtml(k)}</span>` : '';
    return `<span class="tick-item">${key}<span>${escHtml(v)}</span></span><i class="tick-sep"></i>`;
  }).join('');
}

function escHtml(v){
  return String(v == null ? '' : v)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function renderTicker(){
  const track = document.getElementById('tickerTrack');
  if (!track) return;
  const items = tickerItems();
  const sig = JSON.stringify(items);
  if (sig === _tickerLast) return;
  _tickerLast = sig;

  const half = tickerHalfHTML(items);
  track.innerHTML = half + half;          // two identical halves, -50% loop

  // Constant scroll speed regardless of how much content is in the bar.
  const halfW = track.scrollWidth / 2;
  if (halfW > 0){
    const dur = Math.max(6, halfW / TICKER_SPEED);
    if (_tickerForce || !_tickerDur || Math.abs(dur - _tickerDur) / _tickerDur > 0.12){
      _tickerDur = dur;
      _tickerForce = false;
      track.style.setProperty('--tickerDur', dur.toFixed(2) + 's');
    }
  }
}

function scheduleTicker(force){
  if (force){ _tickerForce = true; _tickerLast = ''; }
  if (_tickerTimer) return;
  _tickerTimer = setTimeout(() => { _tickerTimer = null; renderTicker(); }, 250);
}

/* =========================
   SIDE / BOTTOM TILE HEIGHT SYNC
   The side boards now stretch their tiles to fill the locked column height, so
   --tileH is no longer the authority for them. The bottom grid still uses
   --tileH, and it has to match or the board looks like two different builds.
   Measure a real side tile and republish its height. getComputedStyle would
   return the unresolved min()/calc() expression, so measure the rect.

   No feedback loop: the side board is sized by the locked .main height, and the
   camera flexes to absorb whatever the bottom grid takes, so changing --tileH
   cannot change the side tile it was measured from.
========================== */
function syncTileHeights(){
  const probe = document.querySelector('#leftGrid .tile');
  if (!probe) return;
  const h = Math.round(probe.getBoundingClientRect().height);
  if (h > 20 && h < 400){
    document.documentElement.style.setProperty('--tileH', h + 'px');
  }
}

// LOCKED FOOTPRINT helper.
// The overlay height is pinned by --H, so an info panel can no longer grow to
// fit its rows. Instead of clipping live scores, step the row font and gap down
// until the content fits its box. Floors at 9px / 1px; anything past that is
// clipped by .infoBody{overflow:hidden}, which is still preferable to the whole
// OBS scene shifting down.
function fitInfoBody(el){
  if (!el) return;
  const steps = [[14,10],[12,8],[12,4],[12,2],[12,1]];
  for (const [fs, gap] of steps){
    el.style.setProperty('--infoFS', fs + 'px');
    el.style.setProperty('--infoGap', gap + 'px');
    if (el.scrollHeight <= el.clientHeight) return;
  }
}

const _esMap = new Map(); // url -> EventSource

/* Standard v2.4 sec 8 / 18: announce this overlay to the bridge on load.
   The target is the /events endpoint. The bridge has no dedicated warm-up
   endpoint, so do not invent one. Fails silently, which is the correct
   behaviour while BRIDGE_KEY is still the placeholder. */
function warmupPing(){
  try {
    fetch(`${BRIDGE_URL}/events`, {
      method: "POST",
      headers: { "x-bridge-key": BRIDGE_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ type: "overlay_warmup", overlayId: CLIENT_ID, channel: "main" })
    }).catch(() => {});
  } catch(_) {}
}

function connectSSE(url){
  const prev = _esMap.get(url);
  if (prev) { try { prev.close(); } catch(_){} }

  console.log("[Overlay] Connecting SSE:", url);
  const es = new EventSource(url);
  _esMap.set(url, es);

  es.onopen = () => console.log("[Overlay] SSE OPEN", url);

  es.onerror = () => {
    console.warn("[Overlay] SSE ERROR (retrying in 2.5s)", url);
    try { es.close(); } catch(_) {}
    _esMap.delete(url);
    setTimeout(() => connectSSE(url), 2500);
  };

const onAny = (e) => {
  try {
    const obj = JSON.parse(e.data);

    // If the server uses SSE event names (event: team_sold) and sends JSON
    // without {type}, inject the event name so handleSSEEvent works.
    if (obj && typeof obj === "object" && !obj.type && !obj.event && e && e.type && e.type !== "message") {
      obj.type = e.type;
    }

    handleSSEEvent(obj);
  } catch (err) {
    console.warn("[Overlay] bad JSON:", e.data);
  }
};

// default "message" (this catches your initial hello + any data-only sends)
  es.onmessage = onAny;
  es.addEventListener("event", onAny);
  es.addEventListener("message", onAny);

  // Named SSE events bypass onmessage, so every alias the bridge can emit must
  // be registered here or it is silently never received (Standard v2.4 sec 8, 9.1, 19).
  const SSE_EVENTS = [
    "scores", "scores_update",              // scores_update: emitted by the legacy producer
    "team_sold", "sold", "sale",

   Semantics: an event carrying no breakId always passes. One that carries a
   breakId must match this overlay's current break, so a late or replayed event
   from a previous break can never mutate the live board. */
function computeBreakId(){
  const d = new Date();
  const yyyymmdd = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  return `${yyyymmdd}-${currentSport}-${breakNum}`;

function breakIdMatches(data){
  if (!data || typeof data !== "object") return true;
  const payload = (data.data && typeof data.data === "object") ? data.data : data;
  const incoming = data.breakId || payload.breakId;
  if (!incoming) return true;               // no breakId on the event = always pass
  return String(incoming) === computeBreakId();
}

  document.getElementById('applyCamUrl').addEventListener('click', () => {

    // camResolve strips them anyway, but store the clean value so the box reads back tidy.
    const u = String(camUrlInput.value||'').trim().replace(/^["']|["']$/g, '');
    try { camUrlInput.value = u; } catch(_){}
    // Drop any stored file first: the marker would otherwise win over the typed path.
    camIdbClear().then(() => {
      LS.set('camBg', u); LS.set('camBgData','');
      LS.set('camBgKind', VIDEO_EXT.test(u) ? 'video' : 'image');
      applyCamBg();
      camSay('');
      camPopup.classList.remove('active');
    });
  });
  // Reset returns to the baked default (fc-bg.mp4), not to an empty camera.
  document.getElementById('resetCam').addEventListener('click', () => {
    camIdbClear().then(() => {
      LS.set('camBg',''); LS.set('camBgData',''); LS.set('camBgKind','');
      try { camUrlInput.value = ''; } catch(_){}
      applyCamBg();
      camSay('');
      camPopup.classList.remove('active');
    });
  });

  // Export popup
  const exportPopup = document.getElementById('exportPopup');
  const exportBox = document.getElementById('exportBox');
  document.getElementById('exportBtn').addEventListener('click', () => {
    exportBox.value = exportCSV();
    exportPopup.classList.add('active');
  });
  document.getElementById('closeExport').addEventListener('click', () => exportPopup.classList.remove('active'));
  document.getElementById('copyBtn').addEventListener('click', async () => {
    exportBox.focus();
    exportBox.select();
    try{
      await navigator.clipboard.writeText(exportBox.value);
      document.getElementById('copyBtn').textContent = 'Copied!';
      setTimeout(() => document.getElementById('copyBtn').textContent = 'Copy', 900);
    }catch(_){
      try{
        document.execCommand('copy');
        document.getElementById('copyBtn').textContent = 'Copied!';
        setTimeout(() => document.getElementById('copyBtn').textContent = 'Copy', 900);
      }catch(__){}
    }
  });

  /* =========================
     Boot
  ========================== */
  window.addEventListener('DOMContentLoaded', () => {
    loadSport();
    applySportCSS();

    loadBreakNum();
    loadChasers();
    loadHeaderTitle();

    const cfg = breakTypes[currentSport];
    const defaultTitle = `TYSCHAP BREAKZ • ${cfg.name}`;
    if (/^TYSCHAP BREAKZ\s*•/i.test(headerTitleText)){
      setHeaderTitle(defaultTitle);
    } else {
      safeText("headerTitle", headerTitleText);
    }

    renderTeams();
    renderBanner();
    applyCamBg();
    updateStreamStatsBox();
if (SCORES_ENABLED) {
  renderScores();
  if (SCORE_MODE === "cycle") {
    if (_scoreCycleTimer) clearInterval(_scoreCycleTimer);
    _scoreCycleTimer = setInterval(() => {
      _cycleIdx = (_cycleIdx + 1) % _cycleOrder.length;
      renderScores();
    }, CYCLE_MS);
  }
} else {
  console.info("[Overlay] Live scores are disabled for this client (SCORES_ENABLED = false).");
}

    // init per-break stats
    setHighBid(0);
    setTopBuyer('');

if (BRIDGE_URL) {
  // Sales — main bridge, channel "main".
  CHANNELS.forEach(ch => {
    const url = `${BRIDGE_URL}/stream?channel=${encodeURIComponent(ch)}&key=${encodeURIComponent(BRIDGE_KEY)}`;
    connectSSE(url);
  });

  // Scores. Dedicated score service, channel "sports", different HOST.
  // Not subscribed for this client: SCORES_ENABLED is false.
  if (SCORES_ENABLED) {
    connectSSE(
      `${SCORES_BRIDGE_BASE}/stream?channel=${encodeURIComponent(getScoresChannel())}` +
      `&key=${encodeURIComponent(BRIDGE_KEY)}`
    );
  }

  warmupPing();
} else {
  console.warn("[Overlay] No BRIDGE_URL set. Set localStorage tsu.bridge or add ?bridge=https://...");
}



  

    startBannerRotation();
  });
</script>
<div id="soldFxLayer" class="sold-fx-layer" aria-hidden="true"></div>
</body>
</html>
