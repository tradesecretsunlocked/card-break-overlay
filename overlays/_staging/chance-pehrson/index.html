<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>7cBreaks — TSU Overlay</title>
<style>
:root{
  /* ===== 7cBreaks (Teal + Black + White) ===== */
  --bg0: #071313;
  --bg1: #030a0a;

  --steel1: #ffffff;
  --steel2: #ccfaf6;
  --steel3: #0a2222;

  --teal:     #00E0CC;
  --tealDeep: #00857a;

  --white: #ffffff;

  --border:     rgb(255, 255, 255);
  --borderSoft: rgba(255, 255, 255, 0.95);

  --team-cols: 4;
  --team-height: 68px;
  --teams-h: 390px;

  --W: 1080px;
  --radius: 16px;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  width:100%;
  max-width: var(--W);
  min-height: 600px;
  margin-inline: auto;
  font-family: Arial, sans-serif;
  color: var(--white);
  background: transparent;
  display:flex;
  flex-direction:column;
  align-items:center;
  user-select:none;
}

/* ===== Outer container ===== */
.overlay-container{
  width:100%;
  max-width: var(--W);
 
  border-radius: var(--radius);

  background:
    radial-gradient(900px 420px at 30% 0%, rgba(0,224,204,0.10), transparent 62%),
    radial-gradient(900px 520px at 72% 30%, rgba(0,133,122,0.12), transparent 62%),
    linear-gradient(180deg, var(--bg0), var(--bg1));
  border: 4px solid rgba(0,224,204,0.90);
  box-shadow: 0 12px 32px rgba(0,0,0,0.70), 0 0 40px rgba(0,224,204,0.08);
  display:flex;
  flex-direction:column;
  gap: 8px;
  position:relative;
}

.overlay-container::before{
  content:"";
  position:absolute; inset:-30px;
  background:
    radial-gradient(circle at 22% 20%, rgba(0,224,204,0.08), transparent 56%),
    radial-gradient(circle at 72% 18%, rgba(0,133,122,0.10), transparent 58%),
    radial-gradient(circle at 60% 86%, rgba(0,224,204,0.06), transparent 58%);
  filter: blur(16px);
  opacity:.95;
  pointer-events:none;
}

/* ===== Header ===== */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-radius: 14px;
  padding: 6px 10px;
  background:
   linear-gradient(90deg, rgb(5, 20, 20) 15%, rgb(0, 224, 206) 50%, rgb(5, 20, 20) 85%);
  border: 2px solid var(--borderSoft);
  position:relative;
  z-index:2;
}

.brand{
  display:flex;
  flex-direction:column;
  gap: 2px;
  min-width:0;
}
.brand-title{
  font-size: 20px;
  font-weight: 900;
  letter-spacing: 2px;
  text-transform: uppercase;
  text-shadow: 0 3px 12px rgba(0,0,0,0.85), 0 0 18px rgba(0,224,204,0.3);
  white-space: nowrap;
  overflow:hidden;
  text-overflow: ellipsis;
  color: var(--steel1);
}
.brand-slogan{
  font-size: 12px;
  font-weight: 800;
  opacity:0.92;
  letter-spacing:0.8px;
  margin-top:-4px;
  white-space:nowrap;
  color: rgba(0,224,204,0.90);
}

.header-right{
  display:flex;
  align-items:center;
  gap:10px;
  flex: 0 0 auto;
}

.break-id-box{
  display:flex;
  align-items:center;
  gap:10px;
  padding: 6px 10px;
  border-radius: 12px;
  background: rgba(0,0,0,0.55);
  border: 2px solid rgba(0,224,204,0.22);
  box-shadow: inset 0 0 14px rgba(0,0,0,0.45);
}
.break-id-label{
  font-size: 18px;
  opacity:0.86;
  letter-spacing:1px;
  text-transform:uppercase;
  font-weight:900;
  color: rgba(0,224,204,0.85);
}
.break-id-value{
  font-size: 20px;
  font-weight:900;
  color: var(--steel1);
  text-shadow: 0 2px 0 rgba(0,0,0,0.85);
  min-width:28px;
  text-align:right;
}

/* ===== Main wrapper ===== */
.main{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  width:100%;
  min-height:0;
  position:relative;
  z-index:2;
}

/* ===== Split grid + center control bar ===== */
.teams-section{
  display:grid;
  grid-template-columns: 1fr auto 1fr;
  gap:10px;
  height: var(--teams-h);
  min-height:0;
  align-items:stretch;
  padding:2px;
  border-radius:14px;
  background: linear-gradient(90deg, rgba(0,224,204,0.07), rgba(0,0,0,0.20), rgba(0,133,122,0.08));
  border: 2px solid rgba(255,255,255,0.08);
}

.conference{
  display:flex;
  flex-direction:column;
  border-radius:14px;
  padding:3px;
  background: rgba(0,0,0,0.45);
  min-height:0;
  height:inherit;
  width:440px;
  overflow-y:auto;
  overflow-x:hidden;
  justify-content:flex-start;
}
.conference::-webkit-scrollbar{ display:none; }

.conference-title{
  font-size:14px;
  font-weight:900;
  text-align:center;
  text-transform:uppercase;
  letter-spacing:1px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.7);
  padding-bottom:4px;
  color: white;
}

.division{ margin-top:4px; }
.division-name{
  font-size:13px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:1px;
  opacity:0.92;
  color: rgba(0,224,204,0.80);
}
.division-teams{
  display:grid;
  grid-template-columns: repeat(var(--team-cols), 1fr);
  gap:4px;
}

/* ===== Team tile ===== */
.team{
  position:relative;
  background: rgba(0,0,0,0.78);
  border-radius:10px;
  height: var(--team-height);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  cursor:pointer;
  border: 2px solid rgb(255, 255, 255);
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  will-change: transform;
}
.team:hover{
  transform: translateY(-2px) scale(1.015);
  box-shadow: 0 10px 22px rgba(0,0,0,0.55);
  border-color: rgba(0,224,204,0.90);
}
.team img{
  width:100%;
  height:100%;
  object-fit:cover;
  filter: drop-shadow(0 10px 16px rgba(0,0,0,0.55));
}
.team-label{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:10px;
  text-align:center;
  font-weight:900;
  letter-spacing:0.8px;
  text-transform:uppercase;
  font-size:18px;
  line-height:1.05;
  text-shadow: 0 3px 12px rgba(0,0,0,0.80);
  z-index:3;
  pointer-events:none;
  color:#fff;
}

.team.nil .team-label{ flex-direction:column; gap:2px; padding:8px; }
.team.nil img{ filter: brightness(0.35) contrast(1.05); }
.nil-title{
  width:100%; text-align:center; font-weight:900; letter-spacing:0.8px;
  text-transform:uppercase; line-height:1.02; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis;
}
.nil-sub{
  width:100%; text-align:center; font-weight:800; opacity:0.85;
  letter-spacing:0.4px; text-transform:uppercase; font-size:11px;
  line-height:1.1; max-height:2.2em; overflow:hidden;
}

.team::before{
  content:'';
  position:absolute; inset:-12px; border-radius:14px;
  background: radial-gradient(circle, rgba(0,224,204,0.20) 0%, rgba(0,133,122,0.14) 40%, transparent 72%);
  filter: blur(18px);
  opacity:0.34; z-index:0; pointer-events:none;
  animation: tilePulse 3.2s ease-in-out infinite;
}
@keyframes tilePulse{
  0%{ opacity:.16; transform:scale(.98); }
  50%{ opacity:.45; transform:scale(1.02); }
  100%{ opacity:.16; transform:scale(.98); }
}
.team.sold::before{ opacity:0.10; animation:none; }
.team.sold img{ opacity:0.22; filter:grayscale(1) brightness(0.35); }

.sold-x{
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  font-size:54px; font-weight:900;
  color: rgb(255, 255, 255);
  text-shadow:
    0 0 10px rgba(0,224,204,0.60),
    0 0 18px rgba(0,224,204,0.22),
    0 10px 22px rgba(0,0,0,0.85);
  z-index:4; pointer-events:none;
  opacity:0; transform:scale(0.92);
  transition: opacity .14s ease, transform .14s ease;
}
.team.sold .sold-x{ opacity:1; transform:scale(1); }


/* ===== Center control bar ===== */
.control-bar{
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  align-items:stretch;
  width:140px;
  border-radius:14px;
  padding:10px 6px;
  background: linear-gradient(180deg, rgba(0,224,204,0.10), rgba(0,0,0,0.55), rgba(0,133,122,0.12));
  border: 2px solid rgba(255, 255, 255, 0.95);
  box-shadow: inset 0 0 18px rgba(0,0,0,0.35), 0 0 20px rgba(0,224,204,0.06);
  position:relative;
  overflow:visible;
}
.control-bar .btn{
  background: linear-gradient(180deg, #ffffff, rgb(141 141 141));
  color: #021a18;
  border: 2px solid rgba(0,224,204,0.20);
  border-radius:12px;
  padding:10px 8px;
  font-size:18px;
  font-weight:900;
  text-transform:uppercase;
  cursor:pointer;
  width:100%;
  box-shadow: 0 6px 14px rgba(0,0,0,0.35);
  transition: transform .12s ease;
  position:relative; z-index:2;
}
.control-bar .btn:active{ transform:translateY(1px); }

.stat-box{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background: rgba(0,0,0,0.55);
  border: 2px solid rgba(255, 255, 255, 0.8);
  border-radius:12px;
  padding:6px 4px;
  position:relative; z-index:2;
  color:rgba(255, 255, 255, 0.95);
}
.stat-box .value{ font-size:22px; font-weight:900; color:var(--teal); text-shadow:0 2px 0 rgba(0,0,0,0.85); }
.stat-box .label{ font-size:13px; letter-spacing:1px; text-transform:uppercase; opacity:0.85; font-weight:900; color:rgb(255, 255, 255); }
.sold-stat{ cursor:pointer; }

.brand-logo{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  position:relative; left:50%; top:50%; transform:translate(-50%,-50%);
  width:100%; padding:0;
  pointer-events:none;
  animation: logoBreathe 9s ease-in-out infinite;
  transform-origin:center; z-index:1; padding-bottom:62px;
}
@keyframes logoBreathe{
  0%{ transform:scale(1); }
  50%{ transform:scale(1.06); }
  100%{ transform:scale(1); }
}
.brand-logo img{
  width:150%; height:auto;
  top:-280px; left:-95px; z-index:999;
  object-fit:contain; position:absolute;
  filter:
    drop-shadow(0 10px 18px rgba(0,0,0,0.65))
    drop-shadow(0 0 14px rgba(0,224,204,0.22));
  pointer-events:none;
}

/* ===== Ticker ===== */
.ticker{
  width:100%; overflow:hidden; height:40px; border-radius:12px;
  background: linear-gradient(90deg, rgba(0,224,204,0.10), rgba(0,0,0,0.70), rgba(0,133,122,0.12));
  border: 2px solid rgba(0,224,204,0.18);
  position:relative;
}
.ticker-track{
  display:flex; align-items:center;
  width:max-content; min-width:100%;
  will-change:transform; animation:none !important;
}
.ticker-text{
  flex: 0 0 auto; white-space:nowrap; display:inline-block; padding-right:60px;
  font-weight:900; letter-spacing:0.8px; font-size:22px; line-height:40px;
  text-transform:uppercase; text-shadow:0 2px 10px rgba(0,0,0,0.65);
  color: rgb(255, 255, 255);
}
.obs-slider-wrap{ margin-top:12px; display:flex; align-items:center; gap:10px; }
.obs-slider-wrap input[type="range"]{ flex:1 1 auto; accent-color:var(--teal); }
.obs-slider-pill{
  min-width:84px; text-align:center; padding:8px 10px;
  border-radius:999px; border:2px solid rgba(0,224,204,0.18);
  background:rgba(0,0,0,0.35); color:rgba(0,224,204,0.96);
  font-weight:900; font-size:12px;
}

/* ===== Control panel ===== */
.control-panel{
  width:100%; border:2px solid rgba(0,224,204,0.18); border-radius:14px;
  padding:8px; background:rgba(0,0,0,0.08);
  display:flex; flex-direction:row; gap:8px;
  justify-content:space-between; align-items:center; flex-wrap:nowrap;
}
.control-panel.hidden{ display:none; }
.breaktype-buttons{
  display:flex; flex-wrap:nowrap; gap:6px; align-items:center;
  min-width:0; flex:1 1 auto; overflow:hidden;
}
.breaktype-btn{
  background:rgba(0,0,0,0.55); color:rgba(255, 255, 255, 0.95);
  border:2px solid rgb(255, 255, 255); border-radius:12px;
  padding:8px 10px; font-weight:900; letter-spacing:1px;
  text-transform:uppercase; cursor:pointer; font-size:18px; flex:0 1 auto; min-width:0;
}
.breaktype-btn.active{ border-color:rgba(0,224,204,0.70); box-shadow:0 0 0 2px rgba(0,224,204,0.12); }
.control-actions{
  display:flex; align-items:center; gap:8px; flex-wrap:nowrap; margin-left:10px; flex:0 0 auto;
}
.pill-btn{
  background: linear-gradient(180deg, #ffffff, rgb(141 141 141));
  color:#021a18; border:2px solid rgb(0, 224, 205);
  border-radius:999px; padding:10px 14px; font-weight:900; cursor:pointer;
  text-transform:uppercase; letter-spacing:1px; font-size:13px; white-space:nowrap;
  box-shadow:0 8px 18px rgba(0,0,0,0.30); transition:transform .15s ease, box-shadow .15s ease;
}
.pill-btn:hover{ transform:translateY(-1px); box-shadow:0 10px 22px rgba(0,0,0,0.40); }
.pill-btn:active{ transform:translateY(0); }

/* ===== SOLD header row ===== */
.sold-header-row{
  display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px;
  padding:6px 10px; margin-top:2px; border-radius:14px;
  background: linear-gradient(90deg, rgba(0,224,204,0.07), rgba(0,0,0,0.12), rgba(0,133,122,0.07));
  border:1px solid rgba(0,224,204,0.18); z-index:2; position:relative; min-height:36px;
}
.sold-header-controls{ grid-column:2; display:flex; align-items:center; justify-content:center; white-space:nowrap; }
.sold-sse{ grid-column:3; justify-self:end; }
.sold-panel-title{ font-size:14px; font-weight:900; letter-spacing:2px; white-space:nowrap; opacity:0.94; color:rgba(0,224,204,0.96); }

.sse-status{
  display:inline-flex; align-items:center; gap:6px; padding:5px 8px;
  border-radius:999px; border:1px solid rgba(0,224,204,0.18);
  background:rgba(0,0,0,0.25); font-weight:900; font-size:11px;
  letter-spacing:0.6px; text-transform:uppercase; white-space:nowrap;
  color:rgba(0,224,204,0.92); line-height:1;
}
.sse-status .dot{ width:8px; height:8px; border-radius:50%; background:#666; box-shadow:0 0 8px rgba(255,255,255,0.15); }
.sse-status.connected .dot{ background:#3cff8a; box-shadow:0 0 10px rgba(60,255,138,0.7); }
.sse-status.error .dot{ background:#ff2f2f; box-shadow:0 0 10px rgba(255,47,47,0.7); }
.sse-status-mini{ gap:4px; padding:4px 8px; border-width:1px; font-size:10px; letter-spacing:0.5px; background:rgba(0,0,0,0.38); min-height:28px; }
.sse-status-mini .dot{ width:7px; height:7px; box-shadow:0 0 6px rgba(255,255,255,0.12); }

/* ===== SOLD panel slot ===== */
.sold-panel-slot{ width:95%;  position:relative; overflow:visible; margin:0 auto; z-index:2; }
.sold-panel{
  position:relative; inset:0; padding:4px;
  display:grid; grid-template-columns:repeat(4,1fr); gap:4px;
  border-radius:14px; border:2px solid rgba(0,224,204,0.20);
  background: linear-gradient(90deg, rgba(0,224,204,0.07), rgba(0,0,0,0.55), rgba(0,133,122,0.07));
  opacity:1; pointer-events:auto; transition:opacity .2s ease;
  box-shadow: inset 0 0 18px rgba(0,0,0,0.35);
}
.sold-panel.hidden{ background:rgba(5,20,20,0.97); border-color:rgba(0,224,204,0.40); }
.sold-item{
  display:flex; align-items:center; gap:3px; padding:2px 3px; border-radius:999px;
  background:rgba(0,224,204,0.08); box-shadow:inset 0 0 0 2px rgba(0,224,204,0.12);
  transition:transform .15s ease, box-shadow .15s ease;
}
.sold-item:hover{ transform:translateY(-1px); box-shadow:0 8px 18px rgba(0,0,0,0.35); }
.sold-item img{
  max-width:100%; max-height:32px; object-fit:contain;
  filter:drop-shadow(0 10px 16px rgba(0,0,0,0.55));
  background:rgba(0,0,0,0.25); border-radius:8px; padding:1px;
}
.buyer-input{
  width:100%; border:none; outline:none;
  background:rgba(0,0,0,0.55); color:rgba(255, 255, 255, 0.96);
  border-radius:999px; padding:8px 5px; font-size:18px; font-weight:900;
  border:1px solid rgba(0,224,204,0.16);
}

/* ===== NIL modal ===== */
.nil-modal{ position:fixed; inset:0; z-index:5000; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.55); }
.nil-modal.hidden{ display:none; }
.nil-modal-inner{
  width:min(520px,92vw); border-radius:14px;
  border:2px solid rgba(0,224,204,0.22);
  background:linear-gradient(180deg,rgba(0,0,0,0.92),rgba(0,0,0,0.85));
  box-shadow:0 18px 60px rgba(0,0,0,0.65); padding:14px;
}
.nil-modal-inner h2{ margin:0 0 10px; font-size:18px; font-weight:900; letter-spacing:1px; text-transform:uppercase; color:var(--teal); }
#nilTextInput{
  width:100%; height:220px; resize:none; border-radius:12px; padding:10px;
  background:rgba(255,255,255,0.95); color:#000; font-weight:900;
  border:2px solid rgba(255,255,255,0.25); outline:none;
}
.nil-modal-actions{ margin-top:10px; display:flex; gap:8px; justify-content:space-between; flex-wrap:wrap; }
.nil-modal-actions button{
  background:linear-gradient(180deg,rgba(0,180,165,0.90),rgba(0,113,105,0.95));
  color:#fff; border:none; border-radius:10px; padding:10px 12px;
  font-weight:900; cursor:pointer; letter-spacing:0.6px; text-transform:uppercase;
}
.nil-modal-actions button.secondary{
  background:rgba(0,224,204,0.10); border:2px solid rgba(0,224,204,0.22); color:rgba(0,224,204,0.95);
}

/* ===== OBS-safe modal prompt ===== */
.obs-modal{ position:fixed; inset:0; z-index:6000; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.62); }
.obs-modal.hidden{ display:none; }
.obs-modal-inner{
  width:min(520px,92vw); border-radius:14px;
  border:2px solid rgba(0,224,204,0.24);
  background:linear-gradient(180deg,rgba(0,10,10,0.95),rgba(0,5,5,0.90));
  box-shadow:0 18px 60px rgba(0,0,0,0.70); padding:14px;
}
.obs-modal-title{ margin:0 0 10px; font-size:18px; font-weight:900; letter-spacing:1px; text-transform:uppercase; color:var(--teal); }
.obs-modal-desc{ margin:-4px 0 10px; font-size:12px; font-weight:800; color:rgba(0,224,204,0.80); letter-spacing:0.6px; }
.obs-modal-input{
  width:100%; border-radius:12px; padding:12px; background:rgba(0,0,0,0.55);
  border:2px solid rgba(0,224,204,0.22); outline:none; color:rgba(0,224,204,0.96);
  font-weight:900; font-size:16px;
}
.obs-modal-actions{ margin-top:10px; display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; }
.obs-modal-actions button{ border-radius:10px; padding:10px 12px; font-weight:900; cursor:pointer; letter-spacing:0.6px; text-transform:uppercase; border:2px solid rgba(0,224,204,0.18); }
.obs-modal-actions .ok{ background:linear-gradient(180deg,rgba(0,180,165,0.90),rgba(0,113,105,0.95)); color:#fff; }
.obs-modal-actions .cancel{ background:rgba(0,224,204,0.10); color:rgba(0,224,204,0.95); }

/* ===== Wick border sweep ===== */
.wick{ position:relative; border-radius:14px; }
.wick::after{
  content:""; position:absolute; inset:-2px; border-radius:inherit;
  pointer-events:none; z-index:20;
  background: linear-gradient(130deg,
    rgba(0,224,204,0) 0%, rgba(0,224,204,0) 38%,
    rgba(180,255,248,1) 48%, rgba(0,224,204,0.95) 52%,
    rgba(0,133,122,0.85) 58%, rgba(0,224,204,0) 68%,
    rgba(0,224,204,0) 100%
  );
  background-size:300% 300%;
  animation: wickRun 5s ease-in-out infinite alternate;
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask-composite: exclude;
  padding:4px;
  filter:
    drop-shadow(0 0 10px rgba(0,224,204,0.95))
    drop-shadow(0 0 22px rgba(0,180,165,0.75));
  opacity:1;
}
@keyframes wickRun{
  0%{ background-position:0% 50%; }
  100%{ background-position:100% 100%; }
}

.overlay-container.sport-nil .conference-title,
.overlay-container.sport-nil .division-name{ display:none !important; }
</style>
</head>

<body>
<div class="overlay-container" id="overlayRoot">

  <div class="header">

        <span class="break-id-label">Break #</span>

      </div>

  </div>

  <div class="main">

/* ─── Ticker ─── */
const SCORES_BY_SPORT = { nba:'', nfl:'' };
const SCORES_UPDATED_AT = { nba:0, nfl:0 };

let TICKER_LINES = loadTickerLines();
let tickerCycleTimer=null, tickerAnim=null, tickerRefreshPending=false;

function loadTickerLines(){
  try{
    const raw=localStorage.getItem(LS.TICKER);
    if(!raw) return DEFAULT_TICKER_LINES.slice();
    const arr=JSON.parse(raw);
    if(Array.isArray(arr)&&arr.length) return arr.map(s=>String(s));
  }catch(_){}
  return DEFAULT_TICKER_LINES.slice();
}
function saveTickerLines(lines){ localStorage.setItem(LS.TICKER, JSON.stringify(lines)); }
function loadTickerSpeed(){
  const n=parseInt(localStorage.getItem(LS.TICKER_SPEED)||'90',10);
  return Number.isFinite(n)?Math.max(40,Math.min(200,n)):90;
}
function saveTickerSpeed(n){
  const safe=Number.isFinite(n)?Math.max(40,Math.min(200,n)):90;
  localStorage.setItem(LS.TICKER_SPEED,String(safe));
}
function isFreshSportScore(sport){ return (Date.now()-(SCORES_UPDATED_AT[sport]||0))<1000*60*20; }

function normalizeScorePayloadToText(data){
  if(!data) return '';
  if(typeof data.text==='string'&&data.text.trim()) return data.text.trim();
  if(Array.isArray(data.lines)&&data.lines.length) return data.lines.map(s=>String(s).trim()).filter(Boolean).join(' • ');
  const league=String(data.league||data.sport||'').toUpperCase();
  if(Array.isArray(data.games)&&data.games.length){
    const chunks=data.games.slice(0,10).map(g=>{
      const away=String(g.away||g.a||'').toUpperCase();
      const home=String(g.home||g.h||'').toUpperCase();
      const as=g.awayScore??g.as;
      const hs=g.homeScore??g.hs;
      const st=String(g.status||g.clock||'').trim();
      const score=(Number.isFinite(+as)&&Number.isFinite(+hs))?`${away} ${as}-${hs} ${home}`:`${away} VS ${home}`;
      return st?`${score} (${st})`:score;
    });
    return (league?`${league}: `:'SCORES: ')+chunks.join(' • ');
  }
  return '';
}

function getBaseTickerText(){ return TICKER_LINES.join('   •   '); }
function getFreshScoreSegments(){
  return ['nfl','nba']
    .filter(s=>String(SCORES_BY_SPORT[s]||'').trim()&&isFreshSportScore(s))
    .map(s=>SCORES_BY_SPORT[s].trim());
}
function buildFullTickerText(){
  const base=getBaseTickerText();
  const scores=getFreshScoreSegments();
  if(!scores.length) return base;
  return [base,...scores].join('   ✦   ');
}

function applyTickerMarquee(){
  const a=document.getElementById('tickerTextA');
  const b=document.getElementById('tickerTextB');
  const track=document.getElementById('tickerTrack');
  const ticker=document.querySelector('.ticker');
  if(!a||!b||!track||!ticker) return;

  const pxPerSec=loadTickerSpeed();
  const fullText=buildFullTickerText();

  if(tickerAnim){try{tickerAnim.cancel();}catch(_){} tickerAnim=null;}
  if(tickerCycleTimer){clearTimeout(tickerCycleTimer); tickerCycleTimer=null;}

  a.textContent=fullText; b.textContent=fullText;
  track.style.animation='none'; track.style.transform='translateX(0)';
  void track.offsetWidth;

  requestAnimationFrame(()=>{
    const viewWidth=ticker.getBoundingClientRect().width||900;
    const gap=Math.max(120,Math.round(viewWidth*0.10));
    a.style.paddingRight=`${gap}px`; b.style.paddingRight=`${gap}px`;

    requestAnimationFrame(()=>{
      const travel=a.getBoundingClientRect().width||1400;
      const durMs=Math.max(12000,Math.round((travel/pxPerSec)*1000));

      tickerAnim=track.animate(
        [{transform:'translateX(0)'},{transform:`translateX(-${travel}px)`}],
        {duration:durMs,easing:'linear',iterations:1,fill:'forwards'}
      );

      tickerCycleTimer=setTimeout(()=>{ tickerCycleTimer=null; applyTickerMarquee(); },durMs);
    });
  });
}

function requestTickerRefresh(){ tickerRefreshPending=true; }
function refreshTickerText(){ applyTickerMarquee(); }
function setTickerLines(lines){
  TICKER_LINES=Array.isArray(lines)&&lines.length?lines:DEFAULT_TICKER_LINES.slice();
  saveTickerLines(TICKER_LINES); refreshTickerText();
}
function applyTickerFromRaw(raw){
  const txt=String(raw||'').trim();
  const parts=txt.includes('•')?txt.split('•').map(s=>s.trim()).filter(Boolean):[txt].filter(Boolean);
  setTickerLines(parts.length?parts:DEFAULT_TICKER_LINES.slice());
}

function loadBreakNumber(){

}
function saveBreakNumber(n){ localStorage.setItem(LS.BREAK_NUMBER,String(n)); }
function setBreakNumber(n){
  const safe=Number.isFinite(n)&&n>0?n:1;
  document.getElementById('breakIdDisplay').textContent=String(safe);
  saveBreakNumber(safe); loadSoldState(); updateStats(); renderSoldPanel();
}
function computeBreakId(){
  const d=new Date();
  const dayKey=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  return `${dayKey}-${currentBreakType}-${loadBreakNumber()}`;
}
function startNewBreakCycle(){ resetAll(); setBreakNumber(loadBreakNumber()+1); }

/* ─── NIL entries ─── */
function loadNilEntries(){
  try{
    const arr=localStorage.getItem(LS.NIL_ENTRIES)?JSON.parse(localStorage.getItem(LS.NIL_ENTRIES)):[];
    if(!Array.isArray(arr)) return [];
    return arr.map(e=>({
      title:String(e?.title||e?.name||'').trim(),
      sub:String(e?.sub||'').trim(),
      code:String(e?.code||'').trim(),
      image:String(e?.image||'').trim()
    })).filter(e=>e.title.length);
  }catch{return [];}
}
function saveNilEntries(entries){ localStorage.setItem(LS.NIL_ENTRIES,JSON.stringify(entries||[])); }
function makeCodeFromName(name,idx){
  const cleaned=(name||'').toUpperCase().replace(/[^A-Z0-9]+/g,'').slice(0,8);
  const n=String(idx+1).padStart(3,'0');
  return cleaned?`${cleaned}${n}`:`NIL${n}`;
}
function buildNilBreakTypeFromEntries(entries){
  const safe=(entries||[]).filter(e=>String(e?.title||e?.name||'').trim().length>0);
  const mid=Math.ceil(safe.length/2);
  const makeTeams=(arr,offset)=>arr.map((e,i)=>({
    code:e.code||makeCodeFromName(e.title||e.name,offset+i),
    title:(e.title||e.name||'').trim(), sub:(e.sub||'').trim(),
    name:(e.title||e.name||'').trim(), image:e.image||''
  }));
  return {
    name:'Custom', conferences:['Left','Right'],
    divisions:{ Left:{Spots:makeTeams(safe.slice(0,mid),0)}, Right:{Spots:makeTeams(safe.slice(mid),mid)} },
    scoreboard:[]
  };
}
function setNilEntries(entries){
  const safe=Array.isArray(entries)?entries:[];
  saveNilEntries(safe); breakTypes.nil=buildNilBreakTypeFromEntries(safe);
  if(currentBreakType==='nil') renderTeams(); SPORT_LOOKUP.nil=null;
}
function openNilModal(){
  const ta=document.getElementById('nilTextInput');
  const entries=loadNilEntries();
  ta.value=entries.map(e=>(e.sub?`${e.title}\t${e.sub}`:e.title)).filter(Boolean).join('\n');
  document.getElementById('nilModal').classList.remove('hidden');
}
function closeNilModal(){ document.getElementById('nilModal').classList.add('hidden'); }
function clearNilEntries(){ setNilEntries([]); document.getElementById('nilTextInput').value=''; }
function applyNilText(){
  const lines=(document.getElementById('nilTextInput').value||'').split('\n').map(l=>l.trim()).filter(Boolean);
  const entries=lines.map((line,i)=>{
    let parts=line.split('\t');
    if(parts.length<2) parts=line.split('|');
    if(parts.length<2) parts=line.split(',');
    const title=String(parts[0]||'').trim();
    const sub=String(parts.slice(1).join(' ').trim()||'');
    return{title,sub,code:makeCodeFromName(title,i),image:''};
  }).filter(e=>e.title.length);
  setNilEntries(entries); closeNilModal();
}
function triggerNilCsv(){
  const inp=document.getElementById('nilCsvInput');
  inp.value=''; inp.onchange=importNilCsv; inp.click();
}
function importNilCsv(){
  const file=document.getElementById('nilCsvInput')?.files?.[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    const entries=String(e.target.result||'').split('\n')
      .map(l=>l.trim()).filter(Boolean)
      .map((l,i)=>{const c=l.split(',');const title=String(c[0]||'').trim();const sub=String(c[1]||'').trim();if(!title)return null;return{title,sub,code:makeCodeFromName(title,i)};})
      .filter(Boolean);
    setNilEntries(entries); closeNilModal();
  };
  reader.readAsText(file);
}

function applyTilePreset(sportKey){
  const root=document.getElementById('overlayRoot');
  if(!root) return;
  const p=TILE_PRESETS[sportKey]||TILE_PRESETS.nfl;
  root.style.setProperty('--team-cols',String(p.cols));
  root.style.setProperty('--team-height',`${p.height}px`);
  root.style.setProperty('--teams-h',`${p.teamsH}px`);
}

/* ─── State ─── */
let currentBreakType='nfl';
const soldTeams=new Set();
let soldTeamsList=[];
let soldControlsVisible=true;
const lastCodeByListingKey=new Map();

function soldStateKey(){ return `${LS.SOLD_STATE}:${currentBreakType}:${loadBreakNumber()}`; }
function saveSoldState(){
  try{ localStorage.setItem(soldStateKey(),JSON.stringify({sold:Array.from(soldTeams),list:soldTeamsList})); }catch(_){}
}
function loadSoldState(){
  soldTeams.clear(); soldTeamsList=[];
  try{
    const raw=localStorage.getItem(soldStateKey());
    if(!raw) return;
    const data=JSON.parse(raw);
    (Array.isArray(data?.sold)?data.sold:[]).forEach(c=>soldTeams.add(c));
    soldTeamsList=(Array.isArray(data?.list)?data.list:[]).map(e=>({code:String(e.code||''),buyer:String(e.buyer||'')})).filter(e=>e.code);
  }catch(_){}
}

/* ─── UI / rendering ─── */
function getCurrentConfig(){
  return breakTypes[currentBreakType]||breakTypes.nfl;
}

function updateHeader(){
  const root=document.getElementById('overlayRoot');
  if(!root) return;
  root.classList.remove('sport-nfl','sport-nba','sport-nil');
  root.classList.add(`sport-${currentBreakType}`);
  applyTilePreset(currentBreakType);
  document.getElementById('nilItemsBtn').style.display=currentBreakType==='nil'?'inline-flex':'none';
  renderBreakTypeButtons();
  refreshTickerText();
}

function renderBreakTypeButtons(){
  const wrap=document.getElementById('breakTypeButtons');
  if(!wrap) return;
  wrap.innerHTML='';
  Object.keys(breakTypes).forEach(t=>{
    const btn=document.createElement('button');
    btn.className='breaktype-btn'+(t===currentBreakType?' active':'');
    btn.textContent=breakTypes[t].name;
    btn.onclick=()=>setBreakType(t);
    wrap.appendChild(btn);
  });
}

function setBreakType(t){
  if(!breakTypes[t]) return;
  currentBreakType=t; loadSoldState(); renderTeams();
}

function renderTeams(){
  updateHeader();
  const left=document.getElementById('conferenceLeft');
  const right=document.getElementById('conferenceRight');
  if(!left||!right) return;
  left.innerHTML=''; right.innerHTML='';

  const cfg=getCurrentConfig();
  if(!cfg) return;

  cfg.conferences.forEach((confName,i)=>{
    const container=i===0?left:right;
    const confTitle=document.createElement('div');
    confTitle.className='conference-title';
    confTitle.textContent=confName;
    container.appendChild(confTitle);

    const divisions=cfg.divisions[confName]||{};
    Object.keys(divisions).forEach(divName=>{
      const divWrap=document.createElement('div');
      divWrap.className='division';
      const divTitle=document.createElement('div');
      divTitle.className='division-name';
      divTitle.textContent=divName;
      divWrap.appendChild(divTitle);
      const teamGrid=document.createElement('div');
      teamGrid.className='division-teams';
      (divisions[divName]||[]).forEach(teamObj=>teamGrid.appendChild(makeTeamDiv(teamObj)));
      divWrap.appendChild(teamGrid);
      container.appendChild(divWrap);
    });
  });

  soldTeams.forEach(code=>{
    const el=document.querySelector(`[data-team-code="${cssEscape(code)}"]`);
    if(el) el.classList.add('sold');
  });
  SPORT_LOOKUP[currentBreakType]=null;
  updateStats(); renderSoldPanel();
  if(currentBreakType==='nil') requestAnimationFrame(refitAllNilTitles);
}

function makeTeamDiv(teamObj){
  const teamDiv=document.createElement('div');
  teamDiv.className='team';
  teamDiv.dataset.teamCode=teamObj.code||'';
  const isNil=currentBreakType==='nil';
  const bgSrc=isNil?NIL_TILE_BG:(teamObj.image||'');
  if(bgSrc){
    const img=document.createElement('img');
    img.src=bgSrc; img.alt=(teamObj.title||teamObj.name||teamObj.code||'');
    img.onerror=()=>{img.style.display='none';};
    teamDiv.appendChild(img);
  }
  const label=document.createElement('div');
  label.className='team-label';
  if(isNil){
    teamDiv.classList.add('nil');
    const title=document.createElement('div'); title.className='nil-title';
    title.textContent=(teamObj.title||teamObj.name||teamObj.code||'').trim();
    const sub=document.createElement('div'); sub.className='nil-sub';
    sub.textContent=(teamObj.sub||'').trim();
    label.appendChild(title); label.appendChild(sub);
    teamDiv.dataset.nilTitle=title.textContent;
  } else {
    label.textContent=teamObj.code||teamObj.name||'';
  }
  teamDiv.appendChild(label);
  const soldX=document.createElement('div');
  soldX.className='sold-x'; soldX.textContent='✕';
  teamDiv.appendChild(soldX);
  teamDiv.onclick=()=>toggleTeam(teamObj.code);
  return teamDiv;
}

function toggleTeam(code){
  const teamDiv=document.querySelector(`[data-team-code="${cssEscape(code)}"]`);
  if(!teamDiv) return;
  const idx=soldTeamsList.findIndex(e=>e.code===code);
  if(soldTeams.has(code)){
    soldTeams.delete(code); teamDiv.classList.remove('sold');
    if(idx!==-1) soldTeamsList.splice(idx,1);
  } else {
    soldTeams.add(code); teamDiv.classList.add('sold');
    if(idx===-1) soldTeamsList.push({code,buyer:''});
  }
  updateStats(); renderSoldPanel(); saveSoldState();
}

function updateStats(){
  const cfg=getCurrentConfig();
  let total=0;
  cfg.conferences.forEach(conf=>Object.values(cfg.divisions[conf]||{}).forEach(div=>total+=div.length));
  const sold=soldTeams.size;
  document.getElementById('teamsLeft').textContent=String(Math.max(0,total-sold));
  document.getElementById('teamsSold').textContent=String(sold);
}

function toggleSoldControls(){
  soldControlsVisible=!soldControlsVisible;
  document.getElementById('soldControlsPanel').classList.toggle('hidden',!soldControlsVisible);
}

function renderSoldPanel(){
  const panel=document.getElementById('soldPanel');
  if(!panel) return;
  panel.innerHTML='';
  soldTeamsList.forEach(entry=>{
    const teamObj=findTeamByCode(entry.code);
    const row=document.createElement('div'); row.className='sold-item';
    const img=document.createElement('img');
    img.alt=entry.code; img.src=teamObj?.image||'';
    img.onerror=()=>{img.style.display='none';};
    row.appendChild(img);
    const input=document.createElement('input');
    input.className='buyer-input'; input.placeholder=entry.code; input.value=entry.buyer||'';
    input.oninput=e=>{entry.buyer=e.target.value; saveSoldState();};
    row.appendChild(input);
    panel.appendChild(row);
  });
}

function findTeamByCode(code){
  const cfg=getCurrentConfig();
  if(!cfg) return null;
  for(const conf of cfg.conferences){
    const divs=cfg.divisions[conf]||{};
    for(const divName of Object.keys(divs)){
      const found=(divs[divName]||[]).find(t=>t.code===code);
      if(found) return found;
    }
  }
  return null;
}

function resetAll(){
  soldTeams.clear(); soldTeamsList=[];
  lastCodeByListingKey.clear();
  document.querySelectorAll('.team').forEach(t=>t.classList.remove('sold'));
  updateStats(); renderSoldPanel(); saveSoldState();
}

/* ─── OBS-safe prompt ─── */
let PROMPT_MODE=null;
function openPrompt(mode){
  PROMPT_MODE=mode;
  const modal=document.getElementById('obsPrompt');
  const title=document.getElementById('obsPromptTitle');
  const desc=document.getElementById('obsPromptDesc');
  const input=document.getElementById('obsPromptInput');
  const inner=document.querySelector('#obsPrompt .obs-modal-inner');
  if(!modal||!title||!desc||!input||!inner) return;
  const oldSlider=document.getElementById('tickerSpeedWrap');
  if(oldSlider) oldSlider.remove();

  if(mode==='break'){
    title.textContent='Set Break Number'; desc.textContent='Enter a positive number.';
    input.value=String(loadBreakNumber()); input.type='text';
  } else if(mode==='ticker'){
    title.textContent='Set Ticker Text'; desc.textContent='Edit text and adjust scroll speed.';
    input.value=(loadTickerLines()||[]).join(' • '); input.type='text';
    const wrap=document.createElement('div');
    wrap.className='obs-slider-wrap'; wrap.id='tickerSpeedWrap';
    wrap.innerHTML=`<div class="obs-slider-pill">SPEED</div><input id="tickerSpeedSlider" type="range" min="40" max="200" step="5" value="${loadTickerSpeed()}"/><div id="tickerSpeedValue" class="obs-slider-pill">${loadTickerSpeed()} px/s</div>`;
    inner.insertBefore(wrap,document.querySelector('#obsPrompt .obs-modal-actions'));
    const slider=document.getElementById('tickerSpeedSlider');
    const value=document.getElementById('tickerSpeedValue');
    if(slider&&value) slider.addEventListener('input',()=>{ value.textContent=`${parseInt(slider.value,10)} px/s`; });
  } else if(mode==='title'){
    const t=loadTitles();
    title.textContent='Set Title'; desc.textContent='Format: MAIN TITLE || SUBTITLE';
    input.value=`${t.main} || ${t.sub}`; input.type='text';
  }
  modal.classList.remove('hidden');
  setTimeout(()=>input.focus(),0);
  input.onkeydown=e=>{ if(e.key==='Enter') commitPrompt(); if(e.key==='Escape') closePrompt(); };
}
function closePrompt(){ document.getElementById('obsPrompt').classList.add('hidden'); PROMPT_MODE=null; }
function commitPrompt(){
  const input=document.getElementById('obsPromptInput');
  if(!input) return;
  const raw=String(input.value||'').trim();
  if(PROMPT_MODE==='break'){const n=parseInt(raw,10);if(Number.isFinite(n)&&n>0) setBreakNumber(n);}
  if(PROMPT_MODE==='ticker'){
    const slider=document.getElementById('tickerSpeedSlider');
    if(slider) saveTickerSpeed(parseInt(slider.value,10));
    applyTickerFromRaw(raw);
  }
  if(PROMPT_MODE==='title'){
    const parts=raw.split('||').map(s=>s.trim());
    applyTitles(parts[0]||DEFAULT_TITLE_MAIN,parts[1]||DEFAULT_TITLE_SUB);
  }
  closePrompt();
}

/* ─── SSE Bridge ─── */
let sse=null, sseScores=null;


    // ── TSU Migration: shared bridge defaults (May 2026) ──────────────────
    const BRIDGE_URL_DEFAULT = "https://bridge.tradesecretsunlocked.com";
    const BRIDGE_KEY_DEFAULT = "d4a693c2-ed65-43cc-89a1-3e39b82f55b7";
    // ──────────────────────────────────────────────────────────────────────
function getBridgeUrl(){
  const q = getParam("bridge");
  if (q) return normalizeBridge ? normalizeBridge(q) : q.replace(/\/$/, "");
  return BRIDGE_URL_DEFAULT;
}
function getBridgeKey(){
  const q = getParam("key");
  if (q) return q.trim();
  return BRIDGE_KEY_DEFAULT;
}
function getChannel(){ return new URLSearchParams(location.search).get('channel')||'main'; }
function getScoresChannel(){ return new URLSearchParams(location.search).get('scoresChannel')||'sports'; }
function automationEnabled(){ return !!getBridgeUrl(); }
function normalizeBridge(u){ return String(u||'').trim().replace(/\/$/,'').replace(/\/(events|stream)(\/.*)?$/,''); }

function setSSEStatus(state,msg){
  const wrap=document.getElementById('sseStatus');
  const text=document.getElementById('sseText');
  if(!wrap||!text) return;
  wrap.classList.remove('connected','error');
  if(state==='connected') wrap.classList.add('connected');
  if(state==='error') wrap.classList.add('error');
  text.textContent=msg||state||'disconnected';
}

function connectSSE(url){
  if(sse){try{sse.close();}catch(_){}} setSSEStatus('error','connecting');
  try{
    sse=new EventSource(url);
    const ingest=e=>{
      try{ const data=JSON.parse(e.data); handleSSEEvent(data); }
      catch(err){ console.warn('[SSE parse error]',err,e.data); }
    };
    sse.onopen=()=>{ setSSEStatus('connected','connected'); warmupPing(); };
    sse.onmessage=ingest;
    ['team_sold','team_unsold','buyer','buyer_update','sale','purchase','whatnot_purchase','stream_stats','scores','reset','set_break','set_sport','set_title']
      .forEach(t=>{ try{sse.addEventListener(t,ingest);}catch(_){} });
    sse.onerror=()=>{ setSSEStatus('error','reconnecting'); try{sse.close();}catch(_){} sse=null; setTimeout(()=>connectSSE(url),2500); };
  }catch(_){ setSSEStatus('error','failed'); }
}

function connectScoresSSE(base,ch){
  if(sseScores){try{sseScores.close();}catch(_){}}
  try{
    const url=`${base}/stream?channel=${encodeURIComponent(ch)}&key=${encodeURIComponent(getBridgeKey())}`;
    sseScores=new EventSource(url);
    const ingest=e=>{
      try{
        const data=JSON.parse(e.data);
        if(data?.type==='hello') return;
        if(String(data?.type||'').toLowerCase()==='scores') handleSSEEvent(data);
      }catch(_){}
    };
    sseScores.onmessage=ingest;
    try{sseScores.addEventListener('scores',ingest);}catch(_){}
    sseScores.onerror=()=>{ try{sseScores.close();}catch(_){} sseScores=null; setTimeout(()=>connectScoresSSE(base,ch),2500); };
  }catch(_){}
}

function startSSE(){
  if(!automationEnabled()){ setSSEStatus('error','missing bridge'); return; }
  const base=normalizeBridge(getBridgeUrl());
  connectSSE(`${base}/stream?channel=${encodeURIComponent(getChannel())}&key=${encodeURIComponent(getBridgeKey())}` );
  const sc=getScoresChannel();
  if(sc) connectScoresSSE(base,sc);
}

async function warmupPing(){
  if(!automationEnabled()) return;
  const base=normalizeBridge(getBridgeUrl()); const key=getBridgeKey();
  try{
    await fetch(`${base}/events`,{
      method:'POST',
      headers:{'Content-Type':'application/json',...(key?{'x-bridge-key':key,'x-api-key':key}:{})},
      body:JSON.stringify({type:'overlay_warmup',overlay:'7cbreaks',channel:getChannel(),breakId:computeBreakId(),ts:Date.now()})
    });
  }catch(_){}
}

/* ─── SSE event handler ─── */
function handleSSEEvent(data){
  const type=String(data?.type||'').toLowerCase();
  if(type==='hello') return;

  if(type==='scores'){
    const sport=String(data?.sport||data?.league||'').toLowerCase().trim();
    const txt=normalizeScorePayloadToText(data);
    if(sport&&txt){ SCORES_BY_SPORT[sport]=txt; SCORES_UPDATED_AT[sport]=Date.now(); requestTickerRefresh(); }
    return;
  }

  if(type==='reset'){ resetAll(); return; }

  if(type==='set_break'){
    const n=parseInt(data?.breakNumber,10);
    if(Number.isFinite(n)&&n>0) setBreakNumber(n);
    return;
  }

  if(type==='team_unsold'){
    let code=String(data?.code||'').trim().toUpperCase();
    if(!code){ code=inferCodeFromTitle(stripPrefixTitle(String(data?.title||'')),String(data?.sport||currentBreakType||'').toLowerCase())||''; }
    if(!code) return;
    if(soldTeams.has(code)){
      soldTeams.delete(code);
      const el=document.querySelector(`[data-team-code="${cssEscape(code)}"]`);
      if(el) el.classList.remove('sold');
    }
    const idx=soldTeamsList.findIndex(e=>e.code===code);
    if(idx!==-1) soldTeamsList.splice(idx,1);
    const lk=data?.saleId||data?.id||data?.listingId||null;
    if(lk){ const cur=lastCodeByListingKey.get(lk); if(!cur||cur===code) lastCodeByListingKey.delete(lk); }
    updateStats(); renderSoldPanel(); saveSoldState();
    return;
  }

  if(type==='team_sold'){
    const sport=String(data?.sport||'').toLowerCase();
    const buyer=String(data?.buyer||'').trim();
    const incomingTitle=stripPrefixTitle(String(data?.title||''));
    if(sport&&breakTypes[sport]&&sport!==currentBreakType){ currentBreakType=sport; loadSoldState(); renderTeams(); }
    let code=String(data?.code||'').trim().toUpperCase();
    if(!code) code=inferCodeFromTitle(incomingTitle,sport||currentBreakType)||'';
    if(!code){ console.warn('[7cBreaks] could not infer code from:',data?.title,'sport:',sport||currentBreakType); return; }
    const lk=data?.saleId||data?.id||data?.listingId||null;
    if(lk&&code){
      const prevCode=lastCodeByListingKey.get(lk);
      if(prevCode&&prevCode!==code){
        soldTeams.delete(prevCode);
        const prevEl=document.querySelector(`[data-team-code="${cssEscape(prevCode)}"]`);
        if(prevEl) prevEl.classList.remove('sold');
        const pi=soldTeamsList.findIndex(e=>e.code===prevCode);
        if(pi!==-1) soldTeamsList.splice(pi,1);
      }
      lastCodeByListingKey.set(lk,code);
    }
    if(!soldTeams.has(code)){
      soldTeams.add(code);
      const el=document.querySelector(`[data-team-code="${cssEscape(code)}"]`);
      if(el) el.classList.add('sold');
      soldTeamsList.push({code,buyer:buyer||''});
    } else if(buyer){
      const idx=soldTeamsList.findIndex(e=>e.code===code);
      if(idx!==-1) soldTeamsList[idx].buyer=buyer;
    }
    updateStats(); renderSoldPanel(); saveSoldState();
    return;
  }

  if(type==='buyer'){
    const code=String(data?.code||'').trim();
    const buyer=String(data?.buyer||'').trim();
    if(!code) return;
    const idx=soldTeamsList.findIndex(e=>e.code===code);
    if(idx!==-1){ soldTeamsList[idx].buyer=buyer; renderSoldPanel(); saveSoldState(); }
  }
}

/* ─── Helpers ─── */
function stripPrefixTitle(title){
  const raw=String(title||'').trim();
  if(!raw) return '';
  const parts=raw.split(' - ').map(s=>s.trim()).filter(Boolean);
  return parts.length?parts[parts.length-1]:raw;
}
function norm(s){ return String(s||'').toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]+/g,' ').trim(); }

function buildLookupForSport(sportKey){
  const cfg=breakTypes[sportKey]; const map=new Map();
  if(!cfg) return map;
  for(const conf of cfg.conferences||[]){
    const divs=cfg.divisions?.[conf]||{};
    for(const divName of Object.keys(divs)){
      for(const t of (divs[divName]||[])){
        const code=String(t.code||'').toUpperCase().trim();
        if(!code) continue;
        map.set(norm(code),code);
        if(t.name) map.set(norm(t.name),code);
        if(t.title) map.set(norm(t.title),code);
      }
    }
  }
  return map;
}

const SPORT_LOOKUP={nfl:null,nba:null,nil:null};
function ensureLookup(sportKey){
  if(!SPORT_LOOKUP[sportKey]) SPORT_LOOKUP[sportKey]=buildLookupForSport(sportKey);
  return SPORT_LOOKUP[sportKey];
}

function inferCodeFromTitle(title,sportHint){
  const t=norm(title);
  if(!t) return null;
  if(sportHint&&breakTypes[sportHint]){
    const map=ensureLookup(sportHint);
    if(map.has(t)) return map.get(t);
    const keys=Array.from(map.keys()).sort((a,b)=>b.length-a.length);
    for(const k of keys){ if(k.length<3) continue; if(t.includes(k)) return map.get(k); }
  }
  for(const sportKey of Object.keys(SPORT_LOOKUP)){
    if(!breakTypes[sportKey]) continue;
    const map=ensureLookup(sportKey);
    if(map.has(t)) return map.get(t);
    const keys=Array.from(map.keys()).sort((a,b)=>b.length-a.length);
    for(const k of keys){ if(k.length<3) continue; if(t.includes(k)) return map.get(k); }
  }
  return null;
}

function cssEscape(s){ return String(s||'').replace(/"/g,'\\"'); }
function fitTextToWidth(el,maxPx,minPx){
  if(!el) return;
  const parent=el.parentElement; if(!parent) return;
  const maxWidth=parent.clientWidth-10;
  let size=maxPx; el.style.fontSize=size+'px';
  let loops=0;
  while(loops++<40&&size>minPx&&el.scrollWidth>maxWidth){ size-=1; el.style.fontSize=size+'px'; }
}
function refitAllNilTitles(){ document.querySelectorAll('.team.nil .nil-title').forEach(el=>fitTextToWidth(el,20,10)); }

/* ─── Init ─── */
document.addEventListener('DOMContentLoaded',()=>{
  const t=loadTitles(); applyTitles(t.main,t.sub);
  setTickerLines(loadTickerLines());
  setBreakNumber(loadBreakNumber());
  breakTypes.nil=buildNilBreakTypeFromEntries(loadNilEntries());
  applyTickerMarquee();
  const qSport=String(new URLSearchParams(location.search).get('sport')||'').toLowerCase();
  if(qSport&&breakTypes[qSport]) currentBreakType=qSport;
  applyTilePreset(currentBreakType);
  loadSoldState();
  renderTeams();
  if(automationEnabled()) startSSE();
  else setSSEStatus('error','missing bridge');
});
