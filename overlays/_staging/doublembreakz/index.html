<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, initial-scale=1.0"/>
  <title>Double M Breakz — Split Grid Overlay (SSE + Scores)</title>

  <style>
    :root{
      /* ===============================
         DoubleMBreakz (Black/Grey/White)
      ================================= */
      --bg0:#050505;
      --bg1:#0e0e0e;

      --white:#ffffff;

      --border: rgba(0, 0, 0, 0.18);
      --shadow: rgba(0,0,0,0.65);

      --teams-h: 370px;
      --team-height: 60px;
      --team-cols: 5;

      --centerW: 140px;
      --radius: 16px;

      --tickerDur: 22s; /* default; controlled by popup slider */
    }

    *{ box-sizing:border-box; }

body{
  margin:0;
  background: transparent;
  font-family: "Arial Black", Arial, sans-serif;
  width:1080px;
  min-height: 720px;     /* keep your base canvas */
  user-select:none;
  overflow: visible;     /* allow content to extend downward */
  color: var(--white);
}

    /* ===============================
       OUTER SHELL
    ================================ */
 .overlay{
  width: 1080px;
  min-height: 450px;  /* keep your base canvas */
  height: auto;       /* allow expansion */
      padding: 10px;
      border-radius: var(--radius);
      border: 4px solid rgba(255,255,255,0.22);
      background:
        radial-gradient(1200px 600px at 22% 0%, rgba(255,255,255,0.08), transparent 55%),
        radial-gradient(900px 460px at 78% 18%, rgba(255,255,255,0.06), transparent 60%),
        linear-gradient(180deg, var(--bg0) 0%, var(--bg1) 100%);
      box-shadow: 0 18px 44px rgba(0,0,0,0.55);
      display:flex;
      flex-direction:column;
      gap:10px;
        position: relative;   /* anchor absolute children */
  overflow: visible;    /* allow sold panel to render below */
    }

    /* ===============================
       HEADER
    ================================ */
    .header{
      height: 78px;
      border-radius: 16px;
      border: 2px solid var(--border);
      background:
        linear-gradient(90deg, rgba(0, 0, 0, 0) 0%, rgb(255, 255, 255) 50%, rgba(0, 0, 0, 0.1) 100%),
        linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
      padding: 4px 14px;
      display:grid;
      grid-template-columns: 1fr auto 1fr;
      align-items:center;
      gap: 10px;
      position:relative;
      overflow:visible;
    }

    .header::before{
      content:"";
      position:absolute;
      inset:-40px;
      background:
        conic-gradient(from 160deg,
          transparent 0%,
          rgba(255,255,255,0.14) 10%,
          transparent 24%,
          rgba(255,255,255,0.08) 42%,
          transparent 60%,
          rgba(255,255,255,0.12) 76%,
          transparent 100%);
      filter: blur(18px);
      opacity: 0.45;
      animation: headerSpin 16s linear infinite;
      pointer-events:none;
    }
    @keyframes headerSpin{ to { transform: rotate(360deg); } }

    .header-left{
      display:flex;
      flex-direction:column;
      gap: 2px;
      position:relative;
      z-index:1;
      min-width:0;
    }
    .brand{
      font-size: 30px;
      letter-spacing: 1px;
      text-transform: uppercase;
      white-space:nowrap;
      overflow:hidden;
      text-overflow: ellipsis;
      text-shadow: 0 4px 14px rgba(0,0,0,0.65);
    }
    .sub{
      font-size: 12px;
      letter-spacing: 1.2px;
      font-weight: 900;
      color: rgba(255,255,255,0.82);
      text-transform: uppercase;
    }

    .header-center{
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      z-index:20;
      height: 60px;
      width: 240px;
      overflow:visible;
    }
    .header-center img{
      height: 160px;
      width: auto;
      object-fit: cover;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,0.55));
      transform-origin:center;
      animation: breathe 9s ease-in-out infinite;
      position: absolute;
      z-index: 20;
      top:-17px;
    }
    @keyframes breathe{
      0%{ transform: scale(1); }
      50%{ transform: scale(1.05); }
      100%{ transform: scale(1); }
    }

    .header-right{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap: 10px;
      position:relative;
      z-index:1;
      flex-wrap: wrap;
    }

    .pill{
      display:flex;
      align-items:center;
      gap:10px;
      padding: 10px 12px;
      border-radius: 999px;
      border: 2px solid rgba(255,255,255,0.22);
      background: rgba(0,0,0,0.35);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 900;
      white-space:nowrap;
    }
    .pill .label{ font-size: 12px; opacity: 0.88; }
    .pill .value{ font-size: 18px; }

    .sse-pill{
      display:flex;
      align-items:center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 999px;
      border: 2px solid rgba(255,255,255,0.18);
      background: rgba(0,0,0,0.28);
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-size: 12px;
      white-space:nowrap;
    }
    .sse-pill .dot{
      width: 10px; height:10px;
      border-radius:50%;
      background:#666;
      box-shadow: 0 0 8px rgba(255,255,255,0.14);
    }
    .sse-pill.connected .dot{ background:#3cff8a; box-shadow: 0 0 10px rgba(60,255,138,0.7); }
    .sse-pill.error .dot{ background:#ff2f2f; box-shadow: 0 0 10px rgba(255,47,47,0.7); }

    /* ===============================
       MAIN: SPLIT BOARD + CENTER CONTROL
    ================================ */
    .main{
      flex: 1 1 auto;
      display:flex;
      flex-direction:column;
      gap: 10px;
      min-height:0;
    }

.teams-section{
  height: var(--teams-h);   /* fixed: sold panel will never push this up */
  min-height: 0;
      border-radius: var(--radius);
      
      background:
  linear-gradient(181deg, rgb(255 255 255) 0%, rgb(44 44 44) 50%, rgba(255, 255, 255, 0.10) 78%
79%
), linear-gradient(
270deg, rgb(0 0 0) 0%, rgb(4 4 4) 50%, rgb(0 0 0) 100%);
      padding: 1px;
      display:grid;
      grid-template-columns: 1fr var(--centerW) 1fr;
      gap: 8px;
      align-items: stretch;
      overflow:hidden;
      box-shadow: 0 10px 28px rgba(0,0,0,0.40);
    }

    .conference{
      border-radius: 14px;
      border: 4px solid rgba(92, 92, 92, 0.363);
      background: rgba(0, 0, 0, 0.623);
      padding: 4px;
      display:flex;
      flex-direction:column;
      min-height:0;
      overflow:hidden;
    }

    .conf-title{
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.95;
      padding: 2px 8px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.05);
      text-align:center;
      margin-bottom: 2px;
    }

    .conf-scroll{
      min-height:0;
      overflow-y:auto;
      overflow-x:hidden;
      padding-right: 4px;
    }
    .conf-scroll::-webkit-scrollbar{ width: 0px; height:0px; }

    .division{ margin-bottom: 2px; }
    .division-name{
      font-size: 13px;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.85);
      padding: 2px 6px;
      margin-bottom: 2px;
      opacity: 0.92;
    }
    .division-teams{
      display:grid;
      grid-template-columns: repeat(var(--team-cols), 1fr);
      gap: 6px;
    }

    /* ===============================
       TEAM TILE
    ================================ */
    .team{
      position:relative;
      border-radius: 12px;
      border: 2px solid rgba(255, 255, 255, 0.815);
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      height: var(--team-height);
      overflow:hidden;
      cursor:pointer;
      transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
      box-shadow: 0 6px 16px rgba(0,0,0,0.35);
    }
    .team:hover{
      transform: translateY(-2px) scale(1.01);
      border-color: rgba(255,255,255,0.32);
      box-shadow: 0 10px 22px rgba(0,0,0,0.45);
    }
    .team img{
      width:100%;
      height:100%;
      object-fit: cover;
      display:block;
    }
    .team .fallback{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size: 16px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.92);
      background: rgba(0,0,0,0.55);
    }
    .team.sold img{
      opacity: 0.50;
      filter: grayscale(0.75) brightness(0.90);
    }
    .team.sold::after{
      content:"X";
      position:absolute;
      left:50%;
      top:50%;
      transform: translate(-50%, -50%);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.85);
      background: rgba(0,0,0,0.82);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size: 26px;
      font-weight: 900;
      color: rgba(255, 0, 0, 0.95);
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
      z-index: 5;
      pointer-events:none;
      box-shadow: 0 10px 26px rgba(0,0,0,0.6);
    }
    .team.flash{ animation: flash 260ms ease; }
    @keyframes flash{
      0%{ box-shadow: 0 0 0 rgba(255,255,255,0.0); }
      50%{ box-shadow: 0 0 22px rgba(255,255,255,0.35); }
      100%{ box-shadow: 0 0 0 rgba(255,255,255,0.0); }
    }

    /* ===============================
       CENTER CONTROL COLUMN
       (top -> bottom): RESET, SOLD, REMAINING, NEXT BREAK
    ================================ */
    .center{
      border-radius: 14px;
      border: 2px solid rgba(0, 0, 0, 0.288);
      background:
       linear-gradient(180deg, rgb(0 0 0 / 0%), rgb(35, 35, 35));
       border-top:none;
      padding: 10px 8px;
      display:flex;
      flex-direction:column;
      align-items: stretch;
      justify-content: flex-end;
      gap: 10px;
      box-shadow: inset 0 0 20px rgba(255,255,255,0.05);
      overflow:hidden;
    }

    .stat{
      border-radius: 14px;
      border: 2px solid rgba(255, 255, 255, 0.548);
      background: rgb(0 0 0 / 70%);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding: 10px 8px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 900;
      box-shadow: 0 10px 22px rgba(0,0,0,0.35);
    }
    .stat .num{ font-size: 28px; line-height: 1; }
    .stat .lbl{ font-size: 12px; opacity: 0.85; margin-top: 4px; }
    .stat.clickable{
      cursor:pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .stat.clickable:hover{
      transform: translateY(-1px);
      border-color: rgba(255,255,255,0.35);
    }

    .btn{
      border:none;
      border-radius: 14px;
      cursor:pointer;
      padding: 12px 10px;
      font-weight: 900;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.95);
      background:
        linear-gradient(180deg, rgb(0 0 0 / 47%), rgba(255, 255, 255, 0.05));
      border: 2px solid rgba(255, 255, 255, 0.637);
      box-shadow: 0 10px 20px rgba(0,0,0,0.35);
      transition: transform 0.14s ease, box-shadow 0.14s ease, border-color 0.14s ease;
    }
    .btn:hover{
      transform: translateY(-1px);
      border-color: rgba(255,255,255,0.34);
      box-shadow: 0 14px 26px rgba(0,0,0,0.42);
    }
    .btn:active{
      transform: translateY(0px);
      box-shadow: 0 8px 16px rgba(0,0,0,0.35);
    }
    .btn.secondary{
      background: linear-gradient(180deg, rgb(0 0 0 / 60%), rgb(0 0 0 / 80%));
    }

    /* ===============================
       SOLD PANEL (DOCKED BELOW MAIN)
    ================================ */
.sold-dock{
  border-radius: var(--radius);
  border: 2px solid rgba(255,255,255,0.16);
  background: rgba(0, 0, 0, 0.918);
  padding: 10px;

  /* IMPORTANT: keep it in layout flow so the page height grows */
  position: relative;   /* was absolute */
  inset: auto;          /* cancels top/left/right if present */
  margin-top: 10px;     /* keep spacing under ticker */
  height: auto;
  overflow: visible;

  display:flex;
  flex-direction:column;
  gap: 8px;
  box-shadow: 0 10px 24px rgba(0,0,0,0.35);
}

    .sold-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
    }
    .sold-title{
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.92;
      white-space:nowrap;
    }

    .sold-controls{
      display:flex;
      align-items:center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content:flex-end;
    }

    .mini-btn{
      padding: 6px 12px;
      border-radius: 12px;
      border: 2px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.10);
      color:#fff;
      font-weight: 900;
      letter-spacing: 1px;
      cursor:pointer;
      text-transform: uppercase;
    }
    .mini-btn:hover{ border-color: rgba(255,255,255,0.30); }
    .mini-btn:active{ transform: translateY(1px); }

.sold-grid{
  display:grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;

  align-content: start;
  grid-auto-rows: 48px;
}
.sold-grid::-webkit-scrollbar{ width: 0px; height: 0px; }

.sold-item{
  height: 48px;              /* match grid-auto-rows */
  display:flex;
  align-items:center;
  gap: 4px;
  padding: 5px 4px;
      border-radius: 999px;
      border: 2px solid rgba(255,255,255,0.14);
      background: rgba(0, 0, 0, 0.753);
      overflow:hidden;
    }
    .sold-item img{
      width: 34px;
      height: 34px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid rgba(255,255,255,0.45);
      background:#000;
      flex: 0 0 auto;
    }
    .sold-item .code{
      min-width: 52px;
      font-size: 13px;
      letter-spacing: 1px;
      font-weight: 900;
      opacity: 0.95;
      text-transform: uppercase;
      flex: 0 0 auto;
    }
    .sold-item input{
      width: 100%;
      min-width:0;
      padding: 5px 1px;
      border-radius: 999px;
      border: 2px solid rgba(255,255,255,0.16);
      background: rgba(0, 0, 0, 0.877);
      color:#fff;
      font-weight: 900;
      font-size:16px;
      letter-spacing: 0.6px;
      outline:none;
    }

.sold-dock.hidden{
  display: none;
}

    /* ===============================
       TICKER
    ================================ */
.ticker{
  height: 44px;
  border-radius: 14px;
  border: 2px solid rgba(255,255,255,0.18);
  background: linear-gradient(90deg, rgba(255,255,255,0.10), rgba(255,255,255,0.04), rgba(255,255,255,0.10));
  overflow:hidden;
  display:flex;
  align-items:center;
  padding: 0 12px;
  box-shadow: 0 10px 22px rgba(0,0,0,0.35);
}

/* NEW */
.ticker-track{
  display:flex;
  width:max-content;
  will-change: transform;
  animation: tickerMove var(--tickerDur) linear infinite;
}

.ticker-text{
  display:inline-block;
  white-space:nowrap;
  font-weight: 900;
  letter-spacing: 1px;
  text-transform: uppercase;
  font-size: 18px;
  text-shadow: 0 2px 10px rgba(0,0,0,0.65);
  padding-right: 48px; /* gap between repeats (tweak smaller/larger) */
}

/* Move left by exactly one copy */
@keyframes tickerMove{
  0%   { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}

    /* ===============================
       OBS-FRIENDLY POPUP MODAL
    ================================ */
    .modal-backdrop{
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.62);
      display:none;
      align-items:center;
      justify-content:center;
      z-index: 9999;
    }
    .modal-backdrop.show{ display:flex; }

    .modal{
      width: 520px;
      border-radius: 18px;
      border: 2px solid rgba(255,255,255,0.18);
      background:
    radial-gradient(800px 300px at 50% 0%, rgb(71 71 71), transparent 100%), 
    linear-gradient(180deg, rgba(0, 0, 0, 0.70), rgb(71 71 71));
      box-shadow: 0 18px 40px rgba(0,0,0,0.65);
      padding: 12px;
      overflow:hidden;
    }

    .modal-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .modal-title{
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.92;
      white-space:nowrap;
    }
    .modal-close{
      padding: 8px 10px;
      border-radius: 12px;
      border: 2px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.10);
      color:#fff;
      font-weight: 900;
      letter-spacing: 1px;
      cursor:pointer;
      text-transform: uppercase;
    }

    .modal-body{
      display:flex;
      flex-direction:column;
      gap: 10px;
    }

    .field-row{
      display:flex;
      gap: 10px;
      align-items:center;
    }

    .modal-input, .modal-textarea{
      width:100%;
      padding: 12px 12px;
      border-radius: 14px;
      border: 2px solid rgba(255,255,255,0.16);
      background: rgba(0,0,0,0.35);
      color:#fff;
      font-weight: 900;
      letter-spacing: 0.8px;
      outline:none;
      font-family: "Arial Black", Arial, sans-serif;
    }
    .modal-textarea{
      height: 120px;
      resize: none;
      line-height: 1.25;
    }

    .modal-actions{
      display:flex;
      gap: 10px;
      justify-content:flex-end;
      flex-wrap:wrap;
      margin-top: 2px;
    }

    .slider-wrap{
      display:flex;
      flex-direction:column;
      gap: 6px;
      padding: 10px 12px;
      border-radius: 14px;
      border: 2px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.06);
    }
    .slider-top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 900;
      font-size: 12px;
      opacity: 0.9;
      white-space:nowrap;
    }
    input[type="range"]{ width:100%; }

/* ===============================
   SHIMMER BORDER (Hit Chasers "wick" style)
   - add class="wick" to any panel you want to shimmer
================================ */
.wick{
  position: relative;
  border-radius: 14px; /* inherits if applied to already-rounded panels */
}

.wick::after{
  content:"";
  position:absolute;
  inset:-2px;                 /* slightly outside for glow */
  border-radius: inherit;
  pointer-events:none;
  z-index: 19;

  /* monochrome spark sweep */
  background: linear-gradient(130deg,
    rgba(255,255,255,0) 0%,
    rgba(255,255,255,0) 38%,
    rgba(255,255,255,1) 48%,
    rgba(220,220,220,0.95) 52%,
    rgba(160,160,160,0.85) 58%,
    rgba(255,255,255,0) 68%,
    rgba(255,255,255,0) 100%
  );
  background-size: 300% 300%;
  animation: wickRun 5s ease-in-out infinite alternate;

  /* border-only mask */
  -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
  mask-composite: exclude;
  padding: 4px;

  /* glow (monochrome) */
  filter:
    drop-shadow(0 0 10px rgba(255,255,255,0.35))
    drop-shadow(0 0 22px rgba(255,255,255,0.18));
  opacity: 1;
}

@keyframes wickRun{
  0%   { background-position:   0% 50%; }
  100% { background-position: 100% 100%; }
}

/* IMPORTANT: allow the wick glow to extend outward */
.overlay.wick,
.header.wick,
.conference.wick,

.sold-dock.wick{
  overflow: visible !important;
}
html, body{
  height: auto;
  overflow: visible;
}

  </style>
</head>

<body>
 <div class="overlay wick" id="overlayRoot">

    <!-- ===============================
         HEADER
    ================================ -->
    <div class="header">
      <div class="header-left">
        <div class="brand" id="brandText">Double M Breakz</div>
        <div class="sub" id="headerSubtitle">NFL TEAM BREAK</div>
      </div>

      <div class="header-center">
        <img id="topLogo" alt="DoubleMBreakz Logo" />
      </div>

      <div class="header-right">
        <div class="pill">
          <span class="label">Sport</span>
          <span class="value" id="sportDisplay">NFL</span>
        </div>
        <div class="pill">
          <span class="label">Break #</span>
          <span class="value" id="breakNumDisplay">1</span>
        </div>

      </div>
    </div>

    <!-- ===============================
         MAIN
    ================================ -->
    <div class="main">

     <div class="teams-section">
        <div class="conference wick">
          <div class="conf-title" id="leftTitle">AFC</div>
          <div class="conf-scroll" id="conferenceLeft"></div>
        </div>

        <div class="center">
          <!-- TOP: RESET -->
          <button class="btn secondary" onclick="resetAll()">Reset</button>

          <!-- SOLD -->
          <div class="stat clickable" onclick="toggleSoldDock()" title="Toggle sold panel">
            <div class="num" id="teamsSold">0</div>
            <div class="lbl">Sold</div>
          </div>

          <!-- REMAINING -->
          <div class="stat">
            <div class="num" id="teamsLeft">0</div>
            <div class="lbl">Remaining</div>
          </div>

          <!-- BOTTOM: NEXT BREAK -->

<script>
/* =========================================================
   DoubleMBreakz — Split Grid Overlay
   - Single-file OBS-ready
   - SSE v2 multi-channel ready (+scores channel)
   - Sold tiles: opacity + “X”
   - Break counter: daily reset
   - Scores: ticker driven (NFL primary) via SSE type="scores"

     Sold pane bar: Break# popup, Ticker popup (speed), Change Sport
========================================================= */

/* =========================
   BASE PATH (repo-safe)
========================= */
const BASE = (() => {
  const isGhPages = location.hostname.endsWith('github.io');
  if (isGhPages) {
    const parts = location.pathname.split('/').filter(Boolean);
    const repo = parts.length ? parts[0] : '';
    return `/${repo}/`;
  }
  return '../..\/';
})();

const DEFAULT_BRAND = "Double M Breakz";
const DEFAULT_LOGO = `${BASE}images/logos/doublembreaks.png`; // place your logo here

function qs(name){ return new URLSearchParams(location.search).get(name); }

/* =========================
   BRAND / LOGO
========================= */
function setLogos(){
  const logoOverride = qs("logo");
  const url = (logoOverride && logoOverride.trim()) ? logoOverride.trim() : DEFAULT_LOGO;

  const top = document.getElementById("topLogo");
  if (top) top.src = url;

  const brand = qs("brand") || DEFAULT_BRAND;
  document.getElementById("brandText").textContent = brand;
}

/* =========================
   BREAK COUNTER (Daily)
   breakId format: YYYY-MM-DD-sport-counter
========================= */
const CLIENT_KEY = "doublembreakz";
const COUNTER_KEY = `${CLIENT_KEY}.breakCounter`;

function todayKey(){
  const d = new Date();
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return `${yyyy}-${mm}-${dd}`;
}

function loadCounter(){
  try{
    const raw = localStorage.getItem(COUNTER_KEY);
    if (!raw) return { day: todayKey(), n: 1 };

    const obj = JSON.parse(raw);
    if (!obj || typeof obj !== "object") return { day: todayKey(), n: 1 };

    if (obj.day !== todayKey()) return { day: todayKey(), n: 1 };
    const n = parseInt(obj.n, 10);
    return { day: todayKey(), n: Number.isFinite(n) && n > 0 ? n : 1 };
  }catch(_){
    return { day: todayKey(), n: 1 };
  }
}

function saveCounter(day, n){
  localStorage.setItem(COUNTER_KEY, JSON.stringify({ day, n }));
}

function getBreakNumber(){
  return loadCounter().n;
}

function setBreakNumber(n){
  const safe = Number.isFinite(n) && n > 0 ? n : 1;
  const day = todayKey();
  saveCounter(day, safe);

  const d = document.getElementById("breakNumDisplay");
  if (d) d.textContent = String(safe);

  // keep modal input synced
  const mi = document.getElementById("breakModalInput");
  if (mi) mi.value = String(safe);

  persistState();
}

function incrementBreak(){
  setBreakNumber(getBreakNumber() + 1);
}

function applyBreakNumberFromModal(){
  const val = (document.getElementById("breakModalInput")?.value || "").trim();
  const n = parseInt(val, 10);
  setBreakNumber(Number.isFinite(n) && n > 0 ? n : getBreakNumber());
  closeModal();
}

function computeBreakId(){
  const d = todayKey();
  return `${d}-${currentSport}-${getBreakNumber()}`;
}

/* =========================
   TICKER (default + scores + speed)
========================= */
const TICKER_KEY = `${CLIENT_KEY}.tickerLines`;
const TICKER_SPEED_KEY = `${CLIENT_KEY}.tickerSpeedSec`;

const DEFAULT_TICKER_LINES = [
  "DOUBLEMBREAKZ",
  "NFL • NBA • MLB",
  "GOOD LUCK!"
];

function loadTickerLines(){
  try{
    const raw = localStorage.getItem(TICKER_KEY);
    if (!raw) return DEFAULT_TICKER_LINES.slice();
    const arr = JSON.parse(raw);
    if (Array.isArray(arr) && arr.length) return arr.map(s => String(s));
  }catch(_){}
  return DEFAULT_TICKER_LINES.slice();
}

function saveTickerLines(lines){
  localStorage.setItem(TICKER_KEY, JSON.stringify(lines));
}

function loadTickerSpeedSec(){
  try{
    const raw = localStorage.getItem(TICKER_SPEED_KEY);
    const n = parseInt(raw, 10);
    if (Number.isFinite(n) && n >= 10 && n <= 60) return n;
  }catch(_){}
  return 22;
}

function saveTickerSpeedSec(sec){
  const s = Math.max(10, Math.min(60, parseInt(sec, 10) || 22));
  localStorage.setItem(TICKER_SPEED_KEY, String(s));
  applyTickerSpeed(s);
  return s;
}

function applyTickerSpeed(sec){
  const s = Math.max(10, Math.min(60, parseInt(sec, 10) || 22));
  document.documentElement.style.setProperty("--tickerDur", s + "s");

  const label = document.getElementById("tickerSpeedLabel");
  if (label) label.textContent = s + "s";

  const slider = document.getElementById("tickerSpeedSlider");
  if (slider) slider.value = String(s);

  // restart animation to apply immediately
const track = document.getElementById("tickerTrack");
if (track){
  track.style.animation = "none";
  void track.offsetHeight;
  track.style.animation = "";
}
}

let TICKER_LINES = loadTickerLines();
let lastScoresTs = 0;
let scoresBySport = { nfl: null, nba: null, mlb: null };

function refreshTickerText(){
  const useScores = shouldEnableScores() && (Date.now() - lastScoresTs) < 180000;
  const scoreLine = useScores ? buildScoreTickerLine() : "";

  const msg = useScores && scoreLine
    ? `${scoreLine}   •   ${TICKER_LINES.join("   •   ")}`
    : `${TICKER_LINES.join("   •   ")}`;

  const a = document.getElementById("tickerText");
  const b = document.getElementById("tickerTextClone");
  const track = document.getElementById("tickerTrack");
  if (!a || !b || !track) return;

  // Add a little spacer at end so it doesn't look mashed together
  const finalMsg = ` ${msg} `;

  a.textContent = finalMsg;
  b.textContent = finalMsg;

  // Restart animation immediately so updates show right away
  track.style.animation = "none";
  void track.offsetHeight;
  track.style.animation = "";
}

function setTickerLines(lines){
  TICKER_LINES = Array.isArray(lines) && lines.length ? lines : DEFAULT_TICKER_LINES.slice();
  saveTickerLines(TICKER_LINES);
  refreshTickerText();
}

function resetTickerDefaults(){
  setTickerLines(DEFAULT_TICKER_LINES.slice());
  const spd = saveTickerSpeedSec(22);
  // keep modal text in sync
  const ta = document.getElementById("tickerModalText");
  if (ta) ta.value = TICKER_LINES.join(" • ");
  const slider = document.getElementById("tickerSpeedSlider");
  if (slider) slider.value = String(spd);
}

function shouldEnableScores(){
  return new URLSearchParams(location.search).get("scores") === "1";
}

function getScoresChannel(){
  return (new URLSearchParams(location.search).get("scoresChannel") || "sports").toLowerCase();
}

function buildScoreTickerLine(){
  const pick = scoresBySport[currentSport] || scoresBySport.nfl || scoresBySport.nba || scoresBySport.mlb;
  if (!pick) return "";
  const sportLabel = (pick.sport || currentSport || "nfl").toUpperCase();

  const games = Array.isArray(pick.games) ? pick.games : [];
  if (!games.length) return `${sportLabel} SCORES: (no games)`;

  const parts = games.slice(0, 6).map(g => {
    const a = String(g.away || g.a || "").toUpperCase();
    const h = String(g.home || g.h || "").toUpperCase();
    const as = (g.awayScore ?? g.as ?? 0);
    const hs = (g.homeScore ?? g.hs ?? 0);
    const st = String(g.status || g.period || "").toUpperCase();
    const tm = String(g.time || "").toUpperCase();
    const tail = [st, tm].filter(Boolean).join(" ");
    return `${a} ${as} - ${h} ${hs}${tail ? " ("+tail+")" : ""}`;
  });

  return `${sportLabel} SCORES: ${parts.join("   •   ")}`;
}

/* =========================
   POPUP MODALS (OBS friendly)
========================= */
function backdropClick(e){
  const back = document.getElementById("modalBackdrop");
  if (e.target === back) closeModal();
}

function openModal(which){
  const back = document.getElementById("modalBackdrop");
  const bm = document.getElementById("breakModal");
  const tm = document.getElementById("tickerModal");
  if (!back || !bm || !tm) return;

  bm.style.display = "none";
  tm.style.display = "none";

  back.classList.add("show");
  if (which === "break") bm.style.display = "block";
  if (which === "ticker") tm.style.display = "block";
}

function closeModal(){
  const back = document.getElementById("modalBackdrop");
  const bm = document.getElementById("breakModal");
  const tm = document.getElementById("tickerModal");
  if (!back || !bm || !tm) return;

  bm.style.display = "none";
  tm.style.display = "none";
  back.classList.remove("show");
}

function openBreakModal(){
  const mi = document.getElementById("breakModalInput");
  if (mi) mi.value = String(getBreakNumber());
  openModal("break");
  setTimeout(() => { try{ mi?.focus(); mi?.select?.(); }catch(_){ } }, 10);
}

function openTickerModal(){
  const ta = document.getElementById("tickerModalText");
  if (ta) ta.value = TICKER_LINES.join(" • ");

  const sec = loadTickerSpeedSec();
  applyTickerSpeed(sec);

  openModal("ticker");
  setTimeout(() => { try{ ta?.focus(); }catch(_){ } }, 10);
}

function parseTickerText(raw){
  const t = String(raw || "").trim();
  if (!t) return [];
  if (t.includes("•")) return t.split("•").map(s => s.trim()).filter(Boolean);
  if (t.includes("\n")) return t.split("\n").map(s => s.trim()).filter(Boolean);
  return [t];
}

function applyTickerFromModal(){
  const raw = (document.getElementById("tickerModalText")?.value || "");
  const parts = parseTickerText(raw);
  setTickerLines(parts.length ? parts : DEFAULT_TICKER_LINES.slice());

  const slider = document.getElementById("tickerSpeedSlider");
  const sec = parseInt(slider?.value || "22", 10);
  saveTickerSpeedSec(sec);

  closeModal();
}

/* slider live update */
document.addEventListener("input", (e) => {
  if (e?.target?.id === "tickerSpeedSlider"){
    const sec = parseInt(e.target.value, 10);
    applyTickerSpeed(sec);
  }
});
document.addEventListener("change", (e) => {
  if (e?.target?.id === "tickerSpeedSlider"){
    const sec = parseInt(e.target.value, 10);
    saveTickerSpeedSec(sec);
  }
});

  document.getElementById("headerSubtitle").textContent = cfg.header;
  document.getElementById("leftTitle").textContent = cfg.leftTitle;
  document.getElementById("rightTitle").textContent = cfg.rightTitle;

  const root = document.documentElement;
  root.style.setProperty("--team-cols", String(cfg.vars.teamCols));
  root.style.setProperty("--team-height", String(cfg.vars.teamHeight) + "px");
  root.style.setProperty("--teams-h", String(cfg.vars.teamsH) + "px");
}

function makeTeamDiv(team){
  const d = document.createElement("div");
  d.className = "team";
  d.dataset.code = team.code;

  const img = document.createElement("img");
  img.alt = team.name || team.code;
  img.src = team.image || "";
  img.onerror = () => {
    img.remove();
    const fb = document.createElement("div");
    fb.className = "fallback";
    fb.textContent = team.code;
    d.appendChild(fb);
  };
  d.appendChild(img);

  d.addEventListener("click", () => toggleTeam(team.code));
  return d;
}

function initializeGrid(){
  const left = document.getElementById("conferenceLeft");
  const right = document.getElementById("conferenceRight");
  if (!left || !right) return;

  left.innerHTML = "";
  right.innerHTML = "";

  const cfg = breakTypes[currentSport];
  if (!cfg) return;

  const leftKey = Object.keys(cfg.divisions)[0];
  const rightKey = Object.keys(cfg.divisions)[1];

  renderConference(left, cfg.divisions[leftKey], leftKey);
  renderConference(right, cfg.divisions[rightKey], rightKey);

  Object.keys(soldMap).forEach(code => {
    if (soldMap[code]) {
      const el = document.querySelector(`.team[data-code="${CSS.escape(code)}"]`);
      if (el) el.classList.add("sold");
    }
  });

  updateStats();
  updateSoldList();
}

function renderConference(container, divisions){
  const frag = document.createDocumentFragment();

  Object.keys(divisions).forEach(divName => {
    const wrap = document.createElement("div");
    wrap.className = "division";

    const t = document.createElement("div");
    t.className = "division-name";
    t.textContent = divName;
    wrap.appendChild(t);

    const grid = document.createElement("div");
    grid.className = "division-teams";
    divisions[divName].forEach(team => grid.appendChild(makeTeamDiv(team)));

    wrap.appendChild(grid);
    frag.appendChild(wrap);
  });

  container.appendChild(frag);
}

/* =========================
   SOLD / TOGGLE
========================= */
function toggleTeam(code, buyerName){
  const up = String(code || "").toUpperCase().trim();
  if (!up) return;

  soldMap[up] = !soldMap[up];
  if (!soldMap[up]) {
    delete soldMap[up];
    delete buyerMap[up];
  } else {
    if (typeof buyerName === "string" && buyerName.trim()) buyerMap[up] = buyerName.trim();
  }

  const el = document.querySelector(`.team[data-code="${CSS.escape(up)}"]`);
  if (el) {
    el.classList.toggle("sold", !!soldMap[up]);
    el.classList.add("flash");
    setTimeout(() => el.classList.remove("flash"), 300);
  }

  updateStats();
  updateSoldList();
  persistState();
}

function updateStats(){
  const allCodes = getAllTeamCodes();
  const sold = Object.keys(soldMap).length;
  const left = Math.max(0, allCodes.length - sold);

  document.getElementById("teamsSold").textContent = String(sold);
  document.getElementById("teamsLeft").textContent = String(left);
}

function getAllTeamCodes(){
  const cfg = breakTypes[currentSport];
  if (!cfg) return [];
  const confKeys = Object.keys(cfg.divisions);
  const codes = [];
  confKeys.forEach(k => {
    const divs = cfg.divisions[k];
    Object.keys(divs).forEach(dn => divs[dn].forEach(t => codes.push(t.code)));
  });
  return codes;
}

function updateSoldList(){
  const grid = document.getElementById("soldGrid");
  if (!grid) return;
  grid.innerHTML = "";

  const soldCodes = Object.keys(soldMap).filter(c => soldMap[c]).sort();
  const cfg = breakTypes[currentSport];

  const imgLookup = {};
  Object.keys(cfg.divisions).forEach(k => {
    const divs = cfg.divisions[k];
    Object.keys(divs).forEach(dn => divs[dn].forEach(t => { imgLookup[t.code] = t.image || ""; }));
  });

  for (let i = 0; i < soldCodes.length; i++){
    const code = soldCodes[i];

    const row = document.createElement("div");
    row.className = "sold-item";

    const img = document.createElement("img");
    img.src = imgLookup[code] || "";
    img.alt = code;
    img.onerror = () => { img.style.display = "none"; };
    row.appendChild(img);

    const c = document.createElement("div");
    c.className = "code";
    c.textContent = code;
    row.appendChild(c);

    const inp = document.createElement("input");
    inp.value = buyerMap[code] || "";
    inp.placeholder = "Buyer...";
    inp.addEventListener("input", () => {
      buyerMap[code] = inp.value;
      persistState();
    });
    row.appendChild(inp);

    grid.appendChild(row);
  }
}

function toggleSoldDock(){
  const dock = document.getElementById("soldDock");
  if (!dock) return;
  dock.classList.toggle("hidden");
}

/* =========================
   BREAK CYCLE / RESET
========================= */
function startNewBreakCycle(){
  incrementBreak();
  soldMap = {};
  buyerMap = {};
  initializeGrid();
  refreshTickerText();
  warmupPing();
  persistState();
}

function resetAll(){
  soldMap = {};
  buyerMap = {};
  initializeGrid();
  refreshTickerText();
  persistState();
}

/* =========================
   SPORT SWITCH
========================= */
function cycleSport(){
  const idx = sportOrder.indexOf(currentSport);
  const next = sportOrder[(idx + 1 + sportOrder.length) % sportOrder.length];
  setSport(next);
}

function setSport(s){
  const v = String(s || "").toLowerCase();
  if (!breakTypes[v]) return;

  currentSport = v;
  setSportVars();

  soldMap = {};
  buyerMap = {};
  loadState();

  initializeGrid();
  refreshTickerText();
  persistState();
}

/* =========================
   SSE v2 (Multi-Channel + Scores)
========================= */
const BRIDGE_URL_DEFAULT = "https://bridge.tradesecretsunlocked.com";
const BRIDGE_KEY_DEFAULT = "bce810ee-9604-40d4-b863-cf26a115fdc2";
const BRIDGE_KEYS = {
  URL_A: "tsu.bridge",
  URL_B: "tsu.bridgeUrl",
  KEY_A: "tsu.key",
  KEY_B: "tsu.bridgeKey",
  LEGACY_URL: "overlay.bridge.url",
  LEGACY_KEY: "overlay.bridge.key",
  LEGACY_ALT: "tsu.url",
  // add these:
  URL_C: "tsu.bridge.base",
  URL_D: "tsu.bridgeBase"
};

// --- TSU Extension Bridge Handshake Support (no server/ext changes needed) ---
(function setupBridgeHandshake(){
  window.addEventListener("message", (ev) => {
    const msg = ev?.data;
    if (!msg || typeof msg !== "object") return;

    // Extension asking overlay to identify itself / provide current bridge values
    if (msg.type === "TSU_REQUEST_BRIDGE") {
      try{
        ev.source?.postMessage({
          type: "TSU_OVERLAY",
          overlay_id: CLIENT_KEY,
          bridge: resolveBridgeBase(),
          key: resolveBridgeKey()
        }, "*");
      }catch(_){}
      return;
    }

    // Extension pushing bridge info into overlay
    if (msg.type === "TSU_BRIDGE_INFO") {
      const b = cleanBridgeBase(msg.bridge || msg.bridgeUrl || msg.url || msg.base || "");
      const k = String(msg.key || msg.bridgeKey || "").trim();

      if (b) {
        localStorage.setItem(BRIDGE_KEYS.URL_A, b);
        localStorage.setItem(BRIDGE_KEYS.URL_B, b);
      }
      if (k) {
        localStorage.setItem(BRIDGE_KEYS.KEY_A, k);
        localStorage.setItem(BRIDGE_KEYS.KEY_B, k);
      }

      // Reconnect live if already running
      connectBridgeSSE();
      return;
    }
  });
})();

function cleanBridgeBase(raw){
  return String(raw || "")
    .trim()
    .replace(/\/(stream|events)(\/.*)?$/i, "")
    .replace(/\/+$/, "");
}

function resolveBridgeBase(){
  const q = new URLSearchParams(location.search).get("bridge");
  return cleanBridgeBase(q || BRIDGE_URL_DEFAULT);
}

function resolveBridgeKey(){
  const q = new URLSearchParams(location.search).get("key");
  return String(q || BRIDGE_KEY_DEFAULT).trim();
}

function getChannels(){
  const qs = new URLSearchParams(location.search);
  const list = qs.getAll("channel").map(s => String(s||"").trim().toLowerCase()).filter(Boolean);
  return list.length ? list : ["main"];
}

const SSE_SOURCES = new Map();
let sseReconnectTimer = null;

function setSSEStatus(state, text){
  const pill = document.getElementById("ssePill");
  const t = document.getElementById("sseText");
  if (!pill || !t) return;

  pill.classList.remove("connected","error");
  if (state === "connected") pill.classList.add("connected");
  if (state === "error" || state === "connecting") pill.classList.add("error");
  t.textContent = String(text || state || "").toUpperCase();
}

function closeAllSSE(){
  SSE_SOURCES.forEach((es) => { try{ es.close(); }catch(_){ } });
  SSE_SOURCES.clear();
}

function connectBridgeSSE(){
  const base = resolveBridgeBase();
  if (!base){
    setSSEStatus("error","missing");
    return;
  }

  const channels = new Set(getChannels());
  if (shouldEnableScores()) channels.add(getScoresChannel());

  setSSEStatus("connecting", [...channels].join(","));
  closeAllSSE();

  channels.forEach((channel) => {
    const url = `${base}/stream?channel=${encodeURIComponent(channel)}&key=${encodeURIComponent(getBridgeKey())}`;
    const es = new EventSource(url);
    SSE_SOURCES.set(channel, es);

    es.onopen = () => setSSEStatus("connected", channel);

    const ingest = (e) => {
      if (!e || !e.data) return;
      let data;
      try { data = JSON.parse(e.data); } catch(_){ return; }
      if (data?.type === "hello") return;
      handleSSEEvent(data, channel, e.type || "message");
    };

    es.onmessage = ingest;
   [
  // sales
  "team_sold","sold","sale","purchase","purchased","team_bought","bought",

  // unsold / respin
  "team_unsold","unsold","respin","respins","re_spin","respinned",

  // buyer updates
  "buyer","set_buyer","buyer_update",

  // overlay controls
  "reset","break_reset","set_break","set_sport","next_break",

  // scores (still OFF unless ?scores=1)
  "scores"
].forEach(type => es.addEventListener(type, ingest));
      

    es.onerror = () => {
      setSSEStatus("error", "reconnecting");
      try{ es.close(); }catch(_){ }
      SSE_SOURCES.delete(channel);

      if (sseReconnectTimer) return;
      sseReconnectTimer = setTimeout(() => {
        sseReconnectTimer = null;
        connectBridgeSSE();
      }, 2500);
    };
  });

  warmupPing();
}

function breakIdMatches(payload){
  const bid = String(payload?.breakId || payload?.break_id || "").trim();
  if (!bid) return true;
  return bid === computeBreakId();
}

function handleSSEEvent(payload, channel, eventName){
  if (!payload || typeof payload !== "object") return;

  // ---- normalize type ----
  const rawType = String(payload.type || payload.event || eventName || "").toLowerCase();

  const SOLD_TYPES = new Set([
    "team_sold","sold","sale","purchase","purchased","team_bought","bought"
  ]);
  const UNSOLD_TYPES = new Set([
    "team_unsold","unsold","respin","respins","re_spin","respinned"
  ]);
  const BUYER_TYPES = new Set([
    "buyer","set_buyer","buyer_update"
  ]);

  // ---- helpers to pull fields from ANY payload shape ----
  const getCode = () => {
    return String(
      payload.teamCode ??
      payload.team_code ??
      payload.code ??
      payload.team ??
      payload.abbr ??
      payload?.data?.code ??
      payload?.data?.teamCode ??
      payload?.data?.team ??
      ""
    ).toUpperCase().trim();
  };

  const getBuyer = () => {
    return String(
      payload.buyerName ??
      payload.buyer_name ??
      payload.buyer ??
      payload.username ??
      payload.user ??
      payload?.data?.buyer ??
      payload?.data?.buyerName ??
      ""
    ).trim();
  };

  // ---- SCORES (only shown if ?scores=1) ----
  if (rawType === "scores"){
    const sport = String(payload.sport || payload.league || currentSport || "nfl").toLowerCase();
    scoresBySport[sport] = payload;
    lastScoresTs = Date.now();
    refreshTickerText();
    return;
  }

  // ---- overlay controls ----
  if (rawType === "reset" || rawType === "break_reset"){ resetAll(); return; }

  if (rawType === "set_sport"){
    const s = String(payload.sport || payload.league || "").toLowerCase();
    if (s) setSport(s);
    return;
  }

  if (rawType === "set_break"){
    const n = parseInt(payload.breakNum || payload.break || payload.n, 10);
    if (Number.isFinite(n) && n > 0) setBreakNumber(n);
    return;
  }

  if (rawType === "next_break"){ startNewBreakCycle(); return; }

  // ---- breakId filter (sales/unsold/buyer should match current break) ----
  if (!breakIdMatches(payload)) return;

  // ---- SOLD ----
  if (SOLD_TYPES.has(rawType)) {
    const code = getCode();
    const buyer = getBuyer();
    if (code) {
      soldMap[code] = true;
      if (buyer) buyerMap[code] = buyer;

      const el = document.querySelector(`.team[data-code="${CSS.escape(code)}"]`);
      if (el) {
        el.classList.add("sold","flash");
        setTimeout(() => el.classList.remove("flash"), 300);
      }

      updateStats();
      updateSoldList();
      persistState();
    }
    return;
  }

  // ---- UNSOLD / RESPIN ----
  if (UNSOLD_TYPES.has(rawType)) {
    const code = getCode();
    if (code) {
      delete soldMap[code];
      delete buyerMap[code];

      const el = document.querySelector(`.team[data-code="${CSS.escape(code)}"]`);
      if (el) el.classList.remove("sold");

      updateStats();
      updateSoldList();
      persistState();
    }
    return;
  }

  // ---- BUYER UPDATE ----
  if (BUYER_TYPES.has(rawType)) {
    const code = getCode();
    const buyer = getBuyer();
    if (code) {
      if (buyer) buyerMap[code] = buyer;
      else delete buyerMap[code];

      updateSoldList();
      persistState();
    }
    return;
  }
}
/* =========================
   WARMUP PING (POST /events)
========================= */
async function warmupPing(){
  const base = resolveBridgeBase();
  if (!base) return;

  const key = resolveBridgeKey();
  const url = `${base}/events`;

  const body = {
    ts: Date.now(),
    type: "overlay_warmup",
    channel: "main",
    overlay_id: CLIENT_KEY,
    breakId: "warmup",
    breakType: currentSport,
    teamCode: "WARMUP",
    buyerName: "ping"
  };

  try{
    await fetch(url, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-bridge-key": key || "",
        "x-api-key": key || ""
      },
      body: JSON.stringify(body)
    });
  }catch(_){}
}

/* =========================
   INIT
========================= */
function initOverlay(){
  setLogos();

  const sportOverride = (qs("sport") || "").toLowerCase();
  if (sportOverride && breakTypes[sportOverride]) currentSport = sportOverride;

  setBreakNumber(getBreakNumber());
  setSportVars();
  loadState();
  initializeGrid();

  // load/persist ticker speed + text
  applyTickerSpeed(loadTickerSpeedSec());
  refreshTickerText();

  const base = resolveBridgeBase();
  if (base) connectBridgeSSE();
  else setSSEStatus("error","off");
}

document.addEventListener("DOMContentLoaded", initOverlay);
