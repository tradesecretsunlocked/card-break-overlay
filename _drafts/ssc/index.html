<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOLELY SPORTS CARDS – Box Breaks</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bungee+Shade&display=swap" rel="stylesheet" />

  <style>
    :root{
      /* Solely Sports Cards (palette pulled from provided logo art) */
      --primary-color: #000000;         /* black */
      --secondary-color: #890e00;       /* deep red */
      --accent-blue: #172d73;           /* navy */
      --accent-blue2: #3c65ec;          /* bright blue */
      --text-color: #ffffff;
      --border-color: rgba(255,255,255,0.22);

      /* Per-sport division columns (NFL=4, NBA/MLB=5) */
      --div-cols: 4;
    }

    *{ box-sizing: border-box; }

    body{
      margin:50px;;
      padding:0;
      width:100%;
      max-width:1080px;
      min-height:500px;
      margin-inline:auto;
      font-family: Arial, sans-serif;
      color: var(--text-color);
      background: transparent;
      display:flex;
      flex-direction:column;
      align-items:center;
      user-select:none;
    }

    .overlay-container{
      width:1080px;
      height:auto;
      position:relative;
      background:
        radial-gradient(circle at top, rgba(60,101,236,0.18) 0%, rgba(23,45,115,0.10) 28%, rgba(0,0,0,1) 72%),
        linear-gradient(180deg, #0a0a0a 0%, #000000 100%);
      border: 3px solid rgba(137,14,0,0.55);
      border-radius: 16px;
      padding: 8px;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.06),
        0 0 28px rgba(137,14,0,0.28),
        0 18px 40px rgba(0,0,0,0.9);
      display:flex;
      flex-direction:column;
      margin:2px;
      gap:2px;
      overflow: visible;
    }

    .header{
      display:grid;
      grid-template-columns:auto 1fr;
      align-items:center;
      padding: 2px 12px;
      min-height:58px;
      padding-right:16px;
      overflow: visible;
      position:relative;
      background:linear-gradient(45deg, #020536, rgb(105 2 2 / 85%), rgb(2 18 47));
    }

    .brand-logo{
      position:absolute;
      left:51%;
      top:92%;
      transform:translate(-50%,-50%);
      pointer-events:none;
      z-index:50;
    }
    .brand-logo img{
      height: 171px;
      width:auto;
      max-width:none;
      object-fit:contain;
      top:23px;
      position:relative;
      filter:
        drop-shadow(0 6px 18px rgba(0,0,0,0.55))
        drop-shadow(0 0 22px rgba(60,101,236,0.28))
        drop-shadow(0 0 18px rgba(137,14,0,0.20));
    }

    .brand-title{
      font-family: 'Impact','Arial Black',sans-serif;
      font-weight: 900;
      font-size: 45px;
      line-height: 1.1;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: white;
      text-shadow:
        0 4px 0 rgba(0,0,0,0.9),
        0 8px 12px rgba(0,0,0,0.9);
    }

    .header-right{
      display:flex;
      align-items:center;
      gap:10px;
      justify-self:end;
    }

    .break-id-box{
      display:flex;
      align-items:center;
      gap:16px;
      padding: 10px 10px;
      padding-left:40px;
      padding-right:40px;
      border-radius:10px;
      background: rgba(0,0,0,0.55);
      border: 2px solid rgba(137,14,0,0.55);
      box-shadow: inset 0 0 10px rgba(255,255,255,0.04);
    }
    .break-id-label{
      font-size:18px;
      letter-spacing:1px;
      text-transform:uppercase;
      opacity: 0.92;
    }
    .break-id-value{
      font-size:18px;
      font-weight:900;
      letter-spacing:0.5px;
      color: #f2f4f7;
      text-shadow: 0 2px 0 rgba(0,0,0,0.7);
    }

    .main{
      display:flex;
      flex-direction:column;
      gap:8px;
      overflow: visible;
    }

    .teams-section{
      display:grid;
      grid-template-columns: 1fr auto 1fr;
      gap:6px;
      align-items:center;
      margin-top:11px;
    }

    .conference{
      display:flex;
      flex-direction:column;
      gap:10px;
      padding:4px;
      border: 2px solid rgb(255, 255, 255);
      border-radius:12px;
      background: rgba(23,45,115,0.16);
      min-height:255px;
      margin-top:-2px;
      position:relative;
      overflow: visible;
      justify-content: space-around;
    }

    .conference::before{
      content:'';
      position:absolute;
      inset:-3px;
      border-radius:14px;
      pointer-events:none;
      z-index:0;

      background:
        linear-gradient(
          90deg,
          transparent 0%,
          rgba(60,101,236,0.0) 12%,
          rgba(60,101,236,0.25) 30%,
          rgba(242,244,247,0.35) 42%,
          rgba(137,14,0,0.30) 55%,
          transparent 100%
        );

      background-size: 200% 100%;
      background-position: 0% 50%;

      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 1);
      -webkit-mask-composite: xor;
      mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 1);
      mask-composite: exclude;

      padding:2px;
      filter: blur(6px);
      animation: borderWick 5s linear infinite;
      opacity: 0.9;
    }

    #conferenceLeft::before{ animation-direction: normal; }
    #conferenceRight::before{ animation-direction: reverse; }

    .conference > *{ position:relative; z-index:1; }

    @keyframes borderWick{
      0%   { background-position: 0% 50%; opacity: 0.35; }
      50%  { background-position: 100% 50%; opacity: 0.85; }
      100% { background-position: 200% 50%; opacity: 0.35; }
    }

    .conference-title,
    .division-name{ display:none; }

    .division-teams{
      display:grid;
      grid-template-columns: repeat(var(--div-cols), 1fr);
      gap: 2px;
    }

    .team{
      position:relative;
      z-index:2;
      cursor:pointer;
      max-height:70px;
      padding:1px;
    }

    .team img{
      width:100%;
      height:100%;
      object-fit:cover;
      padding:0px;
      position:relative;
      z-index:1;
      border-radius:12px;
      border: 2px solid rgba(255, 255, 255, 0.65);
      box-shadow: 0 6px 16px rgba(0,0,0,0.35);
    }

    .team.sold img{
      filter: grayscale(1) brightness(0.45);
    }

    /* Ambient moving glow */
    .team::before{
      content:'';
      position:absolute;
      inset:-14px;
      border-radius:16px;
      z-index:0;
      pointer-events:none;

      background: radial-gradient(
        circle at 55% 77%,
        rgba(60,101,236,0.55),
        rgba(137,14,0,0.35),
        transparent 70%
      );

      filter: blur(18px);
      opacity:0.65;
      animation: teamGlowDrift 4s ease-in-out infinite;
    }

    .team img{ position:relative; z-index:1; }

    .team.sold::before{
      opacity:0.12;
      animation:none;
    }

    @keyframes teamGlowDrift{
      0%   { background-position: 0% 50%; transform: scale(0.95); opacity: 0.40; }
      50%  { background-position: 100% 50%; transform: scale(1.05); opacity: 0.78; }
      100% { background-position: 0% 50%; transform: scale(0.95); opacity: 0.40; }
    }

    .team.sold::after{
      content:"✕";
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%,-50%);
      font-size:64px;
      font-weight:900;
      line-height:1;
      color:#ff2a2a;
      text-shadow:
        0 0 6px rgba(255,42,42,0.95),
        0 0 14px rgba(255,42,42,0.85),
        0 6px 18px rgba(0,0,0,0.9);
      z-index:999;
      pointer-events:none;
      mix-blend-mode: normal;
    }

    .control-bar{
      display:flex;
      flex-direction:column;
      justify-content: flex-end;
      align-items: stretch;
      width: 120px;
      border: 2px solid rgba(137,14,0,0.55);
      background: linear-gradient(180deg, rgba(23,45,115,0.35), rgba(0,0,0,0.85));
      border-radius: 12px;
      padding: 2px;
      min-height: 280px;
      box-shadow: inset 0 0 10px rgba(255,255,255,0.04);
    }

    .control-bar .btn{
      background: linear-gradient(315deg, rgba(60,101,236,0.55) 10%, rgba(137,14,0,0.70) 90%);
      color: var(--text-color);
      border: 2px solid rgba(137,14,0,0.75);
      border-radius: 8px;
      padding: 5px 8px;
      font-size: 22px;
      font-weight: 900;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow:
        inset 0 1px 0 rgba(0, 0, 0, 0.89),
        0 4px 10px rgba(0,0,0,0.89);
      width: 100%;
      margin-top: 0px;
    }

    .control-bar .stat-box{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      background: rgba(0,0,0,0.65);
      border: 2px solid rgba(255,255,255,0.16);
      border-radius: 8px;
      padding: 2px;
      margin-bottom: 4px;
    }

    .stat-box .value{ font-size: 21px; font-weight: 900; }
    .stat-box .label{ font-size: 14px; letter-spacing: 1px; text-transform: uppercase; opacity: 0.92; }

    /* Hidden toggle switch (still clickable) */
.sold-stat{
  cursor: pointer;
  opacity: 1;
  pointer-events: auto;
}

    .ticker{
      width:100%;
      border-radius:10px;
      padding:6px 10px;
      border: 2px solid rgba(255, 255, 255, 0.87);
      background: rgba(0,0,0,0.25);
      overflow:hidden;
      min-height:40px;
    }

    .ticker-text{
      display:inline-block;
      white-space:nowrap;
      padding-left:100%;
     animation: ticker-scroll var(--ticker-speed, 20s) linear infinite;
      font-weight:900;
      letter-spacing: 0.6px;
      color:#fff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.55);
    }

    @keyframes ticker-scroll{
      0%{ transform:translateX(0); }
      100%{ transform:translateX(-100%); }
    }

    /* SOLD PANEL */
    .sold-panel-wrap{
      width:1080px;
      margin-top:10px;
      transition: opacity 0.25s ease, transform 0.25s ease;
      transform-origin: top;
    }
    .sold-panel-wrap.hidden{
      opacity:0;
      transform:translateY(-8px);
      pointer-events:none;
    }

    .sold-control-bar{
      display:flex;
      gap:8px;
      justify-content:center;
      padding:6px 8px;
      margin-bottom:6px;
      background: rgba(0, 0, 0, 0.925);
      border-radius:10px;
      border: 1px solid rgba(0, 0, 0, 0.808);
      align-items:center;
    }

    .pill-toggle{
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      cursor: pointer;
      background: rgb(54, 54, 54);
      color:#fff;
      border: 2px solid rgba(255,255,255,0.25);
    }
    .pill-toggle.active{
      background: var(--secondary-color);
      border-color: #ff2a2a;
      box-shadow: 0 0 0 2px rgba(137,14,0,0.25);
    }

    .sold-panel-title{
      text-align:center;
      font-weight:900;
      letter-spacing:2px;
      font-size: 14px;
      opacity: 0.9;
      margin-bottom: 0;
      padding-right: 10px;
    }

    .sse-status{
      display:flex;
      align-items:center;
      gap:8px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 2px solid rgba(255,255,255,0.20);
      background: rgba(0,0,0,0.28);
      font-weight: 900;
      font-size: 12px;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .sse-status .dot{
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #666;
      box-shadow: 0 0 8px rgba(255,255,255,0.15);
    }
    .sse-status.connected .dot{ background:#3cff8a; box-shadow:0 0 10px rgba(60,255,138,0.7); }
    .sse-status.error .dot{ background:#ff2f2f; box-shadow:0 0 10px rgba(255,47,47,0.7); }
    .sse-status.connecting .dot{ background:#ffd24a; box-shadow:0 0 10px rgba(255,210,74,0.7); }

    .sold-panel{
      padding:10px;
      display:grid;
      grid-template-columns: repeat(4, 1fr);
      gap:10px;
      background: linear-gradient(90deg, rgb(77, 6, 6), rgb(26, 25, 25));
      border-radius:14px;
      border: 2px solid rgba(137,14,0,0.55);
    }

    .sold-item{
      display:flex;
      align-items:center;
      gap:8px;
      padding: 6px 8px;
      border-radius: 999px;
      background: rgba(255,255,255,0.12);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.12);
    }

    .sold-item img{
      max-width:100%;
      max-height: 36px;
      object-fit: contain;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.55));
    }

    .sold-item .buyer{
      font-size: 18px;
      font-weight: 900;
      text-align:left;
      background: rgba(26, 25, 25, 0.938);
      border: none;
      outline:none;
      color:#ffffff;
      width:100%;
      border-radius: 999px;
      padding: 8px 10px;
    }

    /* EXPORT POPUP */
    .export-popup{
      position:fixed;
      inset:0;
      background: rgba(0,0,0,0.75);
      z-index: 99999;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .export-popup.hidden{ display:none; }

    .export-popup-content{
      width:680px;
      max-width:92%;
      background: linear-gradient(135deg, rgba(15,20,45,0.98), rgba(10,10,15,0.98));
      border-radius:16px;
      padding:20px;
      border: 2px solid rgba(137,14,0,0.55);
      box-shadow: 0 20px 60px rgba(0,0,0,0.85);
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .export-popup-content h2{
      margin:0;
      font-size:20px;
      letter-spacing:1px;
      text-align:center;
    }

    #exportAssignmentsBox{
      width:100%;
      height:220px;
      resize:none;
      background:#000;
      color:#00ff9c;
      border: 2px solid rgba(137,14,0,0.55);
      border-radius:10px;
      padding:10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size:13px;
    }

    .export-popup-buttons{
      display:flex;
      justify-content:space-between;
      gap:12px;
    }

    .export-popup-buttons button{
      flex:1;
      padding:10px;
      font-weight:900;
      cursor:pointer;
      border-radius:10px;
      border:none;
      background: rgba(137,14,0,0.95);
      color:#fff;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }
  </style>
</head>

<body>
  <div class="overlay-container">
    <div class="header">
      <div class="brand">
        <div class="brand-title">SOLELY</div>
      </div>

      <div class="brand-logo">
        <img id="brandLogo" alt="Solely Sports Cards" />
      </div>

      <div class="header-right">
        <div id="breakIdBox" class="break-id-box">
          <span class="break-id-label">Break #</span>
          <span id="breakIdDisplay" class="break-id-value">—</span>
        </div>
      </div>
    </div>

    <div class="main">
      <div class="teams-section">
        <div id="conferenceLeft" class="conference"></div>

        <div class="control-bar">
          <button class="btn" onclick="resetAll()">Reset</button>

          <div class="stat-box sold-stat" onclick="toggleSoldPanel()">
            <div class="value" id="teamsSold">0</div>
            <div class="label">Sold</div>
          </div>

          <div class="stat-box">
            <div class="value" id="teamsLeft">0</div>
            <div class="label">Remaining</div>
          </div>

          <!-- Added for multi-sport (keeps same overall structure) -->
          

          <button class="btn" onclick="startNewBreakCycle()">Next</button>
        </div>

        <div id="conferenceRight" class="conference"></div>
      </div>
    </div>

    <div class="ticker">
      <span id="tickerText" class="ticker-text"></span>
    </div>
  </div>

  <div id="soldPanelWrap" class="sold-panel-wrap hidden">
<div class="sold-control-bar">
  <div class="sold-panel-title">SOLD TEAMS</div>
  <button class="pill-toggle" id="setBreakBtn">Set Break #</button>
  <button class="pill-toggle" id="changeSportBtn">Change Sport</button>
  <button class="pill-toggle" id="tickerBtn">Ticker</button>
  <button class="pill-toggle" id="titleBtn">Title</button>
  <button class="pill-toggle" id="exportAssignmentsBtn">Export CSV</button>

  <div class="sse-status" id="sseStatus">
    SSE <span class="dot" id="sseDot"></span><span id="sseText">OFF</span>
  </div>
</div>

    <div id="soldPanel" class="sold-panel"></div>
  </div>

  <div id="exportAssignmentsPopup" class="export-popup hidden">
    <div class="export-popup-content">
      <h2>Buyer Assignments</h2>
      <textarea id="exportAssignmentsBox"></textarea>
      <div class="export-popup-buttons">
        <button id="copyAssignmentsBtn">Copy CSV</button>
        <button id="closeAssignmentsBtn">Close</button>
      </div>
    </div>
  </div>

  <div id="breakEditPopup" class="export-popup hidden">
    <div class="export-popup-content">
      <h2>Set Break Number</h2>
      <input id="breakEditInput" type="number" min="1" style="padding:10px;font-size:16px;" />
      <div class="export-popup-buttons">
        <button id="applyBreakEdit">Apply</button>
        <button id="closeBreakEdit">Cancel</button>
      </div>
    </div>
  </div>
<!-- TICKER EDIT POPUP -->
<div id="tickerEditPopup" class="export-popup hidden">
  <div class="export-popup-content" style="max-width:560px;">
    <h2>Update Ticker</h2>

    <label style="font-weight:900;letter-spacing:0.6px;text-transform:uppercase;font-size:12px;">
      Text
    </label>
    <input id="tickerEditInput" type="text" style="padding:10px;font-size:16px;border-radius:10px;border:2px solid rgba(137,14,0,0.55);background:#000;color:#fff;" />

    <label style="display:flex;justify-content:space-between;align-items:center;font-weight:900;letter-spacing:0.6px;text-transform:uppercase;font-size:12px;">
      <span>Speed</span>
      <span id="tickerSpeedLabel">20s</span>
    </label>
    <input id="tickerSpeedInput" type="range" min="8" max="45" step="1" />

    <div class="export-popup-buttons">
      <button id="applyTickerEdit">Apply</button>
      <button id="closeTickerEdit">Cancel</button>
    </div>
  </div>
</div>

<!-- TITLE EDIT POPUP -->
<div id="titleEditPopup" class="export-popup hidden">
  <div class="export-popup-content" style="max-width:560px;">
    <h2>Update Title</h2>

    <label style="font-weight:900;letter-spacing:0.6px;text-transform:uppercase;font-size:12px;">
      Title
    </label>
    <input id="titleEditInput" type="text" style="padding:10px;font-size:16px;border-radius:10px;border:2px solid rgba(137,14,0,0.55);background:#000;color:#fff;" />

    <div class="export-popup-buttons">
      <button id="applyTitleEdit">Apply</button>
      <button id="closeTitleEdit">Cancel</button>
    </div>
  </div>
</div>
<script>
  // =========================
  // 0) Dynamic base path
  // =========================
  const BASE = (() => {
    const isGhPages = location.hostname.endsWith('github.io');
    if (isGhPages) {
      const parts = location.pathname.split('/').filter(Boolean);
      const repo = parts.length ? parts[0] : '';
      return `/${repo}/`;
    }
    return '../..\/';
  })();

  const imgPathNFL = (f) => `${BASE}images/nfl/${f}`;
  const imgPathNBA = (f) => `${BASE}images/nba/${f}`;
  const imgPathMLB = (f) => `${BASE}images/mlb/${f}`;

  // =========================
  // 1) Brand logo
  // =========================
  const brandLogo = document.getElementById('brandLogo');
  if (brandLogo) brandLogo.src = `${BASE}images/logos/solely-logo.png`;

  // =========================
  // 2) Sport configs (NFL/NBA/MLB)
  // =========================
  const breakTypes = {
    nfl: {
      name: 'NFL',
      divCols: 4,
      conferences: ['AFC', 'NFC'],
      divisions: {
        AFC: {
          East: [
            { code: 'BUF', image: imgPathNFL('bills.png') },
            { code: 'MIA', image: imgPathNFL('dolphins.png') },
            { code: 'NE',  image: imgPathNFL('patriots.png') },
            { code: 'NYJ', image: imgPathNFL('jets.png') }
          ],
          North: [
            { code: 'BAL', image: imgPathNFL('ravens.png') },
            { code: 'CIN', image: imgPathNFL('bengals.png') },
            { code: 'CLE', image: imgPathNFL('browns.png') },
            { code: 'PIT', image: imgPathNFL('steelers.png') }
          ],
          South: [
            { code: 'HOU', image: imgPathNFL('texans.png') },
            { code: 'IND', image: imgPathNFL('colts.png') },
            { code: 'JAX', image: imgPathNFL('jaguars.png') },
            { code: 'TEN', image: imgPathNFL('titans.png') }
          ],
          West: [
            { code: 'KC',  image: imgPathNFL('chiefs.png') },
            { code: 'DEN', image: imgPathNFL('broncos.png') },
            { code: 'LV',  image: imgPathNFL('raiders.png') },
            { code: 'LAC', image: imgPathNFL('chargers.png') }
          ]
        },
        NFC: {
          East: [
            { code: 'DAL', image: imgPathNFL('cowboys.png') },
            { code: 'NYG', image: imgPathNFL('giants.png') },
            { code: 'PHI', image: imgPathNFL('eagles.png') },
            { code: 'WAS', image: imgPathNFL('commanders.png') }
          ],
          North: [
            { code: 'CHI', image: imgPathNFL('bears.png') },

  function buildConference(container, confName, divisions){
    const title = document.createElement('div');
    title.className = 'conference-title';
    title.textContent = confName;
    container.appendChild(title);

    Object.keys(divisions).forEach(divName => {
      const divisionWrap = document.createElement('div');
      divisionWrap.className = 'division';

      const divTitle = document.createElement('div');
      divTitle.className = 'division-name';
      divTitle.textContent = divName;
      divisionWrap.appendChild(divTitle);

      const teamGrid = document.createElement('div');
      teamGrid.className = 'division-teams';

      divisions[divName].forEach(teamObj => {
        const teamDiv = document.createElement('div');
        teamDiv.className = 'team';
        teamDiv.dataset.teamCode = teamObj.code;
        teamDiv.onclick = () => toggleTeam(teamObj.code);

        const img = document.createElement('img');
        img.src = teamObj.image;
        img.alt = teamObj.code;
        img.onerror = () => { teamDiv.textContent = teamObj.code; };

        teamDiv.appendChild(img);
        teamGrid.appendChild(teamDiv);
      });

      divisionWrap.appendChild(teamGrid);
      container.appendChild(divisionWrap);
    });
  }

  function toggleTeam(code){
    soldTeams.has(code) ? markUnsold(code) : markSold(code);
    updateStats();
    renderSoldPanel();
    // optional: broadcast local click to bridge
    bridgePostSafe({
      type: soldTeams.has(code) ? "team_sold" : "team_unsold",
      teamCode: code,
      breakType: currentBreakType,
      breakId: computeBreakId(),
      ts: Date.now()
    });
  }

  function markSold(code, buyerName = ''){
    const el = document.querySelector(`[data-team-code="${code}"]`);
    if (!el) return;
    soldTeams.add(code);
    el.classList.add('sold');
    if (!soldTeamsList.some(x => x.code === code)) soldTeamsList.push({ code, buyer: buyerName || '' });
    else {
      const item = soldTeamsList.find(x => x.code === code);
      if (buyerName && item) item.buyer = buyerName;
    }
  }

  function markUnsold(code){
    const el = document.querySelector(`[data-team-code="${code}"]`);
    if (!el) return;
    soldTeams.delete(code);
    el.classList.remove('sold');
    const idx = soldTeamsList.findIndex(x => x.code === code);
    if (idx !== -1) soldTeamsList.splice(idx, 1);
  }

  function updateStats(){
    const config = breakTypes[currentBreakType];
    let total = 0;
    config.conferences.forEach(conf => {
      Object.values(config.divisions[conf]).forEach(div => total += div.length);
    });

    document.getElementById('teamsLeft').textContent = total - soldTeams.size;
    document.getElementById('teamsSold').textContent = soldTeams.size;
  }

  function cycleSport(){
    const order = ["nfl","nba","mlb"];
    const idx = order.indexOf(currentBreakType);
    currentBreakType = order[(idx + 1 + order.length) % order.length];

    // persist sport
    localStorage.setItem("ssc.breakType", currentBreakType);

    renderTeams();

    // notify bridge
    bridgePostSafe({

  // =========================
  // 6) BreakId (TSU-friendly)
  // =========================
  function yyyymmddLocal(d = new Date()){
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }

  function computeBreakId(){
    // TSU standard-ish: YYYY-MM-DD-sport-counter
    const date = yyyymmddLocal(new Date());
    const sport = String(currentBreakType || "").toLowerCase();
    const num = String(currentBreakNumber || 1);
    return `${date}-${sport}-${num}`;
  }

  // =========================
  // 7) SSE Bridge Client (standard)
  // =========================
  // Shared-bridge standard: hardcoded URL + key are the source of truth.
  // ?bridge / ?key / ?overlay are opt-in overrides only — NEVER localStorage
  // (stale per-client-era values must not leak in and cross-contaminate).
  const BRIDGE_BASE = "https://bridge.tradesecretsunlocked.com";
  const BRIDGE_KEY_DEFAULT = "62f40d5c18a0418fad060b7584869196";
  function getParam(name){ return new URLSearchParams(location.search).get(name); }

  function getBridgeBase(){ return (getParam("bridge") || BRIDGE_BASE).replace(/\/$/, ""); }
  function getBridgeKey(){ return getParam("key") || BRIDGE_KEY_DEFAULT; }
  function getChannel(){ return (getParam("channel") || "main").toLowerCase(); }
  function getOverlayId(){ return (getParam("overlay") || "ssc").toLowerCase(); }

  function bridgeEnabled(){ return !!getBridgeBase(); }

  let sse = null;

  function setSSEStatus(state, msg){
    const box = document.getElementById("sseStatus");
    const text = document.getElementById("sseText");
    if (!box || !text) return;

    box.classList.remove("connected","error","connecting");
    if (state) box.classList.add(state);
    text.textContent = msg || state || "—";
  }

  function connectBridgeSSE({ onEvent, onStatus }){
    if (!bridgeEnabled()){
      onStatus?.("error", "missing bridge");
      return;
    }

    const base = getBridgeBase();
    const channel = getChannel();
    const url = `${base}/stream?channel=${encodeURIComponent(channel)}&key=${encodeURIComponent(getBridgeKey())}`;

    if (sse) try { sse.close(); } catch(_){}
    onStatus?.("connecting","connecting");

    sse = new EventSource(url);

    const ingest = (e) => {
      try{
        const data = JSON.parse(e.data);
        if (data?.type === "hello") return;
        onEvent?.(data);
      }catch(err){
        console.warn("[SSE parse error]", err, e.data);
      }
    };

    sse.onopen = () => onStatus?.("connected","connected");
    sse.onmessage = ingest;

    ["team_sold","team_unsold","buyer","reset","set_break","set_sport","scores","stream_stats","overlay_warmup"]
      .forEach(t => sse.addEventListener(t, ingest));

    sse.onerror = () => {
      onStatus?.("error","reconnecting");
      try { sse.close(); } catch(_){}
      sse = null;
      setTimeout(() => connectBridgeSSE({ onEvent, onStatus }), 2500);
    };
  }

  async function bridgePost(payload){
    if (!bridgeEnabled()) return;
    const base = getBridgeBase();
    const key = getBridgeKey();

    await fetch(`${base}/events`, {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        ...(key ? { "x-bridge-key": key } : {})
      },
      body: JSON.stringify(payload)
    }).catch(() => {});
  }

  function bridgeWarmup(extra = {}){
    return bridgePost({
      type: "overlay_warmup",
      overlay: getOverlayId(),
      channel: getChannel(),
      ts: Date.now(),
      ...extra
    });
  }

  function bridgePostSafe(payload){
    // never throw inside OBS
    try { bridgePost(payload); } catch(_){}
  }
  function bridgeWarmupSafe(){
    try { bridgeWarmup({ breakId: computeBreakId(), breakType: currentBreakType }); } catch(_){}
  }

  function handleSSEEvent(data){
    // Supported events:
    // - team_sold { teamCode|code, buyerName|buyer, breakType?, breakId? }
    // - team_unsold { teamCode|code, breakType?, breakId? }
    // - buyer { teamCode|code, buyerName|buyer }
    // - reset
    // - set_break { breakNumber }
    // - set_sport { breakType }
    if (!data || !data.type) return;

    // Respect breakId if provided
    const incomingBreakId = String(data.breakId || "").trim();
    if (incomingBreakId && incomingBreakId !== computeBreakId()) return;

    // Respect breakType if provided
    const incomingSport = String(data.breakType || data.sport || "").toLowerCase().trim();
    if (incomingSport && breakTypes[incomingSport] && incomingSport !== currentBreakType){
      currentBreakType = incomingSport;
      localStorage.setItem("ssc.breakType", currentBreakType);
      renderTeams();
      setBreakNumberUI(currentBreakNumber);
    }

    const code = String(data.teamCode || data.code || "").toUpperCase().trim();
    const buyer = String(data.buyerName || data.buyer || "").trim();

    if (data.type === "team_sold" && code) markSold(code, buyer);
    if (data.type === "team_unsold" && code) markUnsold(code);

    if (data.type === "buyer" && code){
      const item = soldTeamsList.find(x => x.code === code);
      if (item) item.buyer = buyer;
      // also update visible input if present
      renderSoldPanel();
    }

    if (data.type === "reset"){
      resetAll();
      return;
    }

    if (data.type === "set_break"){
      const n = parseInt(data.breakNumber, 10);
      if (Number.isFinite(n) && n > 0){
        currentBreakNumber = n;
        localStorage.setItem('ssc.breakNumber', String(currentBreakNumber));
        setBreakNumberUI(currentBreakNumber);
      }
    }

    if (data.type === "set_sport"){
      const s = String(data.breakType || data.sport || "").toLowerCase().trim();
      if (s && breakTypes[s]){
        currentBreakType = s;
        localStorage.setItem("ssc.breakType", currentBreakType);
        renderTeams();
        setBreakNumberUI(currentBreakNumber);
      }
    }

    tickerText: newText,
    tickerSpeed: speed,
    breakType: currentBreakType,
    breakId: computeBreakId(),
    ts: Date.now()
  });
});

closeTickerEdit?.addEventListener("click", () => {
  tickerEditPopup.classList.add("hidden");
});

// Open title editor
titleBtn?.addEventListener("click", () => {
  const titleEl = document.querySelector(".brand-title");
  titleEditInput.value = (titleEl?.textContent || "").trim();
  titleEditPopup.classList.remove("hidden");
});

// Apply title
applyTitleEdit?.addEventListener("click", () => {
  const newTitle = (titleEditInput.value || "").trim();
  const titleEl = document.querySelector(".brand-title");
  if (titleEl) titleEl.textContent = newTitle;

  localStorage.setItem("ssc.titleText", newTitle);
  titleEditPopup.classList.add("hidden");

  bridgePostSafe({
    type: "set_title",
    titleText: newTitle,
    breakType: currentBreakType,
    breakId: computeBreakId(),
    ts: Date.now()
  });
});

closeTitleEdit?.addEventListener("click", () => {
  titleEditPopup.classList.add("hidden");
});
    closeBreakEdit.addEventListener('click', () => breakEditPopup.classList.add('hidden'));

    // Export popup wires
    const exportAssignmentsBtn = document.getElementById("exportAssignmentsBtn");
    const exportAssignmentsPopup = document.getElementById("exportAssignmentsPopup");
    const exportAssignmentsBox = document.getElementById("exportAssignmentsBox");
    const copyAssignmentsBtn = document.getElementById("copyAssignmentsBtn");
    const closeAssignmentsBtn = document.getElementById("closeAssignmentsBtn");

    exportAssignmentsBtn?.addEventListener("click", () => {
      exportAssignmentsBox.value = exportBuyerAssignmentsCSV();
      exportAssignmentsPopup.classList.remove("hidden");
    });
copyAssignmentsBtn?.addEventListener("click", async () => {
  const text = exportAssignmentsBox.value || "";
  try{
    if (navigator.clipboard?.writeText){
      await navigator.clipboard.writeText(text);
      copyAssignmentsBtn.textContent = "Copied!";
    } else {
      exportAssignmentsBox.focus();
      exportAssignmentsBox.select();
      const success = document.execCommand("copy");
      copyAssignmentsBtn.textContent = success ? "Copied!" : "Select + Copy";
    }
  }catch(_){
    exportAssignmentsBox.focus();
    exportAssignmentsBox.select();
    document.execCommand("copy");
    copyAssignmentsBtn.textContent = "Select + Copy";
  }
  setTimeout(() => (copyAssignmentsBtn.textContent = "Copy CSV"), 1000);
});

    closeAssignmentsBtn?.addEventListener("click", () => {
      exportAssignmentsPopup.classList.add("hidden");
    });

    // SSE connect
    connectBridgeSSE({
      onEvent: handleSSEEvent,
      onStatus: (state, msg) => setSSEStatus(state, msg)
    });

    bridgeWarmupSafe();
  });
</script>
